id: people-data
num: 9
domain: analytics
track: technical
title: Reporting on People
subtitle: Why a headcount query is harder than a revenue query
hue: 92
minutes: 9
labs: 
terms: slowly-changing-dimension, as-of-date-join, point-in-time-snapshot, headcount-grain
---

Everything so far in this collection has been taught on orders, order lines and products, because that is where the mechanics are clearest. People data breaks one assumption those examples quietly rely on: that a row describes something that is true now. An HR record describes something that was true between two dates, and every other row for the same person describes a different window. A query written as if the table held one row per person returns a number that looks plausible and is wrong — and this is the single most common way a report built by someone competent at SQL still misreports headcount.

This chapter is the bridge to the Oracle HCM collection. Chapter 4 there calls it effective dating; the modelling world calls it a slowly changing dimension. They are the same idea, and a consultant who works across both is expected to speak either.

## The same idea, two vocabularies

A **slowly changing dimension** is a dimension whose attributes change over time, and the question is what the warehouse does about it. Type 1 overwrites: the old value is gone, which is right for a corrected typo and wrong for anything else. **Type 2** keeps history by adding a row — the old row is closed with an end date and a new one opened — so the dimension holds one row per version of the entity, each valid for a period.

That is exactly what an HR system does natively. A promotion does not update the assignment; it end-dates the current record and inserts a new one. So an HCM source is already type 2, which has two consequences for anyone reporting on it. There is no transformation step to build the history, because it is there. And there is no way to avoid dealing with it, because every query touches it.

## The predicate that makes a query mean something

The whole of the difference is one pair of conditions:

```
SELECT ...
FROM   assignments a
WHERE  DATE '2026-06-30' BETWEEN a.effective_start_date AND a.effective_end_date
```

Without it, a person promoted twice returns three rows; with it, one. Written as a join between a person dimension and a fact, the same predicate has to appear for every date-effective table in the query, not just the one the author was thinking about — two name versions joined to three assignment versions produce six rows for one human, and nothing in the result says so.

Oracle's own tables carry the warning in their names: a `_f` suffix marks a date-effective table, and `_m` marks one that can change more than once in a single day, which needs a further filter to keep the last change of each day. The HCM collection's Chapter 13 has the query written out; the point to carry here is that the filter is per table, and missing one is silent.

## What one row means, again

Chapter 1 of this collection said the grain is the first thing to establish. In people data the grain has a second axis: not just *what* a row describes, but *when* it was true.

**Headcount** counts humans at a moment. **FTE** sums the share of a full workload each one works, so a department of ten with four half-timers is a headcount of ten and an FTE of eight — two correct answers to two different questions, which the HCM collection's Chapter 7 covers from the configuration side. Both still need the as-of date, because both are a count of rows that were valid on a given day.

And a person with two concurrent assignments is one human with two rows that are both current, which no date filter will collapse. That is what the primary-assignment flag is for, and it is the reason a headcount query filters on it while a workload query does not.

## Point in time, period end, and the trend that always under-reports

A number for a single day is a **point-in-time snapshot**. A trend is a series of them, and how the series is built decides whether it is honest.

The tempting shortcut is to take today's rows and group them by hire date and termination date. It produces a smooth curve and it is wrong, because it reports today's attributes — today's department, today's grade — as if they had always applied, and it silently loses anyone whose record was later corrected. The reorganization that moved 200 people into a new department last month appears, in that curve, to have happened three years ago.

The honest alternative is to evaluate the as-of predicate once per period and keep the answer: one row per person per month, built deliberately and stored, rather than recomputed from live history every time someone opens the report. It is more work on the way in and it is the only version that reconciles with what the HR team reported at the time.

## What a reportable people dataset looks like

For a BI tool, the shape worth building is a fact of one row per person per period, carrying the attributes as they were in that period — department, grade, location, FTE, status — plus the keys to join the dimensions. It is deliberately denormalized and deliberately snapshotted, and it makes every subsequent question cheap: headcount by month, attrition by department as it stood then, FTE against budget, a starters-and-leavers reconciliation that adds up.

Building it is where the two halves of this atlas meet. The HCM side knows which object holds which attribute and when it changed; the analytics side knows what grain to land it at and why a star schema wants it that way. Neither half alone produces a number anyone should sign.

## Common mistakes

- Treating an HR table as one row per person. It is one row per version.
- Filtering one date-effective table in a multi-table join and not the others.
- Reporting a trend from current rows, so history is restated with today's attributes.
- Counting rows for headcount when a person can hold two concurrent assignments.
- Using headcount and FTE interchangeably because they are close in most months.
- Rebuilding history live on every refresh instead of snapshotting it once per period.

## Sources

- Kimball Group, "Slowly Changing Dimensions" — the type 1, 2 and 3 definitions this chapter uses. https://www.kimballgroup.com/2008/08/slowly-changing-dimensions/
- Kimball Group, "Slowly Changing Dimensions, Part 2". https://www.kimballgroup.com/2008/09/slowly-changing-dimensions-part-2/
- Oracle, *Implementing Global Human Resources* — date-effective objects and the history they keep. https://docs.oracle.com/en/cloud/saas/human-resources/faigh/index.html
</script>

---
id: egypt-leave
num: 10
domain: hcm
track: functional
title: Egypt: Leave Under Labour Law 14/2025
subtitle: The statutory entitlements that become absence plans
hue: 16
minutes: 12
labs: leave
terms: egyptian-annual-leave-entitlement, casual-leave, sick-leave, maternity-leave, pilgrimage-leave, nursing-breaks, childcare-leave, public-holiday-premium
---

Labour Law No. 14 of 2025 replaced the 2003 law and took effect on 1 September 2025. Its leave provisions are the direct input to absence-plan design (Chapter 6). This chapter states the entitlements and the design implications; the exit and probation rules live in Chapter 8.

> **Every figure in this chapter moves.** The entitlements were checked in 2026 against the EY, Andersen and Amereller summaries below, and the executive regulations and ministerial decisions implementing the law continue to appear. Professional summaries also disagree with each other on several points, which are flagged where they arise. Re-verify against the Arabic text of the statute, or the client's legal counsel, before configuring an entitlement.

## Annual leave: a ladder by service and age

The statutory ladder is 15 days during the first year of service (pro-rated where service exceeds six months but is under a year); 21 days from the second year; 30 days for workers with ten years of service or aged over 50; 45 days for persons with disabilities; plus 7 additional days for hazardous, arduous or remote-area work. Annual leave excludes official and weekly holidays.

Two further rules shape the plan. The worker must take at least 15 days a year, including six consecutive days, and the employer must settle the leave balance or pay its cash equivalent at least every three years. These translate into carryover and expiry configuration and into leave-encashment logic on exit. The best practice exercise for accrual bands is to build this ladder and then test the two boundary cases: the person crossing ten years mid-year and the person turning fifty mid-year.

The two upper tiers are worth reading carefully, because they are *alternatives*, not a sequence: thirty days is reached either by ten years of service **or** by age, whichever arrives first. A plan built only on service length under-pays an employee who joined at forty-eight, and that employee is exactly the one who knows the law.

## Casual leave

**Casual leave** covers unforeseen circumstances: a maximum of 7 days per year (up from 6 under the old law), no more than 2 consecutive days at a time, and — the detail that gets missed in design and surfaces in UAT — counted within the annual-leave entitlement rather than on top of it.

In configuration that makes casual leave an absence *type* drawing on the annual plan with its own rules, not a second plan with its own balance. Build it as a separate accrual and the employee's entitlement is overstated by seven days, the liability reported to Finance is wrong by the same amount, and nothing in the system objects.

[[fig:egypt-leave-ladder]]

## Sick leave

**Sick leave** is paid at rates that vary by duration and is governed by the social-insurance law: for generally insured workers, 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in the same calendar year, subject to medical certification. Industrial establishments have a stronger schedule under labour law, and employers offset amounts already paid by NOSI. In Oracle this is a textbook qualification plan with payment bands.

Three details decide whether the plan behaves: the percentages attach to the **insurable wage** (Chapter 9), not to gross pay, so the plan needs a rate definition pointing at the right base; the 180-day cap is per calendar year rather than per occurrence, so a worker with three separate absences shares one ceiling; and the certification requirement is a document the absence record should carry, because the payment is defensible only if the certificate exists.

## Maternity, nursing and the pay nobody agrees on

**Maternity leave** is four months, covering the period before and after the birth, with no less than 45 days falling after it. It is capped at three occurrences during the employee's service, and the old requirement of ten months' service before qualifying has gone — the entitlement applies from the first day.

How it is *paid* is where the sources genuinely disagree. Some summaries describe full pay from the employer; others describe payment at a percentage of the insurable wage through social insurance, with the employer topping up or offsetting what NOSI pays. The two readings produce different elements and different costs, so this is a question for the client's counsel and their insurance office rather than one to settle from a summary — and it belongs in the configuration workbook with the answer attributed.

Around the birth the law also constrains the working day rather than granting leave. A pregnant employee's daily hours must be reduced by at least an hour from the sixth month, and overtime may not be required during pregnancy or for six months after the birth. For two years after the birth, **nursing breaks** of two periods of at least thirty minutes a day are paid and counted as working time.

None of those three is an absence plan. The hour reduction and the nursing breaks are working-time rules, which means a work schedule change or an information element rather than a leave balance, and the overtime prohibition is a validation on the overtime element. Clients routinely ask for all three as "leave types", and building them that way produces balances that mean nothing.

**Paternity leave** is new: one paid day on the date of the birth, outside the annual balance, available up to three times. Sources differ on whether the limit counts births or occasions; the practical configuration is an absence type with an occurrence cap, and the cap value confirmed in writing.

Unpaid **childcare leave** of up to two years is available in establishments of fifty or more employees, after a year of service, up to three times, with at least two years between the first and the second. Every one of those four conditions is an eligibility rule, and a plan that enforces the duration but not the spacing will approve leave the law does not grant.

## Public holidays, and the premium for working one

Official holidays and the weekly rest do not count against annual leave. Where a worker is required to work on one, the law provides a premium — commonly summarised as double pay plus a compensating day off — and the number of official holidays itself varies between summaries, which is a reason to take the client's published calendar as the source rather than a secondary list.

In Oracle the calendar is not an absence plan either. Holidays belong to the work schedule and the calendar event, which is what keeps them out of leave balances automatically, and the premium is an earnings element driven from the time card (Chapter 5).

## What each entitlement becomes in configuration

The mapping is the useful part of this chapter in a workshop. Annual leave is an accrual plan with service and age bands. Casual leave is an absence type on that plan with its own limits. Sick leave and maternity are qualification plans with payment percentages and occurrence caps. Paternity is a short qualification plan with a cap. Childcare leave is an unpaid plan with four eligibility conditions. Nursing breaks, the pregnancy hour and the overtime prohibition are work-schedule and validation rules. Public holidays are calendar events.

Being able to say that list out loud, in that order, is the difference between a consultant who has read the law and one who has configured it.

[[lab:leave]]

## Common mistakes

- Building annual leave as a flat 21 days.
- Reading the thirty-day tier as service only, when age alone also reaches it.
- Putting casual leave on top of annual leave.
- Treating sick leave as an accrual plan, or attaching its percentages to gross pay instead of the insurable wage.
- Documenting the maternity cap without enforcing it.
- Modelling nursing breaks and the pregnancy hour as leave types rather than working-time rules.
- Enforcing childcare leave's duration but not the two-year spacing between occurrences.
- Letting public holidays consume annual leave because the calendar was never configured.

## Sources

- EY, "Egypt enacts new labor law affecting employers from 1 September 2025". https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025
- Andersen Egypt, "Egypt's New Labour Law No. 14 of 2025". https://eg.andersen.com/egypts-labour-law-14-2025/
- Amereller, "Egypt: New Labor Law No. 14 of 2025". https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/
- Andersen Egypt, English translation of Labor Law No. 14 of 2025 — the article text behind the entitlements above. https://eg.andersen.com/wp-content/uploads/2025/05/Translation-of-Labor-law-No.-14-of-2025.pdf
- PwC Worldwide Tax Summaries, Egypt — "Other taxes" (sick-leave compensation under the social-insurance law). https://taxsummaries.pwc.com/egypt/individual/other-taxes

id: hdl
num: 11
domain: hcm
track: technical
title: Loading Data: HCM Data Loader
subtitle: The highest-value technical skill a functional consultant can arrive with
hue: 232
minutes: 10
labs: hdl, import-load, source-keys
terms: hdl-hcm-data-loader, hsdl-hcm-spreadsheet-data-loader, source-system-key-vs-person-number
---

In Oracle HCM, "functional" consultants are expected to be mildly technical. On real projects, bulk data loads land on strong functional people, and many avoid them. **HCM Data Loader (HDL)** is Oracle's bulk loading tool: nobody hand-enters ten thousand employees, so data migration and mass updates run through it. Comfort with HDL makes a consultant useful immediately.

## The shape of a load

A load is one or more `.dat` files, zipped flat (no folders) and uploaded. Each file holds data for a single business object and is named for it: `Worker.dat`, `Job.dat`, `Grade.dat`, `ElementEntry.dat`. HDL decompresses the zip, imports the data lines into staging tables, groups them into business objects, and then loads them.

Inside a file there are two kinds of instruction line, both pipe-delimited. A **METADATA** line declares the columns for a component: the keyword, then the discriminator (which component the line describes), then the attribute names. **MERGE** lines carry the data in the same order; MERGE creates the record if it does not exist and updates it if it does. **DELETE** removes a record.

```
METADATA|JobFamily|JobFamilyCode|JobFamilyName|EffectiveStartDate|EffectiveEndDate
MERGE|JobFamily|SALES|Sales|2000/01/01|4712/12/31
```

That creates a job family coded SALES, effective from 1 January 2000. The end date `4712/12/31` is Oracle's conventional "end of time"; it appears everywhere. Dates use `YYYY/MM/DD`. A `Worker.dat` continues with further METADATA and MERGE pairs for PersonName, PersonNationalIdentifier, PersonEmail, WorkRelationship and Assignment — all components of the same worker hierarchy, in one file.

Those are two separate inspections, and knowing which one rejected a file tells you where to look. **Import** reads the file and checks its shape — pipe counts, attribute spelling, date format — and puts well-formed lines into staging tables, which are a holding area rather than HR data. **Load** then assembles staged lines into whole business objects and checks what they mean: does the job exist, is the grade valid on that date, does the parent this record points at exist? A file that fails import has a formatting problem and has written nothing anywhere. A file that passes import and fails load is well-formed and refers to something that is not there yet, which is almost always a load-order problem.

[[fig:import-vs-load]]

[[lab:import-load]]

## The rules that get files rejected

The METADATA line must appear before the MERGE or DELETE lines it relates to. A file may contain several METADATA lines, but each must be for a different component — two Job METADATA lines in one file is invalid. Each MERGE line must contain the same attributes as its METADATA line, in the same order, so a pipe-count mismatch fails the line. Attribute names are case-sensitive. Files should be UTF-8 without a byte-order mark.

## Keys: what makes a migration reconcilable

HDL identifies records three ways. **Source keys** use `SourceSystemOwner` plus `SourceSystemId` to identify a record by its origin in the legacy system; if used, both must appear in the METADATA line. **User keys** identify by natural business keys such as `JobFamilyCode`. Oracle also generates its own surrogate IDs internally. A person's Oracle identifier is the **person number**; the source system key is what links that record back to the legacy one.

The choice matters after the load, not during it. Source keys are what let a team trace every Oracle record to its legacy origin and explain every variance in reconciliation. Getting them right makes reconciliation possible; getting them wrong makes it nearly impossible, and data conversion is routinely the thing that delays a go-live.

The cost of having no stable key shows up the first time a load partially fails. Forty records rejected out of twelve hundred is an ordinary morning; matching those forty back to the rows that produced them is only trivial if every record carries an identifier that is unique in the source and unchanged by the load. Names are not that identifier — two employees share one often enough to break a reconciliation, and names get re-spelled and change with marriage. Employee numbers are not reliably that identifier either, because legacy systems reissue them.

[[lab:source-keys]]

## Referencing other objects and ordering the load

To point at a foreign object, the attribute is named with the key type in brackets — `JobFamilyId(SourceSystemId)`, `PersonId(SourceSystemId)`. That is how child components attach to their parents. Several `.dat` files can go in one zip; HDL imports them in parallel but loads them sequentially, so referenced data must exist before it is referenced: job families before jobs, grades and jobs before assignments, people before work relationships.

[[lab:hdl]]

## HSDL: the spreadsheet cousin

**HCM Spreadsheet Data Loader (HSDL)** is a spreadsheet interface over the same loading framework, aimed at business users. HDL is for bulk migration by the project team; HSDL is for ongoing, business-user-facing mass updates after go-live.

## Common mistakes

- Two METADATA lines for the same component in one file.
- MERGE attributes out of order relative to METADATA.
- Wrong date format (`MM/DD/YYYY` corrupts silently).
- Loading children before parents.
- Choosing user keys for a migration that will need reconciling.

## Sources

- Oracle, *HCM Integrations* — the "Data File Instructions and Delivery" chapter. https://docs.oracle.com/en/cloud/saas/human-resources/faihm/index.html
- Oracle tutorial, "Create and Maintain Data with HCM Data Loader". https://docs.oracle.com/en/cloud/saas/tutorial-hdl-load-files/
- HCM Tables, "HCM Data Loader (HDL) Complete Guide — .dat File Format, Templates & Troubleshooting". https://hcm-tables.com/blog/hdl-data-loader-guide
</script>

id: ff
num: 12
domain: hcm
track: technical
title: Fast Formula
subtitle: Oracle's rule language — learn it by reading, not by studying grammar
hue: 330
minutes: 13
labs: ff, ff-run, ff-bugs
terms: fast-formula, formula-result, global-value
---

Statutory rules vary too much across countries to hard-code, so Oracle exposes a rule layer. **Fast Formula** is a simple expression language for calculations, validations and rules, written in near-English rather than a full programming language. In payroll it computes rates and amounts; in absence it drives accrual rules; elsewhere it handles eligibility and defaulting. Because Oracle ships no maintained Egyptian localization, Egyptian social-insurance and tax calculations are built here — and it may be the functional consultant who writes them.

## The four sections

Most formulas follow one shape: declare inputs, set defaults, run the logic, return a value. Oracle does not strictly enforce the order, but following it avoids errors.

```
INPUTS ARE BASIC_SALARY
DEFAULT FOR BASIC_SALARY IS 0
IF BASIC_SALARY > 35000 THEN
  SPECIAL_ALLOWANCE = 2500
ELSE
  SPECIAL_ALLOWANCE = 0
RETURN SPECIAL_ALLOWANCE
```

If a consultant can read this, they can read most delivered formulas.

## Where values come from

Values reach a formula three ways: as inputs passed at runtime, as database items read from the database, or as global values. Inputs are declared with `INPUTS ARE`, and the name must match the element input value exactly, with words joined by underscores. Database items are referenced by name, and the system supplies most of the ones needed. Oracle's own guidance is to prefer `INPUTS` over database items where possible, because inputs do not require a database read and therefore speed up the payroll run — a detail worth saying in an interview.

## Formula types and contexts

Every formula has a type that determines which inputs and contexts are available to it, and a formula written for one context will not work in another. This is why the language cannot be learned in the abstract: the same syntax behaves differently depending on where it runs. The practical approach is to read delivered formulas of the type being built and adapt them.

Statements worth recognizing on sight: `DEFAULT FOR` sets a fallback where a value could be null; `ALIAS` shortens an unwieldy database-item name; and formulas call other formulas with `SET_INPUT`, `EXECUTE` and `GET_OUTPUT`, which is how common calculations are factored out instead of writing one enormous formula. Comments sit inside `/* */`.

## A real rule, written out

The Egyptian employee social-insurance contribution (Chapter 9) makes a good first formula: take the wage as an input, cap it at the ceiling, floor it at the minimum, and return 11% of the result. The order matters — cap and floor first, then the rate.

[[lab:ff]]

[[lab:ff-run]]

## The bugs that compile

Fast Formula bugs divide into two kinds, and only one of them is cheap. A formula that does not compile — a misspelt input name, a name with a space in it where the element's input value has an underscore — is caught the moment it is saved, and costs an hour. A formula that compiles and returns the wrong number is caught by a person, if it is caught at all.

Four failures account for most of the second kind. Applying a rate before capping the wage, which inverts the whole point of a clamp. Returning the wrong variable, so the element pays something plausible and entirely wrong. Omitting a default on an input that is usually empty, so the formula errors for exactly the employees who have no entry that month. And hard-coding a statutory limit that changes every January, which under-deducts quietly until a statutory return is reconciled — limits belong in a dated global value, not in the formula text.

None of these announce themselves. The only reliable defence is a QuickPay against a real person, with the expected number worked out by hand first.

[[lab:ff-bugs]]

## What a payroll formula hands back

A formula does not simply return a number into the void: in payroll it returns **formula results**, and the element's configuration says what each one is for. A *direct result* becomes the element's own pay value. An *indirect result* feeds another element — which is how one calculation creates an entry on a second element without anybody keying it. A *message* returns text to the run, and is the closest thing the language has to a debugger. A *stop entry* ends the element entry, which is how a loan deduction stops itself when the balance reaches zero.

That last one is worth a sentence in an interview, because it is where a consultant stops describing syntax and starts describing behaviour: the formula that recovers a salary advance does not need anyone to remember to end it, provided the stop-entry result was configured.

## Where the numbers that move belong

Statutory figures change — Egyptian insurable-wage limits every January, Saudi contribution rates on a published schedule — and a formula with those numbers typed into it is a time bomb with no alarm attached. **Global values** exist for exactly this: a named, dated value the formula reads, so January's change is a data change on a known date rather than an edit to logic that then needs retesting.

The same reasoning covers rates that differ by population. A formula that branches on legislation or on legal employer, reading a global value for each, stays one formula; one copied per country becomes five formulas that drift apart, and nobody can later say which is authoritative.

## Testing, without a debugger

There is no step-through debugger. What exists is a compile, a message result and a QuickPay, and a working routine out of those three.

Compile first: the compiler catches a misspelt input, an unbalanced condition, a name with a space in it. Then run a QuickPay against one real person whose expected answer has been worked out by hand, on paper, before the run. Compare. Where the number disagrees and the logic looks right, add a message result that returns an intermediate value, run again, and read it in the run results — crude, effective, and the normal way this is done.

Then test the edges on purpose: the empty input, the value exactly on a threshold, the person with no entry at all, and a mid-period change so proration is exercised (Chapter 4). Those four are where the defects are, and all four are cheap to script in user acceptance testing.

## Conventions that keep a formula maintainable

Three habits, each of which costs a minute and saves an afternoon. Name formulas so that the type and the purpose are visible in the name, because the list a consultant inherits is long and unsorted. Comment the first line with the law or policy the rule implements and the date it was checked — the next person needs to know what the formula is supposed to be, not only what it does. And factor shared logic out with `SET_INPUT`, `EXECUTE` and `GET_OUTPUT` rather than copying it, so that a statutory change is made once.

A formula is configuration like any other: it belongs in the configuration workbook with its own entry, and it has an owner for the day its numbers change.


## Common mistakes

- Treating Fast Formula as a programming language to master up front. Approach it through examples.
- Reading database items when an input would do.
- Copying a formula across types and expecting it to run.
- Typing a statutory limit into the logic instead of reading a dated global value.
- Writing a deduction that has to be stopped by hand, when a stop-entry result would end it.
- Declaring a formula finished at compile. Compiling proves the grammar, not the amount.
- Copying one formula per country until nobody can say which is authoritative.

## Sources

- Oracle, *Administering Fast Formulas* — the current Cloud guide, including the "Formulas for Absence Management" chapter. https://docs.oracle.com/en/cloud/saas/human-resources/oapff/index.html
- Oracle, *Implementing Global Payroll* — "Payroll Relationship Rules" and the formula-driven payroll topics around it. https://docs.oracle.com/en/cloud/saas/human-resources/faigp/payroll-relationship-rules.html
- "Understanding Fast Formulas in Oracle HCM: A Guide with Examples", Medium. https://medium.com/@islamrwashdeh/understanding-fast-formulas-in-oracle-hcm-a-guide-with-examples-e54e452501cc
</script>

id: reporting
num: 13
domain: hcm
track: technical
title: Reporting & Integration
subtitle: OTBI, BI Publisher, HCM Extract, REST — four ways out, and when each is right
hue: 186
minutes: 10
labs: reporting, grain-trap, which-door
terms: otbi, subject-area, bi-publisher-bip, bursting, hcm-extract, rest-api
---

There is no SQL Developer connection to a SaaS pod. When someone asks how to get data out of Oracle HCM, the complete answer names four paths and a reason for each: OTBI for ad-hoc analysis, BI Publisher for formatted output and complex SQL, HCM Extract for scheduled or large-volume outbound files, and REST for real-time integration.

## OTBI: self-service against live data

**Oracle Transactional Business Intelligence (OTBI)** is ad-hoc reporting and analysis directly against live HCM data, built by dragging fields rather than writing SQL. It works through **subject areas**: pre-built, governed logical data models — think of them as pre-joined tables exposed as folders and columns — each covering a business domain at a fixed grain. Names follow a pattern of functional area, then grain, then "Real Time": *Workforce Management — Worker Assignment Real Time*, *Workforce Management — Person Real Time*, *Payroll — Payroll Run Results Real Time*. Reading the name tells you the grain before you open it, and "Real Time" areas give a current snapshot while "Trend" areas give data across periods.

Choosing the right subject area is most of the work, and choosing wrong is the number-one cause of reports that return wrong numbers rather than errors. Date-effective tables multiply rows; multiple assignments double-count people unless filtered to the primary, latest record.

The discipline that prevents it is one sentence long: say what a single row means before trusting any number built on it. In *Worker Assignment Real Time* a row is one dated version of one assignment, so a person promoted twice appears three times and a person holding two jobs appears twice again. Neither is a data error — the history is correct and the second assignment is real — but a row count answers "how many assignment versions", not "how many people". Filtering to the current dated row and to the primary assignment turns one into the other, at the cost of hiding the second job, which is why headcount and workload have to be asked for separately.

[[lab:grain-trap]]

Three constraints catch people. Two subject areas cannot be joined in a single analysis. There is a default row limit — commonly cited around 65,000 — past which OTBI can truncate silently. And subject areas are predefined; their grain cannot be changed. When one subject area is not enough there are three workarounds: a Combined Analysis joining two analyses on a shared key such as person number; moving to BI Publisher and writing the SQL; or an HCM Extract for genuinely large volumes.

## BI Publisher: pixel-controlled documents

**BI Publisher (BIP)** has two pieces: a data model, which is genuinely SQL against the reporting schema, and a template, which controls layout. Together they produce documents with exact formatting — payslips, salary certificates, statutory forms, letters — and they can be scheduled and delivered. **Bursting** splits one report run into many individual outputs, each delivered separately; it is the mechanism by which thousands of payslips from one payroll run are emailed to the right people, and it is the standard follow-up question after any BIP question.

BIP is more flexible than OTBI and slower to build: it demands stronger SQL, an understanding of entity relationships, manual data-security setup and template development. Reach for it when OTBI genuinely cannot do the job, not by default.

The decision rule, memorized: ad-hoc analysis, dashboards and quick operational lists go to OTBI; formatted, printable, per-employee and statutory documents go to BI Publisher. Using OTBI for a payslip or BIP for a quick headcount list are both wrong answers in an interview.

## What a data model actually looks like

The SQL half of BI Publisher is where the shape of Oracle's tables stops being an abstraction. Almost everything is date-effective, and a query that forgets it returns history as if it were the present.

```
SELECT p.person_number, n.full_name, s.salary_amount
FROM   per_all_people_f      p                                -- _f: date-effective
JOIN   per_person_names_f    n ON n.person_id = p.person_id
JOIN   per_all_assignments_m a ON a.person_id = p.person_id   -- _m: can change twice in a day
JOIN   cmp_salary            s ON s.assignment_id = a.assignment_id
WHERE  n.name_type = 'GLOBAL'
AND    a.primary_flag = 'Y'
AND    a.assignment_type = 'E'
AND    a.effective_latest_change = 'Y'
AND    TRUNC(SYSDATE) BETWEEN p.effective_start_date AND p.effective_end_date
AND    TRUNC(SYSDATE) BETWEEN n.effective_start_date AND n.effective_end_date
AND    TRUNC(SYSDATE) BETWEEN a.effective_start_date AND a.effective_end_date
AND    TRUNC(SYSDATE) BETWEEN s.date_from AND s.date_to
```

Four things in it are worth carrying into every data model. The `_f` suffix marks a date-effective table and `_m` one that can change several times in a single day, so each needs its own "valid today" filter — put the filter on only one of them and two name versions multiplied by three salary versions returns six rows for one person. Salary joins to the assignment rather than to the person, because that is where pay lives, which is also why someone with two assignments has two salaries. `primary_flag = 'Y'` is the same filter the subject-area grain needed, one level lower down. And every `JOIN` here is an inner join, so a new hire whose salary has not been entered yet vanishes from the report entirely rather than appearing with a blank — the failure mode to look for when a count comes back slightly short.

## Extract and REST: the integration boundary

**HCM Extract** pulls HCM data on a schedule and delivers it to an external system — banks, benefits providers, government portals. It supports changes-only extracts, sending only what has changed since the last run, and it is the right tool when a data volume is too large for OTBI. The **REST API** is Oracle's web-service interface for programmatic read and write access, used where a scheduled file would be too slow: recruitment platforms, identity systems, custom applications.

The honest boundary for a functional consultant: HDL, simple formulas, OTBI and basic BIP are routinely expected. Oracle Integration Cloud (OIC) integrations and complex BIP development are where the genuine hand-off to a technical team happens.

[[lab:reporting]]

Two requests that sound like reporting questions are not. Anything coming *into* Oracle in bulk — ten thousand workers for go-live, a mass update of grades — is HCM Data Loader, not a report; the four paths are all exits. And a request to connect a SQL client directly to the database has no answer at all, because a SaaS pod exposes no database connection to anyone. Where the requirement genuinely needs SQL, the SQL lives inside a BI Publisher data model.

[[lab:which-door]]

## Common mistakes

- Using OTBI for a payslip, or BIP for a quick list.
- Trusting a large OTBI result without checking the row limit.
- Picking a subject area by name without checking its grain.
- Assuming direct database access exists.

## Sources

- Oracle, *Creating and Administering Analytics and Reports for HCM* — "HCM Subject Areas for Transactional Business Intelligence". https://docs.oracle.com/en/cloud/saas/human-resources/fahca/hcm-subject-areas-for-transactional-business-intelligence.html
- HCM Tables, "Oracle Fusion HCM OTBI Subject Areas — Complete Guide with Decision Tree". https://www.hcm-tables.com/blog/otbi-subject-area-guide
- Hexstream, "Oracle Fusion OTBI vs BI Publisher". https://www.hexstream.com/tech-corner/oracle-fusion-otbi-vs-bi-publisher
- SplashBI, "How To Join Two Subject Areas in OTBI". https://splashbi.com/blog/cross-subject-area-otbi-reporting/
</script>

---
id: extend
num: 14
domain: hcm
track: technical
title: Extending Without Customizing
subtitle: Flexfields, lookups, design studio, sandboxes — the answer to "can you add a field?"
hue: 262
minutes: 12
labs: 
terms: dff-descriptive-flexfield, lookup-type-and-lookup-code, value-set, sandbox, journey, redwood, quarterly-update-26a-26d, transaction-design-studio, autocomplete-rule, alerts-composer
---

Every client needs a field Oracle did not ship, an option Oracle did not put in a dropdown, and a screen that behaves slightly differently for one group of users. In a SaaS product none of that can be done by changing code. Oracle's answer is a set of configuration tools that survive upgrades, and the correct response to most "can you add…" requests is one of them — said with the name of the tool, which is what separates a consultant from a note-taker.

## Descriptive flexfields, and the two cousins

A **descriptive flexfield (DFF)** is a configurable extra field added to a standard object without customization: an equipment number, a badge colour, a union membership number. Because it is configuration rather than code, it survives every quarterly update. A **value set** constrains what a flexfield segment can accept — free-text fields become dirty data, so value sets enforce validity and are used together with DFFs to control input.

Two relatives come up often enough to recognise. An **extensible flexfield (EFF)** holds more than one row of extra data against a record — several certifications against one worker, say — where a DFF holds a single set of values. And a **key flexfield (KFF)** is the structure of a code made of segments, the cost allocation key used by payroll costing (Chapter 5) being the one a functional consultant meets.

The question that picks between them is how many of the thing there can be. One value per record is a DFF; many is an EFF; a structured code whose segments mean something to Finance is a KFF.

## Lookups

**Lookup types** and **lookup codes** are configurable lists of values powering dropdowns across the application: contract types, reasons for leaving, nationality lists. They are usually the right answer to "can we add an option to this dropdown?"

Lookups have an access level — user, extensible or system — which decides how much of a delivered list may be changed. A client can add their own leaving reasons to an extensible lookup; they cannot remove Oracle's, and the attempt to tidy a delivered list is a reliable way to spend an afternoon. Lookups are also the quiet backbone of reporting: a leaving reason that exists as a code can be grouped and counted, where the same reason typed into a comment cannot.

## The three-thought habit

When a client says "we need an extra field for X", the first three thoughts should be: DFF (where does the data live), lookup (should it be a controlled list), and approvals (what should the workflow do about it). Saying that sequence aloud in a workshop or interview is a strong signal. For example: recording which company car each manager has is a DFF on the assignment with a value set; a new resignation reason called "Further Study" is a lookup code; hiding the grade field on the transfer form for non-managers is a page-level change made in a sandbox.

[[fig:extension-ladder]]

## The design studio: changing what a page asks for

The tool most often missing from a junior's vocabulary is the **HCM Experience Design Studio**, and it answers the most common request of all: not "add a field" but "stop asking for this one".

**Transaction Design Studio** controls, per transaction and per role, which fields and sections appear — hiding salary on a transfer for line managers, making a reason mandatory on termination, showing a region-specific section only to the people who need it. It is configuration, it survives updates, and it is where a surprising share of "the screen is confusing" feedback from user acceptance testing is resolved.

**Autocomplete rules** sit beside it and handle defaulting and validation without a formula: default the business unit from the legal employer, block a hire date more than a year ahead, derive one field from another as the user types. They cover the ground that used to need a technical change, which makes them worth knowing by name even before knowing how to write one.

**Alerts Composer** is the third member of the family: configurable notifications on events — a contract approaching expiry, a probation ending, a document expiring — which is how the UAE's contract-expiry requirement in Chapter 18 and Egyptian document tracking are met without building anything.

## Sandboxes and publishing

A **sandbox** is an isolated workspace for making and testing configuration changes — page layouts, flexfields, design studio rules — before publishing them to the live environment. Publishing a sandbox is the moment a change becomes real for every user: a controlled, deliberate step, not an autosave.

Two habits keep sandboxes from becoming a problem. Keep them short-lived and single-purpose, because two sandboxes that touch the same page will conflict and the second publish wins in ways nobody intended. And publish in the order the changes depend on each other: a design studio rule that references a flexfield needs the flexfield published first, or it quietly refers to nothing.

## Journeys, Redwood and the quarterly cycle

A **journey** is a configurable checklist of tasks assigned to a person around an event — onboarding, transfer, offboarding — covering the many small tasks across several people that otherwise get missed: equipment, badge, policy acknowledgements, document uploads. It is a visible, client-pleasing feature and a good thing to demonstrate.

**Redwood** is Oracle's current user-experience design system, progressively replacing older pages; a large and growing share of new capability, including Oracle's AI features, is built on it. Recognition-level awareness is enough, but describing the product only in terms of the classic interface sounds a release behind. What matters practically is that a Redwood page and a classic page are not configured the same way, so "can you hide that field?" has two different answers depending on which one the client is looking at.

Fusion applications update on a fixed **quarterly cycle**, named by year and letter — 26A, 26B, 26C, 26D. Updates are mandatory and scheduled; each brings features that are enabled by default or require opt-in, and regression testing around updates is a standing client obligation. The readiness material Oracle publishes before each release is the input to that testing, and the work is to read it for the features that touch what you built rather than all of it. Handling a quarterly update well after go-live is where consultants build reputations.

## Where the line actually is

Three words get used interchangeably in workshops and mean different things to a project. **Configuration** is setup the product expects — plans, elements, roles, flexfields, design studio rules — and it is the answer to most requests. **Extension** is building something new within the supported tools: a Fast Formula, a BI Publisher report, an integration. **Customization**, in the on-premise sense of changing delivered code, does not exist here at all.

The useful sentence in a workshop is that nothing is impossible and everything has an owner: a configuration change costs a conversation, an extension costs design, testing and someone to maintain it through quarterly updates, and the third option is not available. Saying that early is what prevents a client hearing "no" and a project hearing "yes" to the same request.

## Common mistakes

- Promising a "customization". In SaaS, it is configuration, an extension, or a conversation about scope.
- Adding a free-text field without a value set.
- Reaching for a flexfield when the request was really "stop showing me this field" — that is the design studio.
- Trying to delete Oracle's delivered lookup codes instead of adding your own.
- Letting a sandbox live for weeks, then publishing it over someone else's work.
- Publishing a design studio rule before the flexfield it refers to.
- Treating a quarterly update as an IT event with no functional testing attached.

## Sources

id: security
num: 15
domain: hcm
track: technical
title: The Security Model
subtitle: What you can do versus whose data you can see
hue: 300
minutes: 11
labs: security
terms: job-role, abstract-role, duty-role, data-role-and-security-profile, area-of-responsibility-aor, role-provisioning-rule, security-console, ldap-synchronization
---

Security determines who can see and do what. A consultant needs conceptual fluency rather than deep architecture skill, but the vocabulary appears in almost every requirements workshop, and one distinction carries most of it: function versus data scope. The second half of this chapter is the part that earns its keep on a live project — how a role actually reaches a user, and what to check when someone opens a page and finds it empty.

## Role types

Oracle's documentation defines five role types. A **job role** represents the specific job a worker does in the enterprise — Human Resource Analyst, Payroll Manager — and is the most-discussed role type in requirements sessions. An **abstract role** represents a worker's role independently of any job: the predefined Employee, Contingent Worker and Line Manager roles, which grant baseline self-service access to everyone in the system. A **duty role** is a logical grouping of function privileges — the granular building block from which job and abstract roles are composed; duty roles are never assigned directly to users. Aggregate privileges combine a task's function privilege with its data-security policy and are predefined and non-editable.

## Data scope: security profiles and data roles

Where a job role says what a user can do, a **security profile** says which records they can do it to. Profiles scope data by person, organization, position, legislative data group, payroll and other criteria. A **data role** combines a job role with the security profiles that define its scope — Oracle's example is "Country Human Resource Specialist": the HR specialist job plus a country's data. An HR specialist in Egypt and one in Saudi Arabia hold the same job role and see the same screens; their security profiles differ, so neither sees the other country's records. Same function, different scope.

[[fig:function-vs-data]]

## Areas of responsibility

An **area of responsibility (AOR)** assigns responsibility for a defined population — "this HR representative is responsible for the Alexandria plant" — and is used to drive both access and routing without building a custom role for every combination. It is increasingly the preferred mechanism for scoping HR representative access, and it is what stops a client with thirty departments acquiring thirty data roles that each have to be maintained separately.

[[lab:security]]

## How a role actually reaches a user

None of the above matters until a role is provisioned, and that happens in one of three ways. Knowing which one a client uses is the difference between a five-minute fix and an afternoon.

**Automatic provisioning** is the normal path. A **role provisioning rule** maps a role to a condition on the worker's record — legal employer, business unit, job, grade, department, worker type, assignment status — so a new hire in that population receives the role when the record is created and loses it when the condition stops being true. A rule is why the Employee abstract role appears on every hire without anyone doing anything.

**Manual provisioning** assigns a role to one named person. It is right for genuine exceptions and corrosive as a habit: manually assigned roles are invisible to the rules, survive transfers, and accumulate until an audit finds them.

**Role delegation** lets a user hand their access to someone else for a defined period — the HR manager covering for a colleague on leave. It is time-bound by design, which is the whole point of it.

Two scheduled processes sit underneath all of this. *Autoprovision Roles for All Users* re-evaluates the rules across the population, which is what to run after changing a rule rather than waiting for each person's next transaction. And **LDAP synchronization** — *Retrieve Latest LDAP Changes* and *Send Pending LDAP Requests* — moves account and role changes between HCM and the identity store. A role that is configured correctly and still has not appeared is very often waiting on one of those two jobs.

## The Security Console

The **Security Console** is where roles are built, copied and inspected, and three things in it are worth knowing by name. Copying a delivered role is the supported way to create a custom one, because Oracle's own roles must not be edited and an edit is overwritten by a quarterly update (Chapter 14). The role hierarchy view shows what a role actually contains, several levels down, which answers "why can this user do that?" without guessing. And the simulation view shows what a named user can see and do, which is the fastest way to confirm a change before telling a client it is done.

## When somebody cannot see what they should

This is the most common security ticket on a live system, and it has an order worth working through rather than jumping around in.

Start by separating the two questions. If the page does not open at all, it is a function problem: the user lacks the role, or the role lacks the privilege. If the page opens and is empty, it is a data problem, and the role is almost certainly fine.

For a data problem, check four things in this order. Does the user hold the data role or AOR you think they do — the data role, not the job role. Does its security profile actually cover that population: a profile scoped by department does not cover someone whose department changed last week. Is the underlying hierarchy true: a line manager sees nothing when the manager relationship on the assignment is missing, which is a data error wearing a security costume. And has LDAP synchronization run since the change.

Nine times out of ten the answer is in that list, and all four are things a functional consultant can check without a technical colleague — which is exactly why the chapter is worth knowing at this depth.

## Common mistakes

- Answering a data-visibility question with a job role.
- Assigning duty roles to users. They are components, not assignments.
- Building one custom role per department when an AOR would do.
- Editing a delivered role instead of copying it, and losing the change in a quarterly update.
- Provisioning roles by hand until nobody can say why a user holds what they hold.
- Reporting a security change as done before LDAP synchronization has run.

## Sources

- Oracle, *Securing HCM* — the role types, security profiles, data roles and the role-provisioning chapters. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/index.html
- Oracle, *Securing HCM Questions and Answers* — "Which are the role types in HCM Cloud?". https://docs.oracle.com/en/cloud/saas/human-resources/faqas/which-are-the-role-types-in-hcm-cloud.html
- Oracle, *Using Common Features for HCM* — the Security Console, copying a delivered role, and the simulation view. https://docs.oracle.com/en/cloud/saas/human-resources/faucf/index.html
</script>

id: method
num: 16
domain: hcm
track: functional
title: Implementation Methodology
subtitle: How projects actually run — and where the real finish line is
hue: 62
minutes: 9
labs: method, fit-gap, cr-or-defect
terms: fit-gap-analysis, crp-conference-room-pilot, sit-system-integration-testing, uat-user-acceptance-testing, cutover, freeze-period, hypercare, reconciliation, configuration-workbook, test-script, raid-log, change-request, oracle-true-cloud-method
---

This is the vocabulary of how projects are delivered. Trainers and interviewers use it constantly, and using it correctly makes a consultant sound like someone who has been on a project rather than someone who has read about one. Oracle's current methodology for Fusion Cloud projects is the **Oracle True Cloud Method**, successor to older methodologies such as AIM — whose document codes still appear in conversation: BR100 for setup documents, MD050 for functional designs, TE040 for test scripts.

## From requirements to design

A **fit-gap analysis** compares client requirements against delivered functionality and documents where the product fits, where it does not, and what will be done about each gap: configure, work around, extend, or descope. It is the foundation of scope and the reference point for every later argument about what was agreed. The **configuration workbook** — usually a large structured spreadsheet — records every configuration decision and its agreed values; it is the record of what was built and why, and the basis for rebuilding it in the next environment.

The five labels are not interchangeable, and choosing between them is the first real judgement a consultant makes on a project. *Fit* and *configure* sit inside the estimate already agreed. *Extend* — a Fast Formula, a BI Publisher report, an integration — adds design, testing and, more easily forgotten, an owner for the day the statutory figure inside it changes. *Work around* costs no build at all and changes how people work, so it needs the process owner's agreement rather than the project manager's. *Descope* is a decision someone has to sign, not a request quietly dropped; dropped requests come back during user acceptance testing, labelled as defects.

[[lab:fit-gap]]

Clients cannot validate a design from a document. A **conference room pilot (CRP)** is a structured demonstration of the configured system to the client, using their own data and scenarios, usually run in iterations — CRP1, CRP2 — with feedback incorporated between them.

## Testing

**System integration testing (SIT)** checks that the configured system works end to end, including integrations with other systems; individual pieces working does not mean the chain works. It is executed by the project team before handing over to the client for **user acceptance testing (UAT)**, in which the client executes agreed **test scripts** — step-by-step documents defining what to do, what data to use and what result to expect. Each requirement should be traceable to at least one script; testing without scripts is clicking, not testing. On functional projects the consultant writes the scripts and often helps execute them, and UAT failures land on the configuration.

## Cutover and go-live

**Cutover** is the sequenced set of activities moving the client from the legacy system to the new one: final data loads, reconciliation, a **freeze period** during which no changes are permitted in the legacy system so that migration runs against a stable base, and go/no-go decisions. Go-live is not a moment but an ordered plan with dependencies and rollback points. **Reconciliation** — comparing outputs between two systems or two runs and explaining every difference — is central to both data migration and the parallel payroll run; an unexplained difference is a defect until proven otherwise.

**Hypercare** is the intensive support period immediately after go-live, with heightened staffing and response times, typically covering the first one or two live payroll runs. The first live cycles surface problems no amount of testing catches. Hypercare and the first live payroll — not the go-live date — are the actual finish line.

[[lab:method]]

## Governance

Running alongside all of it: the **RAID log**, a single visible home for risks, assumptions, issues and dependencies, reviewed in regular governance meetings; and the **change request**, the formal mechanism by which "can you just add…" becomes a managed decision with its impact on time and cost assessed. Learning to recognize a change request when it is spoken in a workshop — before agreeing to it — protects both the project and the consultant.

The everyday version of that discipline is a three-way sort, usually made standing in a testing room. Something agreed, documented and not working is a **defect**: fix it. Something never agreed, however small it sounds, is a change request: log it, price it, let someone with authority accept it. Something that asks for nothing at all is a question: answer it, and keep answering them, because questions are where unstated requirements surface. Filing change requests as defects is the most common way a project absorbs work nobody agreed to, and the reason it runs late is then impossible to explain.

[[lab:cr-or-defect]]

One principle underlies the whole method: consultants do not design the best system; they get decisions made and documented. The client owns the design.

## Common mistakes

- Treating testing as the QA team's job.
- Skipping the freeze and migrating a moving target.
- Calling go-live the finish.
- Agreeing to scope changes in a workshop without a change request.

## Sources

- Oracle, *Oracle True Cloud Method* overview (Oracle Consulting). https://www.oracle.com/consulting/
- Intellicept, "Oracle ERP Cloud Implementation Phases | Detailed Explanation". https://intellicept.com/oracle-erp-cloud-implementation-phases-explained
- Jade Global, "Oracle Cloud Implementation Methodology". https://www.jadeglobal.com/oracle/methodology/jadecloud-implementation-methodology
</script>

id: gulf
num: 17
domain: hcm
track: functional
title: Saudi Arabia & the Gulf
subtitle: The government platforms a Saudi implementation runs on
hue: 130
minutes: 9
labs: gratuity
terms: gosi, qiwa, mudad, nitaqat-saudization, wps-and-sif-file, iqama-and-visa-linked-employment-data, end-of-service-benefit-eosb-gratuity
---

A Saudi implementation runs on government platforms that have no Egyptian equivalent, and Oracle's generic Gulf localization does not reach them. This chapter covers the systems, the numbers that matter, and the ways a Saudi implementation differs structurally from an Egyptian one.

> **Figures move here too.** Saudi social-insurance rates are being phased up under the 2024 reform, and platform rules change by ministerial decision. Verify against GOSI and the Ministry of Human Resources and Social Development before configuring.

## GOSI: social insurance with two populations

The **General Organization for Social Insurance (GOSI)** is the Saudi counterpart to Egypt's NOSI. The structural difference from Egypt is that contribution treatment depends on nationality. For Saudi nationals registered before the new Social Insurance Law took effect on 3 July 2024, the combined rate is 21.5% of the contributable wage — employee 9.75% (9% pension plus 0.75% SANED unemployment insurance), employer 11.75% (9% pension, 2% occupational hazards, 0.75% SANED). Nationals registered on or after that date fall under a phased schedule that rises from 22.5% to 23.5% combined from 1 July 2026, with further annual steps and a retirement age of 65. Expatriates carry only the employer-paid 2% occupational-hazards contribution — no pension, no SANED. The contributable wage is basic salary plus housing allowance, capped at SAR 45,000 per month; transport, commission and bonuses are excluded.

[[fig:gosi-populations]]

For an Oracle design this means nationality is a payroll-driving attribute, GOSI registration dates matter, and the element inventory needs separate treatment for the two populations.

[[fig:contributable-wage]]

## Qiwa, Mudad and the Wage Protection System

**Qiwa** is the Ministry of Human Resources' digital labour platform: employment contracts are authenticated through it, and it handles work permits and establishment services. **Mudad** is the platform supporting wage protection and payroll compliance. The **Wage Protection System (WPS)** requires employers to pay salaries through official banking channels and to upload monthly payroll documentation — the **SIF** (Salary Information File) — containing each employee's ID or iqama number, basic salary, allowances, deductions and net pay. The system matches the file against actual bank transfers; when they match, the employee is legally considered paid.

Compliance is enforced through consequences: late files escalate from a minor violation to a partial freeze of Qiwa services, and after three months to the employee's right to transfer sponsorship without consent. The three platforms must agree: the basic salary in the Qiwa contract must equal the basic salary in Mudad and in GOSI, so salary changes have to land on all three at once. In Oracle terms, the payment process (Chapter 5) produces the WPS file, and a Gulf go-live always includes a bank-file test with the actual bank.

[[fig:wps-agreement]]

## Nitaqat and nationality as compliance data

**Nitaqat**, or Saudization, is the quota system requiring employers to maintain minimum percentages of Saudi national employees, with a colour-banded compliance rating that directly affects the ability to obtain visas and government services. WPS compliance feeds the rating. As a result, nationality reporting and workforce-composition analytics take on compliance significance in Saudi implementations that they do not have in Egypt: nationality is a compliance-reportable attribute, not merely demographic data.

## Iqama, visas and document-driven employment

Employment legality in the Gulf is document-dependent in a way it is not in Egypt. **Iqama** (residency permit) numbers, visa details, expiry dates and renewal alerts become genuine HR requirements for every expatriate, and they combine with contract-expiry alerting (Chapter 8). Egyptian implementations mostly do not carry this; every Gulf one does.

## End-of-service benefit

Gulf labour law provides an **end-of-service benefit (EOSB)** in place of a state pension for expatriates: a statutory lump sum on departure, calculated on length of service and final wage, with country-specific formulas and reductions for resignation before a service threshold. It is a central component of the final settlement in any Gulf payroll and has no Egyptian equivalent.

The Saudi award under Articles 84 and 85 of the Labour Law is the pattern to know: half a month's wage for each of the first five years and a full month for each year after that, calculated on the last wage and pro-rated for part years, then reduced where the worker resigns — nothing below two years of service, a third from two to five, two thirds from five to ten, and the full award at ten years or more. Figures checked in 2026; Saudi labour law has been amended repeatedly in recent years, so verify against the current text and the client's own contracts, which may be more generous than the statutory floor.

What decides the money is not the formula but the service length fed into it, and that is a configuration question. A worker who left and returned, or who moved between group companies, has a new work relationship and a new legal employer start date; whether the earlier service still counts is a policy decision the client has to state, and it is expressed through a seniority date rather than by back-dating the new employment (Chapter 3). A rehire configured with a fresh service clock under a policy that bridges the break under-pays every affected leaver, and no payroll report flags it, because both figures are arithmetically correct.

[[lab:gratuity]]

## Common mistakes

- Treating GOSI as one rate. Nationals and expatriates differ, and the 2024 reform split nationals into two schedules.
- Ignoring the SAR 45,000 wage ceiling and the basic-plus-housing base.
- Forgetting that Qiwa, Mudad and GOSI must show the same basic salary.
- Treating nationality as demographic data rather than compliance data.
- Leaving the WPS file to the end of the project.

## Sources

- Mercans, "GOSI Contributions in Saudi Arabia: 2026 Rates, Rules & Compliance Guide". https://mercans.com/glossary/gosi-contributions/
- Mercans statutory alert, "Saudi Arabia: GOSI Contribution Rates & Saned Unemployment Fund 2026". https://mercans.com/resources/statutory-alerts/saudi-arabia-gosi-contribution-rates-saned-unemployment-fund-2026/
- Snad, "Mudad and the Wage Protection System (WPS): 2026 Employer Guide". https://www.snad.io/en/blog/mudad-wps-hamayat-ujur-saudi
- Ministry of Human Resources and Social Development (Saudi Arabia), *Labor Law* (Royal Decree M/51), official English translation — Articles 84 and 85. https://www.hrsd.gov.sa/sites/default/files/2023-02/Labor.pdf
- Ministry of Human Resources and Social Development, "Calculating End-of-Service Award" and "End-of-Service Award Regulations", for the pro-rating of part years and what counts as wage. https://www.hrsd.gov.sa/en/knowledge-centre/articles/316
- Qiwa (Ministry of Human Resources and Social Development) — the platform itself, for what employers file. https://qiwa.sa
</script>

id: uae
num: 18
domain: hcm
track: functional
title: The UAE
subtitle: A second Gulf country that configures nothing like the first
hue: 118
minutes: 14
labs: gratuity
terms: mohre, uae-fixed-term-contract, gpssa, alternative-end-of-service-savings-scheme, emiratisation-and-nafis
---

The UAE employs more Oracle HCM consultants than anywhere else in the region, and almost nothing in a Saudi implementation transfers to it unchanged. The gratuity formula is different, the wage-protection file is different, the pension covers a different population under a different authority, and the nationalization programme counts differently. A consultant who has done one Gulf country and assumes the second is a variation of it will design the wrong thing twice before anyone notices. This chapter is the UAE half of Chapter 17.

> **Every figure here moves, and the sources disagree more than usual.** The rules below were checked in 2026 against PwC and Mercans summaries; the authorities are MOHRE for labour matters, GPSSA for pensions and Nafis for Emiratisation, and the official Arabic text governs. Free zones — the DIFC and ADGM especially — run their own employment regimes that this chapter does not cover. Verify before configuring anything.

## Every contract is fixed-term now

Federal Decree-Law No. 33 of 2021 replaced the 1980 labour law and removed the distinction a generation of HR managers grew up with: there is no unlimited contract in the private sector any more. Every contract is fixed-term, renewable, and the renewals are where the administrative work lives.

That is a configuration statement, not a legal footnote. Contract end dates become data the system has to hold and act on, which means contract-expiry alerting is not an optional extra in a UAE implementation the way it is in an Egyptian one, and the lifecycle events of Chapter 8 acquire a route that Egypt does not have: expiry without termination. A client still using "limited" and "unlimited" in a requirements workshop is describing the superseded law, and the useful response is to ask when their contracts were last reissued rather than to configure the vocabulary they used.

## The gratuity is not the Saudi one

The end-of-service gratuity under Article 51 is **21 days of basic wage for each of the first five years of service, and 30 days for each year after that**, payable to anyone with at least one year of continuous service and capped at two years' total wage. Unpaid absence does not count toward service, and the settlement falls due within fourteen days of the contract ending.

Three of those details differ from Saudi Arabia in ways that change the calculation, not just the number. The UAE accrues on **basic wage**, where the Saudi award in Chapter 17 is computed on the last wage as defined by that law — so the component split of the salary (Chapter 5) decides the UAE liability directly. The UAE applies a **cap** of two years' pay, which Saudi Arabia does not. And the UAE pays the full award on resignation after one year, where the Saudi scale reduces it below ten years of service. An EOSB element built for one country and reused in the other is wrong in at least three places.

[[lab:gratuity]]

Since 2023 employers may also join a voluntary **alternative end-of-service savings scheme**, paying monthly contributions into a regulated fund instead of accruing a lump sum on their own books. Where a client has joined it, the payroll design changes shape entirely: a monthly contribution element replaces an accrual and liability calculation, and the final settlement no longer carries the gratuity at all. Ask which model the client is on before designing either.

## GPSSA covers nationals; expatriates have the gratuity instead

Pension contributions through the General Pension and Social Security Authority apply to UAE nationals, and to other GCC nationals under the Gulf insurance-protection extension that Chapter 17 describes from the Saudi side. Expatriates are not in the pension system at all — the gratuity is their end-of-service provision, which is why the two subjects sit in one chapter here and in two places in a European implementation.

There are two contribution regimes, split by when the worker was first registered. Workers registered before November 2023 sit on the older scheme; those entering the workforce from the end of October 2023 fall under Federal Decree-Law No. 57 of 2023, whose total contribution is higher and whose split between employee and employer differs. Published summaries disagree on both the exact cutoff date and the current percentages, and a government subsidy can reduce the employer share at lower salaries, so the rates belong in a dated global value read from GPSSA's own published schedule rather than hard-coded into a formula — the mistake Chapter 12's lab is built around.

What matters structurally is the same point Chapter 17 makes about Saudi Arabia: nationality and registration date are payroll-driving attributes, not demographics. They decide which schedule applies, and a person record missing either produces a contribution that is quietly wrong rather than an error.

## The Wage Protection System, UAE edition

The UAE runs its own Wage Protection System through MOHRE and the Central Bank. Salaries are paid through approved agents and reported in a Salary Information File whose layout is a UAE layout — it is not the file Saudi Arabia's Mudad platform accepts, and the two countries' records are not interchangeable.

This is the single most common cross-Gulf mistake in a payroll design: treating "the Gulf WPS" as one requirement. It is one idea implemented separately per country, with its own file, its own agent, its own identifiers and its own rejection behaviour. A multi-country Gulf go-live needs one bank-file build and test cycle per country, with the real bank, every time (Chapter 5).

## Emiratisation, and what it asks of the data

**Emiratisation** is the UAE's nationalization programme, administered with the Nafis platform. Private-sector companies above the size threshold must raise the share of UAE nationals in skilled roles by a set percentage each year, with monthly financial penalties per unfilled position, escalating annually. Penalties for artificially satisfying the quota — hiring a national who does not genuinely work — are heavier again and sit under a separate decision.

For the consultant the mechanics matter less than what they require of the record: a trustworthy national identifier, an accurate nationality, a job that is correctly classified as skilled, and a reporting line that can produce the ratio on demand. Those are Chapter 2 and Chapter 13 problems wearing a compliance hat, and they are the ones to raise in design rather than in the month the first report is due.

## Where the structure differs

Mainland and free-zone entities answer to different regulators, which usually means separate legal employers, separate registrations and separate wage-protection arrangements, even when the group presents itself as one business. The parent-PSU shape from Chapter 1 is common here: several legal employers, one filing entity, one payroll relationship across them where the statutory unit is shared.

The practical question in the first workshop is therefore not "how many companies do you have" but "how many registrations do you file under, and with whom" — and the answer frequently surprises the client.

## Common mistakes

- Reusing a Saudi end-of-service element in the UAE. Different accrual, different base, different cap, different resignation treatment.
- Assuming one Gulf WPS file. The UAE and Saudi Arabia have separate systems, formats and agents.
- Treating "limited and unlimited contracts" as current. Every private-sector contract is fixed-term under the 2021 law.
- Putting expatriates into the pension scheme. GPSSA covers nationals; expatriates have the gratuity.
- Hard-coding pension percentages that change by registration date and by government subsidy.
- Treating Emiratisation as a reporting problem at go-live rather than a data-quality problem in design.

## Sources

- PwC Worldwide Tax Summaries, United Arab Emirates — "Other taxes", for social-security contributions and the national and GCC populations they cover. https://taxsummaries.pwc.com/united-arab-emirates/individual/other-taxes
- Mercans, "End of Service Gratuity (EOSG) in the UAE" — the Article 51 accrual, the one-year threshold and the two-year cap. https://mercans.com/glossary/uae-end-of-service-gratuity/
- Federal Decree-Law No. 33 of 2021 on the Regulation of Employment Relationships, and Federal Decree-Law No. 57 of 2023 on pensions — the governing texts, published by the UAE government; the Arabic text governs.
- MOHRE for labour and wage protection, GPSSA for pension contribution schedules, and Nafis for current Emiratisation targets and penalties — the authorities to verify against before configuring.
</script>
