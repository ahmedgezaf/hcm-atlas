---
id: sql-windows
num: 4
domain: analytics
track: technical
title: Windows, CTEs and the Second Half of SQL
subtitle: Ranking, running totals and period-on-period — without collapsing the rows
hue: 262
minutes: 8
labs: windows
terms: window-function, partition-by, row-number-rank-dense-rank, lag-and-lead, frame-clause, cte, recursive-cte, qualify
---

Everything up to here collapses rows. `GROUP BY` takes fifty rows and gives you one. Window functions are the other half of SQL: they compute across a set of rows and give the answer back *on every row*, keeping the detail. Ranking, running totals, month-on-month change and "each row's share of its group" all live here, and an analyst who cannot write them is limited to reports that only ever show totals.

## The anatomy

```sql
SELECT
  order_date,
  customer_id,
  total,
  SUM(total) OVER (PARTITION BY customer_id ORDER BY order_date) AS running_total
FROM orders
```

`OVER` is what makes it a **window function**. `PARTITION BY` splits the rows into independent groups — the calculation restarts for each customer — and is the window equivalent of `GROUP BY`, except the rows survive. `ORDER BY` inside `OVER` defines the sequence the function walks in, which is what makes "running" mean anything.

[[lab:windows]]

## Ranking, and the three that differ

`ROW_NUMBER()` numbers rows 1, 2, 3 with no ties ever — two identical values still get different numbers, chosen arbitrarily unless you break the tie yourself. `RANK()` gives ties the same number and then skips: 1, 2, 2, 4. `DENSE_RANK()` gives ties the same number and does not skip: 1, 2, 2, 3.

Which you want depends on the question. "The top 3 by revenue" with ties probably wants `DENSE_RANK`. "Pick exactly one row per customer" wants `ROW_NUMBER` with a deliberate tiebreaker in the `ORDER BY`, because otherwise the row you get is not stable between runs.

Note that you cannot filter on a window function in `WHERE` or `HAVING` — both run before `SELECT`, where the window is computed. Wrap it in a CTE or subquery and filter outside. Some warehouses add a `QUALIFY` clause that filters window results directly; it is not standard SQL, and it is worth knowing whether your engine has it before you write it.

## Looking at the row before

`LAG(total) OVER (ORDER BY order_date)` returns the previous row's value; `LEAD` returns the next one's. This is how period-on-period change is written, and it replaces the self-join that beginners reach for:

```sql
total - LAG(total) OVER (PARTITION BY customer_id ORDER BY order_date) AS change
```

Both take an optional offset and default — `LAG(total, 1, 0)` returns 0 rather than NULL for the first row, which is often what a chart wants.

## The frame, and the trap inside it

There is a third part to a window nobody mentions until it bites: the **frame**, which decides how much of the partition the function sees for the current row. Written out it looks like `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`.

Here is the part to remember. When you supply an `ORDER BY` and no frame, the default is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` — and `RANGE` treats all rows with the *same ordering value* as one unit. If two orders share a date, a running total defaulting to `RANGE` gives both rows the total including both, not a stepped total. With `ROWS` it steps one row at a time. On data with no ties the two are identical, which is exactly why this bug survives testing and appears in production.

If you mean row-by-row, write `ROWS` explicitly.

## CTEs

A **common table expression** names a query so the next one can use it:

```sql
WITH monthly AS (
  SELECT customer_id, date_trunc('month', order_date) AS m, SUM(total) AS revenue
  FROM orders GROUP BY 1, 2
)
SELECT *, revenue - LAG(revenue) OVER (PARTITION BY customer_id ORDER BY m) AS mom
FROM monthly
```

CTEs are the main tool for keeping long queries readable: each step is named, testable on its own, and chainable. Prefer several small ones to a single nested subquery three levels deep. A **recursive CTE** additionally references itself, which is how you walk a hierarchy — an org chart, a bill of materials, a category tree — in one query.

Two cautions. A CTE is not automatically materialised: some engines inline it and evaluate it once per reference, so a CTE used three times may run three times. And readability is not free performance — a tidy chain of CTEs can still be slow, and the execution plan is the only thing that will tell you.

## Common mistakes

- Filtering a window function in `WHERE` instead of wrapping it.
- `ROW_NUMBER` with no tiebreaker, then wondering why results change between runs.
- Taking the default frame on data that has ties in the `ORDER BY`.
- Reaching for a self-join where `LAG` is one line.
- Assuming a CTE is computed once when it is referenced several times.

## Sources

- PostgreSQL documentation, "Window Functions" and "Window Function Calls" — frames and the `RANGE` default. https://www.postgresql.org/docs/current/tutorial-window.html
- Microsoft Learn, "OVER Clause (Transact-SQL)" — partitioning, ordering and `ROWS`/`RANGE`. https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql
- PostgreSQL documentation, "WITH Queries (Common Table Expressions)", including recursive CTEs. https://www.postgresql.org/docs/current/queries-with.html
</script>

id: excel
num: 5
domain: analytics
track: functional
title: Excel, Honestly
subtitle: What a spreadsheet is still the fastest answer to, and the point where it stops
hue: 145
minutes: 7
labs: 
terms: xlookup, index-match, excel-table, pivot-table, power-query, volatile-function, excel-limits, spill-and-dynamic-arrays
---

Analysts are quietly embarrassed about Excel and should not be. It is the fastest tool in existence for a question you have not asked before, on data you have just been handed, when the answer is needed in ten minutes and will never be needed again. Knowing where that stops is the actual skill.

## Lookups

**XLOOKUP** replaced VLOOKUP and should be the default in any version that has it. It takes a lookup value, the array to search, and the array to return, and it fixes three things that made VLOOKUP dangerous: it defaults to **exact match** rather than approximate; it can look left as well as right; and it references arrays rather than a column *number*, so inserting a column does not silently break it.

VLOOKUP's fourth argument is the one to know about even if you never write another. Omitted, it defaults to `TRUE` — approximate match — which assumes the lookup column is sorted ascending and returns the largest value less than or equal to the one asked for. On unsorted data Microsoft's own documentation promises nothing: the value returned may simply be wrong. Either way it is a confidently wrong answer rather than an error, which is why nobody notices. Every legacy VLOOKUP you inherit should be checked for a missing `FALSE`.

**INDEX/MATCH** is the older pairing that did what XLOOKUP does — `INDEX` returns the value at a position, `MATCH` finds the position. It is still worth reading fluently, because the spreadsheets you inherit are full of it.

## Tables, not ranges

Formatting a range as an **Excel Table** changes it from a rectangle of cells into a named object with typed columns. Formulas gain **structured references** — `=SUM(Sales[Revenue])` instead of `=SUM(D2:D5000)` — which describe intent rather than coordinates, extend automatically when rows are added, and do not silently exclude the row someone appended at the bottom.

That last failure is the most common serious error in spreadsheet work: a formula whose range stopped short. Tables remove the whole class of it, and the cost is one keyboard shortcut.

## Pivot tables

A **pivot table** is a grouped aggregation with a drag-and-drop interface, and it is genuinely the fastest way to explore an unfamiliar dataset. Fields go to rows, columns, values and filters; the default aggregation is `SUM` for numbers and `COUNT` for anything else, which is the source of the perennial "why is my pivot counting instead of summing" — there is a non-numeric value, often a stray text cell or a blank, in a column you believed was numeric.

Pivot tables want long data (Chapter 1). A wide table with a column per month cannot be pivoted by month until it is unpivoted, which is what Power Query is for.

## Power Query is the part worth learning properly

**Power Query** is the transformation engine built into Excel and Power BI alike, and it is the single highest-return thing an Excel user can learn. It imports, cleans, reshapes, unpivots, splits columns and joins tables — and it records every step, so the whole thing re-runs on next month's file with one click.

The difference from doing it by hand is not speed, it is that the work is *repeatable and inspectable*. A colleague can read the applied steps and see what you did. A folder of manually cleaned spreadsheets contains no such record, and nobody — including you — can reconstruct what happened three months later.

Because it is the same engine in Power BI, time spent here is not Excel-specific. It transfers directly.

## Where Excel stops

The hard limit is 1,048,576 rows by 16,384 columns per worksheet. In practice things get unpleasant well before that: file sizes in the tens of megabytes, recalculation pauses, and **volatile functions** — `NOW`, `TODAY`, `RAND`, `OFFSET`, `INDIRECT` — which recalculate on every change anywhere in the workbook and are a common reason a file becomes slow for no visible reason.

The softer limits matter more. A spreadsheet has no audit trail, no access control worth the name, and no way to tell whether the copy someone emailed you is the current one. The moment a number matters to more than one person, or has to be reproduced next month, the answer stops being a spreadsheet — it becomes a query against the source and a model somebody can refresh.

Modern Excel has also quietly become more capable: **dynamic arrays** mean a formula can **spill** into neighbouring cells, and `FILTER`, `SORT`, `UNIQUE` and `SEQUENCE` remove most of the reasons people used to need array formulas or helper columns.

## Common mistakes

- A VLOOKUP with the fourth argument omitted, matching approximately by default.
- Hard-coded ranges that stop short of new rows.
- Pivoting data that is still in wide form.
- Cleaning by hand, repeatedly, instead of recording the steps in Power Query.
- Keeping a number that several people depend on in a file that has no version history.

## Sources

- Microsoft Support, "XLOOKUP function". https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929
- Microsoft Support, "Excel specifications and limits". https://support.microsoft.com/en-us/office/excel-specifications-and-limits-1672b34d-7043-467e-8e27-269d656771c3
- Microsoft Learn, "Power Query documentation" — the transformation engine shared with Power BI. https://learn.microsoft.com/en-us/power-query/
- Microsoft Support, "Dynamic arrays and spilled array behavior". https://support.microsoft.com/en-us/office/dynamic-arrays-and-spilled-array-behavior-205c6b06-03ba-4151-89a1-87a7eb36e531

<script type="text/markdown" class="src-chapter">
---
id: payroll
num: 5
domain: hcm
track: functional
title: The Payroll Object Chain
subtitle: Element → eligibility → entry → run → balance → prepayment → payment → costing
hue: 152
minutes: 18
labs: payroll, payslip, balances, parallel-run
terms: element, element-classification, element-eligibility-element-link, element-entry, input-value, balance, salary-basis, payroll-definition, payroll-run, quickpay, prepayments, payment-process-bank-file, costing, parallel-run, salary-record, salary-component, rate-definition, time-card, payroll-flow, mark-for-retry-and-roll-back
---

Payroll in Oracle is a chain of objects, each depending on the one before it. A consultant who can recite the chain and explain what breaks when a link is missing can debug most payroll problems without opening a log. The chain runs: element → element eligibility → element entry → payroll run → balance → prepayment → payment → costing.

## Defining what can be paid

An **element** is the definition of a single thing that can appear on a payslip: a salary, an allowance, a deduction or an informational item. Payroll is built from named, individually configured components — "Basic Salary", "Transport Allowance", "Social Insurance Employee Contribution", "Loan Deduction" — rather than one monolithic calculation, so that each can carry its own rules, taxability and reporting treatment. Elements live inside one LDG and must be rebuilt per country. Every payslip line traces back to an element, and reading a client's element list is one of the first tasks on a project.

Each element has a **classification** — earnings, deduction, information — which controls processing order and how the element feeds balances. Payroll must process earnings before it can calculate deductions based on them, so classification drives sequencing: standard earnings, supplemental earnings, pre-statutory deductions, statutory deductions, voluntary deductions. When a calculation runs in the wrong order, classification and processing priority are the first things to check.

An element's **input values** are the fields that hold the data the calculation needs — amount, rate, percentage, units. A "Loan Deduction" element might carry input values for total loan amount, monthly instalment and remaining balance. Deciding an element's input values is a core design decision recorded in the configuration workbook.

## Who can get it, and who does

Creating an element does nothing on its own. **Element eligibility** (historically "element link") defines which population the element applies to, by criteria such as payroll, legal employer, grade, job or department: "Car Allowance is eligible for grade G7 and above in the Cairo business unit." Without eligibility, an element cannot be given to anyone. This is the most common cause of "why can't I add this allowance to this employee?" — the answer is almost always that eligibility does not cover them. Eligibility defined too narrowly at build time is considerably messier to widen once entries exist.

An **element entry** is the actual attachment of an element to a specific person, with values and dates: a transport allowance of EGP 800 per month effective 1 March. Eligibility says who *could* receive something; the entry says who *does*, and how much. Entries can be created manually, loaded in bulk with HCM Data Loader (Chapter 11), or generated automatically.

The **salary basis** decides how salary is stored, quoted and paid — annual, monthly or hourly — and which element it feeds. An annual basis stores EGP 240,000 and pays EGP 20,000 monthly. Getting the basis wrong multiplies or divides everyone's pay by twelve, so always confirm how the client quotes salary in offer letters before configuring it.

## Salary, and where it actually lives

Salary is held as a dated **salary record** on the assignment, and Oracle derives the element entry from it through the salary basis. That direction matters: a raise is entered on the salary page and the entry follows, never the other way round. Editing the derived entry directly leaves the salary page and the payslip telling different stories about the same person, and nothing in the system flags the disagreement — it surfaces when somebody compares a letter to a payslip.

Most Gulf offers are not quoted as one number. They are quoted as basic plus housing plus transport, and that split is what **salary components** are for: an itemised breakdown held against the salary record rather than as separate manual entries. The split is a statutory question, not a presentational one, because the contributable wage in Chapter 17 and the UAE gratuity base in Chapter 18 are both computed from particular components. Designing the components to match how the client's offer letters are written is therefore part of getting end-of-service right, and it is much harder to change afterwards than before.

**Rate definitions** convert between the stored figure and the figure a process needs — an annual salary into an hourly rate for overtime, a daily rate for an absence payment, a monthly rate for a liability accrual. Grade rates, promised in Chapter 2, attach ranges or step values to grades so that pay governed by grade is validated against the band rather than typed in free. A client whose pay is individually negotiated rarely needs them; one in the public sector or a large Gulf group almost always does.

## The hours side of pay

The functional track promises money, time and law, and time so far has meant leave. Hours are the other half, and they reach payroll in one of three ways: a time card in Oracle Time and Labor, an interface from a biometric or shift system, or a bulk load (Chapter 11). Choosing between them is a design decision with an owner and a cost, and it is worth making explicitly rather than discovering in the first run that attendance arrives as a spreadsheet somebody emails.

An overtime element needs two things: a rate source, which is a rate definition, and a multiplier, which is statutory rather than negotiable. Under Egypt's Labour Law 14/2025 overtime is paid at no less than 35% above the normal hourly wage for daytime hours and 70% for night hours, with total presence at the workplace capped at twelve hours a day. Saudi Arabia's Article 107 sets overtime at 150% of the hourly wage. Sources disagree on two points worth flagging rather than resolving: whether the Saudi calculation runs on basic or total wage, and whether Egyptian rest-day work is compensated as an extra day's wage plus a substitute day off or as double pay. Both were checked in 2026 and both belong in a client's written legal position before an element is built.

The design question that settles the shape is whether the client pays by the hour or by the month. An hourly salary basis fed by time cards computes pay from hours every period; a monthly salary with an overtime element computes a fixed amount plus exceptions. They produce the same payslip in an ordinary month and behave completely differently in a month with unpaid leave, a mid-month joiner or a strike of overtime claims.

## Running it

A **payroll definition** is the calendar: frequency, period start and end dates, cut-off dates and payment date — "Egypt Monthly Payroll, calendar months, cut-off on the 25th, paid on the last working day." A person must be assigned to a payroll, on the assignment, before they can be processed.

The **payroll run** (Calculate Payroll) is the engine that calculates gross-to-net for a population for a period: it evaluates elements, applies formulas, and produces run results and balances, held against the payroll relationship. Errors at this stage typically point to missing entries, missing eligibility or formula problems. **QuickPay** runs the same calculation for a single person outside the main run — the primary testing tool during configuration (change an element, QuickPay one employee, check the result) and the mechanism for off-cycle payments such as a final settlement.

A **balance** is an accumulated total of element results over a period and dimension: gross pay year-to-date, taxable earnings month-to-date. Balances have dimensions (period-, month-, quarter-, year-to-date) and scope (assignment or relationship level). Statutory calculations, payslips and reports all depend on them, and when a report shows a wrong total the balance feed is usually where the problem lives. Balances do not span payroll relationships — which is why year-to-date figures reset on a global transfer.

## After the run

Calculation and payment are separate steps. **Prepayments** takes the run results and distributes them across each person's payment methods — someone may split their salary across two bank accounts. It runs after the payroll run and before the payment process, and it is the step people forget exists until a payment fails. Oracle's standard flow then archives the results, generates payslips, and produces the payments: the **payment process** creates the bank file. In Saudi Arabia and the UAE, the file must follow the Wage Protection System SIF format (Chapter 17), and a Gulf go-live always includes a bank-file test with the actual bank. The bank file is a common cause of go-live delay; never treat it as an afterthought.

**Costing** allocates payroll results to accounting segments so the cost lands in the right place in the general ledger, broken down by department, project or cost centre. It is the bridge between HCM and Finance and is often owned jointly with a finance consultant.

## Running it is a flow, not a button

Calculate Payroll is not a button; it is a **payroll flow** — a sequenced set of tasks with a checklist, owners and a status for each step. Submitting the flow starts it, and the checklist is where a stuck task is seen. On a real cycle the flow is what the payroll team watches, and the consultant's job in hypercare is usually reading it rather than reading a log.

When something is wrong, three corrections do different things. **Mark for retry** flags the records that failed so the next retry picks up only those. **Retry** re-processes them after the cause is fixed. **Roll back** removes the results entirely, as though the process had not run. The order constraint is the part to know: once prepayments have locked a run's results, the run cannot be rolled back until the prepayments are rolled back first. Corrections therefore unwind in the reverse of the order they were made, and a team that tries to roll back a run with prepayments sitting on top of it gets an error that reads like a bug and is not.

Where the cost lands is the other half of finishing a cycle. Costing allocates results to accounting segments through the cost allocation flexfield, with values held at several levels — the payroll, the department, the element eligibility — and the most specific one winning. The results then move to the general ledger through Transfer to Subledger Accounting and Create Accounting, which is the point at which Finance sees payroll at all. A costing design that is merely plausible produces a month-end reconciliation that nobody can explain, which is why the finance consultant belongs in that conversation from the start rather than at the end.

[[fig:payroll-chain]]

[[lab:payroll]]

The failures worth rehearsing are the quiet ones. A person not assigned to a payroll is skipped by the run without an error. A salary basis that says monthly while the annual figure was loaded against it pays twelve times the intended salary, and the run reports nothing, because it calculated exactly what it was given. A deduction classified as an earning is added to gross instead of taken off it. None of these produce a failure message; all of them produce a payslip.

[[lab:payslip]]

[[lab:balances]]

## Proving it works: the parallel run

A **parallel run** executes the new system's payroll alongside the legacy payroll for the same period and reconciles the two line by line. It is the only reliable proof that the new payroll is correct before the old one is switched off, and it typically runs for two or three consecutive months before go-live. Differences must be explained, not just noted. It is also the highest-stakes activity before go-live, and the point where a consultant with analytical instincts is visibly useful.

Two habits separate a reconciliation that proves something from one that merely documents. The first is reading every line rather than the exceptions someone has already flagged, because a difference nobody noticed is exactly the one that reaches hypercare. The second is remembering what the exercise can and cannot prove: a matching line proves the new system agrees with the old one, not that either agrees with the client's policy. Where legacy is wrong — an out-of-date insurable-wage ceiling, an allowance paid flat that policy says is a percentage — the correct outcome is a difference, raised with the client rather than configured away.

[[lab:parallel-run]]

## Common mistakes

- Creating an element and expecting it to appear on payslips. Nothing happens until eligibility exists and an entry is made.
- Confusing eligibility (who could) with entry (who does).
- Forgetting prepayments sits between calculation and payment.
- Treating the bank file as a formality.
- Believing go-live means done. Hypercare and the first live payroll are the finish line.

- Oracle, *Administering Payroll for the United States* — the "Payroll Processes" chapter, for the calculate, prepayments, archive and payment sequence, which is the same in every localization. https://docs.oracle.com/en/cloud/saas/human-resources/faaus/index.html

id: absence
num: 6
domain: hcm
track: functional
title: Absence Management
subtitle: Where labour law becomes configuration
hue: 98
minutes: 13
labs: leave
terms: absence-type, absence-plan, accrual-plan, qualification-plan, no-entitlement-plan, compensatory-plan, eligibility-profile, accrual-band, carryover, leave-encashment, work-schedule, absence-certification, accrual-processing
---

Absence is the module where a country's labour law turns into configuration. Every leave entitlement in the statute becomes an absence plan with rules, and every rule becomes a test script. The Egyptian annual-leave ladder is the classic accrual exercise; Egyptian sick leave is the classic qualification plan.

> **The Egyptian figures quoted here are statutory.** They are the entitlements under Labour Law No. 14 of 2025, stated in full with their sources in Chapter 10, and checked in 2026. Re-verify against the current text of the statute before configuring any of them.

## Types are what people see; plans are the rules

An **absence type** is what the worker actually selects when requesting leave — "Annual Leave", "Sick Leave", "Maternity Leave". It controls display and entry behaviour: whether half days are allowed, whether an end date is required, what documentation is needed. Every type must be associated with at least one plan. Clients describe requirements in terms of types ("we need a Hajj leave"); the consultant translates that into a type plus the plan behind it.

An **absence plan** is the rules engine behind the type: who is eligible, how entitlement is earned or granted, and how it is paid. Oracle defines six plan types, and naming all six is a small, cheap differentiator, because most beginners know only two:

- **Accrual** — workers accumulate time over a period for paid leave, such as a vacation plan.
- **Qualification** — workers qualify for an entitlement on an event and receive payments during the absence, with payment percentages that can vary by band.
- **No entitlement** — tracks absences without maintaining a balance or providing entitlement, typically unpaid leave.
- **Compensatory** — tracks earned compensatory time that can be taken as time off, instead of overtime pay.
- **Agreement** — plans built under statutory or collective-agreement rules.
- **Donation** — tracks donated time that a worker receives.

## Accrual plans and bands

An **accrual plan** accumulates leave over time, with rules for accrual rate, ceilings and carryover. Oracle supports front-loaded accrual (the whole year's entitlement granted at the start of the plan term) and incremental accrual (earned period by period). **Accrual bands** grant different rates to different populations, usually by length of service, because almost every real leave policy is tiered. Egyptian annual leave — 15 days in the first year, 21 from the second, 30 for workers with ten years of service or aged over 50, with higher entitlements again for persons with disabilities and for hazardous or remote work (Chapter 10) — is implemented directly as accrual bands. The boundary cases are the test cases: the person who crosses ten years mid-year and the person who turns fifty mid-year.

**Carryover** rules govern how much unused leave transfers into the next plan term and when it expires. Employers cap carryover to control liability and to encourage people to take leave, and carryover and expiry rules are a frequent source of client disagreement — pin them down in writing early. Egyptian law also imposes its own constraints (Chapter 10).

## Qualification plans

A **qualification plan** is used where entitlement is not earned day by day but triggered by an event and paid at rates that vary over the absence. Egyptian sick leave is the textbook case: 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in a calendar year, subject to medical certification. Those percentages are configured as qualification bands. Maternity leave is the other standard example, with its own cap on occurrences.

A **no-entitlement plan** exists because unpaid absence still needs to be recorded — for attendance, payroll deduction and reporting — even though nothing is earned or granted. A **compensatory plan** comes up whenever a client asks about time off in lieu.

## How an absence is actually recorded

A plan is only half the design. The other half is what happens when somebody asks for a day off.

An absence record carries a type, dates, a duration and a status, and it moves through approval like any other transaction (Chapter 19). The duration is where the configuration shows: it is calculated against the worker's **work schedule**, so a five-day absence spanning a weekend is not five days of leave, and a public holiday inside a leave period is not deducted from the balance — provided the calendar is configured (Chapter 10). A client whose schedules are wrong will report leave balances that are wrong in the same direction every time.

Two further settings matter in practice. Certification requirements hold an absence — or its payment — until a document is supplied, which is how Egyptian sick leave's medical certificate is enforced rather than hoped for. And the entry rules on the type decide whether half days are allowed, whether an end date is mandatory, and how far in the past or future a request can be made, which is the quiet cause of most "the system let them do that" tickets.

## The processes that keep balances true

Accrual balances are not recalculated continuously; they are maintained by processes, and knowing which ones exist is the difference between explaining a balance and guessing at it.

*Calculate Accruals and Balances* runs on a schedule and grants the period's entitlement to each enrolled worker. Carryover is applied at the plan's term end, with its own expiry rules. The absence liability and accrual balances can be valued for Finance, which is how the leave the company owes becomes a number on a balance sheet rather than an estimate.

The practical consequence is that a balance a user disputes has a history: the plan's enrolment date, the accrual runs since, the carryover event at the term end, and any manual adjustment. Checking those four in order answers the question. Adjusting the balance to the number the user expected, without reading them, hides the defect and guarantees its return next year.

## Where absence meets payroll

Absence is not a closed system: entitlement that is paid, unpaid or encashed has to reach payroll, and the connection is deliberate configuration rather than a side effect.

Absence elements carry the payment into the run — full pay, a reduced percentage for a qualification band, or an unpaid deduction — and a **rate definition** (Chapter 5) supplies the money the percentage applies to. Getting that base wrong is the most common absence-payroll defect in the region: Egyptian sick leave is paid on the insurable wage, not on gross, so a plan pointed at the wrong rate pays the right percentage of the wrong number and reconciles to nothing.

The other direction matters at exit. The balance at the termination date becomes the leave payout in the final settlement (Chapter 8), which is why an absence design that leaves balances approximate produces a settlement that is disputed.

## Eligibility profiles and encashment

An **eligibility profile** is a reusable set of criteria — grade, job, department, location, length of service — that decides whether a person qualifies for a plan: "employees in the Egypt legal employer with more than ten years of service" as the criterion for the 30-day band. Eligibility profiles appear in absence, benefits and compensation, so learning them once pays off three times.

**Leave encashment** pays out unused leave in cash instead of time off. It occurs at termination as part of the final settlement and periodically where policy or law allows. It is the link between absence and payroll: an absence balance becomes a payroll element on termination.

[[lab:leave]]

## Common mistakes

- Knowing only accrual and qualification plans. There are six.
- Building a flat annual entitlement when the law is tiered by service.
- Leaving carryover and expiry rules undocumented.
- Forgetting that casual leave in Egypt is counted within annual leave, not on top of it.
- Designing plans without configuring work schedules, so every duration is wrong by the same amount.
- Adjusting a disputed balance instead of reading how it was built.
- Pointing an absence payment at gross pay where the statute says insurable wage.
- Leaving balances approximate, then defending them in a final settlement.

## Sources

- Oracle, *Implementing Absence Management* — "Types of Absence Plans". https://docs.oracle.com/en/cloud/saas/human-resources/faiam/types-of-absence-plans.html
- Oracle, *Implementing Absence Management* — the "Accrual Absence Plans" chapter. https://docs.oracle.com/en/cloud/saas/human-resources/faiam/index.html
- Oracle, *Absence Management* datasheet. https://www.oracle.com/a/ocom/docs/applications/human-capital-management/absence-management-ds.pdf

id: powerbi-model
num: 6
domain: analytics
track: technical
title: Power BI: The Model Is the Product
subtitle: Star schema, relationships, and why the transformation belongs upstream
hue: 45
minutes: 8
labs: 
terms: fact-table, dimension-table, star-schema, relationship-cardinality, cross-filter-direction, date-table, import-vs-directquery, roches-maxim
---

People learn Power BI by dragging fields onto a canvas and are surprised when the numbers misbehave. The visuals are the last five per cent. The model underneath — which tables exist, at what grain, joined how — decides whether every number in the report is right, and it is where the work actually is.

## Facts and dimensions

A **fact table** holds the events you measure: one row per sale, per click, per ticket. It is long, it grows, and its columns are mostly numbers you will aggregate plus the keys that point outward.

A **dimension table** holds the things you slice by: products, customers, stores, dates. It is short, it changes slowly, and its columns are the descriptive attributes you want on an axis or in a slicer.

Arrange one fact table in the middle with dimensions around it, each joined by a single key, and you have a **star schema**. It is the shape Power BI is built for, and Microsoft's own guidance says so plainly. It is not an academic preference: the engine's compression and its filter propagation are both designed around it, and a model in this shape is faster, smaller and easier to reason about than the same data flattened into one wide table or normalised into a snowflake.

[[fig:star-schema]]

The practical rule when you are handed a flat export: split it. Pull the product attributes into a product table, the customer attributes into a customer table, keep the measures and the keys in the fact table.

## Relationships

A relationship has a **cardinality** — usually one-to-many, from the dimension's one row to the fact's many — and a **cross-filter direction**, which decides which way a filter travels. In a star schema, filters flow from the one side to the many side: select a product, and the sales rows filter. That single direction is what you want almost always.

Setting a relationship to filter **both** ways is the tempting fix when a slicer does not affect a visual, and it is usually the wrong one. Bidirectional filters can create ambiguous paths through the model, make results depend on evaluation order, and slow queries down. Reach for them last, deliberately, and only when you can say which problem they solve.

A **many-to-many** relationship is a signal that a bridge table is missing — the intermediate table that resolves the two sides into two one-to-many relationships.

Every model that reports over time needs a dedicated **date table** with one row per date, no gaps, marked as the date table. Without one, Power BI's time-intelligence functions either refuse to work or quietly give the wrong answer at the boundaries of a period.

## Where transformation belongs

Power Query (Chapter 5) and DAX (Chapter 7) can both do many of the same jobs, which invites doing them in the wrong place. The guidance usually quoted here is **Roche's Maxim**: *data should be transformed as far upstream as possible, and as far downstream as necessary.*

In practice that means: rename, reshape, split, filter and type your columns in the source or in Power Query, where the work happens once at refresh and every report downstream benefits. Leave to DAX only what genuinely depends on what the user has selected. A calculation that gives the same answer regardless of the slicers is a transformation, and it belongs upstream.

The cost of ignoring this is a model where nobody can find where a number is defined, and where the same fix has to be made in four reports.

## Import or DirectQuery

**Import** loads a compressed copy of the data into the model. It is fast, it supports the whole of DAX, and it is the default answer. The data is as current as the last refresh.

**DirectQuery** leaves the data in the source and sends a query for every visual. You get current data and no size limit, and you pay for it with latency, a restricted set of DAX, and load on the source system that will eventually become somebody else's problem. Choose it when the freshness requirement is genuinely real-time or the volume genuinely will not import — not because it sounds more modern.

## Common mistakes

- Loading one flat wide table and calling it a model.
- Turning on bidirectional filtering to fix a slicer, without knowing why it worked.
- Reporting over dates without a marked date table.
- Doing transformation work in DAX that Power Query should have done at refresh.
- Choosing DirectQuery by default and discovering the report is slow after it is published.

## Sources

- Microsoft Learn, "Understand star schema and the importance for Power BI". https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
- Microsoft Learn, "Model relationships in Power BI Desktop" — cardinality and cross-filter direction. https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand
- Microsoft Learn, "Bi-directional relationship guidance". https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering
- Matthew Roche, "Roche's Maxim of Data Transformation". https://ssbipolar.com/2021/05/31/roches-maxim/
- Microsoft Learn, "Choose a Power BI model framework" — Import versus DirectQuery. https://learn.microsoft.com/en-us/power-bi/guidance/powerbi-implementation-planning-model-framework
</script>

id: dax
num: 7
domain: analytics
track: technical
title: DAX and Filter Context
subtitle: Why the same measure returns a different number in every cell
hue: 20
minutes: 8
labs: dax-context
terms: measure-vs-calculated-column, filter-context, row-context, calculate, context-transition, iterator-functions, time-intelligence, divide-function
---

DAX looks like Excel formulas and is not. An Excel formula computes one cell from other cells. A DAX measure is a rule that gets evaluated again in every cell of every visual, under whatever filters that cell happens to sit in. Once that clicks, most of the language follows. Until it does, nothing does.

## Measures and calculated columns

A **calculated column** is computed row by row when the data refreshes, and the result is stored in the model. It knows about the current row and nothing about the report. Use it when you need a value to slice, group or filter by — a category band, a flag, a key to relate on.

A **measure** is computed at query time, once per cell of the visual, in whatever filter context that cell sits in. It knows nothing about "the current row" and everything about what the user has selected. Use it for anything you aggregate.

The default should be a measure. A calculated column that holds `Quantity * Price` on every one of ten million rows costs memory in the model and cannot respond to a slicer; the measure `SUMX(Sales, Sales[Quantity] * Sales[Price])` costs nothing at rest and answers correctly whatever the user clicks. Writing calculated columns where measures belong is the single most common beginner pattern, and it is what produces models that are inexplicably large and reports that do not react.

[[lab:dax-context]]

## Filter context

**Filter context** is the set of filters in force when a measure is evaluated: the row and column a cell sits in, the slicers on the page, the page and report filters, anything a visual contributes.

`Total Sales = SUM(Sales[Amount])` is one expression. Put it in a matrix by product and month and it evaluates once per cell — for that product, in that month — and returns a different number each time. The measure does not know or care; the context is supplied to it. This is why "the measure is wrong in the total row" is almost never the measure and almost always the context: the total row is a genuinely different filter context, not the sum of the rows above it.

**Row context** is the other kind, and it is what a calculated column and an iterator have: a current row to read columns from. Row context does not filter anything by itself — which is why referencing a column inside a measure without wrapping it in an aggregation is an error.

## CALCULATE

`CALCULATE` is the function that modifies filter context, and it is the centre of the language. It takes an expression and any number of filter arguments, and evaluates the expression in a context it has changed:

```
Sales LY = CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )
Sales Cairo = CALCULATE ( [Total Sales], 'Store'[City] = "Cairo" )
```

Its filter arguments *replace* existing filters on the same column rather than adding to them, which is the behaviour to internalise — `CALCULATE([Total Sales], 'Store'[City] = "Cairo")` returns Cairo even in a cell already filtered to Alexandria. Wrap the filter in `KEEPFILTERS` when you want to intersect with what is already there instead.

`CALCULATE` also performs **context transition**: when it is evaluated in a row context, it converts that row into an equivalent filter context. This is why a measure called from inside a calculated column or an iterator suddenly sees only the current row, and it is the mechanism behind most DAX behaviour that looks like magic.

## Iterators

Functions ending in X — `SUMX`, `AVERAGEX`, `MAXX`, `RANKX` — take a table, evaluate an expression once per row of it, and aggregate the results. `SUM` adds up a column that already exists; `SUMX` computes something per row and then adds it up. When a calculation multiplies two columns together, or depends on anything more than a single stored column, it is an iterator you want.

## Two small ones that matter

Divide with `DIVIDE(numerator, denominator)` rather than `/`. It returns blank instead of an error when the denominator is zero, which is exactly what a visual should show.

Time intelligence — `SAMEPERIODLASTYEAR`, `DATEADD`, `TOTALYTD` — requires the marked date table from Chapter 6, with contiguous dates. Without one these functions fail quietly at period boundaries rather than loudly, which is the worst way for anything to fail.

## Common mistakes

- Writing a calculated column where a measure belongs, then wondering why slicers do nothing.
- Expecting `CALCULATE`'s filters to add to the existing context rather than replace it.
- Reading a column inside a measure without an aggregation around it.
- Using `SUM` where the calculation needs a row-by-row `SUMX`.
- Time intelligence on a model with no marked, gapless date table.
- Dividing with `/` and shipping a visual full of errors.

## Sources

- Microsoft Learn, "DAX overview" and the function reference. https://learn.microsoft.com/en-us/dax/
- Microsoft Learn, "CALCULATE function (DAX)". https://learn.microsoft.com/en-us/dax/calculate-function-dax
- Microsoft Learn, "Tutorial: Create calculated columns in Power BI Desktop" and "Create measures" — the difference and when each applies. https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-calculated-columns
- Microsoft Learn, "DAX: DIVIDE function vs divide operator (/)". https://learn.microsoft.com/en-us/dax/divide-function-dax
- SQLBI (Marco Russo and Alberto Ferrari), "Introducing CONTEXT TRANSITION in DAX". https://www.sqlbi.com/articles/understanding-context-transition/

id: hrfunction
num: 7
domain: hcm
track: functional
title: Headcount, Metrics & the HR Function
subtitle: The vocabulary HR directors use — speak it fluently
hue: 46
minutes: 9
labs: fte, ulrich, who-decides
terms: headcount, fte-full-time-equivalent, attrition-turnover, org-chart, solid-line-vs-dotted-line-reporting, hrbp-hr-business-partner, centers-of-excellence-coe, shared-services-hr-operations, ulrich-model
---

A consultant does not need HR theory, but does need to speak HR's language fluently enough that an HR director never has to slow down. This chapter covers the metrics that appear in every reporting conversation and the way large HR functions are organized, which explains who owns which decision.

## Headcount is not FTE

**Headcount** is a raw count of people, regardless of how much each one works. One person equals one headcount. **FTE** — full-time equivalent — is a measure of workload rather than of people: an employee working half time is 0.5 FTE but still one headcount. A department with ten people, four of them half-time, has a headcount of ten and an FTE of eight. FTE is stored on the assignment.

Both numbers are "correct", and they answer different questions: legal thresholds, facilities and org design care about humans; budgeting and capacity planning care about work. Reporting FTE when the client asked for headcount, or the reverse, is a reliable source of reporting disputes. Ask which one they mean.

[[lab:fte]]

**Attrition** or turnover is the rate at which people leave over a period, usually expressed annually as a percentage. Definitions vary — voluntary versus involuntary, whether to include probation leavers, what goes in the denominator — so the first question when a client asks for a turnover report is how they define the numerator and the denominator. That question alone marks a consultant as experienced.

## The org chart is data, not a drawing

In Oracle the **org chart** is generated from manager relationships on assignments; it is not drawn separately. If the chart looks wrong, the underlying manager data is wrong — fix the data, not the picture. Matrix organizations have two kinds of manager. **Solid-line** reporting is the formal line manager who owns performance and compensation decisions; **dotted-line** reporting is a secondary, functional relationship without that authority. A regional finance analyst may report solid-line to the country manager and dotted-line to the regional finance head. Approval routing usually follows the solid line, and getting it wrong sends approvals to the wrong person — which surfaces immediately in user acceptance testing.

## How HR is organized: the Ulrich model

Most large HR functions use the vocabulary of what everyone calls the **Ulrich model**, which splits HR into three parts. Strictly it is the three-legged delivery structure that was built on Ulrich's work rather than the four roles he actually wrote about, and knowing that distinction is worth a sentence in front of an HR director. **HR business partners (HRBPs)** are embedded with a business division as its strategic HR contact; they bring requirements framed as business problems rather than system specifications, and translating those into configuration is the consultant's job. **Centers of excellence (CoEs)** are specialist teams owning policy in a domain — compensation and benefits, talent acquisition, learning, organization development. The CoE typically signs off design in its domain: if the consultant designs a grade structure, C&B approves it. **Shared services**, or HR Operations, is the centralized team doing transactional work — payroll processing, data entry, first-line queries — for the whole organization.

In Egypt, shared services usually means the classic Personnel and Payroll team (شؤون العاملين): the people who handle social-insurance forms, labour-office files and attendance. They know the statutory reality better than anyone else in the building. Their daily work is what the configuration automates, they are the consultant's main day-to-day counterparts, and treating them as low-level administrators is a serious mistake — they hold operational knowledge no document captures.

[[lab:ulrich]]

Outside the large multinationals the three groups are usually merged rather than missing. One HR manager plays business partner and centre of excellence at once, payroll may report to Finance instead of to HR, and in the Gulf the teams that file on the government platforms — Qiwa, Mudad, Muqeem — are stakeholders in the design whether or not they appear on the HR organization chart. The model is therefore a checklist of questions rather than a prediction about the org chart, and the question it produces is worth asking by name in the first week: who signs this off, and who will run it every month?

## Who decides is not who knows

Two different questions get asked in every workshop, and confusing them is expensive. *Who decides* is a question about authority: pay and grades belong to compensation and benefits, hiring process to talent acquisition, structure to organization development. *Who knows* is a question about operational fact: how the insurable wage is really calculated, what the actual payroll cut-off is, which steps are done by hand in a spreadsheet today. Authority sits with the policy owners; the facts sit with the people running the process every month.

Routing a question to the wrong group produces one of two failures. Design approved by someone without the authority to approve it gets reversed in testing, usually after the build. Design based on policy documents alone, without the operational detail, passes testing and then fails in the first live run.

[[lab:who-decides]]

## Common mistakes

- Conflating headcount and FTE.
- Building a turnover report before agreeing the definition.
- Redrawing the org chart instead of fixing manager data.
- Routing approvals along the dotted line.

## Sources

- Dave Ulrich, *Human Resource Champions* (Harvard Business School Press, 1997) — the four-role argument (strategic partner, administrative expert, employee champion, change agent) that the three-part delivery structure was later built on.
- Oracle, *Using Global Human Resources* — manager hierarchies and organization charts. https://docs.oracle.com/en/cloud/saas/human-resources/
</script>

id: lifecycle
num: 8
domain: hcm
track: functional
title: The Employment Lifecycle
subtitle: Hire to exit — every event is a dated transaction with a payroll consequence
hue: 26
minutes: 13
labs: lifecycle
terms: probation, notice-period, resignation, termination, end-of-contract, final-settlement, end-of-service-benefit-eosb-gratuity, action-and-action-reason
---

Every event in an employee's working life is, in Oracle, a dated transaction against the assignment, with an approver and a downstream payroll consequence. Thinking in those terms is the consultant's default mental mode. This chapter follows a worker from hire to exit and, because the rules are statutory, uses Egypt's Labour Law No. 14 of 2025 (in force since 1 September 2025) as the worked example; Chapter 10 has the fuller statutory detail and Chapter 17 the Gulf equivalents.

> **Every period in this chapter is statutory, and they move.** The figures are Law 14/2025 as summarised by EY, Andersen and Amereller, checked in 2026, and the executive regulations implementing the law are still appearing. Verify against the current statute or the client's legal counsel before configuring probation, notice or settlement rules.

## The hire, and the three ways it happens

The lifecycle starts before the first day. Oracle offers three entry points, and choosing between them is a design decision rather than a preference.

*Hire an Employee* creates the person, the work relationship and the assignment in one transaction, effective on the start date. *Add a Pending Worker* creates the same records ahead of the start date for someone who has accepted but not started, so onboarding can run — equipment, accounts, documents — and converts to an employee on the day. *Add a Contingent Worker* creates a work relationship of a different worker type for someone engaged but not employed (Chapter 3), which keeps them off the payroll while still giving them a record, a manager and an org-chart position.

In Egypt the pending worker is more useful than most implementations make it, because the statutory onboarding — the social-insurance registration and the labour-office file of Chapter 9 — has to happen around the start date rather than after it, and a record that exists beforehand is what lets that work be tracked instead of remembered.

## Everything in between is a dated change

Between the hire and the exit, almost every event is the same shape: a dated change to the assignment, carrying an **action** and an **action reason** (Chapter 3). A promotion, a transfer, a manager change, a move to part-time, a suspension — each is an update with an effective date, an approver, and usually a payroll consequence.

The action is what the system does; the reason is why, and the reason is what makes analysis possible afterwards. "Why did attrition rise in the third quarter" can only be answered if terminations carry reasons, and reasons exist only because somebody configured them during implementation. A client who accepts the delivered list without reading it has quietly decided not to answer that question.

Two of those middle events deserve naming because they are routinely underestimated. A transfer between legal employers is not a transfer at all — it is an ending and a beginning, with the consequences Chapter 3 sets out for balances and service. And a change in working hours is a change to FTE, which flows into headcount reporting, leave accrual and any pay that is pro-rated, so the "small change to someone's days" is rarely small.

## Probation

**Probation** is an initial period during which either party may end the employment with lighter obligations than after confirmation. Under Law 14/2025 it is capped at three months, cannot be extended, and a worker may be placed on probation only once with the same employer; the clause must be written into the contract or it has no legal effect. In the system, probation end dates drive alerts and confirmation workflows. Where a client's contracts specify a longer probation, flag it — the clause may be invalid.

## Notice

A **notice period** is the advance written warning either party must give before terminating an indefinite-term contract. The 2025 law makes written notice mandatory, counts the notice period as service, and requires full wage during it. Several law-firm summaries state a flat three months regardless of service; earlier commentary described two months under ten years and three above. This is exactly the kind of point to verify against the Arabic text of the statute or the client's legal counsel before configuring, and saying so is a strong professional answer, not a weak one.

## Three exit routes that are not the same

**Resignation** is employee-initiated. Under the 2025 law the resignation must be validated at the competent labour office, the employer must respond within a set period, and the employee may withdraw the resignation within ten days of being notified that the employer accepted it — seven days under the superseded 2003 law, which is the figure still quoted in a good deal of older material. Resignation carries no severance, but unused annual leave is paid out. A process design that makes reversal impossible fails the withdrawal requirement.

**Termination** is employer-initiated, with or without cause. The distinction determines severance exposure. Egyptian law lists specific grounds permitting immediate dismissal, places the burden of proving misconduct on the employer, and imposes strict procedural requirements. Termination is a heavily approval-gated transaction in any implementation.

**End of contract** is a fixed-term contract reaching its expiry date — nobody terminates it; it lapses. Under Law 14/2025, if a fixed-term contract is renewed or the employee simply continues working after expiry, it converts automatically into an indefinite-term contract, which ends the old practice of rolling short renewals indefinitely. Contract-expiry alerts are a real client requirement, especially in the Gulf, where they combine with visa and permit expiry.

Treating the three as one "termination" transaction is a design error: they have different downstream calculations.

[[lab:lifecycle]]

## What the exit actually does in the system

Terminating is a transaction with a reach beyond the record. It end-dates the work relationship, closes the assignment, and sets the payroll dates that decide what can still be paid — the last standard process date, after which no ordinary run picks the person up, and the final close date, after which nothing at all can (Chapter 3). Setting the final close date too tightly is the most common way a legitimate late payment becomes impossible without reopening the record.

It also has to take access away. Role provisioning rules (Chapter 15) remove what they granted when the condition stops being true, which is why a termination that is entered late leaves someone with live access after they have gone — a finding that turns up in audits far more often than it should.

In Egypt the procedural side runs in parallel and is not optional: the labour office is involved in validating a resignation, dismissal grounds must be documented and provable, and the insurance file has to be closed with the Form 6 of Chapter 9. None of that lives in Oracle, and all of it belongs on the exit checklist a journey can carry (Chapter 14), because the consequence of missing it lands on the employer rather than on the system.

## The final settlement

The **final settlement** calculates everything owed to a leaver: final salary, unused leave payout, any severance or end-of-service benefit, minus outstanding deductions such as loans. It is the last payroll event for that person and the one most likely to be disputed. It is usually run as an off-cycle QuickPay and requires the absence balance, the loan balance and the termination date all to be right at the same time — a good practice exercise because it touches absence, payroll and lifecycle at once.

The **end-of-service benefit (EOSB)**, or gratuity, is a statutory lump sum payable to departing employees in Gulf countries, calculated on length of service and final wage. Gulf labour law provides it in place of a state pension for expatriate workers, with country-specific formulas. Egypt does not have gratuity in the Gulf sense; its equivalent protection comes through the social-insurance system. Importing EOSB logic into an Egyptian design, or assuming Egypt has gratuity, is a classic cross-market error.

## Common mistakes

- Extending probation "by agreement". Under the 2025 law it cannot be extended.
- Configuring notice rules from an English summary without verification.
- Designing a resignation process with no withdrawal path.
- Merging the three exit routes into one transaction.
- Building EOSB into an Egyptian payroll.
- Hiring everyone on the start date, so onboarding has no record to hang on.
- Accepting the delivered action reasons unread, then being unable to explain attrition.
- Treating a change in working hours as small. It is an FTE change, and it moves pay and accrual.
- Setting the final close date tightly, so a legitimate late payment cannot be made.
- Entering a termination late and leaving system access live behind it.

## Sources

- EY, "Egypt enacts new labor law affecting employers from 1 September 2025". https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025

id: question-to-chart
num: 8
domain: analytics
track: functional
title: From Question to Chart
subtitle: The part of the job that is not a tool — and the small number of ways to mislead
hue: 310
minutes: 9
labs: 
terms: business-question, chart-choice, truncated-axis, dual-axis, data-ink, dashboard-vs-report, sanity-check
---

The tools are the easy half. The half that decides whether anyone uses your work is turning a vague request into a specific question, answering it in a form a human reads correctly, and being able to say how confident you are.

## Make the question answerable

"Can you look at our sales?" is not a question. The job is to turn it into one that has a single defensible answer, and that takes three or four sentences of conversation rather than three hours of dashboard building.

Ask what decision the answer feeds. Ask over what period, and compared with what — a number with nothing to compare it to is not information. Ask which population counts: does "customer" include the ones who churned, the internal test accounts, the trial users? Ask what would count as a surprising answer, which is the fastest way to surface the assumption the requester has not said out loud.

Then repeat the question back as one sentence and get agreement before building anything. "Revenue from new customers, by month, for the last twelve months, excluding trials, compared with the same months last year." That sentence is the specification, and it is also the title of the chart.

## Choosing the form

The choice is narrower than the chart menu suggests.

Comparing a value across categories is a **bar chart**, sorted by value rather than alphabetically unless the categories have a natural order, with the axis starting at zero. Change over time is a **line chart**, with time on the horizontal axis. The relationship between two measures is a **scatter plot**. Part of a whole is a bar chart too — a pie is readable only at two or three slices, and a stacked bar with more than about four series stops being comparable because only the bottom segment shares a baseline.

A single important number is just the number, large, with its comparison next to it. A table is the right answer more often than people admit: when the reader needs exact values, or will look up one row rather than scan a pattern, a table beats every chart.

Sort order, axis range and colour are decisions, not defaults. Colour especially should mean something — a category, a threshold, a direction — and if it means nothing it should not vary.

## The ways charts mislead

A **truncated axis** on a bar chart is the classic one. Bars encode value by length, so cutting the axis at 90 makes a 2% difference look like a doubling. Bars must start at zero. Line charts are different — they encode change by slope, and a zero baseline often flattens the very thing you are showing — so truncation is acceptable there if the axis is labelled honestly.

**Dual axes** let you place two unrelated scales on one chart and imply a relationship that the data does not contain; the apparent correlation is entirely a function of where you set the two ranges. Two charts stacked with a shared time axis say the same thing without the implication.

Beyond that: do not use area or volume to encode a single value, because people read those badly. Do not use a rainbow of colours for an ordered quantity. And keep the non-data material — gridlines, borders, shadows, legends that repeat the labels — light enough that the data is the loudest thing on the page.

## Dashboards are not reports

A **dashboard** is monitored: a few numbers somebody looks at regularly to decide whether anything needs attention. It should fit on one screen, lead with the summary, and make what is wrong visible without reading. If everything on it is fine, the reader should be able to tell in three seconds.

A **report** is read once and answers a question, at whatever length that takes. Requests for a dashboard are frequently requests for a report, and building the wrong one is a week wasted. The question that separates them: how often will you look at this, and what will you do differently as a result?

## Before you send it

Sanity-check it, every time. Does the total match a number the business already trusts — last month's close, the finance figure, the count in the source system? If it does not, find out why *before* you present, because someone else will. Spot-check a handful of individual rows against the source. Check the boundaries: the first period, the last period, the nulls, the categories with one row.

And say what you are not sure about. "Revenue is up 4%, but two large orders moved in from March, so the underlying trend is closer to flat" is a better answer than a clean number that is technically correct and practically misleading. Nobody loses trust for flagging a caveat; they lose it for a number that quietly turns out to be wrong.

## Common mistakes

- Building before the question has been agreed in one sentence.
- Bar charts with a truncated axis.
- Dual axes implying a correlation the data does not show.
- A pie chart with seven slices.
- Presenting a total without checking it against a number the business already believes.
- Building a dashboard when what was wanted was an answer.

## Sources

- Edward Tufte, *The Visual Display of Quantitative Information*, 2nd ed. — data-ink, graphical integrity and the axis rules. https://www.edwardtufte.com/book/the-visual-display-of-quantitative-information/
- Financial Times, *Visual Vocabulary* — which chart form suits which relationship. https://github.com/Financial-Times/chart-doctor/tree/main/visual-vocabulary
- Microsoft Learn, "Visualization types in Power BI" and the report design guidance. https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a
</script>

id: egypt-payroll
num: 9
domain: hcm
track: functional
title: Egypt: Social Insurance & Salary Tax
subtitle: The mechanics Oracle does not ship — and the consultant's biggest differentiator
hue: 4
minutes: 11
labs: insurance, tax
terms: insurable-wage, social-insurance-contribution-rates, nosi, form-1-and-form-6, personal-exemption, progressive-tax-brackets, bracket-elimination-for-high-earners, martyrs-victims-fund-contribution, universal-health-insurance, minimum-wage-and-mandatory-annual-increment
---

Oracle does not deliver a pre-built, maintained Egyptian payroll localization the way it does for some markets. The implementation partner builds the statutory rules — in elements, balances and Fast Formulas (Chapter 12). A consultant who knows the Egyptian mechanics is therefore useful on day one in a way that one who only knows the product is not.

> **Every figure in this chapter moves.** Insurable-wage limits rise each January under a fixed schedule; tax law changes by decree. The figures below were checked against PwC Worldwide Tax Summaries and statutory alerts in 2026. Re-verify against NOSI or the Egyptian Tax Authority before quoting them to a client.

## Social insurance: the insurable wage

Egyptian social insurance is administered by **NOSI**, the National Organization for Social Insurance, under Law 148 of 2019. Contributions are not calculated on gross salary. They apply to the **insurable wage**: the portion of pay bounded by a statutory floor and ceiling. From 1 January 2026 the minimum is EGP 2,700 per month and the maximum EGP 16,700, up from EGP 2,300 and 14,500 in 2025. The limits rise 15% each January under a schedule that began in 2021, after which they are indexed to inflation.

The **contribution rates** are fixed by law: employee 11%, employer 18.75%, total 29.75% of the insurable wage. At the 2026 ceiling the employee share caps at EGP 1,837.00 per month and the employer share at EGP 3,131.25 — whether the person earns EGP 20,000 or 200,000. Being able to compute a capped contribution in a workshop builds credibility fast, and "contributions apply to full gross" is the most common calculation error in Egyptian payroll.

[[lab:insurance]]

Registration is form-driven. **Form 1** is filed with social insurance on hiring and **Form 6** on termination; the Personnel team handles them, and a standard Oracle implementation does not generate them unless someone builds the output. Two smaller statutory items belong in every Egyptian element inventory: the **Martyrs and Victims Fund** deduction of 0.05% of gross pay, and **universal health insurance** (employer 3.25%, employee 1%), which applies only in governorates where the scheme has been rolled out — confirm the client's governorate rather than assuming.

## The minimum wage and the mandatory increment

The private-sector **minimum wage** is EGP 7,000 per month, and it is defined to include the employer's social-insurance share rather than sit beneath it. Law 14/2025 also requires an **annual increment** of at least 3% of the social-insurance wage. Because the base is the insurable wage, not total salary, the increment is effectively capped at 3% of the ceiling for higher earners. Calculating it on full gross is the classic error.

## Salary tax: annual, progressive, exemption-adjusted

Salary tax is calculated annually and then divided across the year — the monthly figure is a derived slice, not an independent calculation. The formula: gross, less the **personal exemption**, less the employee's social-insurance contribution, equals net taxable income. Law No. 7 of 2024 raised the personal exemption from EGP 15,000 to **EGP 20,000** a year, for residents and non-residents alike, widened the zero-rated band to EGP 40,000, and introduced a top rate of 27.5%.

The **progressive brackets** on annual net taxable income are: 0% to EGP 40,000; 10% to 55,000; 15% to 70,000; 20% to 200,000; 22.5% to 400,000; 25% to 1,200,000; and 27.5% above that.

## Bracket elimination for high earners

Egypt adds a rule most payroll calculators ignore. As net taxable income rises past defined thresholds, access to the lower bands is progressively removed, so that the income which would have been taxed at 0% or 10% is taxed at the next surviving rate instead. Above EGP 600,000 the zero band disappears; above 700,000 the 10% band also goes; the pattern continues through 800,000 and 900,000 until, above EGP 1,200,000, only the 25% and 27.5% bands remain. Deloitte's summary of Law 7/2024 presents this as a table of bracket applications by total-income level, stating the 600,000 and 700,000 steps explicitly and that the pattern continues to 1,200,000. The 800,000 and 900,000 steps above follow that stated pattern rather than a separately cited figure, so confirm the exact ladder against the Egyptian Tax Authority before building it.

A naive progressive calculation that applies every band to every employee is wrong for senior staff — precisely the people who notice. If a consultant builds or validates an Egyptian tax formula, this rule is a correctness requirement.

[[lab:tax]]

## Common mistakes

- Applying contributions to gross instead of the capped insurable wage.
- Quoting last year's limits. They change every January.
- Calculating the 3% increment on total salary.
- Treating tax as a flat monthly percentage.
- Omitting the Martyrs Fund and health-insurance lines, then finding the gap in parallel run.
- Ignoring bracket elimination.

## Sources

- PwC Worldwide Tax Summaries, Egypt — "Taxes on personal income" and "Other taxes". https://taxsummaries.pwc.com/egypt/individual/taxes-on-personal-income · https://taxsummaries.pwc.com/egypt/individual/other-taxes
- Mercans statutory alert, "Egypt: Minimum and Maximum Insurable Wage Limits Increase for Social Insurance from 2026". https://mercans.com/resources/statutory-alerts/egypt-minimum-and-maximum-insurable-wage-limits-increase-for-social-insurance-from-2026/
- Deloitte Middle East, "Amendment to tax brackets and annual personal exemption" (Law 7/2024). https://www.deloitte.com/middle-east/en/services/tax/perspectives/amendment-to-tax-brackets-and-annual-personal-exemption.html
- EY, "Egypt enacts new labor law affecting employers from 1 September 2025" (annual increment). https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025
</script>
