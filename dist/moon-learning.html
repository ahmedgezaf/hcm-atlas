      <div class="explain">${score>=7?'<b>That is the answer an interviewer is listening for</b> — not the list of four tools, but the reason each request lands where it does.':'<b>Worth another pass.</b> Screen and ad-hoc is OTBI, formatted document is BI Publisher, scheduled or bulk outbound is Extract, live question from another system is REST — and anything coming <em>in</em> is not on that list at all.'}</div>
      <div class="stepper"><button class="active" data-again="1">Start again</button></div>`;
      b.querySelector('[data-again]').addEventListener('click',()=>{i=0;score=0;picked=null;draw();});return;}
    const q=Q[i];
    b.innerHTML=`<div class="kv"><span class="small muted">Request ${i+1} of ${Q.length}</span><b>${score} correct</b></div>
    <div class="explain" style="font-size:16px">“${q.q}”</div>
    <div class="opts">${O.map(([v,l])=>`<button class="opt ${picked?(v===q.a?'right':(v===picked?'wrong':'')):''}" data-v="${v}" ${picked?'disabled':''}>${l}</button>`).join('')}</div>
    ${picked?`<div class="msg ${picked===q.a?'ok':'bad'}" role="status"><b>${picked===q.a?'Right.':'It is '+O.find(o=>o[0]===q.a)[1]+'.'}</b><span>${q.why}</span><div class="ar-line">${q.ar}</div></div>
    <div class="stepper"><button class="active" data-next="1">${i===Q.length-1?'See the score':'Next request'}</button></div>`:''}`;
    b.querySelectorAll('[data-v]').forEach(x=>x.addEventListener('click',()=>{if(picked)return;picked=x.dataset.v;if(picked===q.a)score++;draw();}));
    const n=b.querySelector('[data-next]');if(n){n.addEventListener('click',()=>{i++;picked=null;draw();});n.focus();}};
  draw();
}});

/* Lab 28: a Fast Formula that actually runs */
LABS.push({id:'ff-run',ch:'ff',title:'Run a formula, line by line',lead:'The same language, evaluated in the page. Change an input, run it, and read which lines fired: the green ones executed, the faded ones were skipped by a condition. The last preset is the bug every beginner ships at least once.',render(b){
  const PRE=[
    {n:'Special allowance',code:'/* Special allowance for high earners */\nINPUTS ARE BASIC_SALARY\nDEFAULT FOR BASIC_SALARY IS 0\nIF BASIC_SALARY > 35000 THEN\n  SPECIAL_ALLOWANCE = 2500\nELSE\n  SPECIAL_ALLOWANCE = 0\nRETURN SPECIAL_ALLOWANCE',v:{BASIC_SALARY:'40000'}},
    {n:'Egypt social insurance',code:'/* Egypt social insurance: employee share. Limits checked 2026 — they rise each January */\nINPUTS ARE INSURABLE_WAGE\nDEFAULT FOR INSURABLE_WAGE IS 0\nFLOOR_AMT = 2700\nCEILING_AMT = 16700\nEMP_RATE = 0.11\nCAPPED_WAGE = INSURABLE_WAGE\nIF CAPPED_WAGE > CEILING_AMT THEN\n  CAPPED_WAGE = CEILING_AMT\nIF CAPPED_WAGE < FLOOR_AMT THEN\n  CAPPED_WAGE = FLOOR_AMT\nEMP_CONTRIBUTION = ROUND(CAPPED_WAGE * EMP_RATE, 2)\nRETURN EMP_CONTRIBUTION',v:{INSURABLE_WAGE:'20000'}},
    {n:'Transport by grade',code:'/* Transport allowance by grade, pro-rated on days worked */\nINPUTS ARE GRADE_LEVEL, DAYS_WORKED\nDEFAULT FOR GRADE_LEVEL IS 1\nDEFAULT FOR DAYS_WORKED IS 30\nIF GRADE_LEVEL >= 5 THEN\n  MONTHLY_AMT = 1200\nELSE\n  MONTHLY_AMT = 800\nTRANSPORT = ROUND(MONTHLY_AMT * DAYS_WORKED / 30, 2)\nRETURN TRANSPORT',v:{GRADE_LEVEL:'6',DAYS_WORKED:'20'}},
    {n:'No default — the classic failure',code:'/* Overtime pay. Try running it with the input left empty */\nINPUTS ARE OVERTIME_HOURS\nOT_PAY = OVERTIME_HOURS * 150\nRETURN OT_PAY',v:{OVERTIME_HOURS:''}}];
  let cur=0,vals={...PRE[0].v};
  /* A deliberately small interpreter: assignments, IF/THEN/ELSE by indentation,
     arithmetic, ROUND and RETURN — the subset these formulas use. */
  const parse=code=>code.split('\n').map((raw,i)=>{const t=raw.replace(/\/\*.*?\*\//g,'').replace(/\s+$/,'');return{i,raw,t:t.trim(),ind:t.length-t.replace(/^\s+/,'').length,cmt:!t.trim()};}).filter(l=>l.raw.trim());
  const toks=s=>s.match(/\d+(?:\.\d+)?|[A-Za-z_][A-Za-z0-9_]*|>=|<=|<>|[()+\-*/,<>=]/g)||[];
  const run=(code,vin)=>{
    const lines=parse(code),env={},trace=[],fired=new Set();let result=null,err=null;
    let F,T,E;
    E=(ts,k)=>{let[v,i]=T(ts,k);while(ts[i]==='+'||ts[i]==='-'){const o=ts[i];const[r,j]=T(ts,i+1);v=o==='+'?v+r:v-r;i=j;}return[v,i];};
    T=(ts,k)=>{let[v,i]=F(ts,k);while(ts[i]==='*'||ts[i]==='/'){const o=ts[i];const[r,j]=F(ts,i+1);v=o==='*'?v*r:v/r;i=j;}return[v,i];};
    F=(ts,k)=>{const t=ts[k];
      if(t==='(') {const[v,i]=E(ts,k+1);return[v,i+1];}
      if(t==='-'){const[v,i]=F(ts,k+1);return[-v,i];}
      if(/^[A-Za-z_]/.test(t)){
        if(t.toUpperCase()==='ROUND'){const[a,i]=E(ts,k+2);let n=0,j=i;if(ts[j]===','){const r=E(ts,j+1);n=r[0];j=r[1];}return[Math.round(a*Math.pow(10,n))/Math.pow(10,n),j+1];}
        if(!(t in env)) throw new Error(t);
        return[env[t],k+1];}
      return[parseFloat(t),k+1];};
    const val=s=>E(toks(s),0)[0];
    const cond=s=>{const m=s.match(/^(.*?)(>=|<=|<>|>|<|=)(.*)$/);const a=val(m[1]),c=val(m[3]),o=m[2];
      return o==='>'?a>c:o==='<'?a<c:o==='>='?a>=c:o==='<='?a<=c:o==='='?a===c:a!==c;};
    const block=(a,z)=>{let k=a;
      while(k<z){const L=lines[k];
        if(L.cmt){k++;continue;}
        if(/^INPUTS ARE/i.test(L.t)||/^DEFAULT FOR/i.test(L.t)){fired.add(L.i);k++;continue;}
        if(/^IF\b/i.test(L.t)){
          const c=cond(L.t.replace(/^IF\s+/i,'').replace(/\s+THEN$/i,''));
          fired.add(L.i);trace.push([L.i,'condition is '+(c?'true':'false')]);
          let te=k+1;while(te<z&&lines[te].ind>L.ind)te++;
          let es=null,ee=te;
          if(te<z&&/^ELSE$/i.test(lines[te].t)&&lines[te].ind===L.ind){es=te+1;ee=es;while(ee<z&&lines[ee].ind>L.ind)ee++;fired.add(lines[te].i);}
          if(c) block(k+1,te); else if(es!==null) block(es,ee);
          k=ee;continue;}
        if(/^RETURN\b/i.test(L.t)){const n=L.t.replace(/^RETURN\s+/i,'');result=[n,val(n)];fired.add(L.i);trace.push([L.i,'returns '+result[1]]);return;}
        const m=L.t.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
        if(m){env[m[1]]=val(m[2]);fired.add(L.i);trace.push([L.i,m[1]+' = '+env[m[1]]]);k++;continue;}
        k++;}};
    const ins=(code.match(/^INPUTS ARE (.+)$/mi)||[,''])[1].split(',').map(s=>s.trim()).filter(Boolean);
    ins.forEach(n=>{const d=code.match(new RegExp('^DEFAULT FOR '+n+' IS (.+)$','mi'));
      const given=(vin[n]||'').trim();
      if(given!=='') env[n]=parseFloat(given);
      else if(d) env[n]=parseFloat(d[1]);});
    try{ block(0,lines.length); }
    catch(e){ err=e.message; }
    return{lines,trace,fired,result,err,ins};};
  const draw=()=>{
    const p=PRE[cur],out=run(p.code,vals);
    const lit=new Map(out.trace.map(([i,t])=>[i,t]));
    b.innerHTML=`<div class="stepper">${PRE.map((x,i)=>`<button class="${i===cur?'active':''}" data-p="${i}">${x.n}</button>`).join('')}</div>
    <div class="sim">
      <div class="in" style="display:grid;gap:10px;align-content:start">
        ${out.ins.map(n=>`<label style="font-size:13px;font-weight:700;color:var(--ink-2)">${n}<input type="number" data-in="${n}" value="${vals[n]===undefined?'':vals[n]}" placeholder="leave empty to test the default" style="width:100%;margin-top:4px;padding:7px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit"></label>`).join('')}
        ${out.err?`<div class="msg bad"><b>The formula fails.</b><span>${out.err} has no value, and there is no DEFAULT FOR line to fall back on. In a live run this errors for every employee whose entry is empty — which is most of them, most months.</span><div class="ar-line">من غير DEFAULT، أي قيمة فاضية بتوقّع الفورميولا.</div></div>`
          :`<div class="kv total"><span>${out.result?out.result[0]:'no RETURN'}</span><b>${out.result?out.result[1]:'—'}</b></div>`}
        <div class="explain small muted">Inputs come from the element’s input values, and the names must match them exactly. Empty one to see what a missing DEFAULT does.</div>
      </div>
      <div style="display:grid;gap:10px;min-width:0">
        <div class="code">${out.lines.map(l=>`<span class="l ${l.cmt?'cmt':(out.fired.has(l.i)?'ran':'skip')}"><span class="n">${l.i+1}</span>${esc(l.raw)||' '}${lit.has(l.i)?`<span class="note"> → ${esc(lit.get(l.i))}</span>`:''}</span>`).join('')}</div>
        <div class="legend"><span>green · executed</span><span>faded · skipped by a condition, or never reached</span></div>
      </div>
    </div>`;
    b.querySelectorAll('[data-p]').forEach(x=>x.addEventListener('click',()=>{cur=+x.dataset.p;vals={...PRE[cur].v};draw();}));
    b.querySelectorAll('[data-in]').forEach(x=>x.addEventListener('input',()=>{vals[x.dataset.in]=x.value;const k=x.dataset.in,pos=x.selectionStart;draw();const n2=b.querySelector(`[data-in="${k}"]`);if(n2){n2.focus();try{n2.setSelectionRange(pos,pos);}catch(e){}}}));};
  draw();
}});

     o:['Nothing, the logic is sound','The ceiling is last year’s figure — Egyptian limits rise every January, and a hard-coded one quietly under-deducts','14500 should be 145','The rate should be 0.14'],a:1,
     why:'The insurable-wage limits rise every January. Hard-coded, the formula under-deducts from every high earner until someone reconciles a statutory return. Keep limits in a global value with dated versions, and the floor is missing here too.',ar:'الحد الأقصى بتاع السنة اللي فاتت. حط الحدود في global value.'},

/* Lab 30: import and load are two different checks */
LABS.push({id:'import-load',ch:'hdl',title:'Import checks the shape, load checks the meaning',lead:'A load is two inspections with a waiting room between them. Import reads the file and puts well-formed lines in staging; load turns staging into real records. Send a file through and watch where each kind of problem stops it.',render(b){
  const ST=[['sheet','Client’s spreadsheet','one row per employee'],['dat','.dat files','one per business object'],['zip','Flat zip, uploaded','no folders inside'],['imp','Import','is the format readable?'],['stg','Staging','a waiting room'],['load','Load','is the content valid?'],['db','Live records','in the real tables']];

    clean:{n:'A clean file',stop:null,
      t:'All the way through.',
      d:'Import reads every line, staging holds them, load resolves each reference and writes the records. The count that matters is the one at the end: rows in the file against rows in Oracle, reconciled by source key.',

    case:{n:'jobFamilyCode instead of JobFamilyCode',stop:'imp',

    </div>
    <div class="callout"><b>Reading an error report.</b> Thirty errors are rarely thirty problems. Group them: one misspelt department name in a source spreadsheet produces an error per employee in it. Fix the source file and reload — never patch the records by hand in Oracle, or the file and the system stop agreeing and the next load undoes the patch.</div>`;

/* Lab 31: keys — why the legacy id is kept */
LABS.push({id:'source-keys',ch:'hdl',title:'Match them back: name, or key',lead:'Eight employees came from the old payroll and four records failed the load. To fix them, each failure has to be matched back to its source row. Switch how the match is made — two of these people share a name.',render(b){

const D={mode:'questions',ch:null,queue:[],idx:0,flipped:false,rebuild:true,dueOnly:false,iv:null,tick:null};
function buildCards(){
  let cards=[];
  if(D.mode==='terms') cards=domTerms().filter(t=>!D.ch||t.ch===D.ch).map(t=>({id:'t:'+t.id,q:t.name,ch:t.ch,back:[{lb:'Definition',tx:t.what},t.trap?{lb:'Watch out',tx:t.trap,warn:true}:null].filter(Boolean)}));
  else if(D.mode==='questions') cards=DATA.questions.filter(q=>chDomain(q.ch)===dom&&(!D.ch||q.ch===D.ch)).map((q,i)=>({id:'q:'+DATA.questions.indexOf(q),q:q.q,ch:q.ch,back:[{lb:'Model answer',tx:q.a},...q.terms.map(id=>TERMS[id]).filter(Boolean).slice(0,2).map(t=>({lb:t.name,tx:t.what}))]}));
  else cards=S.customQ.filter(q=>chDomain(q.ch)===dom).map(q=>({id:'c:'+q.id,q:q.q,ch:q.ch,back:[{lb:'Your answer',tx:q.a}],mine:true}));
  if(D.dueOnly) cards=cards.filter(c=>isDue(c.id));
  const m=c=>S.drill[c.id]||0, rnd=()=>Math.random()-.5;
  return [...cards.filter(c=>m(c)===0).sort(rnd),...cards.filter(c=>m(c)===1).sort(rnd),...cards.filter(c=>m(c)===2).sort(rnd)];
}
/* An interview round: ten cards drawn across the collection, weakest first,
   with a clock running and no way back to a card once it is graded. The point
   is the summary — which sections to reread, not the score. */
function startInterview(){
  const pool=DATA.questions.map((q,i)=>({id:'q:'+i,q:q.q,a:q.a,ch:q.ch})).filter(x=>chDomain(x.ch)===dom);
  const rnd=()=>Math.random()-.5;
  const weak=pool.filter(x=>(S.drill[x.id]||0)<2).sort(rnd), rest=pool.filter(x=>(S.drill[x.id]||0)===2).sort(rnd);
  return {cards:[...weak,...rest].slice(0,10),i:0,shown:false,started:Date.now(),marks:[],done:false};
}
function renderInterview(v){
  const iv=D.iv, c=iv.cards[iv.i];
  const mins=t=>{const s=Math.max(0,Math.round(t/1000));return (s<60?s+'s':Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s');};
  if(iv.done){
    const got=iv.marks.filter(m=>m.ok).length, weakest={};
    iv.marks.filter(m=>!m.ok).forEach(m=>{weakest[m.ch]=(weakest[m.ch]||0)+1;});
    const rows=Object.entries(weakest).sort((a,b)=>b[1]-a[1]).map(([ch,n])=>{const x=chById(ch);return `<li>${esc(x.title)} — ${n} missed · <a href="#${dom}/chapters/${ch}" data-ch="${ch}">reread chapter ${x.num}</a></li>`;}).join('');
    v.innerHTML=`<div class="view-head"><div><div class="eyebrow">Interview round · finished</div><h1>${got} of ${iv.marks.length}</h1><p>${mins(iv.ended-iv.started)} for ${iv.marks.length} questions, about ${mins((iv.ended-iv.started)/Math.max(iv.marks.length,1))} each. The score is not the point; the list below is.</p></div></div>
    <div class="ivwrap"><div class="card" style="padding:18px">${rows?`<div class="eyebrow" style="margin-bottom:8px">What to go back to</div><ul class="ivlist">${rows}</ul>`:'<div class="eyebrow" style="margin-bottom:8px">Nothing missed</div><p class="small">Every card answered. Run it again with a different draw, or switch the deck to terms.</p>'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="ivAgain">Another round</button><button class="btn ghost" id="ivBack">Back to the deck</button></div></div>`;
    v.querySelectorAll('[data-ch]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();D.iv=null;go('chapters',{ch:a.dataset.ch});}));
    $('#ivAgain').addEventListener('click',()=>{D.iv=startInterview();renderDrill(v);});
    $('#ivBack').addEventListener('click',()=>{D.iv=null;D.rebuild=true;renderDrill(v);});
    return;
  }
  const ch=chById(c.ch);
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">Interview round · answer out loud, then grade yourself</div><h1>Question ${iv.i+1} of ${iv.cards.length}</h1></div></div>
  <div class="ivwrap">
    <div class="ivbar"><span class="mono" id="ivClock">0s</span><span class="small muted">no going back once graded</span><span class="mono">${iv.marks.filter(m=>m.ok).length} so far</span></div>
    <div class="card ivcard" data-h style="--h:${ch.hue}"><div class="chip">Ch. ${ch.num} · ${esc(ch.title)}</div><div class="ivq">${esc(c.q)}</div>
      ${iv.shown?`<div class="ivans"><div class="eyebrow" style="margin:14px 0 6px">Model answer</div><p>${esc(c.a)}</p></div>`:'<p class="small muted" style="margin-top:14px">Say it in a sentence or two before revealing.</p>'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${iv.shown
      ?`<button class="btn no" data-iv="0">Missed it</button><button class="btn yes" data-iv="1">Answered it</button>`
      :`<button class="btn primary" id="ivShow">Reveal the model answer</button>`}<button class="btn ghost" id="ivQuit" style="margin-left:auto">End the round</button></div>
  </div>`;
  clearInterval(D.tick);
  D.tick=setInterval(()=>{ const el=document.getElementById('ivClock'); if(!el){clearInterval(D.tick);return;} el.textContent=mins(Date.now()-iv.started); },1000);
  $('#ivShow')?.addEventListener('click',()=>{iv.shown=true;renderDrill(v);});
  v.querySelectorAll('[data-iv]').forEach(b=>b.addEventListener('click',()=>{
    const ok=b.dataset.iv==='1'; iv.marks.push({ok,ch:c.ch}); grade(c.id,ok);
    iv.i++; iv.shown=false;
    if(iv.i>=iv.cards.length){ iv.done=true; iv.ended=Date.now(); clearInterval(D.tick); }
    renderDrill(v); }));
  $('#ivQuit').addEventListener('click',()=>{ clearInterval(D.tick); if(iv.marks.length){ iv.done=true; iv.ended=Date.now(); } else D.iv=null; renderDrill(v); });
}

function renderDrill(v){

  if(D.rebuild){ D.queue=buildCards(); D.idx=0; D.flipped=false; D.rebuild=false; }
  const pr=progress(); const c=D.queue[D.idx]; const ch=c?chById(c.ch):CH[0]; const counts={0:0,1:0,2:0}; D.queue.forEach(x=>counts[S.drill[x.id]||0]++);
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">Retrieval practice · out loud, not in your head</div><h1>Drill</h1><p>Read the front, answer aloud in a sentence or two, flip, then grade yourself honestly. Missed cards come back first. "Solid" means it was said fluently twice.</p></div></div>
  <div class="drill-top"><div class="seg">${[['questions','Questions'],['terms','Terms'],['mine','Mine']].map(([k,l])=>`<button class="${D.mode===k?'active':''}" data-mode="${k}">${l}</button>`).join('')}</div>
  <div class="chk">${CHD().map(x=>`<label class="${D.ch===x.id?'on':''}" data-h style="--h:${x.hue}"><input type="checkbox" hidden data-pf="${x.id}">${x.num}</label>`).join('')}<span class="small muted" style="align-self:center">${D.ch?chById(D.ch).title:'all chapters'}</span></div>
  <button class="btn sm ${D.dueOnly?'primary':'ghost'}" id="dueBtn" title="Only the cards that are due today">Due today · ${dueCount()}</button>
  <button class="btn sm ghost" id="ivBtn">Interview round</button>
  <button class="btn sm ghost" id="shuffle" style="margin-left:auto">Reshuffle</button></div>
  ${!c?`<div class="empty">${D.mode==='mine'?'No questions of your own yet. Add one below.':'No cards match this filter.'}</div>`:`
  <div class="fc-wrap"><div>
    <div class="fc ${D.flipped?'flipped':''}" id="fc" data-h style="--h:${ch.hue}"><div class="fc-inner">
      <div class="face front"><div class="meta"><span class="chip">Ch. ${ch.num} · ${esc(ch.title)}</span>${c.mine?'<span class="mine">yours</span>':''}<span style="margin-left:auto" class="num">${D.idx+1} / ${D.queue.length}</span></div><div class="q">${esc(c.q)}</div><div class="hint">Say it out loud · click to flip · <span class="kbd">space</span></div></div>
      <div class="face back"><div class="meta"><span class="chip p">Answer</span></div><div class="a">${c.back.map(x=>`<div><div class="lb" ${x.warn?'style="color:var(--gold)"':''}>${esc(x.lb)}</div><div>${esc(x.tx)}</div></div>`).join('')}</div></div>
    </div></div>
    <div class="grade" style="margin-top:12px"><button class="btn no" data-g="0">Not yet</button><button class="btn" id="flipBtn">${D.flipped?'Show front':'Flip'}</button><button class="btn yes" data-g="1">Got it</button></div>
    <div class="selfans card needs-sample" style="padding:14px;margin-top:14px" ${sample?'':'hidden'}><span class="eyebrow">Type an answer and have it checked</span><textarea id="selfA" placeholder="One or two sentences, the way it would be said in an interview…"></textarea><div style="display:flex;gap:8px;align-items:center"><button class="btn sm primary" id="checkA">Check my answer</button><span class="small muted">Graded against the model answer, not the internet.</span></div><div class="feedback" id="fb" hidden></div></div>
  </div>
  <aside class="drill-side"><div class="card" style="padding:14px"><div class="eyebrow" style="margin-bottom:8px">This deck</div><div class="mastery"><div class="m0"><div class="big num">${counts[0]}</div><div class="lbl">new</div></div><div class="m1"><div class="big num">${counts[1]}</div><div class="lbl">shaky</div></div><div class="m2"><div class="big num">${counts[2]}</div><div class="lbl">solid</div></div></div><div class="sbar" style="margin-top:10px"><i class="s2" style="width:${pct(counts[2],D.queue.length)}%"></i><i class="s1" style="width:${pct(counts[1],D.queue.length)}%"></i><i class="s0" style="width:${pct(counts[0],D.queue.length)}%"></i></div></div>
   <div class="card" style="padding:14px"><div class="eyebrow" style="margin-bottom:6px">All cards</div><div class="small">${pr.solid} solid · ${pr.shaky} shaky · ${pr.cards-pr.solid-pr.shaky} new</div><div class="small muted" style="margin-top:6px">${dueCount()} due today${c?` · this card comes back ${whenDue(c.id)}`:''}</div></div>
   <div class="card" style="padding:14px;font-size:14px;color:var(--ink-2)"><b style="color:var(--ink)">The rule.</b> For every card that is not fluent, go back to that one section of the chapter — not the whole chapter.</div>
  </aside></div>`}

  v.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{D.mode=b.dataset.mode;D.rebuild=true;renderDrill(v);}));
  v.querySelectorAll('[data-pf]').forEach(b=>b.addEventListener('change',()=>{ D.ch=D.ch===b.dataset.pf?null:b.dataset.pf; D.rebuild=true; renderDrill(v); }));

  $('#checkA')?.addEventListener('click',async()=>{ const ta=$('#selfA'); if(!ta.value.trim()||!sample) return; const fb=$('#fb'); fb.hidden=false; fb.textContent='Checking…';

    catch(err){ fb.textContent=err&&err.code==='not_granted'?'Checking is not enabled for this view.':'Could not check right now.'; } });

  hcm: `<h2>Where this collection comes from</h2>
  <p>Product behaviour follows Oracle's own documentation — <em>Implementing Global Human Resources</em>, <em>Implementing Absence Management</em>, <em>Administering Global Payroll</em>, <em>Securing HCM</em> and the HCM Data Loader guides — with practitioner write-ups where Oracle's text is terse. Egyptian statutory figures were checked against PwC Worldwide Tax Summaries, Deloitte and Mercans statutory alerts, and the EY, Andersen and Amereller summaries of Labour Law No. 14 of 2025. Saudi figures follow GOSI's published rates and the Mudad and WPS employer guides. Every chapter lists what it used.</p>

  <p>Syntax and behaviour follow the vendors' own references — Microsoft Learn for T-SQL, Power BI, DAX and Excel, and the PostgreSQL manual where the standard and the dialects differ. Where a chapter states an opinion rather than a fact — which join to reach for, when a measure beats a calculated column, when a spreadsheet is genuinely the right answer — it says so in those words.</p>
  <h2>What to distrust</h2>
  <p>Anything dialect-specific. SQL is a standard that no two engines implement identically, and a query that runs in T-SQL may not in PostgreSQL or BigQuery. Where the chapters use a dialect they name it. Power BI ships monthly, so a menu path is the detail most likely to be stale; the concepts underneath move far more slowly than the interface does.</p>`,
};

function renderAbout(v){

  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">About</div><h1>What Moon Learning is, and how it is kept honest</h1></div></div>

  ${ABOUT_SOURCES[dom]||''}
  <h2>Carrying your progress</h2>
  <p>Everything you mark — chapters read, terms known, how each drill card has gone, your own terms and questions, and when each card is next due — lives in this browser, on this device. It is not an account and it is not on a server. That keeps it private and means a different browser starts empty, so there is a backup here: take a copy before switching devices, and paste it back on the other one.</p>

/* =====================================================================
   SPEECH — read a chapter aloud.
   ---------------------------------------------------------------------
   Uses the browser's own SpeechSynthesis, so there is no API key, no
   network call and nothing to pay for; the voices are whatever the
   reader's operating system ships. That is also the limitation: voice
   quality varies wildly between machines, and on some Linux builds there
   are no voices at all — the control simply does not appear there.

   Reads paragraph by paragraph rather than in one long utterance, so the
   current paragraph can be highlighted, progress is meaningful, and a
   long chapter does not hit the per-utterance length limits some engines
   impose. Labs, figures and the sources list are skipped: they are to be
   looked at, not listened to.
   ===================================================================== */

const SPEECH_OK = typeof window !== 'undefined' && 'speechSynthesis' in window;
const SP = { chunks: [], at: -1, playing: false, voice: null, rate: 1, title: '' };

/* Voices arrive asynchronously on most browsers. */
let VOICES = [];
function loadVoices() {
  if (!SPEECH_OK) return;
  VOICES = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  if (!VOICES.length) VOICES = speechSynthesis.getVoices();
  const sel = $('#sbVoice');
  if (!sel || !VOICES.length) return;
  const want = S.voice || '';
  sel.innerHTML = VOICES.map(v => `<option value="${esc(v.name)}">${esc(v.name.replace(/\s*\(.*\)$/, ''))}</option>`).join('');
  const match = VOICES.find(v => v.name === want);
  if (match) sel.value = match.name;
  SP.voice = match || VOICES.find(v => v.default) || VOICES[0];
}
if (SPEECH_OK) {
  speechSynthesis.addEventListener('voiceschanged', loadVoices);
  loadVoices();
}

/* The readable body of the chapter, in order, as [element, text] pairs. */
function speechChunks(root) {
  const out = [];
  root.querySelectorAll('h2, p, li, blockquote').forEach(el => {
    if (el.closest('.sources') || el.closest('.lab') || el.closest('.fig-embed')) return;
    if (el.querySelector('p, li')) return;                 // container, not a leaf
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    if (text.length < 2) return;
    out.push({ el, text: el.tagName === 'H2' ? text + '.' : text });
  });
  return out;
}

function speechButton(c) {
  if (!SPEECH_OK) return '';
  return `<button class="listen" id="listenBtn" aria-label="Read this chapter aloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>
    <span>Listen</span><span class="listen-min">${c.minutes} min</span></button>`;
}

function speechStart(c) {
  const prose = $('#prose');
  if (!SPEECH_OK || !prose) return;
  SP.chunks = speechChunks(prose);
  if (!SP.chunks.length) return;
  SP.title = c.title; SP.at = -1; SP.playing = true;
  SP.rate = parseFloat(S.rate || 1) || 1;
  const bar = $('#speechBar');
  bar.hidden = false;
  $('#sbTitle').textContent = c.title;
  $('#sbRate').value = String(SP.rate);
  speechNext();
}

function speechNext() {
  SP.at += 1;
  if (SP.at >= SP.chunks.length) return speechStop(true);
  speechPaint();
  const chunk = SP.chunks[SP.at];
  const u = new SpeechSynthesisUtterance(chunk.text);
  if (SP.voice) u.voice = SP.voice;
  u.rate = SP.rate;
  u.onend = () => { if (SP.playing) speechNext(); };
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') speechStop(); };
  speechSynthesis.speak(u);
}

function speechPaint() {
  SP.chunks.forEach((c, i) => c.el.classList.toggle('speaking', i === SP.at));
  const cur = SP.chunks[SP.at];
  if (cur) {
    const box = cur.el.getBoundingClientRect();
    if (box.top < 90 || box.bottom > window.innerHeight - 120) cur.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const done = SP.at + 1;
  $('#sbPos').textContent = `${done} of ${SP.chunks.length}`;
  $('#sbFill').style.width = pct(done, SP.chunks.length) + '%';
  const play = $('#sbPlay');
  if (play) { play.classList.toggle('paused', !SP.playing); play.setAttribute('aria-label', SP.playing ? 'Pause' : 'Play'); }
}

function speechPause() {
  if (!SP.playing) return;
  SP.playing = false; speechSynthesis.pause(); speechPaint();
}
function speechResume() {
  if (SP.playing || !SP.chunks.length) return;
  SP.playing = true; speechSynthesis.resume(); speechPaint();
}

/* `finished` distinguishes reaching the end from being cut off. */
function speechStop(finished) {
  if (!SPEECH_OK) return;
  speechSynthesis.cancel();
  SP.chunks.forEach(c => c.el.classList.remove('speaking'));
  SP.chunks = []; SP.at = -1; SP.playing = false;
  const bar = $('#speechBar');
  if (bar) bar.hidden = true;
  const btn = $('#listenBtn');
  if (btn) btn.classList.remove('on');
  if (finished) toast('Finished reading');
}

function speechJump(fraction) {
  if (!SP.chunks.length) return;
  speechSynthesis.cancel();
  SP.at = Math.max(-1, Math.min(SP.chunks.length - 1, Math.round(fraction * SP.chunks.length) - 1));
  SP.playing = true;
  speechNext();
}

/* ---------- wiring (the bar lives in the shell, so wire it once) ---------- */
if (SPEECH_OK) {
  $('#sbPlay').addEventListener('click', () => (SP.playing ? speechPause() : speechResume()));
  $('#sbStop').addEventListener('click', () => speechStop());
  $('#sbRate').addEventListener('change', e => {
    SP.rate = parseFloat(e.target.value) || 1; S.rate = SP.rate; save();
    if (SP.chunks.length) { const at = SP.at; speechSynthesis.cancel(); SP.at = at - 1; SP.playing = true; speechNext(); }
  });
  $('#sbVoice').addEventListener('change', e => {
    SP.voice = VOICES.find(v => v.name === e.target.value) || SP.voice;
    S.voice = e.target.value; save();
    if (SP.chunks.length) { const at = SP.at; speechSynthesis.cancel(); SP.at = at - 1; SP.playing = true; speechNext(); }
  });
  $('#sbTrack').addEventListener('click', e => {
    const box = e.currentTarget.getBoundingClientRect();
    speechJump((e.clientX - box.left) / box.width);
  });
  // Chrome stops speaking if the tab is hidden for a while; keep state honest.
  document.addEventListener('visibilitychange', () => { if (document.hidden && SP.playing) speechPause(); });
  window.addEventListener('beforeunload', () => speechSynthesis.cancel());
}

/* ---------------------------------------------------------------------
   COVER ART — the band at the top of a chapter. Four abstract patterns,
   picked by chapter number so neighbours never repeat, drawn in the
   chapter's own hue. A chapter with a `cover:` image in its frontmatter
   uses that photograph instead; this is the default.
   --------------------------------------------------------------------- */
function coverArt(num) {
  const pattern = num % 4;
  const open = '<svg class="cover-art" viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="ca">';
  const close = '</g></svg>';
  let body = '';

  if (pattern === 0) {                       // concentric rings
    for (let i = 0; i < 10; i++) body += `<circle cx="${40 + i * 88}" cy="80" r="${16 + (i % 4) * 15}"/>`;
  } else if (pattern === 1) {                // diagonal hatch
    for (let i = -4; i < 26; i++) body += `<path d="M${i * 40} 170 L${i * 40 + 90} -10"/>`;
  } else if (pattern === 2) {                // dot grid
    for (let r = 0; r < 5; r++) for (let c = 0; c < 25; c++) body += `<circle cx="${18 + c * 33}" cy="${18 + r * 33}" r="3.5" class="fill"/>`;
  } else {                                   // nested chevrons
    for (let i = 0; i < 12; i++) body += `<path d="M${-40 + i * 76} 170 L${10 + i * 76} 80 L${-40 + i * 76} -10"/>`;
  }
  return open + body + close;
}


/* =====================================================================
   FIGURES — static diagrams embedded in the prose with [[fig:id]].
   ---------------------------------------------------------------------
   A lab is something to push on; a figure is something to take in at a
   glance. They are deliberately different: a figure never has state, is
   never interactive, and carries no numbers that are not also in the
   chapter's text.

   Every figure is inline SVG so it inherits the theme's tokens and the
   chapter's hue (var(--p)) with no image file and no request. Draw on a
   fixed viewBox; .fig-scroll handles narrow screens.

   FIGS.push({ id, ch, title, caption, svg() })
   ===================================================================== */

const FIGS = [];

/* Small builders so the diagrams stay readable and consistent. */
const F = {
  /* A titled box. `sub` is an optional caption line, or an array of lines —
     SVG text does not wrap, so anything long has to be split by hand. */
  box(x, y, w, h, t, sub, cls = '') {
    const lines = sub == null ? [] : (Array.isArray(sub) ? sub : [sub]);
    const ty = lines.length ? y + 21 : y + h / 2 + 4.5;
    return `<g class="f-box ${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>` +
      `<text class="f-t" x="${x + 12}" y="${ty}">${t}</text>` +
      lines.map((l, i) => `<text class="f-s" x="${x + 12}" y="${y + 38 + i * 15}">${l}</text>`).join('') +
      `</g>`;
  },
  /* Column or section heading inside the drawing. */
  head(x, y, t, cls = '') {
    return `<text class="f-h ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  note(x, y, t, cls = '') {
    return `<text class="f-s ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  /* Elbow connector: down from (x1,y1), across, down into (x2,y2). */
  elbow(x1, y1, x2, y2, cls = '') {
    const mid = y1 + (y2 - y1) / 2;
    return `<path class="f-line ${cls}" d="M${x1} ${y1} V${mid} H${x2} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  down(x, y1, y2, cls = '') {
    return `<path class="f-line ${cls}" d="M${x} ${y1} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  across(x1, x2, y, cls = '') {
    return `<path class="f-line ${cls}" d="M${x1} ${y} H${x2}" marker-end="url(#fig-ar)"/>`;
  },
  /* Horizontal proportion bar: segments = [{w, label, cls}] summing to width. */
  bar(x, y, width, height, segments) {
    let at = x, out = '';
    segments.forEach(s => {
      const w = width * s.w;
      out += `<g class="f-seg ${s.cls || ''}"><rect x="${at}" y="${y}" width="${w}" height="${height}" rx="3"/>` +
        (w > 34 ? `<text class="f-bar-l" x="${at + w / 2}" y="${y + height / 2 + 4}">${s.label}</text>` : '') + `</g>`;
      at += w;
    });
    return out;
  },
};

/* =====================================================================
   SEARCH — a keyboard-first palette over everything on the site.
   ---------------------------------------------------------------------
   Indexes five kinds of row: whole chapters, individual chapter sections
   (every H2, which is also a scroll target), glossary terms, labs and
   drill questions. The index is built once, lazily, on first open, by
   parsing the chapter HTML that is already in the page — nothing is added
   to the payload for it.
   ===================================================================== */

const KIND = {
  chapter:  { label: 'Chapter',  w: 30 },
  section:  { label: 'Section',  w: 18 },
  term:     { label: 'Term',     w: 24 },
  lab:      { label: 'Lab',      w: 14 },
  figure:   { label: 'Figure',   w: 16 },
  question: { label: 'Question', w: 8  },
};

let IDX = null;

/* Chapter HTML as a flat list of elements, with the two specially-wrapped
   trailing sections unwrapped so an H2 inside them still starts a section. */
function flattenChapter(html) {
  const root = document.createElement('div');
  root.innerHTML = html;
  const out = [];
  [...root.children].forEach(el => {
    const wrap = el.classList.contains('mistakes') || el.classList.contains('sources');
    if (wrap) [...el.children].forEach(child => out.push({ el: child, sources: el.classList.contains('sources') }));
    else out.push({ el, sources: false });
  });
  return out;
}

function buildIndex() {
  if (IDX) return IDX;
  const rows = [];
  const add = (kind, title, sub, body, nav) => rows.push({
    kind, title, sub, body, nav,
    tl: title.toLowerCase(), sl: (sub || '').toLowerCase(), bl: (body || '').toLowerCase(),
  });

  CH.forEach(c => {
    const blocks = flattenChapter(c.html);
    // Chapter row: its own body is the whole readable text.
    const whole = blocks.filter(b => !b.sources).map(b => b.el.textContent).join(' ').replace(/\s+/g, ' ').trim();
    add('chapter', c.title, c.sub, whole, { ch: c.id });

    // Section rows, keyed by the same slug renderReader gives the heading, so a
    // hit can scroll straight to it. Labs are indexed separately, and their
    // headings are not chapter sections, so they take no part in the numbering.
    const taken = new Set();
    let row = null, text = [];
    const closeSection = () => {
      if (!row) return;
      row.body = text.join(' ').replace(/\s+/g, ' ').trim();
      row.bl = row.body.toLowerCase();
      row = null; text = [];
    };
    blocks.forEach(b => {
      if (b.el.tagName === 'H2') {
        closeSection();
        if (b.sources) return;              // the Sources list is not a destination
        add('section', b.el.textContent, c.title, '',
          { ch: c.id, sec: slugId(b.el.textContent, taken), hue: c.hue });
        row = rows[rows.length - 1];
      } else if (row && !b.sources) {
        text.push(b.el.textContent);
      }
    });
    closeSection();
  });

  allTerms().forEach(t => {
    const c = chById(t.ch);
    add('term', t.name, c ? c.title : '', [t.what, t.trap, t.ar, t.say].filter(Boolean).join(' '),
      { term: t.name, ch: t.ch, hue: c ? c.hue : 210 });
  });

  LABS.forEach(l => {
    const c = chById(l.ch);
    add('lab', l.title, c ? c.title : '', l.lead, { lab: l.id, ch: l.ch, hue: c ? c.hue : 210 });
  });

  FIGS.forEach(f => {
    const c = chById(f.ch);
    add('figure', f.title, c ? c.title : '', f.caption,
      { ch: f.ch, fig: 'fig-' + f.id, hue: c ? c.hue : 210 });
  });

  DATA.questions.forEach((q, i) => {
    const c = chById(q.ch);
    add('question', q.q, c ? c.title : '', q.a, { q: 'q:' + i, ch: q.ch, hue: c ? c.hue : 210 });
  });

  // Chapters carry their own hue for the row accent.
  rows.forEach(r => { const c = chById(r.nav.ch); if (r.nav.hue == null) r.nav.hue = c ? c.hue : 210; r.nav.d = c ? c.domain : DOMAINS[0].id; });
  IDX = rows;
  return IDX;
}

/* ---------- matching ---------- */
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* Each token carries two precompiled patterns so a match can be graded.
   Without this, "TRU" scores as highly inside "s-tru-ctures" as it does in
   "Tax Reporting Unit (TRU)". */
function tokenize(q) {
  return q.toLowerCase().split(/\s+/).map(t => t.trim()).filter(Boolean).slice(0, 6).map(t => ({
    t,
    whole: new RegExp('\\b' + rxEsc(t) + '\\b', 'i'),   // the token is a word of its own
    start: new RegExp('\\b' + rxEsc(t), 'ig'),          // the token begins a word
  }));
}

/* 2 = whole word, 1 = starts a word, 0 = only mid-word, -1 = absent.
   JavaScript's \b is defined against [A-Za-z0-9_], so an Arabic token can never
   satisfy the whole-word or word-start patterns and would score below every
   incidental English substring. Grade it as a whole word when it is present. */
function tier(hay, tk) {
  if (!hay) return -1;
  if (!/[a-z0-9]/i.test(tk.t)) return hay.includes(tk.t) ? 2 : -1;
  if (tk.whole.test(hay)) return 2;
  tk.start.lastIndex = 0;
  if (tk.start.test(hay)) return 1;
  return hay.includes(tk.t) ? 0 : -1;
}

const TITLE = [10, 48, 70], SUB = [4, 18, 24], BODY = [2, 7, 10];

function scoreRow(r, toks, phraseRx) {
  let s = 0;
  for (const tk of toks) {
    const tT = tier(r.tl, tk), tS = tier(r.sl, tk), tB = tier(r.bl, tk);
    if (tT < 0 && tS < 0 && tB < 0) return 0;          // every token must appear somewhere
    if (tT >= 0) s += TITLE[tT] + (r.tl.indexOf(tk.t) === 0 ? 20 : 0);
    else if (tS >= 0) s += SUB[tS];
    else {
      // A body hit counts for more when the row keeps coming back to the word,
      // so the chapter a term belongs to beats one that mentions it in passing.
      tk.start.lastIndex = 0;
      const hits = tB > 0 ? (r.bl.match(tk.start) || []).length : 0;
      s += BODY[tB] + Math.min(hits, 6) * 3;
    }
  }
  if (phraseRx) {
    if (phraseRx.test(r.tl)) s += 45;
    else if (phraseRx.test(r.bl)) s += 16;
  }
  return s + KIND[r.kind].w;
}

function searchRows(q, limit = 40) {
  const toks = tokenize(q);
  if (!toks.length) {
    return CH.map(c => ({
      kind: 'chapter', title: c.title, sub: c.sub, body: '', nav: { ch: c.id, hue: c.hue, d: c.domain }, sc: 0,
    }));
  }
  const phrase = q.trim().toLowerCase();
  const phraseRx = phrase.length > 2 && toks.length > 1 ? new RegExp('\\b' + rxEsc(phrase), 'i') : null;
  const hits = [];
  for (const r of buildIndex()) {
    const sc = scoreRow(r, toks, phraseRx);
    if (sc > 0) hits.push({ ...r, sc });
  }
  hits.sort((a, b) => b.sc - a.sc || a.title.length - b.title.length);
  return hits.slice(0, limit);
}

function hilite(text, toks) {
  if (!text) return '';
  if (!toks.length) return esc(text);
  const rx = new RegExp('(' + toks.map(tk => rxEsc(tk.t)).join('|') + ')', 'ig');
  return text.split(rx).map((part, i) => (i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part))).join('');
}

function snippet(body, toks, len = 150) {
  if (!body) return '';
  const low = body.toLowerCase();
  let at = -1;
  for (const tk of toks) {
    const i = low.indexOf(tk.t);
    if (i >= 0 && (at < 0 || i < at)) at = i;
  }
  if (at < 0) return body.length > len ? body.slice(0, len).trim() + '…' : body;
  const start = Math.max(0, at - 55);
  const end = Math.min(body.length, start + len);
  return (start > 0 ? '…' : '') + body.slice(start, end).trim() + (end < body.length ? '…' : '');
}

/* ---------- palette ---------- */
const P = { open: false, q: '', sel: 0, rows: [] };

function palOpen() {
  if (P.open) return;
  P.open = true; P.sel = 0;
  const el = $('#pal');
  el.hidden = false;
  document.body.classList.add('pal-lock');
  palRender();
  const input = $('#palQ');
  input.value = P.q;
  input.focus();
  input.select();
}

function palClose() {
  if (!P.open) return;
  P.open = false;
  $('#pal').hidden = true;
  document.body.classList.remove('pal-lock');
}

function palRender() {
  const toks = tokenize(P.q);
  P.rows = searchRows(P.q);
  if (P.sel >= P.rows.length) P.sel = Math.max(0, P.rows.length - 1);
  const list = $('#palList');
  if (!P.rows.length) {
    list.innerHTML = `<div class="pal-empty">Nothing matches “${esc(P.q)}”.</div>`;
    palActive();
    return;
  }
  list.innerHTML = P.rows.map((r, i) => `
    <button class="pal-row ${i === P.sel ? 'on' : ''}" id="pal-r${i}" data-i="${i}" data-h style="--h:${r.nav.hue}" role="option" aria-selected="${i === P.sel}">
      <span class="pal-kind">${KIND[r.kind].label}</span>
      <span class="pal-main">
        <span class="pal-t">${hilite(r.title, toks)}</span>
        ${r.sub ? `<span class="pal-sub"><span class="pal-dom">${esc(domById(r.nav.d || dom).short)}</span>${hilite(r.sub, toks)}</span>` : ''}
        ${toks.length && r.body ? `<span class="pal-snip">${hilite(snippet(r.body, toks), toks)}</span>` : ''}
      </span>
    </button>`).join('');
  list.querySelectorAll('.pal-row').forEach(b => {
    b.addEventListener('click', () => palGo(+b.dataset.i));
    b.addEventListener('mousemove', () => palSelect(+b.dataset.i, false));
  });
  palActive();
  palScrollIntoView();
}

function palSelect(i, scroll = true) {
  if (i === P.sel || i < 0 || i >= P.rows.length) return;
  P.sel = i;
  $('#palList').querySelectorAll('.pal-row').forEach((b, k) => {
    b.classList.toggle('on', k === i);
    b.setAttribute('aria-selected', k === i);
  });
  palActive();
  if (scroll) palScrollIntoView();
}

/* Screen readers follow the combobox's active option, not DOM focus, which
   stays in the input so typing keeps working. */
function palActive() {
  $('#palQ').setAttribute('aria-activedescendant', P.rows.length ? 'pal-r' + P.sel : '');
}

function palScrollIntoView() {
  const on = $('#palList').querySelector('.pal-row.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

/* Open whatever the selected row points at. */
function palGo(i) {
  const r = P.rows[i];
  if (!r) return;
  palClose();
  const n = r.nav, d = n.d || dom;
  if (n.lab) return go('labs', { dom: d, lab: n.lab });
  if (n.fig) return go('chapters', { dom: d, ch: n.ch, sec: n.fig });
  if (n.term) { glQ = n.term; glCh = null; return go('glossary', { dom: d }); }
  if (n.q) {
    D.mode = 'questions'; D.ch = null; D.rebuild = true; D.flipped = false;
    go('drill', { dom: d });
    const at = D.queue.findIndex(x => x.id === n.q);
    if (at >= 0) { D.idx = at; renderDrill($('#view')); }
    return;
  }
  return go('chapters', n.sec ? { dom: d, ch: n.ch, sec: n.sec } : { dom: d, ch: n.ch });
}

/* ---------- wiring ---------- */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); P.open ? palClose() : palOpen(); return; }
  if (!P.open) {
    // Bare "/" opens search, as long as the reader is not typing into something.
    if (e.key === '/' && !e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault(); palOpen();
    }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); palClose(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); palSelect(Math.min(P.sel + 1, P.rows.length - 1)); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSelect(Math.max(P.sel - 1, 0)); }
  else if (e.key === 'Home' && e.target.id !== 'palQ') { e.preventDefault(); palSelect(0); }
  else if (e.key === 'Enter') { e.preventDefault(); palGo(P.sel); }
});

$('#palQ').addEventListener('input', e => { P.q = e.target.value; P.sel = 0; palRender(); });
$('#pal .pal-bg').addEventListener('click', palClose);
$('#searchBtn').addEventListener('click', palOpen);
// ⌘ on Apple hardware, Ctrl everywhere else.
if (/Mac|iPhone|iPad|iPod/.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '')) {
  document.querySelectorAll('[data-mod]').forEach(el => { el.textContent = '⌘K'; });
}

route=parseHash(); lastHash=location.hash.slice(1); render();

(function () {

    var labIds = new Set(LABS.map(function (l) { return l.id; }));

    var embedded = new Set(), seen = {};
    CH.forEach(function (c) {
      if (seen[c.id]) P.push('Two chapters share the id "' + c.id + '"');
      seen[c.id] = 1;
      if (!domIds.has(c.domain)) P.push('Chapter ' + c.id + ': domain "' + c.domain + '" is not one of the COLLECTIONS');
      if (c.track !== 'functional' && c.track !== 'technical') P.push('Chapter ' + c.id + ': track must be functional or technical');
      c.labs.forEach(function (l) { if (!labIds.has(l)) P.push('Chapter ' + c.id + ': labs: names "' + l + '", which does not exist'); });

      Array.from(c.html.matchAll(/data-lab="([a-z0-9-]+)"/g)).forEach(function (m) {
        if (!labIds.has(m[1])) P.push('Chapter ' + c.id + ': [[lab:' + m[1] + ']] does not exist');
      });
      Array.from(c.html.matchAll(/data-fig="([a-z0-9-]+)"/g)).forEach(function (m) {
        embedded.add(m[1]);
        var f = FIGS.find(function (x) { return x.id === m[1]; });
        if (!f) P.push('Chapter ' + c.id + ': [[fig:' + m[1] + ']] does not exist');
        else if (f.ch !== c.id) P.push('Chapter ' + c.id + ': figure "' + m[1] + '" belongs to chapter "' + f.ch + '"');
      });
      if (!ICONS[c.id]) P.push('Chapter ' + c.id + ': has no icon yet (ENGINE → const ICONS)');
    });
    var listed = new Set();
    CH.forEach(function (c) { c.terms.forEach(function (t) { listed.add(t); }); });
    DATA.terms.forEach(function (t) {
      if (!chIds.has(t.ch)) P.push('Glossary term ' + t.id + ': chapter "' + t.ch + '" does not exist');
      if (!listed.has(t.id)) P.push('Glossary term ' + t.id + ': not listed in any chapter’s terms: line');
    });
    DATA.questions.forEach(function (q, i) {
      if (!chIds.has(q.ch)) P.push('Drill question ' + (i + 1) + ': chapter "' + q.ch + '" does not exist');
      q.terms.forEach(function (t) { if (!termIds.has(t)) P.push('Drill question ' + (i + 1) + ': term "' + t + '" is not in the GLOSSARY'); });
    });
    FIGS.forEach(function (f) { if (!embedded.has(f.id)) P.push('Figure ' + f.id + ': never embedded with [[fig:' + f.id + ']]'); });
    var mapped = [];
    Object.keys(MAPS).forEach(function (d) { MAPS[d](function (id) { mapped.push(id); return ''; }, function () { return ''; }); });
    CH.forEach(function (c) {
      if (MAPS[c.domain] && mapped.indexOf(c.id) < 0) P.push('Chapter ' + c.id + ': not on the ' + c.domain + ' home map yet (ENGINE → const MAPS)');
    });
  } catch (e) {
    P.push('The page could not finish checking itself: ' + e.message);
  }
  window.PORTABLE_PROBLEMS = P;
  if (!P.length) return;
  var bar = document.createElement('div');
  bar.id = 'portableProblems';
  bar.setAttribute('role', 'alert');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;max-height:45vh;overflow:auto;' +
    'background:#7f1d1d;color:#fff;font:14px/1.5 system-ui,sans-serif;padding:12px 44px 12px 18px;box-shadow:0 6px 24px rgba(0,0,0,.35)';
  bar.innerHTML = '<b>' + P.length + ' thing' + (P.length > 1 ? 's' : '') + ' to fix in this file</b>' +
    '<ul style="margin:6px 0 0;padding-left:20px">' +
    P.map(function (p) { return '<li>' + p.replace(/[&<>]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]; }) + '</li>'; }).join('') +
    '</ul><button aria-label="Hide" style="position:absolute;top:8px;right:12px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer">×</button>';
  bar.querySelector('button').onclick = function () { bar.remove(); };
  document.body.appendChild(bar);
})();

</script>
</body>
