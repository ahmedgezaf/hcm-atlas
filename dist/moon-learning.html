---
id: org
num: 1
domain: hcm
track: functional
title: Enterprise & Organizational Structures
subtitle: The compliance skeleton — legal view versus operational view
hue: 214
minutes: 36
labs: org
terms: enterprise, legal-entity, legal-employer, payroll-statutory-unit-psu, tax-reporting-unit-tru, legislative-data-group-ldg, business-unit-bu, department, division, location, legal-jurisdiction, reference-data-set, organization-tree, employment-model, enterprise-structures-configurator
---

Every Oracle HCM implementation starts here, because nothing else can be configured until these objects exist. No worker can be hired, no element defined, no payroll run, no report filtered, until the structures in this chapter are in place. That order is not a preference — the application enforces it, and a project that rushes this stage pays for it for years.

The single hardest idea in this chapter is also the most important one: Oracle deliberately keeps two pictures of the same company. The **legal** picture answers the questions a government asks — who is registered, who employs, who pays, who reports. The **operational** picture answers the questions a manager asks — who runs what, who sits where, who may see whose data. In real companies the two rarely line up, and Oracle's structure exists precisely so they don't have to.

A consultant who holds those two pictures apart can run a requirements workshop. One who does not will keep asking a client "is that a company or a department?" and getting an answer that means neither.

[[fig:legal-vs-operational]]

## One enterprise, many legal entities

The **enterprise** is the single top node of the whole structure. There is exactly one per implementation, and it is not a legal concept. It never appears on a government form, never signs a contract, never files a return. It is a container for settings that apply to everybody regardless of which company employs them.

What actually lives on it is worth knowing, because these are decisions a consultant is asked about in the first week. The Manage Enterprise HCM Information task holds person-number generation, which has three methods: Manual, where the number is typed in; Automatic prior to submission, the delivered default, which issues the number as the record is created and therefore leaves a gap in the sequence when a transaction is cancelled; and Automatic upon final save, which issues it only once the transaction is approved, so the sequence has no gaps and no number is visible during entry. Both automatic methods draw from the same enterprise sequence, whose starting number is itself a setting. The same task holds worker-number settings, the default enterprise-wide **employment model**, position synchronization defaults, and global behaviours such as how a person's name is displayed.

The employment-model setting deserves a paragraph of its own. It decides whether a worker in this enterprise can hold one assignment or several at the same time, and whether contracts are tracked as separate objects. The two-tier single-assignment model — one work relationship, one assignment — covers the overwhelming majority of implementations and is what to assume unless a client says otherwise. Two-tier multiple-assignment is for organizations where one person genuinely does two jobs concurrently under the same employer: a nurse who also teaches, a plant worker who covers a second line. The setting is made at the enterprise but can be overridden on an individual legal employer, which is how a group runs a simple model everywhere and a multiple-assignment model in the one subsidiary that needs it. Changing it later, after workers exist, is painful. Asking the question early is free.

For a holding company with a factory and a trading arm, the enterprise is the group. The registered companies underneath are something else.

Those registered companies are **legal entities**: organizations recognized by law that can own assets, sign contracts, incur liabilities, employ people and be sued. In Egypt each one has its own commercial register number and tax card. In Saudi Arabia each has its own commercial registration. Oracle creates them through the Legal Entity Configurator, a set of tasks shared with Financials rather than owned by HCM, which is why the task list sits under Define Common Applications Configuration rather than a purely HR menu.

The first real job on any project is to work out how many legal entities there actually are. The commercial registers give the definitive answer. The org chart does not, the letterhead does not, and the client's own finance team frequently does not either — groups acquire companies and keep running them as one business long after the paperwork says otherwise. Ask for the register documents, count them, and build from that.

## What makes a legal entity real

A legal entity in Oracle is not just a name. Three other objects have to exist first, and a consultant who does not know them will be blocked on day one of configuration.

A **legal address** is the registered address of an organizational unit. Oracle requires legal addresses to exist before legal entities, because the entity is registered *somewhere* and the application will not let that be blank. These are maintained separately from the ordinary work **location** records used for employees, and the two are easy to confuse: one is where the company is registered, the other is where people physically work. They may be the same building. They are not the same object.

A **legal jurisdiction** is the combination of a geographic area and a law that applies within it — Egypt income tax, Saudi social insurance, a specific municipal levy. Oracle ships predefined jurisdictions for the legislations it supports and lets you create more. Every legal entity is registered against an *identifying jurisdiction*, and the registration number entered there is the one that appears on statutory output. In Egypt that is the tax registration; in Saudi Arabia it is the commercial registration number.

A **legal authority** is the government body that governs a jurisdiction — the Egyptian Tax Authority, NOSI, GOSI, the Ministry of Human Resources. Authorities are what registrations point at.

The practical sequence is therefore: addresses, then jurisdictions and authorities, then the legal entity, then its registrations, then its HCM-specific information. Skipping ahead produces a validation error rather than a broken configuration, which is a mercy — but it also means a consultant who does not know the order spends an afternoon guessing.

## Legal employer: the classification that lets you hire

A legal entity on its own employs nobody. To hire anyone into it, the entity must be classified as a **legal employer**. Oracle makes "employer" a classification you switch on rather than something every legal entity is assumed to be, because some entities exist only to hold property, own a licence or issue invoices. A property-holding company in a group has a commercial register and a tax card and has never had a payslip run against it.

Every worker belongs to exactly one legal employer at a time, through their work relationship (Chapter 3). This is the most consequential link in the employment data model. Change the legal employer and you have changed who legally employs the person — the old employment ends and a new one begins, which in Egypt means a settlement, a new social-insurance registration and a fresh service date unless service is explicitly bridged. Change their department and nothing legal has happened at all. The system treats these as completely different events, and it is right to.

> **Interview classic.** "What is the difference between a legal entity and a legal employer?" A legal employer is a classification applied to a legal entity that enables it to employ workers. Not every legal entity is a legal employer. Treating the two as synonyms is the most common miss in this whole area.

There is a second, quieter consequence. Because the legal employer can override enterprise-level settings — the employment model, and a set of localization defaults — it is also the level at which a group with genuinely different operating companies expresses that difference. A consultant who reaches for a new business unit when the answer is a new legal employer has usually misread the requirement.

## Who pays, and who reports

Two more classifications sit on the legal entity, and both are about payroll.

A **payroll statutory unit (PSU)** is a legal entity responsible for paying workers and remitting payroll tax and social insurance to the authorities. It is the level at which a person's payroll records are grouped for statutory calculation and reporting — in Egypt, the entity that files with NOSI and the Egyptian Tax Authority; in Saudi Arabia, the entity that files with GOSI. Oracle's guidance is to create at least one legal entity designated as a PSU for every legislative data group, which is another way of saying: for each country you pay people in, somebody has to be the filer.

Oracle's documentation puts the parent relationship plainly. When a legal entity is identified as a legal employer but *not* as a PSU, it must be given a parent PSU, and its legal reporting units are then created as tax reporting units under that parent rather than under itself. This is how a group centralises statutory filing: several employers, one filer.

[[fig:parent-psu]]

Beneath the PSU sits the **tax reporting unit (TRU)**, the reporting face of the PSU toward tax and social-insurance authorities. Oracle describes the TRU as the HCM form of a legal reporting unit, existing to group workers for tax and social-insurance reporting. When a legal entity is identified as a PSU, its legal reporting unit is carried across into HCM as a TRU automatically — which is why consultants often find a TRU they did not consciously create.

A single PSU may need to report under more than one registration number, and the TRU is the level that hangs on. This is not a theoretical case in the region. An Egyptian company with branches registered at different social-insurance offices files separately for each; a Saudi group with several commercial registrations is assessed for Saudization against each registered establishment rather than against the group as a whole. Each of those registration numbers is a candidate TRU. The design question is answered by collecting registration certificates, not by drawing boxes.

A worker is linked to a TRU through their statutory deductions calculation card (Chapter 5), not directly on the assignment. That indirection catches people out: a worker can be in the right legal employer, the right payroll and the right department, and still be missing from a statutory report because the card carries no TRU.

The practical design question on a multi-company client is therefore: which legal entities are PSUs, and which are legal employers reporting under a parent PSU? A group with three registered companies in Egypt may well have three PSUs. Do not assume one per country.

## The hard boundary: legislative data groups

A **legislative data group (LDG)** is a partition that isolates payroll and related legislative data. Each LDG belongs to exactly one legislation and carries one currency, and Oracle's instruction is to create one for each country the enterprise operates in, then associate each PSU with it.

All payroll configuration lives inside exactly one LDG: elements, balances, balance dimensions, fast formulas, element eligibility, payroll definitions, rate definitions, calculation value definitions, organization payment methods. Egyptian payroll rules cannot leak into Saudi payroll rules, because as far as the application is concerned the Egyptian objects do not exist in the Saudi world. An element defined in the Egypt LDG is not hidden from the Saudi LDG. It is absent from it. It must be built again.

This produces the most common support question in the first month of a multi-country project: "why can't I see my element?" The answer is almost always the LDG context selected at the top of the page.

The partition is a feature, not a limitation. It is what makes it safe for one instance to run Egyptian and Saudi payroll side by side, with completely different statutory logic, without any possibility of one country's rule firing against the other's population. The cost is duplication: two countries means two element libraries, two sets of formulas, two balance structures. Estimating a multi-country payroll project as though configuration is reused once is the classic way to lose money on it.

One more consequence, and it is the expensive one: an LDG cannot be meaningfully changed once payroll data exists inside it. The currency and legislation chosen at the start are effectively permanent. Getting the country list right before configuration starts is worth an extra workshop.

[[fig:ldg-wall]]

## The operational picture: business units

The **business unit (BU)** is an operational grouping used for processing transactions, sharing reference data such as jobs and grades, and controlling data access. It is not a legal registration and carries no statutory meaning whatever.

A shared-services centre may serve three legal entities. A single legal entity may contain several business units. Neither arrangement is unusual and neither is wrong. Clients decide based on how they actually run the business, and they conflate "how are we registered" with "how do we operate" constantly. Keeping the two apart is the consultant's job, and the useful question in a workshop is not "is this a business unit?" but "does this group of people need its own set of jobs, its own approvals, and its own view of the data?"

## Reference data sets, and why the BU matters more than it looks

The business unit's real power is reference data sharing, and this is the part of Chapter 1 most often skipped in training.

Oracle lets you group set-enabled configuration data — jobs, grades, locations, departments — into **reference data sets**, then assign those sets to business units. At transaction time the application filters what can be selected based on the business unit involved. Assign a job to the Common Set and every business unit can use it. Assign it to a specific set attached to one business unit, and only that unit sees it.

The consequence is that business unit design silently decides how much duplication the client will live with. A global group that wants one job catalogue everywhere puts jobs in the Common Set and is done. A group whose manufacturing arm and consulting arm share nothing puts them in separate sets and accepts that "Manager" now exists twice. Getting this wrong in either direction is painful: over-sharing produces a job list of four hundred entries where a hiring manager needs six, and under-sharing produces four hundred entries that are the same six repeated.

Positions are the exception worth remembering. They attach to a business unit directly rather than through a set. If a client asks why their position list does not behave like their job list, that is why.

[[fig:reference-data-sets]]

## Divisions, departments and locations

A **division** is the top of the management hierarchy — above the business unit, not below it — aligned to a product line or a geography and used for management reporting rather than transaction processing. One division can span several business units and several legal entities, which is how a group answers "how did the Middle East business perform" when the Middle East is not a legal entity and never will be. Oracle's own worked example builds divisions for the US, Europe and the Middle East across five countries and several legal entities, a shape that maps neatly onto how regional groups in Cairo and Riyadh describe themselves. Oracle treats division → business unit → department as recommended practice rather than something the application enforces, so it is worth confirming which way a client's existing structure actually runs before assuming it.

Below the business unit, the **department** is the box on the org chart that a worker actually sits in. It is the natural unit for headcount reporting and manager hierarchies, and it exists independently of whoever currently manages it — which is why a manager change never requires a new department. Departments can carry a cost centre, which is the hook payroll costing later uses to send an employee's cost to the right place in the general ledger.

A **location** is a physical work site with an address. It matters more than it looks, because statutory jurisdiction, working-time rules, allowance eligibility and public-holiday calendars are frequently driven by where the person physically works rather than by who employs them. In the Gulf especially, location often decides allowance eligibility — a site allowance for a remote plant, a housing differential between cities. Locations are set-enabled like jobs and grades, so the same sharing rules apply.

## Trees: how the structure becomes security and org charts

The objects above are a list until something arranges them into a shape. That something is an **organization tree**.

Oracle supports department trees, organization trees and position trees. A tree takes the flat set of departments (or organizations, or positions) and expresses the parent–child relationships between them, in versions that carry their own effective dates. Two things consume them. The org chart the business sees is drawn from a tree. More importantly, security profiles scope data by tree node: "this HR specialist can see everyone in the Manufacturing department and everything below it" is a statement about a tree, not about a list of departments.

This is the quiet link between Chapter 1 and Chapter 15. A structure that is correct but flat gives the security model nothing to grip. When a client asks for departmental HR access and the department tree has never been built, the request cannot be satisfied no matter how the roles are configured.

Trees are versioned and must be published before use, which is a recurring source of "I made the change and nothing happened".

## The order you build it in

Stated as a sequence, because the dependencies are real and the application enforces most of them:

- Legal addresses, jurisdictions and authorities.
- Legislative data groups, one per country.
- Legal entities, with their registrations.
- Legal entity HCM information: legal employer, PSU, parent PSU where the entity is an employer only.
- Tax reporting units, beyond those created automatically with the PSU.
- Divisions, then business units and the reference data sets assigned to them.
- Departments and locations.
- Trees, then published.

Oracle also ships the **Enterprise Structures Configurator**, an interview-style wizard that asks about the enterprise, its countries and its operating shape, then creates legal entities, classifies them as legal employers and PSUs, and creates a legislative data group for each country in one pass. It produces a technical summary of what it intends to do before committing, and the structure can be reviewed and rolled back before it is loaded. It is genuinely useful for a greenfield build and genuinely dangerous as a substitute for understanding, because it makes defensible default choices that a consultant then has to explain — or unpick — six months later.

## Three shapes you will actually meet

**The single-entity Egyptian company.** One commercial register, one tax card, one legal entity that is both legal employer and PSU, one Egypt LDG, one TRU, one business unit, departments under it. Most of this chapter collapses to a single line each. The work is in the department tree and the locations.

**The Egypt-plus-Saudi group.** Two LDGs, and everything payroll-shaped doubles. Legal entities in each country, each a legal employer; whether each is also a PSU depends on who files. Saudization is assessed per Saudi establishment, so the number of Saudi TRUs follows the number of registrations rather than the number of companies. Divisions give the group a "Middle East" view that no legal entity provides. This is the shape most regional implementations take.

**The shared-services group.** Several legal employers, one PSU doing the filing, one business unit running transactions for all of them. This is where the legal and operational pictures separate most visibly, and where a consultant who has only seen the first shape gets confused: the same person is employed by company A, paid by filer B, and processed by service centre C, and all three are correct at once.

## What is expensive to change later

Not every decision in this chapter carries the same weight, and knowing which ones bind is what separates a consultant from someone reading a setup guide.

[[fig:change-cost]]

Cheap to change: departments, divisions, locations, tree structure, most reference data. These move with ordinary effective-dated updates.

Expensive: the business unit design, because reference data sets attach to it and moving them means re-pointing every job, grade and location.

Effectively permanent: the legislative data group's legislation and currency, and the legal employer a worker sits in. The first cannot be altered once payroll data exists. The second changes only by ending one employment and starting another — a global transfer, which is the worked example Chapter 3 walks through, and which has real consequences for service dates, accrued leave and end-of-service liability.

[[lab:org]]

## Common mistakes

- Describing the enterprise as "the company". The company is a legal entity; the enterprise is the whole group.
- Assuming a legal entity can hire. It cannot until it is classified as a legal employer.
- Assuming one PSU per country. Map legal entities to PSUs deliberately, from the registration certificates.
- Counting legal entities from the org chart instead of the commercial registers.
- Expecting to reuse one element library across countries. Each LDG is its own world, and the duplication has to be estimated for.
- Calling a business unit "just another word for department". A BU is a processing and access construct; departments sit below it.
- Designing business units without deciding the reference data sets, then discovering the job list cannot be shared.
- Confusing a legal address with a work location. One is where the company is registered, the other is where people sit.
- Building the structure and never building the trees, then being unable to scope security to a department.
- Letting the Enterprise Structures Configurator make the design decisions, then having to defend them.

---
id: tables
num: 1
domain: analytics
track: functional
title: Thinking in Tables
subtitle: What one row means — the question that prevents most analysis errors
hue: 188
minutes: 7
labs: 
terms: grain, primary-key, foreign-key, surrogate-key, cardinality, tidy-data, long-and-wide, null-in-data
---

Before any tool, one habit. When a table lands in front of you, ask what a single row represents, and do not start work until you can say it in one sentence. Almost every wrong number in analytics traces back to someone who never asked — who summed a column without noticing the rows had been duplicated, or averaged an average, or joined two tables whose rows meant different things.

## The grain

The **grain** of a table is what one row is. "One row is one order." "One row is one order line." "One row is one product, per store, per day." Those are three different tables, and the same column called `revenue` means something different in each.

The grain is the first thing to establish and the last thing to lose track of. A table at order grain can be summed safely for total revenue. The same query joined to order *lines* is no longer at order grain — each order now appears once per line — and summing the order-level revenue column will overstate the total, silently, by the average number of lines per order weighted by order value — which is more than the plain average whenever the larger orders carry more lines, as they usually do. Nothing errors. The number is simply wrong, and it looks plausible, which is worse.

State the grain out loud in a handover or an interview and you sound like someone who has been burned. That is the point.

[[fig:grain]]

## Keys

A **primary key** is the column, or set of columns, that uniquely identifies a row. It is how you know the grain is what you think it is: if `order_id` is the primary key, there is exactly one row per order, and a count of rows equals a count of orders. When a supposed primary key turns out to have duplicates, the grain was never what the documentation claimed.

A **foreign key** is a column that points at another table's primary key — `customer_id` on the orders table pointing at the customers table. Foreign keys are how tables connect, and they are the reason joins work at all.

Keys come in two flavours. A **natural key** is something meaningful from the business: an email address, an ISBN, a national ID. A **surrogate key** is a meaningless number the system generates, usually auto-incrementing. Surrogate keys are preferred in analytics because natural keys change — people change email addresses, companies get reassigned codes — and a key that changes breaks every row that referenced it. The rule of thumb: join on surrogate keys, report on natural ones.

**Cardinality** describes how two tables relate: one-to-one, one-to-many, many-to-many. One customer has many orders, so customers-to-orders is one-to-many. Getting cardinality wrong is what produces duplicated rows, and it is the single most common cause of an inflated total.

## Tidy data

A table is **tidy** when each column is one variable, each row is one observation, and each cell is one value. It sounds obvious and it is routinely violated: a column called `Q1 Q2 Q3 Q4` holding four numbers, a cell containing "Cairo, Egypt", a column whose header is itself a data value.

The last of those is the most common, and it has a name. A table with columns `Jan`, `Feb`, `Mar` is in **wide** form — the month is encoded in the column header rather than stored as a value. The **long** form has one row per month with a `month` column and a `value` column. Wide is easier for a human to read across; long is what every tool wants to compute on. Pivot tables, Power BI and most charting libraries all expect long, and most of the reshaping work in a real project is turning wide data that came out of a spreadsheet into long data a tool can use.

## Missing values

**NULL** is not zero and not an empty string. It means "no value recorded", and it behaves differently from both. Zero is a measurement; NULL is the absence of one. An average over a column with NULLs ignores them, so the denominator is smaller than the row count — which is usually right for "average order value" and badly wrong for "average daily sales" when the missing days genuinely were zero.

The distinction matters most when deciding what to do with it. Filling NULLs with zero is a modelling decision, not a cleanup step, and it should be a deliberate one you can defend.

## Common mistakes

- Summing a column after a join that changed the grain.
- Treating a column labelled "ID" as unique without checking.
- Joining on a natural key that the business quietly reassigns.
- Reshaping wide to long by hand instead of with the tool's unpivot.
- Replacing NULLs with zero without deciding whether zero is true.

## Sources

- Hadley Wickham, "Tidy Data", *Journal of Statistical Software* 59(10). https://www.jstatsoft.org/article/view/v059i10
- Microsoft Learn, "Understand star schema and the importance for Power BI" — grain and dimension modelling. https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
- PostgreSQL documentation, "Constraints" — primary and foreign keys. https://www.postgresql.org/docs/current/ddl-constraints.html

<script type="text/markdown" class="src-chapter">
---
id: sql-shape
num: 2
domain: analytics
track: technical
title: The Shape of a SQL Query
subtitle: Why the clauses run in a different order from the one you write them in
hue: 212
minutes: 8
labs: query-order
terms: logical-processing-order, where-vs-having, group-by, aggregate-function, distinct, alias-scope, three-valued-logic, count-star-vs-column
---

SQL is written in one order and executed in another. Almost every beginner error — the alias that will not work in `WHERE`, the filter that belongs in `HAVING`, the `COUNT` that returns a number nobody expected — comes from not knowing the second order.

## The order the database actually uses

You write `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY`. The engine resolves it as:

```
FROM        which tables, and how they join
WHERE       throw away rows
GROUP BY    collapse the survivors into groups
HAVING      throw away groups
SELECT      work out the output columns
DISTINCT    remove duplicate output rows
ORDER BY    sort
LIMIT       cut
```

This is the *logical* processing order — the engine is free to optimise the physical execution however it likes, as long as the result matches what this order would produce. Two consequences follow immediately, and they explain most of the confusion.

[[lab:query-order]]

**An alias defined in `SELECT` cannot be used in `WHERE`.** `WHERE` runs first; at that point the alias does not exist yet. Write the expression out again in `WHERE`, or wrap the query. The same alias *does* usually work in `ORDER BY`, because `ORDER BY` runs last — one of the few places SQL bends its own rule for convenience, and a genuine dialect difference worth checking.

**`WHERE` filters rows, `HAVING` filters groups.** "Only orders over 100" is a row condition and belongs in `WHERE`. "Only customers whose total is over 1,000" is a condition on an aggregate and belongs in `HAVING`, because the total does not exist until `GROUP BY` has run. Putting an aggregate in `WHERE` is an error; putting a plain row filter in `HAVING` usually works but is slower, because you have grouped rows you were always going to discard.

## Grouping

`GROUP BY` collapses rows into one row per distinct combination of the grouping columns. Every column in `SELECT` must then either appear in `GROUP BY` or be wrapped in an **aggregate function** — `SUM`, `COUNT`, `AVG`, `MIN`, `MAX`. The reason is arithmetic, not pedantry: if you have collapsed fifty rows into one, the engine has no way to choose which of the fifty values of `customer_name` to show unless you tell it.

Aggregates ignore NULLs. `AVG(discount)` over ten rows where four are NULL divides by six, not ten. That is often what you want and occasionally a serious bug, and the only way to know is to have decided what the NULLs mean.

## The two counts

`COUNT(*)` counts rows. `COUNT(column)` counts rows where that column is not NULL. `COUNT(DISTINCT column)` counts distinct non-NULL values. Three different questions, and interviewers ask the difference because it is a fast test of whether someone has thought about NULLs at all.

## Three-valued logic

SQL does not have true and false. It has true, false and **unknown**, and NULL is what produces unknown. `NULL = NULL` is not true — it is unknown, because two unrecorded values cannot be shown to be equal. That is why you write `IS NULL`, never `= NULL`.

The trap this creates is `NOT IN` against a list containing a NULL. `x NOT IN (1, 2, NULL)` is never *true*: for an `x` of 1 or 2 it is false, and for every other `x` it is unknown, because `x <> NULL` cannot be shown to hold. Either way `WHERE` keeps nothing and the query returns no rows at all. Nothing errors; the result set is simply empty, and people rewrite the query three times before spotting it. `NOT EXISTS` does not have this behaviour and is the safer habit.

## Writing it so someone can read it

Beyond correctness: put each clause on its own line, uppercase the keywords or lowercase them but do not mix, and alias tables with something meaningful rather than `a` and `b`. A query is read far more often than it is written, usually by you, months later, trying to work out why a number moved.

## Common mistakes

- Using a `SELECT` alias in `WHERE` and being told the column does not exist.
- Putting an aggregate condition in `WHERE` instead of `HAVING`.
- Assuming `COUNT(column)` and `COUNT(*)` are the same.
- `NOT IN` against a subquery that can return NULL.
- Comparing to NULL with `=` instead of `IS NULL`.

## Sources

- Microsoft Learn, "SELECT (Transact-SQL)" — logical processing order of the SELECT statement. https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
- PostgreSQL documentation, "Queries" and "Functions and Operators: Comparison". https://www.postgresql.org/docs/current/queries.html
- PostgreSQL documentation, "Aggregate Functions" — NULL handling in aggregates. https://www.postgresql.org/docs/current/functions-aggregate.html
</script>

---
id: workforce
num: 2
domain: hcm
track: functional
title: Workforce Structures
subtitle: Jobs, positions, grades — what work exists and at what level
hue: 200
minutes: 12
labs: jobpos
terms: job, position, grade, grade-step, job-family, position-synchronization, grade-rate, job-profile
---

If Chapter 1 is the compliance skeleton, this is the work skeleton: how an organization defines what work exists, at what level, and in which seat. One distinction in this chapter — job versus position — is the most frequently tested concept in Oracle HCM interviews, and the fastest way to look unprepared in front of a trainer is to treat the two as synonyms.

## Job: what the work is

A **job** is a generic definition of a role, independent of the organization chart. It carries attributes such as a grade range, required qualifications and a job family. Most roles repeat across an organization, so defining "Accountant" once and reusing it everywhere avoids duplicating the same definition dozens of times. The Finance department in Cairo, the plant in 10th of Ramadan City and the Alexandria branch can all use the same job. In a job-based (non-position) organization, the assignment carries job, department and location as separate fields; this is the common pattern in Egyptian private companies.

Jobs are set-enabled (Chapter 1), which means the jobs a transaction can select depend on the reference data sets assigned to its business unit. A client who wants one job catalogue across the group puts jobs in the Common Set; a client whose divisions genuinely use different catalogues accepts duplicate maintenance in exchange for separation. That choice is made once and lived with.

## Position: a specific seat

A **position** is a specific, individual seat: a job tied to a particular department and location, which exists whether or not anyone currently fills it. "Accountant #3, Finance Department, Alexandria Plant" carries its own headcount budget, reporting line and FTE. When the incumbent leaves, the position remains and becomes vacant — and a vacancy is a real, reportable thing.

Organizations that budget headcount need to track seats independently of people. Position management is therefore standard in government, oil and gas, banking and most Gulf entities. It brings vacancy reporting and stricter headcount control, at the cost of more setup and maintenance. A consultant aiming at the Gulf market should learn position management properly rather than treating it as an optional extra.

[[lab:jobpos]]

## Choosing between them, out loud

The decision is not about tidiness, and a consultant who can run it as four questions will sound like someone who has made it before.

Does the client budget and approve headcount by seat? Positions carry that; jobs do not. Do they need to see that a seat exists while it is empty — for recruitment, for a vacancy report, for a finance review? Only positions make a vacancy visible. Do approvals or succession depend on the seat rather than the person (Chapters 19 and 20)? A position hierarchy and a succession plan are both plans for seats. And is there an owner for the maintenance, because every reorganization becomes position work?

Three yeses and an owner mean positions. One yes and no owner means jobs, and the client is better served by a clear job catalogue than by a position structure that decays within a year.

## Position synchronization

Where positions are used, **position synchronization** decides how much of the position flows down to the assignment: job, department, location, grade, manager, FTE. With it on, the position is the master — changing the position updates every assignment attached to it — and the configuration question is which attributes are synchronized and whether an individual assignment may override them.

This is where position-based clients get into trouble. Synchronization turned on with no override produces a reorganization that rewrites a thousand assignments correctly and instantly; the same setting makes a one-off exception impossible without changing the position. Turned off, the position becomes decorative and the two structures drift apart until nobody trusts either. The question to settle in design is which attributes are the position's and which belong to the person in it.

## Grades, steps and rates

A **grade** is a level in the hierarchy, used to control compensation ranges and eligibility for benefits or allowances — "G1" through "G12", or "Junior / Senior / Lead / Principal". They drive eligibility constantly: "only G7 and above get the car allowance" is a sentence a consultant hears and then configures. Grade is not the same as salary. Grade is a level; money attaches to it through **grade rates** and the salary basis (Chapter 5), and the two are linked but distinct objects.

A **grade step** is an increment within a single grade, used where progression happens in defined steps rather than across a continuous range. Steps are grouped into grade ladders. Grade G5 might have steps 1 through 8, each with a defined rate; an annual increment moves a person from step 3 to step 4 without changing their grade. Government and unionized pay scales work this way, which makes steps highly relevant in the Gulf public sector and in Egyptian government-linked entities. If a client has a step-based scale and the design uses a plain grade rate range, the design is wrong.

Rates carry a currency and a date, and both matter in the region. A Gulf group paying in several currencies needs rates per legislative data group rather than one global ladder, and a client whose scale is revised annually needs dated rates rather than overwritten ones — otherwise last year's salary review can no longer be explained.

## Job families and profiles

A **job family** groups related jobs — all finance jobs, all engineering jobs — for career-path design, reporting and shared eligibility rules. A **job profile** is the content side of a job: the competencies, qualifications and responsibilities attached to it, which Talent and Recruiting read (Chapter 20). Both are recognition-level for a Core HR build and become central the moment a client adds those modules, which is a good reason to create them deliberately rather than leaving the catalogue flat.

One regional note makes them more than theory. Nationalization reporting in Saudi Arabia and the UAE counts nationals in *skilled* roles, and what counts as skilled is read from the job's classification. A job catalogue built without that in mind produces a compliance report that has to be rebuilt later, person by person.

## Common mistakes

- Defining a job as a specific seat. That is a position.
- Choosing positions for tidiness, with nobody owning the maintenance.
- Turning position synchronization on without deciding what an assignment may override.
- Saying "grade equals salary". Grade is a level; rate ranges and the salary basis carry the money.
- Designing a continuous rate range for a client whose scale is actually step-based.
- Overwriting grade rates each year, so last year's review cannot be explained.
- Leaving job classification vague where nationalization reporting depends on it.

## Sources

- Oracle, *Implementing Global Human Resources* — the Jobs and Positions and the Grades, Grade Rates and Grade Ladders chapters. https://docs.oracle.com/en/cloud/saas/human-resources/faigh/index.html
- Oracle, *Implementing Global Human Resources* — "Employment Model", for positions and assignments in the employment hierarchy. https://docs.oracle.com/en/cloud/saas/human-resources/faigh/employment-model.html
- Oracle, *Using Common Features for HCM* — reference data sets and how set-enabled objects are shared. https://docs.oracle.com/en/cloud/saas/human-resources/faucf/index.html
</script>

---
id: model
num: 3
domain: hcm
track: functional
title: The Employment Data Model
subtitle: Person → work relationship → assignment. There is no employee table.
hue: 246
minutes: 32
labs: model
terms: person, work-relationship, work-terms, assignment, payroll-relationship, concurrent-employment, global-transfer, worker-types, seniority-date, assignment-status, action-and-action-reason, primary-assignment, last-standard-process-date
---

This is the single most important structure in the product. Payroll, absence, security and reporting all read from it. If a new consultant learns only one chapter cold, it should be this one.

The core insight: there is no employee table. A human being, that human's relationship to an employer, and the details of the job they do are three separate objects, each dated independently. Knowing which attribute lives on which object is the actual skill, and it is the skill that shows in an interview within about ninety seconds. Someone who says "we'll update the employee record" has not learned the model. Someone who asks "is that a change to the assignment or to the work relationship?" has.

The reason for the split is history. HR systems have to answer questions about the past — what grade was this person on in March, who employed them in 2019, how many people were in this department a year ago — and they have to answer them without losing the fact that it is the same human throughout. Splitting the human from the employment from the job is what makes all three answerable at once.

[[fig:employment-stack]]

## Person: the human, held once

The **person** record represents a human being and is held once, globally, across the entire enterprise. It carries what is true of the human regardless of any employer: name, date of birth, national identifier, personal contact details, nationality, and personal documents such as a passport or an Iqama.

A person may work for one company, leave, and return years later, or work for two group companies at once. Their date of birth does not change with any of that. Storing it once avoids contradictions, and it is why a rehire six years later still shows the same person number.

That guarantee is only as good as the hire process. Before creating a person, the hire flow looks for someone already in the system with a matching name, date of birth or national identifier. Skipping that check — or bulk-loading people without a reliable key — is how duplicate person records appear, and duplicates are unpleasant to clean up once payroll and absence data hang off both of them. In Egypt and the Gulf the national identifier is the natural key and should be treated as one: the Egyptian national ID, the Saudi national ID or Iqama number. Migration plans that key on employee number instead will merge the wrong people or split the right one.

Person numbers themselves follow the enterprise setting described in Chapter 1 — Manual, Automatic prior to submission, or Automatic upon final save. The number identifies the human, not the employment, which is why it does not change on rehire or transfer.

## Which attribute lives where

Before the objects are described one by one, it is worth seeing them as a lookup table, because this is the question that comes up twenty times a day on a live project.

[[fig:attribute-home]]

The test to apply when a client asks for a new field: does this change when the person changes employer? Then it belongs on the work relationship. Does it change when they change job? Assignment. Is it true of the human regardless of who employs them? Person. Does payroll need to accumulate it across the year? Payroll relationship. Getting this wrong is the single most common data-migration defect, and it usually surfaces months later as a history that cannot be explained.

## Work relationship: the legal link

A **work relationship** is the link between a person and one legal employer. Oracle describes it as the legal connection between a person and a legal employer, carrying the worker type and the start date of that employment.

Terminating employment end-dates the work relationship. It does not delete the person, and it does not delete the history. A person can hold more than one work relationship at once — a contingent-worker relationship with one group company and an employee relationship with another — and can hold several over time as they leave and return.

The dates on the work relationship are where service is decided, and service is money. Oracle distinguishes several: the date the person first joined the enterprise, the date they joined this legal employer, and one or more **seniority dates** which can be configured to accumulate service across breaks or across employers within the group. This matters enormously in the region, because end-of-service gratuity in the Gulf and the Egyptian end-of-service settlement are both calculated on continuous service. A rehire that starts a fresh service clock when the client's policy bridges the break will under-pay every affected leaver, and nobody notices until somebody resigns.

Ask, in the requirements workshop, exactly what the client means by "years of service" — and then ask which of those dates it maps to. The answer is rarely the one written on the offer letter.

## Worker types, and what each is for

The **worker type** recorded on the work relationship is one of four: employee, contingent worker, pending worker or non-worker. They are not cosmetic. Worker type maps to a payroll relationship type, which decides whether the person is included in payroll runs at all.

An **employee** is the ordinary case: employed by the legal employer, on the payroll.

A **contingent worker** is engaged but not employed — an agency worker, a contractor on a supplier's books. They occupy a position, appear on the org chart and consume security and absence configuration, but a contingent worker may be excluded from payroll entirely. Clients ask for them constantly and then describe them as employees, so the question worth asking is "who pays them?"

A **pending worker** is someone hired but not yet started. The record exists so onboarding — equipment, accounts, documents, the joining checklist — can begin before day one, and it converts to an employee on the actual start date. It is a genuinely useful feature that most implementations under-use.

A **non-worker** is a person the enterprise needs to hold without an employment: a retiree drawing a pension, a board member, a beneficiary, a volunteer. They exist so that people who must appear in the system are not forced into an employee shape that would put them in a payroll run.

## Assignment: the job details

The **assignment** carries the actual job details: business unit, department, job, position, grade, location, manager, working hours, assignment category, assignment status, and the standing data payroll reads.

Job details change often — promotions, transfers, hours changes, a new manager — while the person and the employer stay the same. Isolating them in their own date-effective object keeps the history clean. Almost every lifecycle transaction is a dated change against the assignment, which is why a consultant spends most of their configuration life here, and why Chapter 4 on effective dating matters as much as it does.

Three attributes on the assignment deserve naming, because they cause more support tickets than the rest combined.

The **assignment status** controls whether the assignment is active, suspended or inactive, and — separately — whether it is eligible for payroll processing. The distinction is the part that catches people: a status can be active for HR purposes while excluding the person from payroll, which is exactly what is wanted for unpaid leave and exactly what is not wanted when somebody has set it by accident. "The employee is active but did not get paid" is almost always this.

The **primary assignment** flag matters when a person holds more than one. Reports, the org chart and many downstream integrations read the primary assignment, so a person with two jobs whose primary flag sits on the minor one will be reported under the wrong department indefinitely.

Every change to an assignment is recorded with an **action and action reason** — Hire, Promotion, Transfer, Termination as the action, and a client-defined reason underneath it. The action drives which flow runs and which fields appear; the reason is what makes analytics possible later. "Why did attrition rise in Q3" can only be answered if terminations carry reasons, and reasons only exist if someone insisted on configuring them during implementation. That someone is the consultant.

## The employment model option, and the tier that is no longer a choice

The **employment model** is set on the enterprise and can be overridden per legal employer, and it has four values: single assignment, single assignment with contract, multiple assignments, and multiple contracts with single assignment. All four are two-tier — the work relationship holds assignments directly. Where a legislation needs contract detail inside the employment record, Oracle's answer is the contract variants rather than an extra layer.

Older material, and a good deal of interview folklore, describes a **three-tier** model in which a layer of **employment terms** — also called work terms — sits between the relationship and the assignment to group contractual attributes across several assignments. It is worth recognizing the term, because it is still said out loud and it still appears in training decks. It is not on the configuration screen.

What does survive is the object. A work terms record exists under every work relationship whether or not anyone calls the model three-tier, and HCM Data Loader expects it as a component of the Worker file — `PeriodOfServiceId` points a work terms record at its work relationship, and the assignment points at the work terms record (Chapter 11). A consultant meets the layer on the first data migration regardless of what the enterprise option says, which is the real reason to know the word.

## Payroll relationship: where payroll actually runs

Parallel to this hierarchy sits the **payroll relationship**, which links the person to a payroll statutory unit. It is the highest level of the payroll employment model and groups a person's assignments for statutory calculation and reporting. Oracle creates it automatically on hire, which is why most consultants meet it for the first time when something goes wrong.

The reason it exists is statutory arithmetic. Tax and social insurance must be calculated on a person's total earnings within a statutory unit, not per assignment. If someone holds two assignments, their social insurance cannot be calculated twice in isolation — that would apply the ceiling twice and under-deduct. Grouping the assignments under one payroll relationship is what makes the ceiling, the bracket and the annual accumulation apply once to the whole person.

Three consequences follow, and all three appear in interviews.

Payroll processing always occurs at the payroll relationship level. Elements are entered against assignments, but the run is against the relationship.

Balances aggregate at the payroll relationship, and — critically — **balances do not span payroll relationships**. Year-to-date tax, year-to-date insurable earnings, accumulated employer contributions: all of it belongs to one relationship and stops at its edge.

Termination dates live here too. When employment ends, the payroll relationship carries a **last standard process date**, after which no ordinary payroll run will pick the person up, and a final close date, after which nothing at all will. Setting the final close date too early is how a legitimate late payment — a final bonus, a corrected settlement — becomes impossible to pay without reopening the record. Leave room.

Assignments grouped in one payroll relationship must share the same payroll statutory unit and person type. That is why a person who is an employee of one company and a contingent worker at another has two payroll relationships, not one.

## Concurrent employment

**Concurrent employment** means one person holding several simultaneous assignments under one work relationship, or several work relationships across different legal employers. A lecturer who also runs a research lab. A doctor employed by a hospital who also works clinic hours. A group finance manager who formally holds a role in two subsidiaries.

The two cases behave differently and the difference is the whole point. Two assignments under one work relationship means one employer, one payroll relationship, one set of balances and one statutory ceiling applied across both jobs.

Two work relationships means two employers — but not, automatically, two payroll relationships. The relationship is keyed on the payroll statutory unit and the person type, exactly as stated above, so two employers that are separate PSUs produce two relationships calculating independently, while two employers sharing one parent PSU produce a single relationship, with one set of balances and one ceiling across both jobs. The shared-services shape in Chapter 1, where several legal employers name one parent PSU, is precisely that second case. Which of the two happens is also legislation-dependent: under the payroll relationship rules Oracle ships, Lifetime Record and Last Record group a new assignment under an existing relationship for the same PSU and person type, while New Record creates one per assignment regardless.

When a client describes somebody who "works for both companies", the useful follow-up is: which PSU files for this person, and is it the same one for both companies? The answer decides the shape, and it decides whether a statutory ceiling applies once or twice.

## The canonical worked example: a global transfer

A **global transfer** moves a worker from one legal employer to another, typically across countries. Legally that is a new employment, not an edit to an existing one — different country, different legislation, different statutory registration.

Oracle handles this through a single Local and Global Transfer flow that covers both a move within the same legal employer and a move to a different one, with options for what happens to the existing assignments and whether the move is permanent or temporary. The underlying record changes are the part to be able to narrate.

The source work relationship is terminated and a new one is created under the destination legal employer. A new payroll relationship is created under the destination payroll statutory unit, which sits in a different legislative data group. The person record is unchanged throughout. Because balances never span payroll relationships, year-to-date figures start fresh in the new country — which is correct, since the new country's authorities have no interest in earnings taxed elsewhere, but which surprises clients who expected a single annual figure.

[[fig:global-transfer-count]]

Be able to narrate this end to end and give the counts at the end: one person record, two work relationships (one ended), two payroll relationships (one ended). Then add the consequence nobody asks for but everybody wants: accrued leave and end-of-service liability do not move by themselves, and whether service bridges across the transfer is a policy decision expressed through seniority dates.

## Rehire: the case everyone gets wrong

A rehire is a global transfer's quieter cousin and it trips up more projects.

The person record is reused — same human, same person number, same date of birth — and a new work relationship is created for the new employment. What happens to the payroll relationship is where the easy answer is wrong. It depends on the payroll relationship rule the legislation uses: under the rule Oracle ships for Saudi Arabia, the application compares the new assignment's start date with the last standard earnings date of the existing payroll relationship and reuses that relationship when the start date falls before it, which is what makes back-to-back fixed-term contracts continuous. Only where a new relationship is created do balances start again. Before promising a client either behaviour, find out which rule their legislative data group runs.

What is controversial is service. Whether the earlier employment counts toward gratuity, leave entitlement bands and notice periods is a policy question the client must answer, and the answer is expressed through seniority dates rather than by faking the hire date. Consultants who solve it by back-dating the new work relationship to the original hire date create a record that says the person was employed during a period when they were not, which corrupts headcount history, absence accruals and any report that counts service in a given year.

The correct instinct: never lie to the dates. Configure the seniority date that means what the client means.

## What this model looks like to a data migration

The model is abstract until somebody has to load ten thousand people into it, at which point it becomes very concrete.

Oracle's bulk loader (Chapter 11) treats the person, the work relationship and the assignment as components of a single Worker object rather than as three separate loads. That is deliberate and it is a mercy: the three have to be created in one transaction, with consistent dates, or the result is a person with no employment or an assignment pointing at a work relationship that does not exist. It also means the file is wide, the ordering inside it matters, and a single malformed row can fail a block of records rather than one.

Three rules follow, and they are worth knowing before the first load rather than after it.

Dates must agree across the components. An assignment cannot start before its work relationship does, and a work relationship cannot start before the person exists. Source systems routinely hold a hire date on the employee record and a different one on the contract, and somebody has to decide which is true.

The keys must be stable. Loads reference objects by a source key or by a user key, and the person's national identifier is usually the only value in a legacy HR system that is both unique and unchanged across the whole history. Employee numbers get reissued; names get re-spelled.

History is loaded as history, not as today. If the client wants the last five years of job changes, those are dated assignment records, not a single current row — and loading them in date order is what produces a readable history afterwards rather than a stack of corrections.

## Reading the model on screen

Knowing where each object surfaces in the interface saves an embarrassing pause in a demo.

The person attributes sit under the personal details area: name, national identifier, date of birth, contact details, documents. The work relationship and the assignment share the employment information page, with the work relationship's dates and worker type at the top and the assignment's job, grade, department, manager and status beneath — which is a UI convenience, not evidence that they are the same object. The payroll relationship has its own page, reached from the payroll area rather than from the person's employment record, and that separation on screen is a useful reminder of the separation underneath.

When something cannot be found, the question to ask is not "where is this field" but "which object owns it", and then go to that object's page.

[[lab:model]]

## Common mistakes

- Believing there is an employee table. There is a person, a work relationship and an assignment.
- Confusing termination of a work relationship with deletion of the person. The person survives, and should.
- Keying a data migration on employee number rather than national identifier, and producing duplicate people.
- Believing the work terms layer does not exist because the enterprise is two-tier. It is created for every assignment, and HCM Data Loader expects the component in the file.
- Thinking payroll runs against the assignment. It runs against the payroll relationship.
- Expecting balances to carry across a global transfer. They do not — a new legislative data group means a new payroll relationship.
- Assuming a rehire always restarts balances, or always continues them. It depends on the legislation's payroll relationship rule and on the dates.
- Treating "years of service" as one number. Ask which date the client means before configuring anything that depends on it.
- Back-dating a rehire's work relationship to the original hire date instead of using a seniority date.
- Leaving the primary assignment flag on the minor of two concurrent jobs, then wondering why reporting is wrong.
- Setting the final close date on termination too early, so a legitimate late payment cannot be made.
- Configuring actions without action reasons, then being unable to answer any question about why people left.

## Sources

- Oracle, *Implementing Global Human Resources* — "Employment Model", for the four employment model options. https://docs.oracle.com/en/cloud/saas/human-resources/faigh/employment-model.html

id: sql-joins
num: 3
domain: analytics
track: technical
title: Joins, and the Rows You Did Not Expect
subtitle: Where totals quietly double — and why the join type is only half the story
hue: 236
minutes: 8
labs: joins
terms: inner-join, left-join, full-outer-join, cross-join, fan-out, anti-join, join-key-mismatch
---

A join answers one question: for each row on the left, which rows on the right match? Everything else — the join type, the direction, the surprises — follows from what you decide to do when the answer is *none*, or *more than one*.

## The four you will actually use

An **inner join** keeps only rows that matched on both sides. A **left join** keeps every row from the left table and fills the right-hand columns with NULL where nothing matched. A **full outer join** keeps unmatched rows from both sides. A **cross join** matches every row with every row, producing the product of the two row counts — rarely what anyone wants by accident, occasionally exactly what you want for building a date scaffold.

Right joins exist and are almost never written deliberately; a left join with the tables swapped reads better and everyone understands it immediately.

[[lab:joins]]

## The mistake that turns a left join into an inner join

This one catches everybody once.

```sql
SELECT c.name, o.total
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
WHERE o.status = 'shipped'
```

That is not a left join any more. Customers with no orders get NULL for `o.status`, `NULL = 'shipped'` is unknown, and `WHERE` discards them — so the query returns exactly what an inner join would. The fix is to move the condition into the `ON` clause, where it filters what counts as a match rather than filtering the result:

```sql
LEFT JOIN orders o
  ON o.customer_id = c.id AND o.status = 'shipped'
```

The rule generalises: a condition on the *right* table of a left join belongs in `ON`; a condition on the left table belongs in `WHERE`. Filtering `IS NULL` on a right-hand column in `WHERE` is the deliberate exception — that is an **anti-join**, the idiom for "customers who have never ordered".

## Fan-out

Join type is the half everyone learns. The half that breaks reports is **fan-out**: when one left row matches several right rows, the left row is repeated once per match. That is correct join behaviour. It is also how a total doubles.

Join orders to order lines and every order-level value — the order total, the shipping fee, the customer's name — now appears once per line. `SUM(o.total)` is no longer the sum of order totals; it is the sum of order totals weighted by line count. The result looks like a plausible revenue figure and is inflated by a factor nobody can see.

The defences, in order of preference: aggregate the many side to the grain you want *before* joining, usually in a subquery or CTE; or, if you must aggregate after the join, collapse back to one row per key first — a subquery that selects the key and one value per key, then sum that — rather than reaching for `SUM(DISTINCT …)`, which deduplicates by *value* and will quietly merge two different orders that happen to share a total; or count rows before and after the join and notice when the number changes. That last one is a habit worth building — if a join changed your row count and you did not expect it to, stop.

## When keys do not match

Joins silently return fewer rows than expected for dull reasons. Trailing whitespace on a text key. One side stored as text and the other as integer, so the implicit cast fails or, worse, succeeds inconsistently. Case sensitivity, which differs by database and by collation. Leading zeros stripped by a spreadsheet somewhere upstream.

When a join returns fewer rows than it should, check the keys before you check the logic. Count distinct values on both sides, and look at a handful that failed to match. It is nearly always the data, not the SQL.

## Common mistakes

- Filtering the right table in `WHERE` and collapsing a left join to an inner one.
- Summing a column after a one-to-many join.
- Not noticing the row count changed.
- Joining on a key with different types or invisible whitespace on the two sides.
- Reaching for `SELECT DISTINCT` to hide duplication rather than fixing the grain.

## Sources

- PostgreSQL documentation, "Table Expressions" — join types and the meaning of `ON` versus `WHERE`. https://www.postgresql.org/docs/current/queries-table-expressions.html
- Microsoft Learn, "FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)". https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
- Microsoft Learn, "Understand star schema and the importance for Power BI" — why grain and cardinality decide whether a total is right. https://learn.microsoft.com/en-us/power-bi/guidance/star-schema
</script>

---
id: dating
num: 4
domain: hcm
track: functional
title: Effective Dating
subtitle: Nothing is deleted. Everything has the date it became true.
hue: 278
minutes: 12
labs: dating
terms: effective-date, update-vs-correction, retroactive-change-retro, end-dating, future-dated-change, retroactive-event-group, proration
---

Oracle HCM is a date-effective system. Almost nothing is ever deleted; changes are recorded with the date on which they become true in the real world. People coming from transactional systems trip over this more than anything else, and it has direct payroll consequences — which is why this short chapter sits underneath every record in the atlas.

## The effective date is not the entry date

The **effective date** is the date on which a change becomes true — not the date it was typed into the system. HR reality and data entry rarely happen on the same day: a promotion effective 1 January may be entered on 15 January, and the system must know the person was at the new grade from the first. Every date-effective record has a start date and an end date. Setting the effective date correctly is the difference between a correct payslip and a retroactive correction, and most "the system calculated it wrong" tickets turn out to be effective-date errors. The system tracks the entry date separately, for audit.

Screens carry the same idea. A person search run as of a past date returns the organization as it was then, not as it is now — which is how a consultant answers "who reported to her in March" without a report. It is also the first thing to check when a user insists a record is missing: they may be looking at it on the wrong day.

## Which objects are dated, and which are not

Not everything in the system keeps history, and knowing the difference saves an afternoon. The person, the work relationship, work terms, the assignment, salary and element entries are all date-effective: each change writes a new row with its own window. Reference data such as jobs, grades and locations is date-effective too, which is why a grade can be valid from one date and not before.

Transaction records are not. A payroll run, a flow, an approval — these happen once, at a point in time, and are not re-dated afterwards. When a client asks to "change the date" of something, the first question is which of the two kinds it is, because for the first the answer is an update and for the second it is a reversal and a re-run.

## Update versus correction

An **update** creates a new dated record and preserves history. A **correction** overwrites the existing record as if the previous value was never true. Some changes are real events — a promotion — and some are data-entry mistakes — a typo in a grade. The system needs to tell real history from erroneous history.

Promoting someone on 1 July is an update: both the old and the new grade belong in history because both were true. Fixing a misspelled surname is a correction: the old spelling was never true and should not be preserved. Using a correction to record a real-world change destroys legitimate history and can trigger incorrect retroactive payroll; it is the one habit that corrupts an audit trail silently.

The reverse mistake costs as much. Recording a typo as an update leaves the system believing an incorrect value was genuinely true for a period, which means anything reading history — a service calculation, an accrual, a retro run — will act on it. Correct the wrong record rather than stacking a new one on top of it.

[[lab:dating]]

## Future-dated changes

A change may also be dated forward. A **future-dated change** — next month's promotion, a transfer agreed in advance, a termination with notice — is entered now and becomes effective later, and until that date the current record is what every process sees.

Two consequences are worth holding. The screen shows the record as of the date being viewed, so a user who enters a future promotion and then looks at today's record sees the old grade and assumes the change was lost. And a future-dated termination is visible to HR while payroll still pays the person, correctly, until the date arrives — which is the intended behaviour and a reliable source of worried emails. The useful habit is to ask, every time, "as of what date are we looking at this?"

## Retroactive changes

A **retroactive change** ("retro") is a change entered with an effective date in the past, after payroll has already been processed for that period. Backdated promotions and late salary approvals are normal. A raise effective 1 May and approved in July means the May and June payrolls already ran at the old rate; the July run must calculate the arrears for both months and pay them. Oracle handles this through retroactive events and the *Recalculate Payroll for Retroactive Changes* process, which runs before the main calculation and creates retro entries the payroll run then picks up.

What makes retro predictable rather than mysterious is the **retroactive event group**: the list of changes the system is watching for. A change to something in the group raises an event and will be reprocessed; a change to something outside it will not, however obviously retrospective it looks to a human. When a client reports that "retro did not pick it up", the event group is where to look before anything else, and the *Retroactive Notification* report is what shows which events are waiting.

Two further things matter for a consultant explaining retro to a client. First, retro affects balances, not just the current payslip: it re-states social insurance and tax for the prior periods too. Second, retro is not always money in — a change that reduces pay creates a recovery, and a client who has never considered negative retro will want to decide its policy before the first one appears.

In Egypt this is not an edge case. Insurable-wage limits move every January, minimum-wage decrees and the commencement of Labour Law 14/2025 both landed mid-cycle, and statutory changes of that kind are routinely announced after the period they apply to. Retro is how the payroll absorbs them, which makes the event group a piece of statutory configuration rather than a technical nicety.

## Proration

Retro answers what happens when a change arrives late. **Proration** answers what happens when a change takes effect mid-period: a raise effective on the 16th means the period has to be paid partly at each rate. Oracle prorates using a proration event group and a proration formula on the element, and the design question — calendar days, working days, or a fixed divisor — is a client decision with a visible effect on money.

The two are often confused in a workshop. The test is when the change was entered relative to the payroll run: before it, and the period is prorated; after it, and the period is retro.

## End-dating instead of deleting

**End-dating** closes a record as of a date rather than deleting it, so that history is preserved. Terminating employment end-dates the work relationship; removing an allowance end-dates the element entry. When a client asks "can you just delete this record?", the correct consulting answer is almost always "we end-date it, and here is why that is better for you." In a date-effective SaaS system the tools are end-date, correct, or reverse. Deletion is rare, restricted, and usually the wrong instinct.

The same principle governs migration. History loaded as a single current row is history destroyed; loading dated records in date order is what produces a readable past (Chapter 11), and it is the part of a data migration that cannot be fixed afterwards without doing it again.

## Common mistakes

- "The effective date is when I entered it." The system tracks the two dates separately for a reason.
- Using correction for a real event, wiping the history — or an update for a typo, enshrining it.
- Looking at today's record and concluding a future-dated change was lost.
- Blaming retro when the change was never in the retroactive event group.
- Assuming retro only adds money. It can recover money too.
- Confusing proration with retro. One is a mid-period change, the other is a late one.
- Reaching for delete. End-date instead.

## Sources

- Oracle, *Implementing Global Payroll* — "How Retroactive Pay Is Calculated". https://docs.oracle.com/en/cloud/saas/human-resources/faigp/how-retroactive-pay-is-calculated.html
- Oracle, *Implementing Global Payroll* — the "Events, Retroactive Pay and Proration" chapter, for event groups and proration formulas. https://docs.oracle.com/en/cloud/saas/human-resources/faigp/index.html
- Oracle, *Implementing Global Human Resources* — date-effective objects and the history they keep. https://docs.oracle.com/en/cloud/saas/human-resources/faigh/index.html
</script>
