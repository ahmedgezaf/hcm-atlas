iles. Saudization is assessed per Saudi establishment, so the number of Saudi TRUs follows the number of registrations rather than the number of companies. Divisions give the group a \"Middle East\" view that no legal entity provides. This is the shape most regional implementations take.<\/p>\n<p><strong>The shared-services group.<\/strong> Several legal employers, one PSU doing the filing, one business unit running transactions for all of them. This is where the legal and operational pictures separate most visibly, and where a consultant who has only seen the first shape gets confused: the same person is employed by company A, paid by filer B, and processed by service centre C, and all three are correct at once.<\/p>\n<h2>What is expensive to change later<\/h2>\n<p>Not every decision in this chapter carries the same weight, and knowing which ones bind is what separates a consultant from someone reading a setup guide.<\/p>\n<figure class=\"fig-embed\" data-fig=\"change-cost\"><\/figure>\n\n<p>Cheap to change: departments, divisions, locations, tree structure, most reference data. These move with ordinary effective-dated updates.<\/p>\n<p>Expensive: the business unit design, because reference data sets attach to it and moving them means re-pointing every job, grade and location.<\/p>\n<p>Effectively permanent: the legislative data group's legislation and currency, and the legal employer a worker sits in. The first cannot be altered once payroll data exists. The second changes only by ending one employment and starting another — a global transfer, which is the worked example Chapter 3 walks through, and which has real consequences for service dates, accrued leave and end-of-service liability.<\/p>\n<div class=\"lab-embed\" data-lab=\"org\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Describing the enterprise as \"the company\". The company is a legal entity; the enterprise is the whole group.<\/li>\n<li>Assuming a legal entity can hire. It cannot until it is classified as a legal employer.<\/li>\n<li>Assuming one PSU per country. Map legal entities to PSUs deliberately, from the registration certificates.<\/li>\n<li>Counting legal entities from the org chart instead of the commercial registers.<\/li>\n<li>Expecting to reuse one element library across countries. Each LDG is its own world, and the duplication has to be estimated for.<\/li>\n<li>Calling a business unit \"just another word for department\". A BU is a processing and access construct; departments sit below it.<\/li>\n<li>Designing business units without deciding the reference data sets, then discovering the job list cannot be shared.<\/li>\n<li>Confusing a legal address with a work location. One is where the company is registered, the other is where people sit.<\/li>\n<li>Building the structure and never building the trees, then being unable to scope security to a department.<\/li>\n<li>Letting the Enterprise Structures Configurator make the design decisions, then having to defend them.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — \"Enterprise Structures: Initial Configuration\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21a/faigh/enterprise-structures-initial-configuration.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21a/faigh/enterprise-structures-initial-configuration.html<\/a><\/li>\n<li>Oracle, <em>Implementing Payroll<\/em> — \"What's a tax reporting unit?\" and related legal-entity classification topics. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/fapcd/what-s-a-tax-reporting-unit.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/fapcd/what-s-a-tax-reporting-unit.html<\/a><\/li>\n<li>Oracle, <em>Using Common Features<\/em> — \"How Business Units Work with Reference Data Sets\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faucf/how-business-units-work-with-reference-data-sets.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faucf/how-business-units-work-with-reference-data-sets.html<\/a><\/li>\n<li>Maverick Solutions, \"Effectively using legislations and legislative data groups in Oracle Cloud HCM Payroll\". <a href=\"https://mavericksolutions.com/2021/06/15/legislations-and-legislative-data-groups-in-oracle-cloud-hcm-payroll/\" target=\"_blank\" rel=\"noopener\">https://mavericksolutions.com/2021/06/15/legislations-and-legislative-data-groups-in-oracle-cloud-hcm-payroll/<\/a><\/li>\n<li>Apps2Fusion, \"Legal Entity and Legal Employer in Fusion Application\". <a href=\"https://apps2fusion.com/old/oracle-fusion-online-training/1519-legal-entity-and-legal-employer-in-fusion-application\" target=\"_blank\" rel=\"noopener\">https://apps2fusion.com/old/oracle-fusion-online-training/1519-legal-entity-and-legal-employer-in-fusion-application<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"tables","num":1,"domain":"analytics","track":"functional","title":"Thinking in Tables","sub":"What one row means — the question that prevents most analysis errors","hue":188,"minutes":7,"labs":[],"terms":["grain","primary-key","foreign-key","surrogate-key","cardinality","tidy-data","long-and-wide","null-in-data"],"html":"<p>Before any tool, one habit. When a table lands in front of you, ask what a single row represents, and do not start work until you can say it in one sentence. Almost every wrong number in analytics traces back to someone who never asked — who summed a column without noticing the rows had been duplicated, or averaged an average, or joined two tables whose rows meant different things.<\/p>\n<h2>The grain<\/h2>\n<p>The <strong>grain<\/strong> of a table is what one row is. \"One row is one order.\" \"One row is one order line.\" \"One row is one product, per store, per day.\" Those are three different tables, and the same column called <code>revenue<\/code> means something different in each.<\/p>\n<p>The grain is the first thing to establish and the last thing to lose track of. A table at order grain can be summed safely for total revenue. The same query joined to order <em>lines<\/em> is no longer at order grain — each order now appears once per line — and summing the order-level revenue column will overstate the total, silently, by exactly the average number of lines per order. Nothing errors. The number is simply wrong, and it looks plausible, which is worse.<\/p>\n<p>State the grain out loud in a handover or an interview and you sound like someone who has been burned. That is the point.<\/p>\n<figure class=\"fig-embed\" data-fig=\"grain\"><\/figure>\n\n<h2>Keys<\/h2>\n<p>A <strong>primary key<\/strong> is the column, or set of columns, that uniquely identifies a row. It is how you know the grain is what you think it is: if <code>order_id<\/code> is the primary key, there is exactly one row per order, and a count of rows equals a count of orders. When a supposed primary key turns out to have duplicates, the grain was never what the documentation claimed.<\/p>\n<p>A <strong>foreign key<\/strong> is a column that points at another table's primary key — <code>customer_id<\/code> on the orders table pointing at the customers table. Foreign keys are how tables connect, and they are the reason joins work at all.<\/p>\n<p>Keys come in two flavours. A <strong>natural key<\/strong> is something meaningful from the business: an email address, an ISBN, a national ID. A <strong>surrogate key<\/strong> is a meaningless number the system generates, usually auto-incrementing. Surrogate keys are preferred in analytics because natural keys change — people change email addresses, companies get reassigned codes — and a key that changes breaks every row that referenced it. The rule of thumb: join on surrogate keys, report on natural ones.<\/p>\n<p><strong>Cardinality<\/strong> describes how two tables relate: one-to-one, one-to-many, many-to-many. One customer has many orders, so customers-to-orders is one-to-many. Getting cardinality wrong is what produces duplicated rows, and it is the single most common cause of an inflated total.<\/p>\n<h2>Tidy data<\/h2>\n<p>A table is <strong>tidy<\/strong> when each column is one variable, each row is one observation, and each cell is one value. It sounds obvious and it is routinely violated: a column called <code>Q1 Q2 Q3 Q4<\/code> holding four numbers, a cell containing \"Cairo, Egypt\", a column whose header is itself a data value.<\/p>\n<p>The last of those is the most common, and it has a name. A table with columns <code>Jan<\/code>, <code>Feb<\/code>, <code>Mar<\/code> is in <strong>wide<\/strong> form — the month is encoded in the column header rather than stored as a value. The <strong>long<\/strong> form has one row per month with a <code>month<\/code> column and a <code>value<\/code> column. Wide is easier for a human to read across; long is what every tool wants to compute on. Pivot tables, Power BI and most charting libraries all expect long, and most of the reshaping work in a real project is turning wide data that came out of a spreadsheet into long data a tool can use.<\/p>\n<h2>Missing values<\/h2>\n<p><strong>NULL<\/strong> is not zero and not an empty string. It means \"no value recorded\", and it behaves differently from both. Zero is a measurement; NULL is the absence of one. An average over a column with NULLs ignores them, so the denominator is smaller than the row count — which is usually right for \"average order value\" and badly wrong for \"average daily sales\" when the missing days genuinely were zero.<\/p>\n<p>The distinction matters most when deciding what to do with it. Filling NULLs with zero is a modelling decision, not a cleanup step, and it should be a deliberate one you can defend.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Summing a column after a join that changed the grain.<\/li>\n<li>Treating a column labelled \"ID\" as unique without checking.<\/li>\n<li>Joining on a natural key that the business quietly reassigns.<\/li>\n<li>Reshaping wide to long by hand instead of with the tool's unpivot.<\/li>\n<li>Replacing NULLs with zero without deciding whether zero is true.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Hadley Wickham, \"Tidy Data\", <em>Journal of Statistical Software<\/em> 59(10). <a href=\"https://www.jstatsoft.org/article/view/v059i10\" target=\"_blank\" rel=\"noopener\">https://www.jstatsoft.org/article/view/v059i10<\/a><\/li>\n<li>Microsoft Learn, \"Understand star schema and the importance for Power BI\" — grain and dimension modelling. <a href=\"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/guidance/star-schema<\/a><\/li>\n<li>PostgreSQL documentation, \"Constraints\" — primary and foreign keys. <a href=\"https://www.postgresql.org/docs/current/ddl-constraints.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/ddl-constraints.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"sql-shape","num":2,"domain":"analytics","track":"technical","title":"The Shape of a SQL Query","sub":"Why the clauses run in a different order from the one you write them in","hue":212,"minutes":8,"labs":["query-order"],"terms":["logical-processing-order","where-vs-having","group-by","aggregate-function","distinct","alias-scope","three-valued-logic","count-star-vs-column"],"html":"<p>SQL is written in one order and executed in another. Almost every beginner error — the alias that will not work in <code>WHERE<\/code>, the filter that belongs in <code>HAVING<\/code>, the <code>COUNT<\/code> that returns a number nobody expected — comes from not knowing the second order.<\/p>\n<h2>The order the database actually uses<\/h2>\n<p>You write <code>SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY<\/code>. The engine resolves it as:<\/p>\n<pre><code>FROM        which tables, and how they join\nWHERE       throw away rows\nGROUP BY    collapse the survivors into groups\nHAVING      throw away groups\nSELECT      work out the output columns\nDISTINCT    remove duplicate output rows\nORDER BY    sort\nLIMIT       cut\n<\/code><\/pre>\n<p>This is the <em>logical<\/em> processing order — the engine is free to optimise the physical execution however it likes, as long as the result matches what this order would produce. Two consequences follow immediately, and they explain most of the confusion.<\/p>\n<div class=\"lab-embed\" data-lab=\"query-order\"><\/div>\n\n<p><strong>An alias defined in <code>SELECT<\/code> cannot be used in <code>WHERE<\/code>.<\/strong> <code>WHERE<\/code> runs first; at that point the alias does not exist yet. Write the expression out again in <code>WHERE<\/code>, or wrap the query. The same alias <em>does<\/em> usually work in <code>ORDER BY<\/code>, because <code>ORDER BY<\/code> runs last — one of the few places SQL bends its own rule for convenience, and a genuine dialect difference worth checking.<\/p>\n<p><strong><code>WHERE<\/code> filters rows, <code>HAVING<\/code> filters groups.<\/strong> \"Only orders over 100\" is a row condition and belongs in <code>WHERE<\/code>. \"Only customers whose total is over 1,000\" is a condition on an aggregate and belongs in <code>HAVING<\/code>, because the total does not exist until <code>GROUP BY<\/code> has run. Putting an aggregate in <code>WHERE<\/code> is an error; putting a plain row filter in <code>HAVING<\/code> usually works but is slower, because you have grouped rows you were always going to discard.<\/p>\n<h2>Grouping<\/h2>\n<p><code>GROUP BY<\/code> collapses rows into one row per distinct combination of the grouping columns. Every column in <code>SELECT<\/code> must then either appear in <code>GROUP BY<\/code> or be wrapped in an <strong>aggregate function<\/strong> — <code>SUM<\/code>, <code>COUNT<\/code>, <code>AVG<\/code>, <code>MIN<\/code>, <code>MAX<\/code>. The reason is arithmetic, not pedantry: if you have collapsed fifty rows into one, the engine has no way to choose which of the fifty values of <code>customer_name<\/code> to show unless you tell it.<\/p>\n<p>Aggregates ignore NULLs. <code>AVG(discount)<\/code> over ten rows where four are NULL divides by six, not ten. That is often what you want and occasionally a serious bug, and the only way to know is to have decided what the NULLs mean.<\/p>\n<h2>The two counts<\/h2>\n<p><code>COUNT(*)<\/code> counts rows. <code>COUNT(column)<\/code> counts rows where that column is not NULL. <code>COUNT(DISTINCT column)<\/code> counts distinct non-NULL values. Three different questions, and interviewers ask the difference because it is a fast test of whether someone has thought about NULLs at all.<\/p>\n<h2>Three-valued logic<\/h2>\n<p>SQL does not have true and false. It has true, false and <strong>unknown<\/strong>, and NULL is what produces unknown. <code>NULL = NULL<\/code> is not true — it is unknown, because two unrecorded values cannot be shown to be equal. That is why you write <code>IS NULL<\/code>, never <code>= NULL<\/code>.<\/p>\n<p>The trap this creates is <code>NOT IN<\/code> against a list containing a NULL. <code>x NOT IN (1, 2, NULL)<\/code> evaluates to unknown for every <code>x<\/code>, so the condition is never true and the query returns nothing at all. Nothing errors; the result set is simply empty, and people rewrite the query three times before spotting it. <code>NOT EXISTS<\/code> does not have this behaviour and is the safer habit.<\/p>\n<h2>Writing it so someone can read it<\/h2>\n<p>Beyond correctness: put each clause on its own line, uppercase the keywords or lowercase them but do not mix, and alias tables with something meaningful rather than <code>a<\/code> and <code>b<\/code>. A query is read far more often than it is written, usually by you, months later, trying to work out why a number moved.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Using a <code>SELECT<\/code> alias in <code>WHERE<\/code> and being told the column does not exist.<\/li>\n<li>Putting an aggregate condition in <code>WHERE<\/code> instead of <code>HAVING<\/code>.<\/li>\n<li>Assuming <code>COUNT(column)<\/code> and <code>COUNT(*)<\/code> are the same.<\/li>\n<li><code>NOT IN<\/code> against a subquery that can return NULL.<\/li>\n<li>Comparing to NULL with <code>=<\/code> instead of <code>IS NULL<\/code>.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Microsoft Learn, \"SELECT (Transact-SQL)\" — logical processing order of the SELECT statement. <a href=\"https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql<\/a><\/li>\n<li>PostgreSQL documentation, \"Queries\" and \"Functions and Operators: Comparison\". <a href=\"https://www.postgresql.org/docs/current/queries.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/queries.html<\/a><\/li>\n<li>PostgreSQL documentation, \"Aggregate Functions\" — NULL handling in aggregates. <a href=\"https://www.postgresql.org/docs/current/functions-aggregate.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/functions-aggregate.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"workforce","num":2,"domain":"hcm","track":"functional","title":"Workforce Structures","sub":"Jobs, positions, grades — what work exists and at what level","hue":200,"minutes":6,"labs":["jobpos"],"terms":["job","position","grade","grade-step","job-family"],"html":"<p>If Chapter 1 is the compliance skeleton, this is the work skeleton: how an organization defines what work exists, at what level, and in which seat. One distinction in this chapter — job versus position — is the most frequently tested concept in Oracle HCM interviews, and the fastest way to look unprepared in front of a trainer is to treat the two as synonyms.<\/p>\n<h2>Job: what the work is<\/h2>\n<p>A <strong>job<\/strong> is a generic definition of a role, independent of the organization chart. It carries attributes such as a grade range, required qualifications and a job family. Most roles repeat across an organization, so defining \"Accountant\" once and reusing it everywhere avoids duplicating the same definition dozens of times. The Finance department in Cairo, the plant in 10th of Ramadan City and the Alexandria branch can all use the same job. In a job-based (non-position) organization, the assignment carries job, department and location as separate fields; this is the common pattern in Egyptian private companies.<\/p>\n<h2>Position: a specific seat<\/h2>\n<p>A <strong>position<\/strong> is a specific, individual seat: a job tied to a particular department and location, which exists whether or not anyone currently fills it. \"Accountant #3, Finance Department, Alexandria Plant\" carries its own headcount budget, reporting line and FTE. When the incumbent leaves, the position remains and becomes vacant — and a vacancy is a real, reportable thing.<\/p>\n<p>Organizations that budget headcount need to track seats independently of people. Position management is therefore standard in government, oil and gas, banking and most Gulf entities. It brings vacancy reporting and stricter headcount control, at the cost of more setup and maintenance. A consultant aiming at the Gulf market should learn position management properly rather than treating it as an optional extra.<\/p>\n<div class=\"lab-embed\" data-lab=\"jobpos\"><\/div>\n\n<h2>Grades and steps<\/h2>\n<p>A <strong>grade<\/strong> is a level in the hierarchy, used to control compensation ranges and eligibility for benefits or allowances — \"G1\" through \"G12\", or \"Junior / Senior / Lead / Principal\". Grades carry rate ranges (minimum, midpoint, maximum). They drive eligibility constantly: \"only G7 and above get the car allowance\" is a sentence a consultant hears and then configures. Grade is not the same as salary. Grade is a level; money attaches to it through rate ranges and the salary basis (Chapter 5), and the two are linked but distinct objects.<\/p>\n<p>A <strong>grade step<\/strong> is an increment within a single grade, used where progression happens in defined steps rather than across a continuous range. Steps are grouped into grade ladders. Grade G5 might have steps 1 through 8, each with a defined rate; an annual increment moves a person from step 3 to step 4 without changing their grade. Government and unionized pay scales work this way, which makes steps highly relevant in the Gulf public sector and in Egyptian government-linked entities. If a client has a step-based scale and the design uses a plain grade rate range, the design is wrong.<\/p>\n<p>A <strong>job family<\/strong> groups related jobs — all finance jobs, all engineering jobs — for career-path design, reporting and shared eligibility rules. It is recognition-level for Core HR and becomes more important in Talent Management.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Defining a job as a specific seat. That is a position.<\/li>\n<li>Saying \"grade equals salary\". Grade is a level; rate ranges and the salary basis carry the money.<\/li>\n<li>Designing a continuous rate range for a client whose scale is actually step-based.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — Jobs and Positions; Grades, Grade Rates and Grade Ladders. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigh/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigh/<\/a><\/li>\n<li>Oracle, \"Employment Model\" (positions and assignments in the employment hierarchy). <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"model","num":3,"domain":"hcm","track":"functional","title":"The Employment Data Model","sub":"Person → work relationship → assignment. There is no employee table.","hue":246,"minutes":17,"labs":["model"],"terms":["person","work-relationship","work-terms","assignment","payroll-relationship","concurrent-employment","global-transfer","worker-types","seniority-date","assignment-status","action-and-action-reason","primary-assignment","last-standard-process-date"],"html":"<p>This is the single most important structure in the product. Payroll, absence, security and reporting all read from it. If a new consultant learns only one chapter cold, it should be this one.<\/p>\n<p>The core insight: there is no employee table. A human being, that human's relationship to an employer, and the details of the job they do are three separate objects, each dated independently. Knowing which attribute lives on which object is the actual skill, and it is the skill that shows in an interview within about ninety seconds. Someone who says \"we'll update the employee record\" has not learned the model. Someone who asks \"is that a change to the assignment or to the work relationship?\" has.<\/p>\n<p>The reason for the split is history. HR systems have to answer questions about the past — what grade was this person on in March, who employed them in 2019, how many people were in this department a year ago — and they have to answer them without losing the fact that it is the same human throughout. Splitting the human from the employment from the job is what makes all three answerable at once.<\/p>\n<figure class=\"fig-embed\" data-fig=\"employment-stack\"><\/figure>\n\n<h2>Person: the human, held once<\/h2>\n<p>The <strong>person<\/strong> record represents a human being and is held once, globally, across the entire enterprise. It carries what is true of the human regardless of any employer: name, date of birth, national identifier, personal contact details, nationality, and personal documents such as a passport or an Iqama.<\/p>\n<p>A person may work for one company, leave, and return years later, or work for two group companies at once. Their date of birth does not change with any of that. Storing it once avoids contradictions, and it is why a rehire six years later still shows the same person number.<\/p>\n<p>That guarantee is only as good as the hire process. Before creating a person, the hire flow looks for someone already in the system with a matching name, date of birth or national identifier. Skipping that check — or bulk-loading people without a reliable key — is how duplicate person records appear, and duplicates are unpleasant to clean up once payroll and absence data hang off both of them. In Egypt and the Gulf the national identifier is the natural key and should be treated as one: the Egyptian national ID, the Saudi national ID or Iqama number. Migration plans that key on employee number instead will merge the wrong people or split the right one.<\/p>\n<p>Person numbers themselves are generated according to the enterprise setting described in Chapter 1 — manual entry, automatic on save, or drawn from a sequence. The number identifies the human, not the employment, which is why it does not change on rehire or transfer.<\/p>\n<h2>Which attribute lives where<\/h2>\n<p>Before the objects are described one by one, it is worth seeing them as a lookup table, because this is the question that comes up twenty times a day on a live project.<\/p>\n<figure class=\"fig-embed\" data-fig=\"attribute-home\"><\/figure>\n\n<p>The test to apply when a client asks for a new field: does this change when the person changes employer? Then it belongs on the work relationship. Does it change when they change job? Assignment. Is it true of the human regardless of who employs them? Person. Does payroll need to accumulate it across the year? Payroll relationship. Getting this wrong is the single most common data-migration defect, and it usually surfaces months later as a history that cannot be explained.<\/p>\n<h2>Work relationship: the legal link<\/h2>\n<p>A <strong>work relationship<\/strong> is the link between a person and one legal employer. Oracle describes it as the legal connection between a person and a legal employer, carrying the worker type and the start date of that employment.<\/p>\n<p>Terminating employment end-dates the work relationship. It does not delete the person, and it does not delete the history. A person can hold more than one work relationship at once — a contingent-worker relationship with one group company and an employee relationship with another — and can hold several over time as they leave and return.<\/p>\n<p>The dates on the work relationship are where service is decided, and service is money. Oracle distinguishes several: the date the person first joined the enterprise, the date they joined this legal employer, and one or more <strong>seniority dates<\/strong> which can be configured to accumulate service across breaks or across employers within the group. This matters enormously in the region, because end-of-service gratuity in the Gulf and the Egyptian end-of-service settlement are both calculated on continuous service. A rehire that starts a fresh service clock when the client's policy bridges the break will under-pay every affected leaver, and nobody notices until somebody resigns.<\/p>\n<p>Ask, in the requirements workshop, exactly what the client means by \"years of service\" — and then ask which of those dates it maps to. The answer is rarely the one written on the offer letter.<\/p>\n<h2>Worker types, and what each is for<\/h2>\n<p>The <strong>worker type<\/strong> recorded on the work relationship is one of four: employee, contingent worker, pending worker or non-worker. They are not cosmetic. Worker type maps to a payroll relationship type, which decides whether the person is included in payroll runs at all.<\/p>\n<p>An <strong>employee<\/strong> is the ordinary case: employed by the legal employer, on the payroll.<\/p>\n<p>A <strong>contingent worker<\/strong> is engaged but not employed — an agency worker, a contractor on a supplier's books. They occupy a position, appear on the org chart and consume security and absence configuration, but a contingent worker may be excluded from payroll entirely. Clients ask for them constantly and then describe them as employees, so the question worth asking is \"who pays them?\"<\/p>\n<p>A <strong>pending worker<\/strong> is someone hired but not yet started. The record exists so onboarding — equipment, accounts, documents, the joining checklist — can begin before day one, and it converts to an employee on the actual start date. It is a genuinely useful feature that most implementations under-use.<\/p>\n<p>A <strong>non-worker<\/strong> is a person the enterprise needs to hold without an employment: a retiree drawing a pension, a board member, a beneficiary, a volunteer. They exist so that people who must appear in the system are not forced into an employee shape that would put them in a payroll run.<\/p>\n<h2>Assignment: the job details<\/h2>\n<p>The <strong>assignment<\/strong> carries the actual job details: business unit, department, job, position, grade, location, manager, working hours, assignment category, assignment status, and the standing data payroll reads.<\/p>\n<p>Job details change often — promotions, transfers, hours changes, a new manager — while the person and the employer stay the same. Isolating them in their own date-effective object keeps the history clean. Almost every lifecycle transaction is a dated change against the assignment, which is why a consultant spends most of their configuration life here, and why Chapter 4 on effective dating matters as much as it does.<\/p>\n<p>Three attributes on the assignment deserve naming, because they cause more support tickets than the rest combined.<\/p>\n<p>The <strong>assignment status<\/strong> controls whether the assignment is active, suspended or inactive, and — separately — whether it is eligible for payroll processing. The distinction is the part that catches people: a status can be active for HR purposes while excluding the person from payroll, which is exactly what is wanted for unpaid leave and exactly what is not wanted when somebody has set it by accident. \"The employee is active but did not get paid\" is almost always this.<\/p>\n<p>The <strong>primary assignment<\/strong> flag matters when a person holds more than one. Reports, the org chart and many downstream integrations read the primary assignment, so a person with two jobs whose primary flag sits on the minor one will be reported under the wrong department indefinitely.<\/p>\n<p>Every change to an assignment is recorded with an <strong>action and action reason<\/strong> — Hire, Promotion, Transfer, Termination as the action, and a client-defined reason underneath it. The action drives which flow runs and which fields appear; the reason is what makes analytics possible later. \"Why did attrition rise in Q3\" can only be answered if terminations carry reasons, and reasons only exist if someone insisted on configuring them during implementation. That someone is the consultant.<\/p>\n<h2>Two-tier and three-tier<\/h2>\n<p>Oracle offers two shapes for the hierarchy. In the <strong>two-tier<\/strong> model, the default, a work relationship holds assignments directly. In the <strong>three-tier<\/strong> model an optional layer called <strong>employment terms<\/strong> — also called work terms — sits between them to group contractual attributes such as working hours, grade, collective agreement and contract details across several assignments.<\/p>\n<p>Two-tier is the more common choice in new implementations, and is what to assume. The three-tier model exists for organizations that genuinely need one set of contractual terms covering multiple assignments, which in practice means European employers with collective agreements more often than employers in Egypt or the Gulf.<\/p>\n<p>\"What is the difference between employment terms and an assignment?\" is a standard interview question. Terms group contractual and compensation attributes; the assignment holds the actual job details. The answer is short, and the follow-up — \"which would you recommend?\" — is where a candidate shows judgment: two-tier, unless the client has a contractual layer that genuinely spans assignments, because the third tier is an extra object to date-track, migrate and explain for the rest of the system's life.<\/p>\n<h2>Payroll relationship: where payroll actually runs<\/h2>\n<p>Parallel to this hierarchy sits the <strong>payroll relationship<\/strong>, which links the person to a payroll statutory unit. It is the highest level of the payroll employment model and groups a person's assignments for statutory calculation and reporting. Oracle creates it automatically on hire, which is why most consultants meet it for the first time when something goes wrong.<\/p>\n<p>The reason it exists is statutory arithmetic. Tax and social insurance must be calculated on a person's total earnings within a statutory unit, not per assignment. If someone holds two assignments, their social insurance cannot be calculated twice in isolation — that would apply the ceiling twice and under-deduct. Grouping the assignments under one payroll relationship is what makes the ceiling, the bracket and the annual accumulation apply once to the whole person.<\/p>\n<p>Three consequences follow, and all three appear in interviews.<\/p>\n<p>Payroll processing always occurs at the payroll relationship level. Elements are entered against assignments, but the run is against the relationship.<\/p>\n<p>Balances aggregate at the payroll relationship, and — critically — <strong>balances do not span payroll relationships<\/strong>. Year-to-date tax, year-to-date insurable earnings, accumulated employer contributions: all of it belongs to one relationship and stops at its edge.<\/p>\n<p>Termination dates live here too. When employment ends, the payroll relationship carries a <strong>last standard process date<\/strong>, after which no ordinary payroll run will pick the person up, and a final close date, after which nothing at all will. Setting the final close date too early is how a legitimate late payment — a final bonus, a corrected settlement — becomes impossible to pay without reopening the record. Leave room.<\/p>\n<p>Assignments grouped in one payroll relationship must share the same payroll statutory unit and person type. That is why a person who is an employee of one company and a contingent worker at another has two payroll relationships, not one.<\/p>\n<h2>Concurrent employment<\/h2>\n<p><strong>Concurrent employment<\/strong> means one person holding several simultaneous assignments under one work relationship, or several work relationships across different legal employers. A lecturer who also runs a research lab. A doctor employed by a hospital who also works clinic hours. A group finance manager who formally holds a role in two subsidiaries.<\/p>\n<p>The two cases behave differently and the difference is the whole point. Two assignments under one work relationship means one employer, one payroll relationship, one set of balances and one statutory ceiling applied across both jobs. Two work relationships means two employers, two payroll relationships, and each employer calculating independently — which is correct, because each is separately registered and separately liable.<\/p>\n<p>When a client describes somebody who \"works for both companies\", the useful follow-up is: which company's payroll pays them, and do both of them file for this person? The answer decides the shape.<\/p>\n<h2>The canonical worked example: a global transfer<\/h2>\n<p>A <strong>global transfer<\/strong> moves a worker from one legal employer to another, typically across countries. Legally that is a new employment, not an edit to an existing one — different country, different legislation, different statutory registration.<\/p>\n<p>Oracle handles this through a single Local and Global Transfer flow that covers both a move within the same legal employer and a move to a different one, with options for what happens to the existing assignments and whether the move is permanent or temporary. The underlying record changes are the part to be able to narrate.<\/p>\n<p>The source work relationship is terminated and a new one is created under the destination legal employer. A new payroll relationship is created under the destination payroll statutory unit, which sits in a different legislative data group. The person record is unchanged throughout. Because balances never span payroll relationships, year-to-date figures start fresh in the new country — which is correct, since the new country's authorities have no interest in earnings taxed elsewhere, but which surprises clients who expected a single annual figure.<\/p>\n<figure class=\"fig-embed\" data-fig=\"global-transfer-count\"><\/figure>\n\n<p>Be able to narrate this end to end and give the counts at the end: one person record, two work relationships (one ended), two payroll relationships (one ended). Then add the consequence nobody asks for but everybody wants: accrued leave and end-of-service liability do not move by themselves, and whether service bridges across the transfer is a policy decision expressed through seniority dates.<\/p>\n<h2>Rehire: the case everyone gets wrong<\/h2>\n<p>A rehire is a global transfer's quieter cousin and it trips up more projects.<\/p>\n<p>The person record is reused — same human, same person number, same date of birth. A new work relationship is created for the new employment. A new payroll relationship is created, so balances start again. None of that is controversial.<\/p>\n<p>What is controversial is service. Whether the earlier employment counts toward gratuity, leave entitlement bands and notice periods is a policy question the client must answer, and the answer is expressed through seniority dates rather than by faking the hire date. Consultants who solve it by back-dating the new work relationship to the original hire date create a record that says the person was employed during a period when they were not, which corrupts headcount history, absence accruals and any report that counts service in a given year.<\/p>\n<p>The correct instinct: never lie to the dates. Configure the seniority date that means what the client means.<\/p>\n<h2>What this model looks like to a data migration<\/h2>\n<p>The model is abstract until somebody has to load ten thousand people into it, at which point it becomes very concrete.<\/p>\n<p>Oracle's bulk loader (Chapter 11) treats the person, the work relationship and the assignment as components of a single Worker object rather than as three separate loads. That is deliberate and it is a mercy: the three have to be created in one transaction, with consistent dates, or the result is a person with no employment or an assignment pointing at a work relationship that does not exist. It also means the file is wide, the ordering inside it matters, and a single malformed row can fail a block of records rather than one.<\/p>\n<p>Three rules follow, and they are worth knowing before the first load rather than after it.<\/p>\n<p>Dates must agree across the components. An assignment cannot start before its work relationship does, and a work relationship cannot start before the person exists. Source systems routinely hold a hire date on the employee record and a different one on the contract, and somebody has to decide which is true.<\/p>\n<p>The keys must be stable. Loads reference objects by a source key or by a user key, and the person's national identifier is usually the only value in a legacy HR system that is both unique and unchanged across the whole history. Employee numbers get reissued; names get re-spelled.<\/p>\n<p>History is loaded as history, not as today. If the client wants the last five years of job changes, those are dated assignment records, not a single current row — and loading them in date order is what produces a readable history afterwards rather than a stack of corrections.<\/p>\n<h2>Reading the model on screen<\/h2>\n<p>Knowing where each object surfaces in the interface saves an embarrassing pause in a demo.<\/p>\n<p>The person attributes sit under the personal details area: name, national identifier, date of birth, contact details, documents. The work relationship and the assignment share the employment information page, with the work relationship's dates and worker type at the top and the assignment's job, grade, department, manager and status beneath — which is a UI convenience, not evidence that they are the same object. The payroll relationship has its own page, reached from the payroll area rather than from the person's employment record, and that separation on screen is a useful reminder of the separation underneath.<\/p>\n<p>When something cannot be found, the question to ask is not \"where is this field\" but \"which object owns it\", and then go to that object's page.<\/p>\n<div class=\"lab-embed\" data-lab=\"model\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Believing there is an employee table. There is a person, a work relationship and an assignment.<\/li>\n<li>Confusing termination of a work relationship with deletion of the person. The person survives, and should.<\/li>\n<li>Keying a data migration on employee number rather than national identifier, and producing duplicate people.<\/li>\n<li>Assuming every implementation has employment terms. Two-tier omits that layer entirely.<\/li>\n<li>Thinking payroll runs against the assignment. It runs against the payroll relationship.<\/li>\n<li>Expecting balances to carry across a global transfer or a rehire. They do not.<\/li>\n<li>Treating \"years of service\" as one number. Ask which date the client means before configuring anything that depends on it.<\/li>\n<li>Back-dating a rehire's work relationship to the original hire date instead of using a seniority date.<\/li>\n<li>Leaving the primary assignment flag on the minor of two concurrent jobs, then wondering why reporting is wrong.<\/li>\n<li>Setting the final close date on termination too early, so a legitimate late payment cannot be made.<\/li>\n<li>Configuring actions without action reasons, then being unable to answer any question about why people left.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — \"Employment Model\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html<\/a><\/li>\n<li>Oracle, <em>Administering Global Payroll<\/em> — \"Overview of Administering Payroll Relationships\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html<\/a><\/li>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — \"Enterprise Structures: Initial Configuration\", for the legal employer relationship the work relationship points at. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21a/faigh/enterprise-structures-initial-configuration.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21a/faigh/enterprise-structures-initial-configuration.html<\/a><\/li>\n<li>Future Proof Technologies, \"HCM Employment Model in Oracle Fusion HCM Cloud\". <a href=\"https://medium.com/@futureprooftrainings/hcm-employment-model-in-oracle-fusion-hcm-cloud-0ec24a4e638a\" target=\"_blank\" rel=\"noopener\">https://medium.com/@futureprooftrainings/hcm-employment-model-in-oracle-fusion-hcm-cloud-0ec24a4e638a<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"sql-joins","num":3,"domain":"analytics","track":"technical","title":"Joins, and the Rows You Did Not Expect","sub":"Where totals quietly double — and why the join type is only half the story","hue":236,"minutes":8,"labs":["joins"],"terms":["inner-join","left-join","full-outer-join","cross-join","fan-out","anti-join","join-key-mismatch"],"html":"<p>A join answers one question: for each row on the left, which rows on the right match? Everything else — the join type, the direction, the surprises — follows from what you decide to do when the answer is <em>none<\/em>, or <em>more than one<\/em>.<\/p>\n<h2>The four you will actually use<\/h2>\n<p>An <strong>inner join<\/strong> keeps only rows that matched on both sides. A <strong>left join<\/strong> keeps every row from the left table and fills the right-hand columns with NULL where nothing matched. A <strong>full outer join<\/strong> keeps unmatched rows from both sides. A <strong>cross join<\/strong> matches every row with every row, producing the product of the two row counts — rarely what anyone wants by accident, occasionally exactly what you want for building a date scaffold.<\/p>\n<p>Right joins exist and are almost never written deliberately; a left join with the tables swapped reads better and everyone understands it immediately.<\/p>\n<div class=\"lab-embed\" data-lab=\"joins\"><\/div>\n\n<h2>The mistake that turns a left join into an inner join<\/h2>\n<p>This one catches everybody once.<\/p>\n<pre><code class=\"language-sql\">SELECT c.name, o.total\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.status = 'shipped'\n<\/code><\/pre>\n<p>That is not a left join any more. Customers with no orders get NULL for <code>o.status<\/code>, <code>NULL = 'shipped'<\/code> is unknown, and <code>WHERE<\/code> discards them — so the query returns exactly what an inner join would. The fix is to move the condition into the <code>ON<\/code> clause, where it filters what counts as a match rather than filtering the result:<\/p>\n<pre><code class=\"language-sql\">LEFT JOIN orders o\n  ON o.customer_id = c.id AND o.status = 'shipped'\n<\/code><\/pre>\n<p>The rule generalises: a condition on the <em>right<\/em> table of a left join belongs in <code>ON<\/code>; a condition on the left table belongs in <code>WHERE<\/code>. Filtering <code>IS NULL<\/code> on a right-hand column in <code>WHERE<\/code> is the deliberate exception — that is an <strong>anti-join<\/strong>, the idiom for \"customers who have never ordered\".<\/p>\n<h2>Fan-out<\/h2>\n<p>Join type is the half everyone learns. The half that breaks reports is <strong>fan-out<\/strong>: when one left row matches several right rows, the left row is repeated once per match. That is correct join behaviour. It is also how a total doubles.<\/p>\n<p>Join orders to order lines and every order-level value — the order total, the shipping fee, the customer's name — now appears once per line. <code>SUM(o.total)<\/code> is no longer the sum of order totals; it is the sum of order totals weighted by line count. The result looks like a plausible revenue figure and is inflated by a factor nobody can see.<\/p>\n<p>The defences, in order of preference: aggregate the many side to the grain you want <em>before<\/em> joining, usually in a subquery or CTE; or join and then aggregate with <code>SUM(DISTINCT …)<\/code> only if the values are genuinely distinct, which they often are not; or count rows before and after the join and notice when the number changes. That last one is a habit worth building — if a join changed your row count and you did not expect it to, stop.<\/p>\n<h2>When keys do not match<\/h2>\n<p>Joins silently return fewer rows than expected for dull reasons. Trailing whitespace on a text key. One side stored as text and the other as integer, so the implicit cast fails or, worse, succeeds inconsistently. Case sensitivity, which differs by database and by collation. Leading zeros stripped by a spreadsheet somewhere upstream.<\/p>\n<p>When a join returns fewer rows than it should, check the keys before you check the logic. Count distinct values on both sides, and look at a handful that failed to match. It is nearly always the data, not the SQL.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Filtering the right table in <code>WHERE<\/code> and collapsing a left join to an inner one.<\/li>\n<li>Summing a column after a one-to-many join.<\/li>\n<li>Not noticing the row count changed.<\/li>\n<li>Joining on a key with different types or invisible whitespace on the two sides.<\/li>\n<li>Reaching for <code>SELECT DISTINCT<\/code> to hide duplication rather than fixing the grain.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>PostgreSQL documentation, \"Table Expressions\" — join types and the meaning of <code>ON<\/code> versus <code>WHERE<\/code>. <a href=\"https://www.postgresql.org/docs/current/queries-table-expressions.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/queries-table-expressions.html<\/a><\/li>\n<li>Microsoft Learn, \"FROM clause plus JOIN, APPLY, PIVOT (Transact-SQL)\". <a href=\"https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql<\/a><\/li>\n<li>Microsoft Learn, \"Understand star schema and the importance for Power BI\" — why grain and cardinality decide whether a total is right. <a href=\"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/guidance/star-schema<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"dating","num":4,"domain":"hcm","track":"functional","title":"Effective Dating","sub":"Nothing is deleted. Everything has the date it became true.","hue":278,"minutes":6,"labs":["dating"],"terms":["effective-date","update-vs-correction","retroactive-change-retro","end-dating"],"html":"<p>Oracle HCM is a date-effective system. Almost nothing is ever deleted; changes are recorded with the date on which they become true in the real world. People coming from transactional systems trip over this more than anything else, and it has direct payroll consequences.<\/p>\n<h2>The effective date is not the entry date<\/h2>\n<p>The <strong>effective date<\/strong> is the date on which a change becomes true — not the date it was typed into the system. HR reality and data entry rarely happen on the same day: a promotion effective 1 January may be entered on 15 January, and the system must know the person was at the new grade from the first. Every date-effective record has a start date and an end date. Setting the effective date correctly is the difference between a correct payslip and a retroactive correction, and most \"the system calculated it wrong\" tickets turn out to be effective-date errors. The system tracks the entry date separately, for audit.<\/p>\n<h2>Update versus correction<\/h2>\n<p>An <strong>update<\/strong> creates a new dated record and preserves history. A <strong>correction<\/strong> overwrites the existing record as if the previous value was never true. Some changes are real events — a promotion — and some are data-entry mistakes — a typo in a grade. The system needs to tell real history from erroneous history.<\/p>\n<p>Promoting someone on 1 July is an update: both the old and the new grade belong in history because both were true. Fixing a misspelled surname is a correction: the old spelling was never true and should not be preserved. Using a correction to record a real-world change destroys legitimate history and can trigger incorrect retroactive payroll; it is the one habit that corrupts an audit trail silently.<\/p>\n<div class=\"lab-embed\" data-lab=\"dating\"><\/div>\n\n<h2>Retroactive changes<\/h2>\n<p>A <strong>retroactive change<\/strong> (\"retro\") is a change entered with an effective date in the past, after payroll has already been processed for that period. Backdated promotions and late salary approvals are normal. A raise effective 1 May and approved in July means the May and June payrolls already ran at the old rate; the July run must calculate the arrears for both months and pay them. Oracle handles this through retroactive events and the <em>Recalculate Payroll for Retroactive Changes<\/em> process, which runs before the main calculation and creates retro entries the payroll run then picks up.<\/p>\n<p>Two things matter for a consultant explaining retro to a client. First, retro affects balances, not just the current payslip: it re-states social insurance and tax for the prior periods too. Second, retro is not always money in — a change that reduces pay creates a recovery.<\/p>\n<h2>End-dating instead of deleting<\/h2>\n<p><strong>End-dating<\/strong> closes a record as of a date rather than deleting it, so that history is preserved. Terminating employment end-dates the work relationship; removing an allowance end-dates the element entry. When a client asks \"can you just delete this record?\", the correct consulting answer is almost always \"we end-date it, and here is why that is better for you.\" In a date-effective SaaS system the tools are end-date, correct, or reverse. Deletion is rare, restricted, and usually the wrong instinct.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>\"The effective date is when I entered it.\" The system tracks the two dates separately for a reason.<\/li>\n<li>Using correction for a real event, wiping the history.<\/li>\n<li>Assuming retro only adds money. It can recover money too.<\/li>\n<li>Reaching for delete. End-date instead.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"How Retroactive Pay Is Calculated\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/22a/faigp/how-retroactive-pay-is-calculated.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/22a/faigp/how-retroactive-pay-is-calculated.html<\/a><\/li>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"Events, Retroactive Pay and Proration\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21b/faigp/events-retroactive-pay-and-proration.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21b/faigp/events-retroactive-pay-and-proration.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"sql-windows","num":4,"domain":"analytics","track":"technical","title":"Windows, CTEs and the Second Half of SQL","sub":"Ranking, running totals and period-on-period — without collapsing the rows","hue":262,"minutes":8,"labs":["windows"],"terms":["window-function","partition-by","row-number-rank-dense-rank","lag-and-lead","frame-clause","cte","recursive-cte","qualify"],"html":"<p>Everything up to here collapses rows. <code>GROUP BY<\/code> takes fifty rows and gives you one. Window functions are the other half of SQL: they compute across a set of rows and give the answer back <em>on every row<\/em>, keeping the detail. Ranking, running totals, month-on-month change and \"each row's share of its group\" all live here, and an analyst who cannot write them is limited to reports that only ever show totals.<\/p>\n<h2>The anatomy<\/h2>\n<pre><code class=\"language-sql\">SELECT\n  order_date,\n  customer_id,\n  total,\n  SUM(total) OVER (PARTITION BY customer_id ORDER BY order_date) AS running_total\nFROM orders\n<\/code><\/pre>\n<p><code>OVER<\/code> is what makes it a <strong>window function<\/strong>. <code>PARTITION BY<\/code> splits the rows into independent groups — the calculation restarts for each customer — and is the window equivalent of <code>GROUP BY<\/code>, except the rows survive. <code>ORDER BY<\/code> inside <code>OVER<\/code> defines the sequence the function walks in, which is what makes \"running\" mean anything.<\/p>\n<div class=\"lab-embed\" data-lab=\"windows\"><\/div>\n\n<h2>Ranking, and the three that differ<\/h2>\n<p><code>ROW_NUMBER()<\/code> numbers rows 1, 2, 3 with no ties ever — two identical values still get different numbers, chosen arbitrarily unless you break the tie yourself. <code>RANK()<\/code> gives ties the same number and then skips: 1, 2, 2, 4. <code>DENSE_RANK()<\/code> gives ties the same number and does not skip: 1, 2, 2, 3.<\/p>\n<p>Which you want depends on the question. \"The top 3 by revenue\" with ties probably wants <code>DENSE_RANK<\/code>. \"Pick exactly one row per customer\" wants <code>ROW_NUMBER<\/code> with a deliberate tiebreaker in the <code>ORDER BY<\/code>, because otherwise the row you get is not stable between runs.<\/p>\n<p>Note that you cannot filter on a window function in <code>WHERE<\/code> or <code>HAVING<\/code> — both run before <code>SELECT<\/code>, where the window is computed. Wrap it in a CTE or subquery and filter outside. Some warehouses add a <code>QUALIFY<\/code> clause that filters window results directly; it is not standard SQL, and it is worth knowing whether your engine has it before you write it.<\/p>\n<h2>Looking at the row before<\/h2>\n<p><code>LAG(total) OVER (ORDER BY order_date)<\/code> returns the previous row's value; <code>LEAD<\/code> returns the next one's. This is how period-on-period change is written, and it replaces the self-join that beginners reach for:<\/p>\n<pre><code class=\"language-sql\">total - LAG(total) OVER (PARTITION BY customer_id ORDER BY order_date) AS change\n<\/code><\/pre>\n<p>Both take an optional offset and default — <code>LAG(total, 1, 0)<\/code> returns 0 rather than NULL for the first row, which is often what a chart wants.<\/p>\n<h2>The frame, and the trap inside it<\/h2>\n<p>There is a third part to a window nobody mentions until it bites: the <strong>frame<\/strong>, which decides how much of the partition the function sees for the current row. Written out it looks like <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW<\/code>.<\/p>\n<p>Here is the part to remember. When you supply an <code>ORDER BY<\/code> and no frame, the default is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW<\/code> — and <code>RANGE<\/code> treats all rows with the <em>same ordering value<\/em> as one unit. If two orders share a date, a running total defaulting to <code>RANGE<\/code> gives both rows the total including both, not a stepped total. With <code>ROWS<\/code> it steps one row at a time. On data with no ties the two are identical, which is exactly why this bug survives testing and appears in production.<\/p>\n<p>If you mean row-by-row, write <code>ROWS<\/code> explicitly.<\/p>\n<h2>CTEs<\/h2>\n<p>A <strong>common table expression<\/strong> names a query so the next one can use it:<\/p>\n<pre><code class=\"language-sql\">WITH monthly AS (\n  SELECT customer_id, date_trunc('month', order_date) AS m, SUM(total) AS revenue\n  FROM orders GROUP BY 1, 2\n)\nSELECT *, revenue - LAG(revenue) OVER (PARTITION BY customer_id ORDER BY m) AS mom\nFROM monthly\n<\/code><\/pre>\n<p>CTEs are the main tool for keeping long queries readable: each step is named, testable on its own, and chainable. Prefer several small ones to a single nested subquery three levels deep. A <strong>recursive CTE<\/strong> additionally references itself, which is how you walk a hierarchy — an org chart, a bill of materials, a category tree — in one query.<\/p>\n<p>Two cautions. A CTE is not automatically materialised: some engines inline it and evaluate it once per reference, so a CTE used three times may run three times. And readability is not free performance — a tidy chain of CTEs can still be slow, and the execution plan is the only thing that will tell you.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Filtering a window function in <code>WHERE<\/code> instead of wrapping it.<\/li>\n<li><code>ROW_NUMBER<\/code> with no tiebreaker, then wondering why results change between runs.<\/li>\n<li>Taking the default frame on data that has ties in the <code>ORDER BY<\/code>.<\/li>\n<li>Reaching for a self-join where <code>LAG<\/code> is one line.<\/li>\n<li>Assuming a CTE is computed once when it is referenced several times.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>PostgreSQL documentation, \"Window Functions\" and \"Window Function Calls\" — frames and the <code>RANGE<\/code> default. <a href=\"https://www.postgresql.org/docs/current/tutorial-window.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/tutorial-window.html<\/a><\/li>\n<li>Microsoft Learn, \"OVER Clause (Transact-SQL)\" — partitioning, ordering and <code>ROWS<\/code>/<code>RANGE<\/code>. <a href=\"https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/sql/t-sql/queries/select-over-clause-transact-sql<\/a><\/li>\n<li>PostgreSQL documentation, \"WITH Queries (Common Table Expressions)\", including recursive CTEs. <a href=\"https://www.postgresql.org/docs/current/queries-with.html\" target=\"_blank\" rel=\"noopener\">https://www.postgresql.org/docs/current/queries-with.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"excel","num":5,"domain":"analytics","track":"functional","title":"Excel, Honestly","sub":"What a spreadsheet is still the fastest answer to, and the point where it stops","hue":145,"minutes":7,"labs":[],"terms":["xlookup","index-match","excel-table","pivot-table","power-query","volatile-function","excel-limits","spill-and-dynamic-arrays"],"html":"<p>Analysts are quietly embarrassed about Excel and should not be. It is the fastest tool in existence for a question you have not asked before, on data you have just been handed, when the answer is needed in ten minutes and will never be needed again. Knowing where that stops is the actual skill.<\/p>\n<h2>Lookups<\/h2>\n<p><strong>XLOOKUP<\/strong> replaced VLOOKUP and should be the default in any version that has it. It takes a lookup value, the array to search, and the array to return, and it fixes three things that made VLOOKUP dangerous: it defaults to <strong>exact match<\/strong> rather than approximate; it can look left as well as right; and it references arrays rather than a column <em>number<\/em>, so inserting a column does not silently break it.<\/p>\n<p>VLOOKUP's fourth argument is the one to know about even if you never write another. Omitted, it defaults to <code>TRUE<\/code> — approximate match — which assumes the lookup column is sorted and returns the nearest smaller value if it is not. On unsorted data that produces confidently wrong answers rather than errors. Every legacy VLOOKUP you inherit should be checked for a missing <code>FALSE<\/code>.<\/p>\n<p><strong>INDEX/MATCH<\/strong> is the older pairing that did what XLOOKUP does — <code>INDEX<\/code> returns the value at a position, <code>MATCH<\/code> finds the position. It is still worth reading fluently, because the spreadsheets you inherit are full of it.<\/p>\n<h2>Tables, not ranges<\/h2>\n<p>Formatting a range as an <strong>Excel Table<\/strong> changes it from a rectangle of cells into a named object with typed columns. Formulas gain <strong>structured references<\/strong> — <code>=SUM(Sales[Revenue])<\/code> instead of <code>=SUM(D2:D5000)<\/code> — which describe intent rather than coordinates, extend automatically when rows are added, and do not silently exclude the row someone appended at the bottom.<\/p>\n<p>That last failure is the most common serious error in spreadsheet work: a formula whose range stopped short. Tables remove the whole class of it, and the cost is one keyboard shortcut.<\/p>\n<h2>Pivot tables<\/h2>\n<p>A <strong>pivot table<\/strong> is a grouped aggregation with a drag-and-drop interface, and it is genuinely the fastest way to explore an unfamiliar dataset. Fields go to rows, columns, values and filters; the default aggregation is <code>SUM<\/code> for numbers and <code>COUNT<\/code> for anything else, which is the source of the perennial \"why is my pivot counting instead of summing\" — there is a non-numeric value, often a stray text cell or a blank, in a column you believed was numeric.<\/p>\n<p>Pivot tables want long data (Chapter 1). A wide table with a column per month cannot be pivoted by month until it is unpivoted, which is what Power Query is for.<\/p>\n<h2>Power Query is the part worth learning properly<\/h2>\n<p><strong>Power Query<\/strong> is the transformation engine built into Excel and Power BI alike, and it is the single highest-return thing an Excel user can learn. It imports, cleans, reshapes, unpivots, splits columns and joins tables — and it records every step, so the whole thing re-runs on next month's file with one click.<\/p>\n<p>The difference from doing it by hand is not speed, it is that the work is <em>repeatable and inspectable<\/em>. A colleague can read the applied steps and see what you did. A folder of manually cleaned spreadsheets contains no such record, and nobody — including you — can reconstruct what happened three months later.<\/p>\n<p>Because it is the same engine in Power BI, time spent here is not Excel-specific. It transfers directly.<\/p>\n<h2>Where Excel stops<\/h2>\n<p>The hard limit is 1,048,576 rows by 16,384 columns per worksheet. In practice things get unpleasant well before that: file sizes in the tens of megabytes, recalculation pauses, and <strong>volatile functions<\/strong> — <code>NOW<\/code>, <code>TODAY<\/code>, <code>RAND<\/code>, <code>OFFSET<\/code>, <code>INDIRECT<\/code> — which recalculate on every change anywhere in the workbook and are a common reason a file becomes slow for no visible reason.<\/p>\n<p>The softer limits matter more. A spreadsheet has no audit trail, no access control worth the name, and no way to tell whether the copy someone emailed you is the current one. The moment a number matters to more than one person, or has to be reproduced next month, the answer stops being a spreadsheet — it becomes a query against the source and a model somebody can refresh.<\/p>\n<p>Modern Excel has also quietly become more capable: <strong>dynamic arrays<\/strong> mean a formula can <strong>spill<\/strong> into neighbouring cells, and <code>FILTER<\/code>, <code>SORT<\/code>, <code>UNIQUE<\/code> and <code>SEQUENCE<\/code> remove most of the reasons people used to need array formulas or helper columns.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>A VLOOKUP with the fourth argument omitted, matching approximately by default.<\/li>\n<li>Hard-coded ranges that stop short of new rows.<\/li>\n<li>Pivoting data that is still in wide form.<\/li>\n<li>Cleaning by hand, repeatedly, instead of recording the steps in Power Query.<\/li>\n<li>Keeping a number that several people depend on in a file that has no version history.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Microsoft Support, \"XLOOKUP function\". <a href=\"https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929<\/a><\/li>\n<li>Microsoft Support, \"Excel specifications and limits\". <a href=\"https://support.microsoft.com/en-us/office/excel-specifications-and-limits-1672b34d-7043-467e-8e27-269d656771c3\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/office/excel-specifications-and-limits-1672b34d-7043-467e-8e27-269d656771c3<\/a><\/li>\n<li>Microsoft Learn, \"Power Query documentation\" — the transformation engine shared with Power BI. <a href=\"https://learn.microsoft.com/en-us/power-query/\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-query/<\/a><\/li>\n<li>Microsoft Support, \"Dynamic arrays and spilled array behavior\". <a href=\"https://support.microsoft.com/en-us/office/dynamic-arrays-and-spilled-array-behavior-205c6b06-03ba-4151-89a1-87a7eb36e531\" target=\"_blank\" rel=\"noopener\">https://support.microsoft.com/en-us/office/dynamic-arrays-and-spilled-array-behavior-205c6b06-03ba-4151-89a1-87a7eb36e531<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"payroll","num":5,"domain":"hcm","track":"functional","title":"The Payroll Object Chain","sub":"Element → eligibility → entry → run → balance → prepayment → payment → costing","hue":152,"minutes":11,"labs":["payroll"],"terms":["element","element-classification","element-eligibility-element-link","element-entry","input-value","balance","salary-basis","payroll-definition","payroll-run","quickpay","prepayments","payment-process-bank-file","costing","parallel-run"],"html":"<p>Payroll in Oracle is a chain of objects, each depending on the one before it. A consultant who can recite the chain and explain what breaks when a link is missing can debug most payroll problems without opening a log. The chain runs: element → element eligibility → element entry → payroll run → balance → prepayment → payment → costing.<\/p>\n<h2>Defining what can be paid<\/h2>\n<p>An <strong>element<\/strong> is the definition of a single thing that can appear on a payslip: a salary, an allowance, a deduction or an informational item. Payroll is built from named, individually configured components — \"Basic Salary\", \"Transport Allowance\", \"Social Insurance Employee Contribution\", \"Loan Deduction\" — rather than one monolithic calculation, so that each can carry its own rules, taxability and reporting treatment. Elements live inside one LDG and must be rebuilt per country. Every payslip line traces back to an element, and reading a client's element list is one of the first tasks on a project.<\/p>\n<p>Each element has a <strong>classification<\/strong> — earnings, deduction, information — which controls processing order and how the element feeds balances. Payroll must process earnings before it can calculate deductions based on them, so classification drives sequencing: standard earnings, supplemental earnings, pre-statutory deductions, statutory deductions, voluntary deductions. When a calculation runs in the wrong order, classification and processing priority are the first things to check.<\/p>\n<p>An element's <strong>input values<\/strong> are the fields that hold the data the calculation needs — amount, rate, percentage, units. A \"Loan Deduction\" element might carry input values for total loan amount, monthly instalment and remaining balance. Deciding an element's input values is a core design decision recorded in the configuration workbook.<\/p>\n<h2>Who can get it, and who does<\/h2>\n<p>Creating an element does nothing on its own. <strong>Element eligibility<\/strong> (historically \"element link\") defines which population the element applies to, by criteria such as payroll, legal employer, grade, job or department: \"Car Allowance is eligible for grade G7 and above in the Cairo business unit.\" Without eligibility, an element cannot be given to anyone. This is the most common cause of \"why can't I add this allowance to this employee?\" — the answer is almost always that eligibility does not cover them. Eligibility defined too narrowly at build time is considerably messier to widen once entries exist.<\/p>\n<p>An <strong>element entry<\/strong> is the actual attachment of an element to a specific person, with values and dates: a transport allowance of EGP 800 per month effective 1 March. Eligibility says who <em>could<\/em> receive something; the entry says who <em>does<\/em>, and how much. Entries can be created manually, loaded in bulk with HCM Data Loader (Chapter 11), or generated automatically.<\/p>\n<p>The <strong>salary basis<\/strong> decides how salary is stored, quoted and paid — annual, monthly or hourly — and which element it feeds. An annual basis stores EGP 240,000 and pays EGP 20,000 monthly. Getting the basis wrong multiplies or divides everyone's pay by twelve, so always confirm how the client quotes salary in offer letters before configuring it.<\/p>\n<h2>Running it<\/h2>\n<p>A <strong>payroll definition<\/strong> is the calendar: frequency, period start and end dates, cut-off dates and payment date — \"Egypt Monthly Payroll, calendar months, cut-off on the 25th, paid on the last working day.\" A person must be assigned to a payroll, on the assignment, before they can be processed.<\/p>\n<p>The <strong>payroll run<\/strong> (Calculate Payroll) is the engine that calculates gross-to-net for a population for a period: it evaluates elements, applies formulas, and produces run results and balances, held against the payroll relationship. Errors at this stage typically point to missing entries, missing eligibility or formula problems. <strong>QuickPay<\/strong> runs the same calculation for a single person outside the main run — the primary testing tool during configuration (change an element, QuickPay one employee, check the result) and the mechanism for off-cycle payments such as a final settlement.<\/p>\n<p>A <strong>balance<\/strong> is an accumulated total of element results over a period and dimension: gross pay year-to-date, taxable earnings month-to-date. Balances have dimensions (period-, month-, quarter-, year-to-date) and scope (assignment or relationship level). Statutory calculations, payslips and reports all depend on them, and when a report shows a wrong total the balance feed is usually where the problem lives. Balances do not span payroll relationships — which is why year-to-date figures reset on a global transfer.<\/p>\n<h2>After the run<\/h2>\n<p>Calculation and payment are separate steps. <strong>Prepayments<\/strong> takes the run results and distributes them across each person's payment methods — someone may split their salary across two bank accounts. It runs after the payroll run and before the payment process, and it is the step people forget exists until a payment fails. Oracle's standard flow then archives the results, generates payslips, and produces the payments: the <strong>payment process<\/strong> creates the bank file. In Saudi Arabia and the UAE, the file must follow the Wage Protection System SIF format (Chapter 17), and a Gulf go-live always includes a bank-file test with the actual bank. The bank file is a common cause of go-live delay; never treat it as an afterthought.<\/p>\n<p><strong>Costing<\/strong> allocates payroll results to accounting segments so the cost lands in the right place in the general ledger, broken down by department, project or cost centre. It is the bridge between HCM and Finance and is often owned jointly with a finance consultant.<\/p>\n<div class=\"lab-embed\" data-lab=\"payroll\"><\/div>\n\n<h2>Proving it works: the parallel run<\/h2>\n<p>A <strong>parallel run<\/strong> executes the new system's payroll alongside the legacy payroll for the same period and reconciles the two line by line. It is the only reliable proof that the new payroll is correct before the old one is switched off, and it typically runs for two or three consecutive months before go-live. Differences must be explained, not just noted. It is also the highest-stakes activity before go-live, and the point where a consultant with analytical instincts is visibly useful.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Creating an element and expecting it to appear on payslips. Nothing happens until eligibility exists and an entry is made.<\/li>\n<li>Confusing eligibility (who could) with entry (who does).<\/li>\n<li>Forgetting prepayments sits between calculation and payment.<\/li>\n<li>Treating the bank file as a formality.<\/li>\n<li>Believing go-live means done. Hypercare and the first live payroll are the finish line.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Administering Payroll<\/em> — \"Payroll Processes\" (calculate, prepayments, archive, payments). <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21a/faaus/payroll-processes.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21a/faaus/payroll-processes.html<\/a><\/li>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"Overview of Payroll Costing\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigp/overview-of-payroll-costing.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigp/overview-of-payroll-costing.html<\/a><\/li>\n<li>Oracle, <em>Administering Global Payroll<\/em> — \"Overview of Administering Payroll Relationships\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"absence","num":6,"domain":"hcm","track":"functional","title":"Absence Management","sub":"Where labour law becomes configuration","hue":98,"minutes":8,"labs":["leave"],"terms":["absence-type","absence-plan","accrual-plan","qualification-plan","no-entitlement-plan","compensatory-plan","eligibility-profile","accrual-band","carryover","leave-encashment"],"html":"<p>Absence is the module where a country's labour law turns into configuration. Every leave entitlement in the statute becomes an absence plan with rules, and every rule becomes a test script. The Egyptian annual-leave ladder is the classic accrual exercise; Egyptian sick leave is the classic qualification plan.<\/p>\n<h2>Types are what people see; plans are the rules<\/h2>\n<p>An <strong>absence type<\/strong> is what the worker actually selects when requesting leave — \"Annual Leave\", \"Sick Leave\", \"Maternity Leave\". It controls display and entry behaviour: whether half days are allowed, whether an end date is required, what documentation is needed. Every type must be associated with at least one plan. Clients describe requirements in terms of types (\"we need a Hajj leave\"); the consultant translates that into a type plus the plan behind it.<\/p>\n<p>An <strong>absence plan<\/strong> is the rules engine behind the type: who is eligible, how entitlement is earned or granted, and how it is paid. Oracle defines six plan types, and naming all six is a small, cheap differentiator, because most beginners know only two:<\/p>\n<ul>\n<li><strong>Accrual<\/strong> — workers accumulate time over a period for paid leave, such as a vacation plan.<\/li>\n<li><strong>Qualification<\/strong> — workers qualify for an entitlement on an event and receive payments during the absence, with payment percentages that can vary by band.<\/li>\n<li><strong>No entitlement<\/strong> — tracks absences without maintaining a balance or providing entitlement, typically unpaid leave.<\/li>\n<li><strong>Compensatory<\/strong> — tracks earned compensatory time that can be taken as time off, instead of overtime pay.<\/li>\n<li><strong>Agreement<\/strong> — plans built under statutory or collective-agreement rules.<\/li>\n<li><strong>Donation<\/strong> — tracks donated time that a worker receives.<\/li>\n<\/ul>\n<h2>Accrual plans and bands<\/h2>\n<p>An <strong>accrual plan<\/strong> accumulates leave over time, with rules for accrual rate, ceilings and carryover. Oracle supports front-loaded accrual (the whole year's entitlement granted at the start of the plan term) and incremental accrual (earned period by period). <strong>Accrual bands<\/strong> grant different rates to different popula
