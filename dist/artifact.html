OUP BY, except the rows survive.","terms":["window-function","partition-by"]},{"ch":"sql-windows","q":"Your running total is wrong on days that have two orders. Why?","a":"The default frame. With an ORDER BY and no frame clause, the default is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, and RANGE treats every row sharing an ordering value as one unit — so both rows on that date get the total including both, rather than stepping one at a time. Writing ROWS explicitly fixes it. It's a nasty bug because on data with no ties the two are identical, so it survives testing.","terms":["frame-clause","window-function"]},{"ch":"sql-windows","q":"How do you keep exactly one row per customer — say their most recent order?","a":"ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) in a CTE, then filter to row number 1 outside it. You can't filter a window function in WHERE because WHERE runs before SELECT. And the ORDER BY needs a deliberate tiebreaker — otherwise two orders on the same date make the result unstable between runs.","terms":["row-number-rank-dense-rank","cte","window-function"]},{"ch":"excel","q":"You inherit a spreadsheet full of VLOOKUPs. What do you check first?","a":"The fourth argument. Omitted, it defaults to TRUE — approximate match — which assumes the lookup column is sorted and returns the nearest smaller value if it isn't. On unsorted data that gives confidently wrong answers rather than errors, so nobody notices. Anything new I'd write as XLOOKUP, which defaults to exact match, can look left, and references arrays rather than a column number so inserting a column doesn't break it.","terms":["xlookup","index-match"]},{"ch":"excel","q":"When is Excel the right answer, and when has it stopped being one?","a":"It's the fastest tool in existence for a question nobody has asked before, on data just handed to you, where the answer is needed in ten minutes and never again. It stops the moment a number matters to more than one person or has to be reproduced next month — because a spreadsheet has no audit trail, no real access control, and no way to tell whether the copy you were emailed is current. At that point it becomes a query against the source and a model somebody can refresh.","terms":["excel-limits","power-query"]},{"ch":"excel","q":"Why is Power Query the highest-return thing to learn in Excel?","a":"Because it makes the cleaning repeatable and inspectable. It imports, reshapes, unpivots, splits and joins, and it records every step — so next month's file is one click, and a colleague can read what you did. A folder of manually cleaned spreadsheets contains no such record. And it's the same engine in Power BI, so none of the effort is Excel-specific.","terms":["power-query","excel-table"]},{"ch":"powerbi-model","q":"Why does Power BI want a star schema rather than one flat table?","a":"Because the engine's compression and its filter propagation are both built around it. One fact table of the events you measure, surrounded by dimension tables of the things you slice by, each joined on a single key. It's smaller, faster and far easier to reason about than a flat wide table, and Microsoft's own guidance says so. Given a flat export, splitting the dimensions out of it is the first modelling job.","terms":["star-schema","fact-table","dimension-table"]},{"ch":"powerbi-model","q":"A slicer isn't filtering a visual. Someone suggests turning on bidirectional filtering. What do you say?","a":"That it's the tempting fix and usually the wrong one. Filters are meant to flow from the one side to the many — select a product, the sales rows filter. Making a relationship filter both ways can create ambiguous paths through the model, make results depend on evaluation order, and slow queries down. I'd look first for a missing bridge table or a model that isn't really a star, and reach for bidirectional last, deliberately.","terms":["cross-filter-direction","relationship-cardinality"]},{"ch":"powerbi-model","q":"How do you decide whether a calculation belongs in Power Query or DAX?","a":"Roche's Maxim: transform as far upstream as possible, and as far downstream as necessary. If the calculation gives the same answer regardless of what the user has selected, it's a transformation — do it in the source or Power Query, where it happens once at refresh and every report benefits. Leave to DAX only what genuinely depends on the filter context. Otherwise nobody can find where a number is defined, and the same fix has to be made four times.","terms":["roches-maxim","power-query"]},{"ch":"dax","q":"When do you write a measure and when a calculated column?","a":"A calculated column is computed row by row at refresh and stored, so it knows the current row and nothing about the report — use it for something you need to slice, group or filter by. A measure is computed at query time in the filter context of each cell, so it knows nothing about rows and everything about what the user selected — use it for anything you aggregate. The default should be a measure; a calculated column holding Quantity times Price on ten million rows costs memory and can't respond to a slicer.","terms":["measure-vs-calculated-column","filter-context"]},{"ch":"dax","q":"A stakeholder says your measure is wrong in the total row. What's usually going on?","a":"The total row is a different filter context, not the sum of the rows above it. The measure is evaluated once per cell under whatever filters that cell sits in, and the total cell has fewer filters — so for anything non-additive, like a ratio or a distinct count, the total legitimately isn't the column sum. It's almost never the measure and almost always the context, and the explanation is usually what the stakeholder actually needs.","terms":["filter-context","measure-vs-calculated-column"]},{"ch":"dax","q":"What does CALCULATE do, and what surprises people about it?","a":"It evaluates an expression in a filter context it has modified — it's the centre of the language. What surprises people is that its filter arguments replace existing filters on the same column rather than adding to them, so filtering to Cairo returns Cairo even in a cell already filtered to Alexandria. KEEPFILTERS makes it intersect instead. The other surprise is context transition: called in a row context, it turns that row into a filter context, which is behind most DAX behaviour that looks like magic.","terms":["calculate","context-transition"]},{"ch":"question-to-chart","q":"Someone asks you to 'look at our sales'. What happens next?","a":"A short conversation, not three hours of dashboard building. What decision does the answer feed? Over what period, and compared with what — a number with nothing to compare it to isn't information. Which population counts: are churned customers, test accounts and trials in or out? What would count as a surprising answer? Then I repeat it back as one sentence and get agreement. That sentence is the specification, and it's usually the chart title.","terms":["business-question","dashboard-vs-report"]},{"ch":"question-to-chart","q":"Why must a bar chart's axis start at zero when a line chart's need not?","a":"Because they encode differently. Bars encode value by length, so truncating the axis at 90 makes a 2% difference look like a doubling — the reader is comparing lengths that no longer mean what they look like. A line encodes change by slope, and forcing a zero baseline often flattens exactly the movement you're showing, so truncation is legitimate there as long as the axis is labelled honestly.","terms":["truncated-axis","chart-choice"]},{"ch":"question-to-chart","q":"What do you do before presenting a number?","a":"Reconcile it against something the business already trusts — last month's close, the finance figure, the count in the source system. If it doesn't match, find out why before the meeting, because someone in the room will ask. Then spot-check individual rows against the source and look at the boundaries: first period, last period, nulls, categories with one row. And say what I'm unsure about — a flagged caveat costs nothing, a number that quietly turns out to be wrong costs trust.","terms":["sanity-check","business-question"]},{"ch":"org","q":"A client has five companies on the org chart. How do you work out how many legal entities to create?","a":"By the commercial registers, not the org chart. A legal entity is an organization recognized by law — its own register number and tax card. Groups routinely run acquired companies as one business long after the paperwork says otherwise, and the reverse happens too. Ask for the registration certificates and count those. Then decide separately which of them actually employ people, because only those need the legal employer classification.","terms":["legal-entity","legal-employer"]},{"ch":"org","q":"A legal entity is a legal employer but not a payroll statutory unit. What does Oracle require?","a":"A parent PSU has to be entered on it. Its legal reporting units are then created as tax reporting units under that parent rather than under the entity itself. That is the shape a shared-services group takes: several legal employers, one entity doing the statutory filing for all of them.","terms":["legal-employer","payroll-statutory-unit-psu","tax-reporting-unit-tru"]},{"ch":"org","q":"Why does business unit design decide how much duplicate configuration a client lives with?","a":"Because set-enabled data — jobs, grades, locations, departments — is grouped into reference data sets and those sets are assigned to business units. Data in the Common Set is available everywhere; data in a specific set is only available to the units it is assigned to. Split the units too finely and the same six jobs get built repeatedly; share too broadly and a hiring manager scrolls four hundred entries to find one.","terms":["business-unit-bu","reference-data-set"]},{"ch":"org","q":"Which decisions in the enterprise structure are effectively permanent?","a":"The legislation and currency on a legislative data group, which cannot be altered once payroll data exists inside it; and the legal employer a worker sits in, which changes only by ending one employment and starting another. Business unit design is expensive rather than permanent, because reference data sets attach to it. Departments, divisions, locations and tree structure are cheap — they move with ordinary effective-dated updates.","terms":["legislative-data-group-ldg","legal-employer","business-unit-bu"]},{"ch":"org","q":"A department-level HR access requirement cannot be delivered no matter how the roles are configured. What is usually missing?","a":"The department tree. Security profiles scope data by tree node, so 'everyone in Manufacturing and below' is a statement about a hierarchy. If the departments exist as a flat list and no tree was ever built and published, there is nothing for the security profile to grip.","terms":["organization-tree","department"]},{"ch":"model","q":"A client asks you to add a field for 'highest qualification'. Which object does it belong on, and how do you decide?","a":"The person, because it is true of the human regardless of who employs them and does not change when they change job or employer. The test I apply is: does it change when they change employer? Then work relationship. When they change job? Assignment. Does payroll need to accumulate it across the year? Payroll relationship. Otherwise it is a person attribute. Putting it on the assignment would mean re-entering it on every promotion and losing it on a rehire.","terms":["person","assignment","work-relationship"]},{"ch":"model","q":"An employee is showing as active but was not paid in the last run. Where do you look first?","a":"The assignment status. Status controls whether the assignment is active for HR purposes and, separately, whether it is eligible for payroll processing — those are two different things, and a status that is active but payroll-ineligible is a valid combination used for unpaid leave. After that I would check the payroll relationship's last standard process date if the person has been terminated, and then element eligibility.","terms":["assignment-status","last-standard-process-date","payroll-relationship"]},{"ch":"model","q":"Why does Oracle group assignments under a payroll relationship instead of calculating per assignment?","a":"Because statutory arithmetic is per person per statutory unit, not per job. If someone holds two assignments and each were calculated in isolation, the social-insurance ceiling and the tax brackets would apply twice and the deduction would be wrong. The payroll relationship groups the assignments so the ceiling, the bracket and the annual accumulation apply once to the whole person. It is also why balances stop at the payroll relationship and never span two of them.","terms":["payroll-relationship","concurrent-employment"]},{"ch":"model","q":"A worker who left three years ago is being rehired, and the client says their service should count from the original start date. How do you configure that?","a":"With a seniority date, not by back-dating the new work relationship. The person record is reused, a new work relationship and a new payroll relationship are created, and balances start fresh. The seniority date is what carries continuous service across the break, which is what gratuity, leave bands and notice periods read. Back-dating the work relationship would assert the person was employed during a period they were not, which corrupts headcount history and absence accruals.","terms":["seniority-date","work-relationship","person"]},{"ch":"model","q":"Walk me through a global transfer from Egypt to Saudi Arabia and give the object counts at the end.","a":"Legally it is a new employment, so the Egyptian work relationship is terminated and a new one is created under the Saudi legal employer. A new payroll relationship is created under the Saudi PSU, which sits in a different legislative data group, so none of the Egyptian configuration applies. The person record is untouched. Counts at the end: one person record, two work relationships with the first ended, two payroll relationships with the first ended. Year-to-date balances restart at zero because balances never span payroll relationships, and whether service bridges the move is a policy decision expressed through seniority dates.","terms":["global-transfer","work-relationship","payroll-relationship","seniority-date"]}]}</script>

     terms[], minutes, html}. The HTML is built from Markdown source
     (chapters-*.md) by build.py; [[lab:id]] in the source embeds a lab.
   • Glossary terms live in DATA.terms: {id, name, what, trap, ch}.
   • Drill questions live in DATA.questions: {ch, q, a, terms[]}.
   • Labs are functions in LABS: {id, ch, title, lead, render(el)}.
   • Readers can add their own terms and questions in-page; those, plus
     progress and notes, live in state S (browser storage, synced to the
     page's database when available).
   ===================================================================== */
const DATA = JSON.parse(document.getElementById('hcm-data').textContent);
const CH = DATA.chapters; const chById = id => CH.find(c=>c.id===id);
const TERMS = {}; DATA.terms.forEach(t=>TERMS[t.id]=t);
const allTerms = () => [...DATA.terms, ...S.custom];

/* ---------- state ---------- */
const S = {known:{},read:{},notes:{},drill:{},custom:[],customQ:[],updatedAt:0};
const LS='hcm-atlas-v2';
try{ const raw=localStorage.getItem(LS); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){}
let db=null, saveTimer=null;
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(db) db.doc('progress/main').set(JSON.parse(JSON.stringify(S))).catch(()=>{}); },600); }
(async()=>{ try{ if(!window.claude||!window.claude.use) return; db=await claude.use('db'); if(!db) return;
  const snap=await db.doc('progress/main').get(); if(snap.exists){ const d=snap.data(); if((d.updatedAt||0)>(S.updatedAt||0)){ Object.assign(S,d); render(); } else save(); } else save();
  const el=document.getElementById('sync'); el.classList.add('on'); el.querySelector('span').textContent='Progress synced across devices'; }catch(e){ db=null; } })();
let sample=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ sample=await claude.use('sample'); if(sample) document.querySelectorAll('.needs-sample').forEach(x=>x.hidden=false); } }catch(e){} })();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-EG');
const fmt2 = n => n.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function pct(a,b){ return b?Math.round(100*a/b):0; }
function termExplain(id){ const t=TERMS[id]; if(!t) return ''; return `<b>${esc(t.name)}</b><br>${esc(t.what)}${t.trap?`<div class="muted" style="margin-top:6px"><b style="color:var(--gold)">Watch out:</b> ${esc(t.trap)}</div>`:''}`; }
/* Stable heading ids: derived from the text, so a deep link keeps working when
   a section moves or a lab is added. Deduped against ids already handed out. */
function slugId(text, taken){ const base='h-'+String(text).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); let id=base,n=2; while(taken.has(id)) id=base+'-'+(n++); taken.add(id); return id; }
function explainBox(id, init){ return `<div class="explain" id="${id}">${init}</div>`; }
function knownBtn(id){ return `<span class="known ${S.known[id]?'on':''}" data-known="${esc(id)}" title="Mark as known" role="button" tabindex="0"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></span>`; }
function wireKnown(root){ root.querySelectorAll('[data-known]').forEach(k=>{ const h=e=>{ e.preventDefault(); e.stopPropagation(); const id=k.dataset.known; S.known[id]=!S.known[id]; if(!S.known[id]) delete S.known[id]; save(); k.classList.toggle('on',!!S.known[id]); }; k.onclick=h; k.onkeydown=e=>{ if(e.key==='Enter'||e.key===' ') h(e); }; }); }

/* ---------- collections ----------
   A chapter belongs to a domain; everything downstream of it — its terms, labs,
   figures and drill questions — inherits that. The views show one collection at
   a time; only search reaches across all of them. */
const DOMAINS=DATA.domains;
const domById=id=>DOMAINS.find(d=>d.id===id);
const chDomain=id=>{ const c=chById(id); return c?c.domain:DOMAINS[0].id; };
let dom=DOMAINS[0].id;
const CHD=()=>CH.filter(c=>c.domain===dom);
const domTerms=()=>allTerms().filter(t=>chDomain(t.ch)===dom);
const domQuestions=()=>DATA.questions.filter(q=>chDomain(q.ch)===dom);
const domLabs=()=>LABS.filter(l=>chDomain(l.ch)===dom);
const VIEWS=['home','chapters','labs','glossary','drill','about'];
const SECTIONS=[['home','Home'],['chapters','Chapters'],['labs','Labs'],['glossary','Glossary'],['drill','Drill'],['about','About']];

/* ---------- router ----------
   #<domain>/<view>[/<id>[/<section>]] — e.g. #hcm/chapters/org/h-the-ldg.
   A hash whose first segment is a view instead (the pre-collections format)
   still resolves, against the first collection. */
let route={view:'overview'}, lastHash='';
function go(view, extra={}){
  if(extra.dom){ dom=extra.dom; delete extra.dom; }
  route={view,...extra};
  lastHash=view==='overview'?'overview':[dom,view,extra.ch||extra.lab||'',extra.sec||''].filter(Boolean).join('/');
  location.hash=lastHash; render(); if(!extra.sec) window.scrollTo({top:0});
}
function parseHash(){
  const parts=location.hash.slice(1).split('/').filter(Boolean);
  if(!parts.length||parts[0]==='overview') return {view:'overview'};
  let d=parts[0], rest=parts.slice(1);
  if(!domById(d)){ d=DOMAINS[0].id; rest=parts; }        // legacy #chapters/org
  dom=d;
  const [v,x,y]=rest; const r={view:VIEWS.includes(v)?v:'home'};
  if(r.view==='chapters'&&x){ r.ch=x; if(y) r.sec=y; }
  if(r.view==='labs'&&x) r.lab=x;
  return r;
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h===lastHash) return; lastHash=h; route=parseHash(); render(); window.scrollTo({top:0}); });

function renderNav(){
  const over=route.view==='overview';
  // Set on the root so fixed overlays outside .app — the speech bar, the
  // palette — resolve --p too. Chapters and labs override it further down.
  const r=document.documentElement;
  r.setAttribute('data-h',''); r.style.setProperty('--h', domById(dom).hue);
  $('#domainNav').innerHTML=DOMAINS.map(d=>`<button class="dtab ${!over&&d.id===dom?'on':''}" data-h style="--h:${d.hue}" data-dom="${d.id}" aria-current="${!over&&d.id===dom}">${icon('domain-'+d.id)}<span>${esc(d.short)}</span></button>`).join('');
  $('#sectionNav').innerHTML=over?'':SECTIONS.map(([v,l])=>`<button class="sec-btn ${v===route.view?'on':''}" data-go="${v}" aria-current="${v===route.view}">${icon('nav-'+v)}<span>${l}</span></button>`).join('');
  $('#domainNav').querySelectorAll('[data-dom]').forEach(b=>b.addEventListener('click',()=>go('home',{dom:b.dataset.dom})));
  $('#sectionNav').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
}
function render(){
  speechStop();
  renderNav();
  ({overview:renderOverview,home:renderHome,chapters:renderChapters,labs:renderLabs,glossary:renderGlossary,drill:renderDrill,about:renderAbout}[route.view]||renderOverview)($('#view'));
}
document.querySelectorAll('[data-go]').forEach(b=>{ if(b.closest('.topbar')&&!b.closest('#sectionNav')) b.addEventListener('click',()=>go(b.dataset.go)); });
$('#themeBtn').addEventListener('click',()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme'); const next=cur==='dark'?'light':cur==='light'?'':'dark'; if(next) r.setAttribute('data-theme',next); else r.removeAttribute('data-theme'); try{localStorage.setItem('hcm-theme',next);}catch(e){} });
try{ const th=localStorage.getItem('hcm-theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

/* ---------- progress ---------- */
function cardIds(d=dom){ const ids=[];
  allTerms().forEach(t=>{ if(chDomain(t.ch)===d) ids.push('t:'+t.id); });
  DATA.questions.forEach((q,i)=>{ if(chDomain(q.ch)===d) ids.push('q:'+i); });
  S.customQ.forEach(q=>{ if(chDomain(q.ch)===d) ids.push('c:'+q.id); });
  return ids; }
function progress(d=dom){ const chs=CH.filter(c=>c.domain===d), ts=allTerms().filter(t=>chDomain(t.ch)===d);
  const cards=cardIds(d);
  return {total:ts.length, known:ts.filter(t=>S.known[t.id]).length,
          read:chs.filter(c=>S.read[c.id]).length, chapters:chs.length,
          cards:cards.length, solid:cards.filter(c=>S.drill[c]===2).length,
          shaky:cards.filter(c=>S.drill[c]===1).length}; }

/* ================= HOME ================= */
/* Per-chapter progress: one column per chapter, filled by the share of its
   terms marked known, ticked when the chapter is read. Clicking opens it. */
function chapterProgress(){
  const rows=CHD().map(c=>{ const t=c.terms.length, k=c.terms.filter(id=>S.known[id]).length;
    return {c,t,k,pct:t?Math.round(100*k/t):0,read:!!S.read[c.id]}; });
  const done=rows.filter(r=>r.read).length, allKnown=rows.filter(r=>r.t&&r.k===r.t).length;
  return `<div class="pchart card">
    <div class="pchart-head"><div><div class="eyebrow">Where you are, chapter by chapter</div><p class="small muted">Column height is the share of that chapter's terms you have marked known. A tick means you marked the chapter read.</p></div>
      <div class="pchart-key"><span>${done} read</span><span>${allKnown} fully known</span></div></div>
    <div class="pchart-grid" style="--cols:${rows.length}">${rows.map(r=>`<button class="pcol ${r.read?'read':''}" data-h style="--h:${r.c.hue}" data-ch="${r.c.id}" aria-label="Chapter ${r.c.num}, ${esc(r.c.title)} — ${r.k} of ${r.t} terms known${r.read?', read':''}"><span class="pcol-v">${r.pct}%</span><span class="pcol-trk"><i style="height:${r.pct}%"></i></span><span class="pcol-n">${r.c.num}</span>${r.read?'<span class="pcol-ok">✓</span>':'<span class="pcol-ok off"></span>'}</button>`).join('')}</div>
  </div>`;
}

/* Each collection's home map is laid out by hand — the arrangement carries
   meaning a generated grid cannot. A collection without one falls back to a
   plain grouping by track. The build checks every chapter appears on one. */
const MAPS = {
  hcm: (node, sec) => `
    ${sec('functional','Functional','What the business configures and runs: the structures people sit in, the record that describes them, and the money, time and law that follow.')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">Structure — what exists before anyone is hired</div>${node('org')}${node('workforce','two')}
      <div class="layer-lbl">People — the data model everything reads from</div>${node('model','two')}${node('hrfunction')}
      ${node('dating','wide')}
      <div class="layer-lbl">Money &amp; time — what the model feeds</div>${node('payroll')}${node('absence')}${node('lifecycle')}
      <div class="layer-lbl">Law — the rules configured per country</div>${node('egypt-payroll')}${node('egypt-leave')}${node('gulf')}
      <div class="layer-lbl">Delivery — how the project is run</div>${node('method','full')}
    </div></div>
    ${sec('technical','Technical','What the consultant builds with: loading data in bulk, writing the calculation logic, getting information back out, extending without customizing, and controlling who sees what.')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">The consultant’s toolkit</div>${node('hdl')}${node('ff')}${node('reporting')}${node('extend','two')}${node('security')}
    </div></div>`,

  analytics: (node, sec) => `
    ${sec('functional')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">Before the tool — what a row means</div>${node('tables','full')}
      <div class="layer-lbl">And after it — what a reader takes away</div>${node('excel')}${node('question-to-chart','two')}
    </div></div>
    ${sec('technical')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">SQL — getting the rows out, in three passes</div>${node('sql-shape')}${node('sql-joins')}${node('sql-windows')}
      <div class="layer-lbl">Power BI — the model decides whether the numbers are right</div>${node('powerbi-model','two')}${node('dax')}
    </div></div>`,
};

function renderHome(v){
  const d=domById(dom), pr=progress();
  const node=(id,cls='')=>{const c=chById(id);return `<button class="mnode ${cls}" data-h style="--h:${c.hue}" data-ch="${id}"><span class="k">${c.num}</span><div class="t">${icon(c.id)}<span>${esc(c.title)}</span></div><div class="s">${esc(c.sub)}</div>${S.read[id]?'<span class="done">✓</span>':''}</button>`;};
  const stat=(to,val,p2,lbl)=>`<button class="hstat" data-go2="${to}"><div class="ring" style="--v:${p2}"><b>${p2}%</b></div><div><div class="big num">${val}</div><div class="lbl">${lbl}</div></div></button>`;
  const L=t=>d.tracks[t];
  const sec=(track,name,blurb)=>`<div class="sec-lbl"><span class="sec-k ${track}">${name||L(track).name}</span>${(blurb||L(track).blurb)?`<p>${blurb||L(track).blurb}</p>`:''}</div>`;
  const auto=()=>['functional','technical'].map(t=>{ const list=CHD().filter(c=>c.track===t); if(!list.length) return '';
      return sec(t)+`<div class="sysmap-scroll"><div class="sysmap-inner">${list.map(c=>node(c.id)).join('')}</div></div>`; }).join('');
  const first=CHD()[0];
  v.innerHTML=`<section class="hero" data-h style="--h:${d.hue}">
    <div class="hero-side">${stat('chapters',`${pr.read} / ${pr.chapters}`,pct(pr.read,pr.chapters),'chapters read')}${stat('glossary',`${pr.known} / ${pr.total}`,pct(pr.known,pr.total),'terms marked known')}${stat('drill',`${pr.solid} / ${pr.cards}`,pct(pr.solid,pr.cards),'drill cards solid')}</div>
    <div class="hero-main"><div class="eyebrow">${esc(d.name)}</div><h1>${esc(d.tagline)}</h1><p>${esc(d.blurb)}</p><div class="cta">${first?`<button class="btn gold" data-go2="chapters" data-ch2="${first.id}">Start with Chapter 1</button>`:''}${domLabs().length?'<button class="btn" data-go2="labs">Open the labs</button>':''}</div></div>
  </section>
  ${chapterProgress()}
  <div class="eyebrow" style="margin:22px 0 10px">The whole collection on one screen — each block is a chapter</div>
  <div class="sysmap card">
    ${MAPS[dom]?MAPS[dom](node,sec):auto()}
    <div class="legend"><span>Colour is consistent everywhere: the chapter’s colour marks its labs, its glossary terms and its drill cards.</span><span>Dashed = a foundation that runs under every record above it.</span></div>
  </div>
  ${dom==='hcm'?`<div class="paths3">
    <button class="path3 card" data-go2="chapters" data-ch2="model"><span class="n">If you read one chapter</span><h3>The Employment Data Model</h3><p>Person, work relationship, assignment, payroll relationship. Everything else reads from it.</p></button>
    <button class="path3 card" data-go2="chapters" data-ch2="egypt-payroll"><span class="n">If you work in Egypt</span><h3>Social Insurance &amp; Salary Tax</h3><p>Oracle does not ship these rules. Knowing them is the differentiator.</p></button>
    <button class="path3 card" data-go2="chapters" data-ch2="hdl"><span class="n">If you want to be useful on day one</span><h3>Loading Data: HDL</h3><p>Bulk loads land on functional consultants. Most avoid them.</p></button>
  </div>
  <div class="callout" style="margin-top:22px"><b>Numbers move.</b> Egyptian insurable-wage limits rise every January; Saudi GOSI rates are phasing up through 2028; labour-law summaries still disagree on details. Statutory figures here were verified in 2026 and each chapter lists its sources. Re-check with the authority before quoting a figure to a client.</div>`:''}`;
  v.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>go('chapters',{ch:b.dataset.ch})));
  v.querySelectorAll('[data-go2]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go2, b.dataset.ch2?{ch:b.dataset.ch2}:{})));
}

/* ================= OVERVIEW ================= */
function renderOverview(v){
  const card=d=>{ const pr=progress(d.id), chs=CH.filter(c=>c.domain===d.id);
    const labs=LABS.filter(l=>chDomain(l.ch)===d.id).length;
    const mins=chs.reduce((a,c)=>a+c.minutes,0);
    return `<button class="dcard glass" data-h style="--h:${d.hue}" data-open="${d.id}">
      <div class="dcard-top"><span class="dcard-ico">${icon('domain-'+d.id)}</span><div><div class="dcard-name">${esc(d.name)}</div><div class="dcard-tag">${esc(d.tagline)}</div></div></div>
      <p class="dcard-blurb">${esc(d.blurb)}</p>
      <div class="dcard-stats"><span><b class="num">${chs.length}</b> chapters</span><span><b class="num">${mins}</b> min</span><span><b class="num">${pr.total}</b> terms</span>${labs?`<span><b class="num">${labs}</b> labs</span>`:''}</div>
      <div class="dcard-prog"><div class="bar"><i style="width:${pct(pr.read,pr.chapters)}%"></i></div><span>${pr.read} of ${pr.chapters} chapters read</span></div>
    </button>`; };
  const started=CH.filter(c=>S.read[c.id]);
  v.innerHTML=`<section class="over-hero">
    <div class="eyebrow">Moon Learning</div>
    <h1>Everything I am studying, in one place.</h1>
    <p class="over-lede">Two collections so far. Each is written to be read in order, with interactive labs for the ideas that only make sense once they move, a glossary of the vocabulary, and a drill deck to make it stick. Nothing here is a copied cheat sheet — it is written out, and every chapter says where it came from.</p>
  </section>
  <div class="dgrid">${DOMAINS.map(card).join('')}</div>
  ${started.length?`<div class="over-cont"><div class="eyebrow">Pick up where you left off</div><div class="cont-row">${started.slice(-4).reverse().map(c=>`<button class="cont card" data-h style="--h:${c.hue}" data-jump="${c.id}">${icon(c.id)}<div><b>${esc(c.title)}</b><span>${esc(domById(c.domain).short)} · Ch. ${c.num}</span></div></button>`).join('')}</div></div>`:''}
  <p class="over-foot">Progress, notes and anything you add are kept in this browser. Open a collection above, or press <span class="kbd" data-mod>Ctrl K</span> to search across all of them at once.</p>`;
  v.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>go('home',{dom:b.dataset.open})));
  v.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{ const c=chById(b.dataset.jump); go('chapters',{dom:c.domain,ch:c.id}); }));
}

/* ================= CHAPTERS ================= */
function renderChapters(v){
  if(route.ch) return renderReader(v, chById(route.ch)||CH[0]);
  const row=c=>`<button class="chrow card" data-h style="--h:${c.hue}" data-ch="${c.id}"><div class="n">${icon(c.id)}<span>${c.num}</span></div><div><h3>${esc(c.title)}</h3><div class="s">${esc(c.sub)}</div></div><div class="m">${S.read[c.id]?'<span class="ok">✓ Read</span>':''}<span>${c.minutes} min</span><span>${c.terms.length} terms</span>${c.labs.length?`<span>${c.labs.length} lab${c.labs.length>1?'s':''}</span>`:''}</div></button>`;
  const group=(track,name,blurb)=>{ const list=CHD().filter(c=>c.track===track); if(!list.length) return '';
    const read=list.filter(c=>S.read[c.id]).length;
    return `<section class="chgroup"><div class="chgroup-head"><span class="sec-k ${track}">${name}</span><p>${blurb}</p><span class="n num">${read} of ${list.length} read · ${list.reduce((a,c)=>a+c.minutes,0)} min</span></div><div class="chlist">${list.map(row).join('')}</div></section>`; };
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">${CHD().length} chapters · about ${CHD().reduce((a,c)=>a+c.minutes,0)} minutes of reading</div><h1>Chapters</h1><p>Read in order the first time — each chapter assumes the ones before it. After that, jump to whatever the project needs.</p></div></div>
  ${['functional','technical'].map(t=>{const L=domById(dom).tracks[t]; return group(t,L.name,L.blurb);}).join('')}`;
  v.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>go('chapters',{ch:b.dataset.ch})));
}
function renderReader(v,c){
  const sib=CHD(); const i=sib.indexOf(c); const prev=sib[i-1], next=sib[i+1];
  const terms=[...c.terms.map(id=>TERMS[id]).filter(Boolean), ...S.custom.filter(t=>t.ch===c.id)];
  v.innerHTML=`<div class="reader" data-h style="--h:${c.hue}"><article>
    <div class="ch-cover">${c.cover?`<img class="cover-img" src="${c.cover}" alt="">`:coverArt(c.num)}<div class="ch-cover-in"><span class="ch-cover-ico">${icon(c.id)}</span><span class="ch-cover-n num">${String(c.num).padStart(2,'0')}</span></div></div>
    <div class="ch-head"><div class="eyebrow">Chapter ${c.num} of ${sib.length}</div><h1>${esc(c.title)}</h1><p class="sub">${esc(c.sub)}</p><div class="meta"><span>${c.minutes} min read</span><span>·</span><span>${terms.length} key terms</span>${c.labs.length?`<span>·</span><span>${c.labs.length} interactive lab${c.labs.length>1?'s':''}</span>`:''}${speechButton(c)}<label class="toggle" style="margin-left:auto"><input type="checkbox" id="readChk" ${S.read[c.id]?'checked':''}> Mark as read</label></div></div>
    <div class="prose" id="prose">${c.html}</div>
    <section class="keyterms"><h2>Key terms in this chapter</h2><div class="kt">${terms.map(t=>`<div class="row">${knownBtn(t.id)}<div><b>${esc(t.name)}${t.mine?' <span class="mine">yours</span>':''}</b><span>${esc(t.what)}</span></div></div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn sm" id="addTermBtn">+ Add a term to this chapter</button><div id="addTermForm"></div></div></section>
    <div class="ch-foot">
      <div class="notes"><span class="eyebrow">My notes on this chapter</span><textarea id="chNote" placeholder="Examples from the client, things the trainer said, questions to chase…">${esc(S.notes[c.id]||'')}</textarea></div>
      <div class="ask-box needs-sample" ${sample?'':'hidden'}><span class="eyebrow">Ask about this chapter</span><input type="text" id="askQ" placeholder="e.g. give me a Saudi example of this, or explain the PSU/TRU split like I'm the client"><div class="ans muted" id="askA">Answers are grounded in this chapter's text.</div></div>
      <div class="ch-nav">${prev?`<button class="btn" data-ch="${prev.id}">← ${esc(prev.title)}</button>`:'<span></span>'}${next?`<button class="btn primary" data-ch="${next.id}">${esc(next.title)} →</button>`:`<button class="btn primary" data-go2="drill">Go to Drill →</button>`}</div>
    </div></article>

/* ================= GLOSSARY ================= */
let glQ='', glCh=null;
function renderGlossary(v){
  const list=domTerms().filter(t=>(!glCh||t.ch===glCh)&&(!glQ||(t.name+' '+t.what+' '+(t.trap||'')).toLowerCase().includes(glQ.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  let letter=''; const rows=list.map(t=>{ const c=chById(t.ch); const L=t.name[0].toUpperCase(); const head=L!==letter?`<div class="gl-letter">${L}</div>`:''; letter=L; return head+`<div class="gterm card" data-h style="--h:${c?c.hue:210}">${knownBtn(t.id)}<div><b>${esc(t.name)}${t.mine?' <span class="mine">yours</span>':''}</b><div class="d">${esc(t.what)}</div>${t.trap?`<div class="w"><b>Watch out</b> · ${esc(t.trap)}</div>`:''}</div>${c?`<a class="go" href="#chapters/${c.id}" data-ch="${c.id}">Ch. ${c.num} →</a>`:''}${t.mine?`<button class="btn sm ghost" data-del="${t.id}">Delete</button>`:''}</div>`; }).join('');
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">${domTerms().length} terms · A to Z</div><h1>Glossary</h1><p>One definition per term, the trap that usually comes with it, and the chapter that explains it properly. Tick a term when you can say it out loud without looking.</p></div></div>
  <div class="gl-top"><input type="search" id="glSearch" placeholder="Search terms…" value="${esc(glQ)}"><div class="chk">${CHD().map(c=>`<label class="${glCh===c.id?'on':''}" data-h style="--h:${c.hue}"><input type="checkbox" hidden data-gc="${c.id}">${c.num}</label>`).join('')}<span class="small muted" style="align-self:center">${glCh?chById(glCh).title:'all chapters'}</span></div></div>
  <div class="gl">${rows||'<div class="empty">No term matches.</div>'}</div>`;
  const si=$('#glSearch'); si.addEventListener('input',()=>{ glQ=si.value; const pos=si.selectionStart; renderGlossary(v); const e=$('#glSearch'); e.focus(); e.setSelectionRange(pos,pos); });
  v.querySelectorAll('[data-gc]').forEach(b=>b.addEventListener('change',()=>{ glCh=glCh===b.dataset.gc?null:b.dataset.gc; renderGlossary(v); }));
  v.querySelectorAll('[data-ch]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); go('chapters',{ch:a.dataset.ch}); }));
  v.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ S.custom=S.custom.filter(t=>t.id!==b.dataset.del); save(); renderGlossary(v); toast('Term removed'); }));
  wireKnown(v);
}

  b.innerHTML=`<div class="calc"><div class="in card" style="padding:16px"><label>Monthly gross salary (EGP)</label><input type="number" id="txN" value="30000" step="1000" min="0"><input type="range" id="txR" min="5000" max="150000" step="1000" value="30000"><label class="toggle"><input type="checkbox" id="txE" checked> Apply bracket elimination for high earners</label><div class="small muted">Personal exemption EGP 20,000/yr · employee social insurance deducted before tax</div></div><div class="out card" style="padding:16px" id="txOut"></div></div><div class="callout"><b>Interpolated thresholds.</b> The handbook states the 600k and 700k steps explicitly and says the pattern continues to 1.2M; the 800k/900k steps here follow that pattern. Treat the exact ladder as something to confirm against the Egyptian Tax Authority.</div>`;

  const calc=()=>{const gm=Math.max(0,+n.value||0); const iw=Math.min(16700,Math.max(2700,gm)); const si=iw*.11*12; const gross=gm*12; const net=Math.max(0,gross-20000-si);
    let elim=0; if(e.checked) ELIM.forEach(([th,k])=>{ if(net>th) elim=k; });
    let prev=0, total=0; const rows=BR.map(([up,rate],i)=>{ const dead=i<elim; const span=Math.max(0,Math.min(net,up)-prev); const inBand=span; let amt; if(dead){ amt=inBand*BR[elim][1]; } else amt=inBand*rate; total+=amt; const w=up===Infinity?(net>prev?100:0):Math.min(100,100*Math.max(0,Math.min(net,up)-prev)/(up-prev)); const row=`<div class="brk ${dead?'dead':''}"><span class="num">${fmt(prev)}–${up===Infinity?'∞':fmt(up)}</span><div class="trk"><div class="fill" style="width:${w}%"></div></div><span class="rate">${(rate*100).toFixed(rate*100%1?1:0)}%</span><span class="amt">${inBand>0?'EGP '+fmt(amt):'—'}</span></div>`; prev=up; return row;}).join('');
    $('#txOut').innerHTML=`<div class="kv"><span>Annual gross</span><b>EGP ${fmt(gross)}</b></div><div class="kv"><span>− personal exemption</span><b>EGP 20,000</b></div><div class="kv"><span>− employee social insurance (12 × 11% of insurable)</span><b>EGP ${fmt(si)}</b></div><div class="kv"><span>= Net taxable income</span><b>EGP ${fmt(net)}</b></div>
    <div class="brackets">${rows}</div>${elim?`<div class="small" style="color:var(--bad);margin-top:6px">Net income above EGP ${fmt(ELIM[elim-1][0])}: the first ${elim} bracket${elim>1?'s':''} ${elim>1?'are':'is'} eliminated — that income is taxed at the ${(BR[elim][1]*100).toFixed(1)}% band instead.</div>`:''}
    <div class="kv total" style="margin-top:8px"><span>Annual tax</span><b>EGP ${fmt(total)}</b></div><div class="kv"><span>Monthly slice (÷12)</span><b>EGP ${fmt(total/12)}</b></div>`;};
  n.addEventListener('input',()=>{r.value=n.value;calc();}); r.addEventListener('input',()=>{n.value=r.value;calc();}); e.addEventListener('change',calc); calc();
}});

LABS.push({id:'hdl',ch:'hdl',title:'HDL file anatomy & load order',lead:'One .dat per business object, zipped flat. METADATA declares the columns, MERGE carries the data, pipes separate everything. Hover any token; then put the files in a valid load order.',render(b){
  const tip={METADATA:'Instruction keyword: this line declares the column list for the discriminator that follows. Must come before its MERGE lines.',MERGE:'Instruction keyword: create the record if it does not exist, update it if it does. (DELETE is the other one.)',JobFamily:'The discriminator — which business object / component this line is about. Two METADATA lines for the same component in one file = rejected.',JobFamilyCode:'A user key: a natural business key. Attribute names are case-sensitive.',JobFamilyName:'Attribute — must appear in the MERGE line in the same position.',EffectiveStartDate:'Date-effective start. Format yyyy/mm/dd.',EffectiveEndDate:'Date-effective end.',SALES:'Value for JobFamilyCode — this is the user key identifying the record.',Sales:'Value for JobFamilyName.','2000/01/01':'Effective from 1 January 2000.','4712/12/31':'Oracle’s “end of time”. You will see it constantly.',Worker:'Discriminator for the top of the worker hierarchy. PersonName, WorkRelationship, Assignment follow as further METADATA/MERGE pairs in the same file.',SourceSystemOwner:'Source key, part 1: which legacy system the record came from. If you use source keys, both attributes must be in METADATA.',SourceSystemId:'Source key, part 2: the record’s id in that legacy system. This is what makes reconciliation possible.',PersonNumber:'Oracle’s own identifier.',ActionCode:'HIRE, and the like — the action this row performs.',StartDate:'Start of the work relationship.',DateOfBirth:'Person-level attribute — lives on the person, not the assignment.',XXTEST:'Value of SourceSystemOwner.',XXTEST_PER1:'Value of SourceSystemId — the legacy key reconciliation runs against.',XXTEST1:'Value of PersonNumber.',HIRE:'The action.','2018/01/01':'Date value.','1975/01/01':'Date of birth.','JobFamilyId(SourceSystemId)':'Foreign reference: point at another object by naming the attribute with the key type in brackets. This is how children attach to parents.'};
  const line=(kw,parts)=>`<div class="ln"><span class="tok kw" data-tip="${kw}">${kw}</span>${parts.map(p=>`<span class="pipe-c">|</span><span class="tok ${p==='4712/12/31'?'eot':''}" data-tip="${esc(p)}">${esc(p)}</span>`).join('')}</div>`;
  const files=['Grade','Job','JobFamily','Worker']; const valid=o=>{const i=x=>o.indexOf(x); return i('JobFamily')<i('Job') && i('Grade')<i('Worker') && i('Job')<i('Worker');};
  let picked=[];
  const draw=()=>{b.innerHTML=`<div class="stage"><div class="eyebrow" style="margin-bottom:8px">JobFamily.dat — user keys</div><div class="hdl">${line('METADATA',['JobFamily','JobFamilyCode','JobFamilyName','EffectiveStartDate','EffectiveEndDate'])}${line('MERGE',['JobFamily','SALES','Sales','2000/01/01','4712/12/31'])}</div>
    <div class="eyebrow" style="margin:16px 0 8px">Worker.dat — source keys</div><div class="hdl">${line('METADATA',['Worker','SourceSystemOwner','SourceSystemId','EffectiveStartDate','EffectiveEndDate','PersonNumber','ActionCode','StartDate','DateOfBirth'])}${line('MERGE',['Worker','XXTEST','XXTEST_PER1','2018/01/01','4712/12/31','XXTEST1','HIRE','2018/01/01','1975/01/01'])}</div>
    <div class="eyebrow" style="margin:16px 0 8px">Job.dat — referencing a parent</div><div class="hdl">${line('METADATA',['Job','JobCode','JobName','JobFamilyId(SourceSystemId)','EffectiveStartDate','EffectiveEndDate'])}</div></div>
    ${explainBox('hdlEx','<span class="muted">Hover a token. Rejection reasons to memorise: METADATA after its MERGE lines; two METADATA lines for the same component; MERGE attributes not matching METADATA order; wrong case in an attribute name.</span>')}
    <div class="stage"><div class="eyebrow" style="margin-bottom:8px">Load order — files import in parallel but load sequentially; referenced data must exist first</div><div class="orderer">${files.map(f=>`<button class="node ${picked.includes(f)?'picked':''}" data-f="${f}">${f}.dat</button>`).join('')}<button class="btn sm ghost" id="hdlReset">Reset</button></div><div class="order-out" style="margin-top:10px">${picked.length?picked.map((f,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${f}.dat</span>`).join(''):'<span class="muted small">Click the files in the order they should be loaded.</span>'}</div>${picked.length===files.length?`<div class="verdict ${valid(picked)?'ok':'no'}" style="margin-top:8px">${valid(picked)?'Valid. JobFamily before Job (Job references it); Grade and Job before Worker (assignments reference both).':'Something is referenced before it exists. Job needs JobFamily first; Worker needs Grade and Job first.'}</div>`:''}</div>`;
    b.querySelectorAll('[data-tip]').forEach(t=>t.addEventListener('mouseenter',()=>{$('#hdlEx').innerHTML=`<b><code>${esc(t.dataset.tip)}</code></b><br>${esc(tip[t.dataset.tip]||'A value in this column.')}`;}));
    b.querySelectorAll('[data-f]').forEach(x=>x.addEventListener('click',()=>{picked.push(x.dataset.f);draw();})); $('#hdlReset').addEventListener('click',()=>{picked=[];draw();});};
  draw();
}});

/* ===================== DATA & ANALYTICS ===================== */

LABS.push({id:'query-order',ch:'sql-shape',title:'What the engine does, in its own order',lead:'The same query, stepped through the order the database actually resolves it in. Watch the rows disappear before SELECT ever runs — that is why an alias defined in SELECT cannot be used in WHERE.',render(b){
  const ROWS=[{id:101,cust:'Amal',amt:120,st:'shipped'},{id:102,cust:'Amal',amt:60,st:'shipped'},
              {id:103,cust:'Karim',amt:200,st:'cancelled'},{id:104,cust:'Karim',amt:90,st:'shipped'},
              {id:105,cust:'Nour',amt:45,st:'shipped'},{id:106,cust:'Nour',amt:30,st:'pending'}];
  const STEPS=[
    {k:'FROM',   t:'orders',                         say:'Every row in the table, before anything is discarded.'},
    {k:'WHERE',  t:"status = 'shipped'",             say:'Rows are thrown away first. This is why a filter here cannot reference an alias from SELECT — SELECT has not run yet.'},
    {k:'GROUP BY',t:'customer',                      say:'The survivors collapse into one row per customer. From here on there are groups, not rows.'},
    {k:'HAVING', t:'SUM(amount) > 100',              say:'Groups are thrown away. A condition on an aggregate can only live here, because the aggregate did not exist until GROUP BY ran.'},
    {k:'SELECT', t:'customer, SUM(amount) AS total', say:'Only now are the output columns worked out — and only now does the alias `total` exist.'},
    {k:'ORDER BY',t:'total DESC',                    say:'Sorting is last, which is the one place the alias from SELECT is usually allowed.'}];
  let at=0;
  const draw=()=>{
    const kept=ROWS.filter(r=>at<1||r.st==='shipped');
    let grouped=null;
    if(at>=2){ const m={}; kept.forEach(r=>{ m[r.cust]=(m[r.cust]||0)+r.amt; });
      grouped=Object.entries(m).map(([cust,total])=>({cust,total})); }
    if(at>=3) grouped=grouped.filter(g=>g.total>100);
    if(at>=5) grouped=[...grouped].sort((x,y)=>y.total-x.total);
    const table = at<2
      ? `<table class="dt"><thead><tr><th>id</th><th>customer</th><th>amount</th><th>status</th></tr></thead><tbody>${ROWS.map(r=>{
          const gone=at>=1&&r.st!=='shipped';
          return `<tr class="${gone?'gone':''}"><td>${r.id}</td><td>${r.cust}</td><td class="n">${r.amt}</td><td>${r.st}</td></tr>`;}).join('')}</tbody></table>`

LABS.push({id:'joins',ch:'sql-joins',title:'Which rows survive, and which multiply',lead:'Three customers, four orders, one of them orphaned. Change the join and watch what happens to the row count — then look at what fan-out does to a total.',render(b){
  const C=[{id:1,name:'Amal'},{id:2,name:'Karim'},{id:3,name:'Nour'}];
  const O=[{id:'A-1',cid:1,amt:120},{id:'A-2',cid:1,amt:60},{id:'K-1',cid:2,amt:90},{id:'X-9',cid:99,amt:75}];
  const KINDS={
    inner:{lbl:'INNER JOIN', say:'Only rows that matched on both sides. Nour has no orders and disappears; the orphaned order X-9 disappears too. Rows vanish silently — that is how records go missing from a report.'},
    left: {lbl:'LEFT JOIN',  say:'Every customer survives. Nour gets NULLs where the order columns would be. The orphaned order is still dropped, because it is on the right.'},
    right:{lbl:'RIGHT JOIN', say:'Every order survives, including the orphan X-9 whose customer does not exist. Almost nobody writes this deliberately — a LEFT JOIN with the tables swapped reads better.'},
    full: {lbl:'FULL OUTER', say:'Nothing is lost from either side. Useful for reconciling two sources: the NULLs on each side are exactly the rows that failed to match.'},
    trap: {lbl:'LEFT + WHERE',say:'A LEFT JOIN with a condition on the right table in WHERE. Nour’s NULL fails the comparison and she is discarded — so this returns exactly what an INNER JOIN returns. Put the condition in ON instead.'}};
  let k='inner';
  const rowsFor=()=>{
    const out=[];
    if(k==='right'||k==='full'){
      O.forEach(o=>{ const c=C.find(x=>x.id===o.cid); out.push({c:c||null,o}); });
      if(k==='full') C.forEach(c=>{ if(!O.some(o=>o.cid===c.id)) out.push({c,o:null}); });
      return out;
    }
    C.forEach(c=>{ const mine=O.filter(o=>o.cid===c.id);
      if(mine.length) mine.forEach(o=>out.push({c,o}));
      else if(k==='left') out.push({c,o:null}); });
    return out;
  };
  const draw=()=>{
    const rows=rowsFor();
    const total=rows.reduce((a,r)=>a+(r.o?r.o.amt:0),0);
    const dupes=rows.filter(r=>r.c&&rows.filter(x=>x.c&&x.c.id===r.c.id).length>1).length;
    b.innerHTML=`<div class="stepper" style="margin-bottom:14px">${Object.entries(KINDS).map(([id,v])=>
        `<button class="${id===k?'active':''}" data-k="${id}">${v.lbl}</button>`).join('')}</div>
      <div class="stage"><table class="dt" style="min-width:430px"><thead><tr><th>customer</th><th>order</th><th>amount</th></tr></thead><tbody>${rows.map(r=>
        `<tr><td class="${r.c?'':'nul'}">${r.c?r.c.name:'NULL'}</td><td class="${r.o?'':'nul'}">${r.o?r.o.id:'NULL'}</td><td class="n ${r.o?'':'nul'}">${r.o?r.o.amt:'NULL'}</td></tr>`).join('')}</tbody></table></div>
      <div class="counter" style="margin-top:12px">
        <div><div class="big num">${rows.length}</div><div class="lbl">rows out (3 customers, 4 orders in)</div></div>
        <div><div class="big num">${total}</div><div class="lbl">SUM(amount)</div></div>
        <div><div class="big num">${dupes}</div><div class="lbl">rows where a customer repeats</div></div>
      </div>
      <div class="explain" style="margin-top:12px"><b>${KINDS[k].lbl}</b><br>${KINDS[k].say}
        ${dupes?'<div class="muted" style="margin-top:6px"><b style="color:var(--gold)">Fan-out:</b> Amal has two orders, so her row is repeated. Any customer-level column — a credit limit, a region, an annual fee — would now be counted twice by a SUM.</div>':''}</div>`;
    b.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('click',()=>{ k=x.dataset.k; draw(); }));
  };
  draw();
}});

LABS.push({id:'windows',ch:'sql-windows',title:'The frame nobody writes, and the bug it hides',lead:'A running total over four days, two of which fall on the same date. Switch the frame between ROWS and RANGE — the default — and watch the tied rows disagree.',render(b){
  const R=[{d:'2026-01-01',amt:100},{d:'2026-01-02',amt:80},{d:'2026-01-02',amt:40},{d:'2026-01-03',amt:60}];
  let frame='RANGE', rank='ROW_NUMBER';
  const running=()=>R.map((r,i)=>{
    if(frame==='ROWS') return R.slice(0,i+1).reduce((a,x)=>a+x.amt,0);
    return R.filter(x=>x.d<=r.d).reduce((a,x)=>a+x.amt,0);   // RANGE: peers share a value
  });
  const ranks=()=>{ const sorted=[...R].map((r,i)=>({...r,i})).sort((a,c)=>c.amt-a.amt);
    const out=Array(R.length); let prev=null, rk=0, dense=0;
    sorted.forEach((r,n)=>{ if(r.amt!==prev){ rk=n+1; dense+=1; prev=r.amt; }
      out[r.i]= rank==='ROW_NUMBER'?n+1 : rank==='RANK'?rk : dense; });
    return out; };
  const draw=()=>{
    const run=running(), rk=ranks();
    const tie=frame==='RANGE';
    b.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px">
        <div><div class="eyebrow" style="margin-bottom:5px">Frame</div><div class="stepper">${['ROWS','RANGE'].map(f=>
          `<button class="${f===frame?'active':''}" data-f="${f}">${f}${f==='RANGE'?' (default)':''}</button>`).join('')}</div></div>
        <div><div class="eyebrow" style="margin-bottom:5px">Ranking</div><div class="stepper">${['ROW_NUMBER','RANK','DENSE_RANK'].map(f=>
          `<button class="${f===rank?'active':''}" data-r="${f}">${f}</button>`).join('')}</div></div></div>
      <div class="stage"><table class="dt" style="min-width:470px"><thead><tr><th>order_date</th><th>amount</th><th>running total</th><th>${rank}() by amount</th></tr></thead><tbody>${R.map((r,i)=>
        `<tr class="${tie&&r.d==='2026-01-02'?'tie':''}"><td>${r.d}</td><td class="n">${r.amt}</td><td class="n"><b>${run[i]}</b></td><td class="n">${rk[i]}</td></tr>`).join('')}</tbody></table></div>
      <div class="explain" style="margin-top:12px">${frame==='RANGE'
        ? '<b>RANGE — what you get if you write no frame at all</b><br>RANGE treats every row sharing the ordering value as one unit, so both rows dated 2 January show 220: the total including <em>both</em> of them. Nothing is wrong with the SQL, and on data with no ties this is identical to ROWS — which is exactly why the bug survives testing and turns up in production.'
        : '<b>ROWS — one row at a time</b><br>The total steps 100, 180, 220, 280 as you would expect. If you mean row-by-row, write <code>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code> and say so.'}
        <div class="muted" style="margin-top:8px">${rank==='ROW_NUMBER'?'ROW_NUMBER never ties — the two 80/40 rows get distinct numbers, and with no tiebreaker in ORDER BY, which one comes first is not stable between runs.':rank==='RANK'?'RANK ties and then skips: 1, 2, 2, 4.':'DENSE_RANK ties and does not skip: 1, 2, 2, 3.'}</div></div>`;
    b.querySelectorAll('[data-f]').forEach(x=>x.addEventListener('click',()=>{ frame=x.dataset.f; draw(); }));
    b.querySelectorAll('[data-r]').forEach(x=>x.addEventListener('click',()=>{ rank=x.dataset.r; draw(); }));
  };
  draw();
}});

LABS.push({id:'dax-context',ch:'dax',title:'The same measure, a different answer every time',lead:'One measure, six rows of sales. Move the slicers and watch what the filter context does to it — then see why CALCULATE ignores the slicer you just set.',render(b){
  const S=[{cat:'Books',reg:'Cairo',amt:120},{cat:'Books',reg:'Alexandria',amt:80},
           {cat:'Toys',reg:'Cairo',amt:200},{cat:'Toys',reg:'Alexandria',amt:60},

  let cat='All', reg='All';

    const inCtx=S.filter(r=>(cat==='All'||r.cat===cat)&&(reg==='All'||r.reg===reg));
    const total=inCtx.reduce((a,r)=>a+r.amt,0);
    const cairo=S.filter(r=>(cat==='All'||r.cat===cat)&&r.reg==='Cairo').reduce((a,r)=>a+r.amt,0);
    const keep=inCtx.filter(r=>r.reg==='Cairo').reduce((a,r)=>a+r.amt,0);
    b.innerHTML=`<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px">
        <div><div class="eyebrow" style="margin-bottom:5px">Category slicer</div><div class="stepper">${['All','Books','Toys'].map(v=>
          `<button class="${v===cat?'active':''}" data-c="${v}">${v}</button>`).join('')}</div></div>
        <div><div class="eyebrow" style="margin-bottom:5px">Region slicer</div><div class="stepper">${['All','Cairo','Alexandria'].map(v=>
          `<button class="${v===reg?'active':''}" data-g="${v}">${v}</button>`).join('')}</div></div></div>
      <div class="stage"><table class="dt" style="min-width:380px"><thead><tr><th>category</th><th>region</th><th>amount</th></tr></thead><tbody>${S.map(r=>{
        const on=(cat==='All'||r.cat===cat)&&(reg==='All'||r.reg===reg);
        return `<tr class="${on?'':'gone'}"><td>${r.cat}</td><td>${r.reg}</td><td class="n">${r.amt}</td></tr>`;}).join('')}</tbody></table></div>
      <div class="out" style="margin-top:14px">
        <div class="kv"><span><code>Total Sales = SUM(Sales[Amount])</code></span><b>${total}</b></div>
        <div class="kv"><span><code>Sales Cairo = CALCULATE([Total Sales], Region = "Cairo")</code></span><b>${cairo}</b></div>
        <div class="kv total"><span><code>… with KEEPFILTERS</code></span><b>${keep}</b></div>
      </div>
      <div class="explain" style="margin-top:12px"><b>${inCtx.length} of ${S.length} rows are in the filter context</b><br>
        The measure is one expression. It is evaluated again under whatever filters apply, which is why the same measure returns a different number in every cell of a matrix — and why a total row is a different context rather than the sum of the rows above it.

    b.querySelectorAll('[data-c]').forEach(x=>x.addEventListener('click',()=>{ cat=x.dataset.c; draw(); }));
    b.querySelectorAll('[data-g]').forEach(x=>x.addEventListener('click',()=>{ reg=x.dataset.g; draw(); }));

  <p>Moon Learning is where I write up what I am studying, properly, instead of leaving it in scattered notes. Each collection covers one subject; right now there are ${DOMAINS.length} — ${DOMAINS.map(x=>esc(x.name)).join(' and ')}. The test of whether I understand something is whether I can write it out so that it teaches, so that is the form everything takes.</p>
  <h2>How a collection is organised</h2>
  <p><strong>Chapters</strong> are written to be read, in order the first time. Each one ends with the mistakes beginners actually make and the sources it was checked against. <strong>Labs</strong> are the same ideas made movable: things to click, drag and push numbers through, for the concepts that only land once you see them change. <strong>Figures</strong> are the ones that are better looked at than listened to — diagrams drawn into the text where it explains a shape. The <strong>Glossary</strong> is one definition per term with the trap attached. <strong>Drill</strong> is retrieval practice: answer out loud, flip, grade yourself honestly, and missed cards come back first.</p>
  <h2>Reading and listening</h2>
  <p>Every chapter has a <strong>Listen</strong> control that reads it aloud using your browser's own speech engine — no account, no network, and it works offline. It reads paragraph by paragraph and highlights where it is, so you can follow along or put the phone down. The voices are whatever your operating system provides, which is why the quality varies between machines; pick a different one from the bar at the bottom if the default grates.</p>
  ${ABOUT_SOURCES[dom]||''}
  <h2>Adding to it</h2>
  <p>You can add your own terms from any chapter and your own drill questions from the Drill deck; they are kept with your progress in this browser. The site itself is a single HTML file. Chapters are written as Markdown and compiled in, and the build refuses to run if a chapter references a term, lab or figure that does not exist — so a broken cross-reference never ships. New knowledge is meant to arrive as a chapter with its own sources, not as loose notes.</p>
  <h2>Design</h2>
  <p>Navy and gold, a serif for reading and a grotesque for the interface, and one colour per chapter carried through its labs, glossary terms and drill cards so the colour becomes a memory cue. The collections carry their own accent in the bar at the top. Light and dark are both designed rather than inverted, wide diagrams scroll inside their own frame so the page never scrolls sideways, and a chapter prints as a clean document if you would rather read it on paper.</p>
  <p class="about-foot">Currently ${CH.length} chapters across ${DOMAINS.length} collections · ${allTerms().length} glossary terms · ${LABS.length} labs · ${FIGS.length} figures · ${DATA.questions.length} drill questions.</p>
  </div>`;
}

/* =====================================================================
   SPEECH — read a chapter aloud.
   ---------------------------------------------------------------------
   Uses the browser's own SpeechSynthesis, so there is no API key, no
   network call and nothing to pay for; the voices are whatever the
   reader's operating system ships. That is also the limitation: voice
   quality varies wildly between machines, and on some Linux builds there
   are no voices at all — the control simply does not appear there.

   Reads paragraph by paragraph rather than in one long utterance, so the
   current paragraph can be highlighted, progress is meaningful, and a
   long chapter does not hit the per-utterance length limits some engines
   impose. Labs, figures and the sources list are skipped: they are to be
   looked at, not listened to.
   ===================================================================== */

const SPEECH_OK = typeof window !== 'undefined' && 'speechSynthesis' in window;
const SP = { chunks: [], at: -1, playing: false, voice: null, rate: 1, title: '' };

/* Voices arrive asynchronously on most browsers. */
let VOICES = [];
function loadVoices() {
  if (!SPEECH_OK) return;
  VOICES = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  if (!VOICES.length) VOICES = speechSynthesis.getVoices();
  const sel = $('#sbVoice');
  if (!sel || !VOICES.length) return;
  const want = S.voice || '';
  sel.innerHTML = VOICES.map(v => `<option value="${esc(v.name)}">${esc(v.name.replace(/\s*\(.*\)$/, ''))}</option>`).join('');
  const match = VOICES.find(v => v.name === want);
  if (match) sel.value = match.name;
  SP.voice = match || VOICES.find(v => v.default) || VOICES[0];
}
if (SPEECH_OK) {
  speechSynthesis.addEventListener('voiceschanged', loadVoices);
  loadVoices();
}

/* The readable body of the chapter, in order, as [element, text] pairs. */
function speechChunks(root) {
  const out = [];
  root.querySelectorAll('h2, p, li, blockquote').forEach(el => {
    if (el.closest('.sources') || el.closest('.lab') || el.closest('.fig-embed')) return;
    if (el.querySelector('p, li')) return;                 // container, not a leaf
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    if (text.length < 2) return;
    out.push({ el, text: el.tagName === 'H2' ? text + '.' : text });
  });
  return out;
}

function speechButton(c) {
  if (!SPEECH_OK) return '';
  return `<button class="listen" id="listenBtn" aria-label="Read this chapter aloud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg>
    <span>Listen</span><span class="listen-min">${c.minutes} min</span></button>`;
}

function speechStart(c) {
  const prose = $('#prose');
  if (!SPEECH_OK || !prose) return;
  SP.chunks = speechChunks(prose);
  if (!SP.chunks.length) return;
  SP.title = c.title; SP.at = -1; SP.playing = true;
  SP.rate = parseFloat(S.rate || 1) || 1;
  const bar = $('#speechBar');
  bar.hidden = false;
  $('#sbTitle').textContent = c.title;
  $('#sbRate').value = String(SP.rate);
  speechNext();
}

function speechNext() {
  SP.at += 1;
  if (SP.at >= SP.chunks.length) return speechStop(true);
  speechPaint();
  const chunk = SP.chunks[SP.at];
  const u = new SpeechSynthesisUtterance(chunk.text);
  if (SP.voice) u.voice = SP.voice;
  u.rate = SP.rate;
  u.onend = () => { if (SP.playing) speechNext(); };
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') speechStop(); };
  speechSynthesis.speak(u);
}

function speechPaint() {
  SP.chunks.forEach((c, i) => c.el.classList.toggle('speaking', i === SP.at));
  const cur = SP.chunks[SP.at];
  if (cur) {
    const box = cur.el.getBoundingClientRect();
    if (box.top < 90 || box.bottom > window.innerHeight - 120) cur.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  const done = SP.at + 1;
  $('#sbPos').textContent = `${done} of ${SP.chunks.length}`;
  $('#sbFill').style.width = pct(done, SP.chunks.length) + '%';
  const play = $('#sbPlay');
  if (play) { play.classList.toggle('paused', !SP.playing); play.setAttribute('aria-label', SP.playing ? 'Pause' : 'Play'); }
}

function speechPause() {
  if (!SP.playing) return;
  SP.playing = false; speechSynthesis.pause(); speechPaint();
}
function speechResume() {
  if (SP.playing || !SP.chunks.length) return;
  SP.playing = true; speechSynthesis.resume(); speechPaint();
}

/* `finished` distinguishes reaching the end from being cut off. */
function speechStop(finished) {
  if (!SPEECH_OK) return;
  speechSynthesis.cancel();
  SP.chunks.forEach(c => c.el.classList.remove('speaking'));
  SP.chunks = []; SP.at = -1; SP.playing = false;
  const bar = $('#speechBar');
  if (bar) bar.hidden = true;
  const btn = $('#listenBtn');
  if (btn) btn.classList.remove('on');
  if (finished) toast('Finished reading');
}

function speechJump(fraction) {
  if (!SP.chunks.length) return;
  speechSynthesis.cancel();
  SP.at = Math.max(-1, Math.min(SP.chunks.length - 1, Math.round(fraction * SP.chunks.length) - 1));
  SP.playing = true;
  speechNext();
}

/* ---------- wiring (the bar lives in the shell, so wire it once) ---------- */
if (SPEECH_OK) {
  $('#sbPlay').addEventListener('click', () => (SP.playing ? speechPause() : speechResume()));
  $('#sbStop').addEventListener('click', () => speechStop());
  $('#sbRate').addEventListener('change', e => {
    SP.rate = parseFloat(e.target.value) || 1; S.rate = SP.rate; save();
    if (SP.chunks.length) { const at = SP.at; speechSynthesis.cancel(); SP.at = at - 1; SP.playing = true; speechNext(); }
  });
  $('#sbVoice').addEventListener('change', e => {
    SP.voice = VOICES.find(v => v.name === e.target.value) || SP.voice;
    S.voice = e.target.value; save();
    if (SP.chunks.length) { const at = SP.at; speechSynthesis.cancel(); SP.at = at - 1; SP.playing = true; speechNext(); }
  });
  $('#sbTrack').addEventListener('click', e => {
    const box = e.currentTarget.getBoundingClientRect();
    speechJump((e.clientX - box.left) / box.width);
  });
  // Chrome stops speaking if the tab is hidden for a while; keep state honest.
  document.addEventListener('visibilitychange', () => { if (document.hidden && SP.playing) speechPause(); });
  window.addEventListener('beforeunload', () => speechSynthesis.cancel());
}

/* ---------------------------------------------------------------------
   COVER ART — the band at the top of a chapter. Four abstract patterns,
   picked by chapter number so neighbours never repeat, drawn in the
   chapter's own hue. A chapter with a `cover:` image in its frontmatter
   uses that photograph instead; this is the default.
   --------------------------------------------------------------------- */
function coverArt(num) {
  const pattern = num % 4;
  const open = '<svg class="cover-art" viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="ca">';
  const close = '</g></svg>';
  let body = '';

  if (pattern === 0) {                       // concentric rings
    for (let i = 0; i < 10; i++) body += `<circle cx="${40 + i * 88}" cy="80" r="${16 + (i % 4) * 15}"/>`;
  } else if (pattern === 1) {                // diagonal hatch
    for (let i = -4; i < 26; i++) body += `<path d="M${i * 40} 170 L${i * 40 + 90} -10"/>`;
  } else if (pattern === 2) {                // dot grid
    for (let r = 0; r < 5; r++) for (let c = 0; c < 25; c++) body += `<circle cx="${18 + c * 33}" cy="${18 + r * 33}" r="3.5" class="fill"/>`;
  } else {                                   // nested chevrons
    for (let i = 0; i < 12; i++) body += `<path d="M${-40 + i * 76} 170 L${10 + i * 76} 80 L${-40 + i * 76} -10"/>`;
  }
  return open + body + close;
}


/* =====================================================================
   FIGURES — static diagrams embedded in the prose with [[fig:id]].
   ---------------------------------------------------------------------
   A lab is something to push on; a figure is something to take in at a
   glance. They are deliberately different: a figure never has state, is
   never interactive, and carries no numbers that are not also in the
   chapter's text.

   Every figure is inline SVG so it inherits the theme's tokens and the
   chapter's hue (var(--p)) with no image file and no request. Draw on a
   fixed viewBox; .fig-scroll handles narrow screens.

   FIGS.push({ id, ch, title, caption, svg() })
   ===================================================================== */

const FIGS = [];

/* Small builders so the diagrams stay readable and consistent. */
const F = {
  /* A titled box. `sub` is an optional caption line, or an array of lines —
     SVG text does not wrap, so anything long has to be split by hand. */
  box(x, y, w, h, t, sub, cls = '') {
    const lines = sub == null ? [] : (Array.isArray(sub) ? sub : [sub]);
    const ty = lines.length ? y + 21 : y + h / 2 + 4.5;
    return `<g class="f-box ${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>` +
      `<text class="f-t" x="${x + 12}" y="${ty}">${t}</text>` +
      lines.map((l, i) => `<text class="f-s" x="${x + 12}" y="${y + 38 + i * 15}">${l}</text>`).join('') +
      `</g>`;
  },
  /* Column or section heading inside the drawing. */
  head(x, y, t, cls = '') {
    return `<text class="f-h ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  note(x, y, t, cls = '') {
    return `<text class="f-s ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  /* Elbow connector: down from (x1,y1), across, down into (x2,y2). */
  elbow(x1, y1, x2, y2, cls = '') {
    const mid = y1 + (y2 - y1) / 2;
    return `<path class="f-line ${cls}" d="M${x1} ${y1} V${mid} H${x2} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  down(x, y1, y2, cls = '') {
    return `<path class="f-line ${cls}" d="M${x} ${y1} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  across(x1, x2, y, cls = '') {
    return `<path class="f-line ${cls}" d="M${x1} ${y} H${x2}" marker-end="url(#fig-ar)"/>`;
  },
  /* Horizontal proportion bar: segments = [{w, label, cls}] summing to width. */
  bar(x, y, width, height, segments) {
    let at = x, out = '';
    segments.forEach(s => {
      const w = width * s.w;
      out += `<g class="f-seg ${s.cls || ''}"><rect x="${at}" y="${y}" width="${w}" height="${height}" rx="3"/>` +
        (w > 34 ? `<text class="f-bar-l" x="${at + w / 2}" y="${y + height / 2 + 4}">${s.label}</text>` : '') + `</g>`;
      at += w;
    });
    return out;
  },
};

/* Shared arrow marker; one per rendered figure. */
const FIG_DEFS = `<defs><marker id="fig-ar" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L7 4 L0 7 z" class="f-arrow"/></marker></defs>`;
