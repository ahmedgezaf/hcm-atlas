tions, usually by length of service, because almost every real leave policy is tiered. Egyptian annual leave — 15 days in the first year, 21 from the second, 30 after ten years of service or at age 50 — is implemented directly as accrual bands. The boundary cases are the test cases: the person who crosses ten years mid-year and the person who turns fifty mid-year.<\/p>\n<p><strong>Carryover<\/strong> rules govern how much unused leave transfers into the next plan term and when it expires. Employers cap carryover to control liability and to encourage people to take leave, and carryover and expiry rules are a frequent source of client disagreement — pin them down in writing early. Egyptian law also imposes its own constraints (Chapter 10).<\/p>\n<h2>Qualification plans<\/h2>\n<p>A <strong>qualification plan<\/strong> is used where entitlement is not earned day by day but triggered by an event and paid at rates that vary over the absence. Egyptian sick leave is the textbook case: 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in a calendar year, subject to medical certification. Those percentages are configured as qualification bands. Maternity leave is the other standard example, with its own cap on occurrences.<\/p>\n<p>A <strong>no-entitlement plan<\/strong> exists because unpaid absence still needs to be recorded — for attendance, payroll deduction and reporting — even though nothing is earned or granted. A <strong>compensatory plan<\/strong> comes up whenever a client asks about time off in lieu.<\/p>\n<h2>Eligibility profiles and encashment<\/h2>\n<p>An <strong>eligibility profile<\/strong> is a reusable set of criteria — grade, job, department, location, length of service — that decides whether a person qualifies for a plan: \"employees in the Egypt legal employer with more than ten years of service\" as the criterion for the 30-day band. Eligibility profiles appear in absence, benefits and compensation, so learning them once pays off three times.<\/p>\n<p><strong>Leave encashment<\/strong> pays out unused leave in cash instead of time off. It occurs at termination as part of the final settlement and periodically where policy or law allows. It is the link between absence and payroll: an absence balance becomes a payroll element on termination.<\/p>\n<div class=\"lab-embed\" data-lab=\"leave\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Knowing only accrual and qualification plans. There are six.<\/li>\n<li>Building a flat annual entitlement when the law is tiered by service.<\/li>\n<li>Leaving carryover and expiry rules undocumented.<\/li>\n<li>Forgetting that casual leave in Egypt is counted within annual leave, not on top of it.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Types of Absence Plans\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faiam/types-of-absence-plans.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faiam/types-of-absence-plans.html<\/a><\/li>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Accrual Absence Plans\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/20b/faiam/accrual-absence-plans.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/20b/faiam/accrual-absence-plans.html<\/a><\/li>\n<li>Oracle, <em>Absence Management<\/em> datasheet. <a href=\"https://www.oracle.com/a/ocom/docs/applications/human-capital-management/absence-management-ds.pdf\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/a/ocom/docs/applications/human-capital-management/absence-management-ds.pdf<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"powerbi-model","num":6,"domain":"analytics","track":"technical","title":"Power BI: The Model Is the Product","sub":"Star schema, relationships, and why the transformation belongs upstream","hue":45,"minutes":8,"labs":[],"terms":["fact-table","dimension-table","star-schema","relationship-cardinality","cross-filter-direction","date-table","import-vs-directquery","roches-maxim"],"html":"<p>People learn Power BI by dragging fields onto a canvas and are surprised when the numbers misbehave. The visuals are the last five per cent. The model underneath — which tables exist, at what grain, joined how — decides whether every number in the report is right, and it is where the work actually is.<\/p>\n<h2>Facts and dimensions<\/h2>\n<p>A <strong>fact table<\/strong> holds the events you measure: one row per sale, per click, per ticket. It is long, it grows, and its columns are mostly numbers you will aggregate plus the keys that point outward.<\/p>\n<p>A <strong>dimension table<\/strong> holds the things you slice by: products, customers, stores, dates. It is short, it changes slowly, and its columns are the descriptive attributes you want on an axis or in a slicer.<\/p>\n<p>Arrange one fact table in the middle with dimensions around it, each joined by a single key, and you have a <strong>star schema<\/strong>. It is the shape Power BI is built for, and Microsoft's own guidance says so plainly. It is not an academic preference: the engine's compression and its filter propagation are both designed around it, and a model in this shape is faster, smaller and easier to reason about than the same data flattened into one wide table or normalised into a snowflake.<\/p>\n<figure class=\"fig-embed\" data-fig=\"star-schema\"><\/figure>\n\n<p>The practical rule when you are handed a flat export: split it. Pull the product attributes into a product table, the customer attributes into a customer table, keep the measures and the keys in the fact table.<\/p>\n<h2>Relationships<\/h2>\n<p>A relationship has a <strong>cardinality<\/strong> — usually one-to-many, from the dimension's one row to the fact's many — and a <strong>cross-filter direction<\/strong>, which decides which way a filter travels. In a star schema, filters flow from the one side to the many side: select a product, and the sales rows filter. That single direction is what you want almost always.<\/p>\n<p>Setting a relationship to filter <strong>both<\/strong> ways is the tempting fix when a slicer does not affect a visual, and it is usually the wrong one. Bidirectional filters can create ambiguous paths through the model, make results depend on evaluation order, and slow queries down. Reach for them last, deliberately, and only when you can say which problem they solve.<\/p>\n<p>A <strong>many-to-many<\/strong> relationship is a signal that a bridge table is missing — the intermediate table that resolves the two sides into two one-to-many relationships.<\/p>\n<p>Every model that reports over time needs a dedicated <strong>date table<\/strong> with one row per date, no gaps, marked as the date table. Without one, Power BI's time-intelligence functions either refuse to work or quietly give the wrong answer at the boundaries of a period.<\/p>\n<h2>Where transformation belongs<\/h2>\n<p>Power Query (Chapter 5) and DAX (Chapter 7) can both do many of the same jobs, which invites doing them in the wrong place. The guidance usually quoted here is <strong>Roche's Maxim<\/strong>: <em>data should be transformed as far upstream as possible, and as far downstream as necessary.<\/em><\/p>\n<p>In practice that means: rename, reshape, split, filter and type your columns in the source or in Power Query, where the work happens once at refresh and every report downstream benefits. Leave to DAX only what genuinely depends on what the user has selected. A calculation that gives the same answer regardless of the slicers is a transformation, and it belongs upstream.<\/p>\n<p>The cost of ignoring this is a model where nobody can find where a number is defined, and where the same fix has to be made in four reports.<\/p>\n<h2>Import or DirectQuery<\/h2>\n<p><strong>Import<\/strong> loads a compressed copy of the data into the model. It is fast, it supports the whole of DAX, and it is the default answer. The data is as current as the last refresh.<\/p>\n<p><strong>DirectQuery<\/strong> leaves the data in the source and sends a query for every visual. You get current data and no size limit, and you pay for it with latency, a restricted set of DAX, and load on the source system that will eventually become somebody else's problem. Choose it when the freshness requirement is genuinely real-time or the volume genuinely will not import — not because it sounds more modern.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Loading one flat wide table and calling it a model.<\/li>\n<li>Turning on bidirectional filtering to fix a slicer, without knowing why it worked.<\/li>\n<li>Reporting over dates without a marked date table.<\/li>\n<li>Doing transformation work in DAX that Power Query should have done at refresh.<\/li>\n<li>Choosing DirectQuery by default and discovering the report is slow after it is published.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Microsoft Learn, \"Understand star schema and the importance for Power BI\". <a href=\"https://learn.microsoft.com/en-us/power-bi/guidance/star-schema\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/guidance/star-schema<\/a><\/li>\n<li>Microsoft Learn, \"Model relationships in Power BI Desktop\" — cardinality and cross-filter direction. <a href=\"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-relationships-understand<\/a><\/li>\n<li>Microsoft Learn, \"Bi-directional relationship guidance\". <a href=\"https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/guidance/relationships-bidirectional-filtering<\/a><\/li>\n<li>Matthew Roche, \"Roche's Maxim of Data Transformation\". <a href=\"https://ssbipolar.com/2021/05/31/roches-maxim/\" target=\"_blank\" rel=\"noopener\">https://ssbipolar.com/2021/05/31/roches-maxim/<\/a><\/li>\n<li>Microsoft Learn, \"Choose a Power BI model framework\" — Import versus DirectQuery. <a href=\"https://learn.microsoft.com/en-us/power-bi/guidance/powerbi-implementation-planning-model-framework\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/guidance/powerbi-implementation-planning-model-framework<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"dax","num":7,"domain":"analytics","track":"technical","title":"DAX and Filter Context","sub":"Why the same measure returns a different number in every cell","hue":20,"minutes":8,"labs":["dax-context"],"terms":["measure-vs-calculated-column","filter-context","row-context","calculate","context-transition","iterator-functions","time-intelligence","divide-function"],"html":"<p>DAX looks like Excel formulas and is not. An Excel formula computes one cell from other cells. A DAX measure is a rule that gets evaluated again in every cell of every visual, under whatever filters that cell happens to sit in. Once that clicks, most of the language follows. Until it does, nothing does.<\/p>\n<h2>Measures and calculated columns<\/h2>\n<p>A <strong>calculated column<\/strong> is computed row by row when the data refreshes, and the result is stored in the model. It knows about the current row and nothing about the report. Use it when you need a value to slice, group or filter by — a category band, a flag, a key to relate on.<\/p>\n<p>A <strong>measure<\/strong> is computed at query time, once per cell of the visual, in whatever filter context that cell sits in. It knows nothing about \"the current row\" and everything about what the user has selected. Use it for anything you aggregate.<\/p>\n<p>The default should be a measure. A calculated column that holds <code>Quantity * Price<\/code> on every one of ten million rows costs memory in the model and cannot respond to a slicer; the measure <code>SUMX(Sales, Sales[Quantity] * Sales[Price])<\/code> costs nothing at rest and answers correctly whatever the user clicks. Writing calculated columns where measures belong is the single most common beginner pattern, and it is what produces models that are inexplicably large and reports that do not react.<\/p>\n<div class=\"lab-embed\" data-lab=\"dax-context\"><\/div>\n\n<h2>Filter context<\/h2>\n<p><strong>Filter context<\/strong> is the set of filters in force when a measure is evaluated: the row and column a cell sits in, the slicers on the page, the page and report filters, anything a visual contributes.<\/p>\n<p><code>Total Sales = SUM(Sales[Amount])<\/code> is one expression. Put it in a matrix by product and month and it evaluates once per cell — for that product, in that month — and returns a different number each time. The measure does not know or care; the context is supplied to it. This is why \"the measure is wrong in the total row\" is almost never the measure and almost always the context: the total row is a genuinely different filter context, not the sum of the rows above it.<\/p>\n<p><strong>Row context<\/strong> is the other kind, and it is what a calculated column and an iterator have: a current row to read columns from. Row context does not filter anything by itself — which is why referencing a column inside a measure without wrapping it in an aggregation is an error.<\/p>\n<h2>CALCULATE<\/h2>\n<p><code>CALCULATE<\/code> is the function that modifies filter context, and it is the centre of the language. It takes an expression and any number of filter arguments, and evaluates the expression in a context it has changed:<\/p>\n<pre><code>Sales LY = CALCULATE ( [Total Sales], SAMEPERIODLASTYEAR ( 'Date'[Date] ) )\nSales Cairo = CALCULATE ( [Total Sales], 'Store'[City] = &quot;Cairo&quot; )\n<\/code><\/pre>\n<p>Its filter arguments <em>replace<\/em> existing filters on the same column rather than adding to them, which is the behaviour to internalise — <code>CALCULATE([Total Sales], 'Store'[City] = \"Cairo\")<\/code> returns Cairo even in a cell already filtered to Alexandria. Wrap the filter in <code>KEEPFILTERS<\/code> when you want to intersect with what is already there instead.<\/p>\n<p><code>CALCULATE<\/code> also performs <strong>context transition<\/strong>: when it is evaluated in a row context, it converts that row into an equivalent filter context. This is why a measure called from inside a calculated column or an iterator suddenly sees only the current row, and it is the mechanism behind most DAX behaviour that looks like magic.<\/p>\n<h2>Iterators<\/h2>\n<p>Functions ending in X — <code>SUMX<\/code>, <code>AVERAGEX<\/code>, <code>MAXX<\/code>, <code>RANKX<\/code> — take a table, evaluate an expression once per row of it, and aggregate the results. <code>SUM<\/code> adds up a column that already exists; <code>SUMX<\/code> computes something per row and then adds it up. When a calculation multiplies two columns together, or depends on anything more than a single stored column, it is an iterator you want.<\/p>\n<h2>Two small ones that matter<\/h2>\n<p>Divide with <code>DIVIDE(numerator, denominator)<\/code> rather than <code>/<\/code>. It returns blank instead of an error when the denominator is zero, which is exactly what a visual should show.<\/p>\n<p>Time intelligence — <code>SAMEPERIODLASTYEAR<\/code>, <code>DATEADD<\/code>, <code>TOTALYTD<\/code> — requires the marked date table from Chapter 6, with contiguous dates. Without one these functions fail quietly at period boundaries rather than loudly, which is the worst way for anything to fail.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Writing a calculated column where a measure belongs, then wondering why slicers do nothing.<\/li>\n<li>Expecting <code>CALCULATE<\/code>'s filters to add to the existing context rather than replace it.<\/li>\n<li>Reading a column inside a measure without an aggregation around it.<\/li>\n<li>Using <code>SUM<\/code> where the calculation needs a row-by-row <code>SUMX<\/code>.<\/li>\n<li>Time intelligence on a model with no marked, gapless date table.<\/li>\n<li>Dividing with <code>/<\/code> and shipping a visual full of errors.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Microsoft Learn, \"DAX overview\" and the function reference. <a href=\"https://learn.microsoft.com/en-us/dax/\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/dax/<\/a><\/li>\n<li>Microsoft Learn, \"CALCULATE function (DAX)\". <a href=\"https://learn.microsoft.com/en-us/dax/calculate-function-dax\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/dax/calculate-function-dax<\/a><\/li>\n<li>Microsoft Learn, \"Tutorial: Create calculated columns in Power BI Desktop\" and \"Create measures\" — the difference and when each applies. <a href=\"https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-calculated-columns\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-calculated-columns<\/a><\/li>\n<li>Microsoft Learn, \"DAX: DIVIDE function vs divide operator (/)\". <a href=\"https://learn.microsoft.com/en-us/dax/divide-function-dax\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/dax/divide-function-dax<\/a><\/li>\n<li>SQLBI (Marco Russo and Alberto Ferrari), \"Introducing CONTEXT TRANSITION in DAX\". <a href=\"https://www.sqlbi.com/articles/understanding-context-transition/\" target=\"_blank\" rel=\"noopener\">https://www.sqlbi.com/articles/understanding-context-transition/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"hrfunction","num":7,"domain":"hcm","track":"functional","title":"Headcount, Metrics & the HR Function","sub":"The vocabulary HR directors use — speak it fluently","hue":46,"minutes":7,"labs":["fte"],"terms":["headcount","fte-full-time-equivalent","attrition-turnover","org-chart","solid-line-vs-dotted-line-reporting","hrbp-hr-business-partner","centers-of-excellence-coe","shared-services-hr-operations","ulrich-model"],"html":"<p>A consultant does not need HR theory, but does need to speak HR's language fluently enough that an HR director never has to slow down. This chapter covers the metrics that appear in every reporting conversation and the way large HR functions are organized, which explains who owns which decision.<\/p>\n<h2>Headcount is not FTE<\/h2>\n<p><strong>Headcount<\/strong> is a raw count of people, regardless of how much each one works. One person equals one headcount. <strong>FTE<\/strong> — full-time equivalent — is a measure of workload rather than of people: an employee working half time is 0.5 FTE but still one headcount. A department with ten people, four of them half-time, has a headcount of ten and an FTE of eight. FTE is stored on the assignment.<\/p>\n<p>Both numbers are \"correct\", and they answer different questions: legal thresholds, facilities and org design care about humans; budgeting and capacity planning care about work. Reporting FTE when the client asked for headcount, or the reverse, is a reliable source of reporting disputes. Ask which one they mean.<\/p>\n<div class=\"lab-embed\" data-lab=\"fte\"><\/div>\n\n<p><strong>Attrition<\/strong> or turnover is the rate at which people leave over a period, usually expressed annually as a percentage. Definitions vary — voluntary versus involuntary, whether to include probation leavers, what goes in the denominator — so the first question when a client asks for a turnover report is how they define the numerator and the denominator. That question alone marks a consultant as experienced.<\/p>\n<h2>The org chart is data, not a drawing<\/h2>\n<p>In Oracle the <strong>org chart<\/strong> is generated from manager relationships on assignments; it is not drawn separately. If the chart looks wrong, the underlying manager data is wrong — fix the data, not the picture. Matrix organizations have two kinds of manager. <strong>Solid-line<\/strong> reporting is the formal line manager who owns performance and compensation decisions; <strong>dotted-line<\/strong> reporting is a secondary, functional relationship without that authority. A regional finance analyst may report solid-line to the country manager and dotted-line to the regional finance head. Approval routing usually follows the solid line, and getting it wrong sends approvals to the wrong person — which surfaces immediately in user acceptance testing.<\/p>\n<h2>How HR is organized: the Ulrich model<\/h2>\n<p>Most large HR functions use the vocabulary of the <strong>Ulrich model<\/strong>, which splits HR into three parts. <strong>HR business partners (HRBPs)<\/strong> are embedded with a business division as its strategic HR contact; they bring requirements framed as business problems rather than system specifications, and translating those into configuration is the consultant's job. <strong>Centers of excellence (CoEs)<\/strong> are specialist teams owning policy in a domain — compensation and benefits, talent acquisition, learning, organization development. The CoE typically signs off design in its domain: if the consultant designs a grade structure, C&amp;B approves it. <strong>Shared services<\/strong>, or HR Operations, is the centralized team doing transactional work — payroll processing, data entry, first-line queries — for the whole organization.<\/p>\n<p>In Egypt, shared services usually means the classic Personnel and Payroll team (شؤون العاملين): the people who handle social-insurance forms, labour-office files and attendance. They know the statutory reality better than anyone else in the building. Their daily work is what the configuration automates, they are the consultant's main day-to-day counterparts, and treating them as low-level administrators is a serious mistake — they hold operational knowledge no document captures.<\/p>\n<p>Knowing the model lets a consultant work out who owns a decision and who merely has an opinion about it.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Conflating headcount and FTE.<\/li>\n<li>Building a turnover report before agreeing the definition.<\/li>\n<li>Redrawing the org chart instead of fixing manager data.<\/li>\n<li>Routing approvals along the dotted line.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Dave Ulrich, <em>Human Resource Champions<\/em> (1997) — the original three-part model.<\/li>\n<li>Oracle, <em>Using Global Human Resources<\/em> — manager hierarchies and organization charts. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"lifecycle","num":8,"domain":"hcm","track":"functional","title":"The Employment Lifecycle","sub":"Hire to exit — every event is a dated transaction with a payroll consequence","hue":26,"minutes":8,"labs":["lifecycle"],"terms":["probation","notice-period","resignation","termination","end-of-contract","final-settlement","end-of-service-benefit-eosb-gratuity"],"html":"<p>Every event in an employee's working life is, in Oracle, a dated transaction against the assignment, with an approver and a downstream payroll consequence. Thinking in those terms is the consultant's default mental mode. This chapter follows a worker from hire to exit and, because the rules are statutory, uses Egypt's Labour Law No. 14 of 2025 (in force since 1 September 2025) as the worked example; Chapter 10 has the fuller statutory detail and Chapter 17 the Gulf equivalents.<\/p>\n<h2>Probation<\/h2>\n<p><strong>Probation<\/strong> is an initial period during which either party may end the employment with lighter obligations than after confirmation. Under Law 14/2025 it is capped at three months, cannot be extended, and a worker may be placed on probation only once with the same employer; the clause must be written into the contract or it has no legal effect. In the system, probation end dates drive alerts and confirmation workflows. Where a client's contracts specify a longer probation, flag it — the clause may be invalid.<\/p>\n<h2>Notice<\/h2>\n<p>A <strong>notice period<\/strong> is the advance written warning either party must give before terminating an indefinite-term contract. The 2025 law makes written notice mandatory, counts the notice period as service, and requires full wage during it. Several law-firm summaries state a flat three months regardless of service; earlier commentary described two months under ten years and three above. This is exactly the kind of point to verify against the Arabic text of the statute or the client's legal counsel before configuring, and saying so is a strong professional answer, not a weak one.<\/p>\n<h2>Three exit routes that are not the same<\/h2>\n<p><strong>Resignation<\/strong> is employee-initiated. Under the 2025 law the resignation must be validated at the competent labour office, the employer must respond within a set period, and the employee may withdraw the resignation within a short window after acceptance. Resignation carries no severance, but unused annual leave is paid out. A process design that makes reversal impossible fails the withdrawal requirement.<\/p>\n<p><strong>Termination<\/strong> is employer-initiated, with or without cause. The distinction determines severance exposure. Egyptian law lists specific grounds permitting immediate dismissal, places the burden of proving misconduct on the employer, and imposes strict procedural requirements. Termination is a heavily approval-gated transaction in any implementation.<\/p>\n<p><strong>End of contract<\/strong> is a fixed-term contract reaching its expiry date — nobody terminates it; it lapses. Under Law 14/2025, if a fixed-term contract is renewed or the employee simply continues working after expiry, it converts automatically into an indefinite-term contract, which ends the old practice of rolling short renewals indefinitely. Contract-expiry alerts are a real client requirement, especially in the Gulf, where they combine with visa and permit expiry.<\/p>\n<p>Treating the three as one \"termination\" transaction is a design error: they have different downstream calculations.<\/p>\n<div class=\"lab-embed\" data-lab=\"lifecycle\"><\/div>\n\n<h2>The final settlement<\/h2>\n<p>The <strong>final settlement<\/strong> calculates everything owed to a leaver: final salary, unused leave payout, any severance or end-of-service benefit, minus outstanding deductions such as loans. It is the last payroll event for that person and the one most likely to be disputed. It is usually run as an off-cycle QuickPay and requires the absence balance, the loan balance and the termination date all to be right at the same time — a good practice exercise because it touches absence, payroll and lifecycle at once.<\/p>\n<p>The <strong>end-of-service benefit (EOSB)<\/strong>, or gratuity, is a statutory lump sum payable to departing employees in Gulf countries, calculated on length of service and final wage. Gulf labour law provides it in place of a state pension for expatriate workers, with country-specific formulas. Egypt does not have gratuity in the Gulf sense; its equivalent protection comes through the social-insurance system. Importing EOSB logic into an Egyptian design, or assuming Egypt has gratuity, is a classic cross-market error.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Extending probation \"by agreement\". Under the 2025 law it cannot be extended.<\/li>\n<li>Configuring notice rules from an English summary without verification.<\/li>\n<li>Designing a resignation process with no withdrawal path.<\/li>\n<li>Merging the three exit routes into one transaction.<\/li>\n<li>Building EOSB into an Egyptian payroll.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\". <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<li>Andersen Egypt, \"Egypt's New Labour Law No. 14 of 2025\". <a href=\"https://eg.andersen.com/egypts-labour-law-14-2025/\" target=\"_blank\" rel=\"noopener\">https://eg.andersen.com/egypts-labour-law-14-2025/<\/a><\/li>\n<li>Amereller, \"Egypt: New Labor Law No. 14 of 2025\". <a href=\"https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/\" target=\"_blank\" rel=\"noopener\">https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"question-to-chart","num":8,"domain":"analytics","track":"functional","title":"From Question to Chart","sub":"The part of the job that is not a tool — and the small number of ways to mislead","hue":310,"minutes":7,"labs":[],"terms":["business-question","chart-choice","truncated-axis","dual-axis","data-ink","dashboard-vs-report","sanity-check"],"html":"<p>The tools are the easy half. The half that decides whether anyone uses your work is turning a vague request into a specific question, answering it in a form a human reads correctly, and being able to say how confident you are.<\/p>\n<h2>Make the question answerable<\/h2>\n<p>\"Can you look at our sales?\" is not a question. The job is to turn it into one that has a single defensible answer, and that takes three or four sentences of conversation rather than three hours of dashboard building.<\/p>\n<p>Ask what decision the answer feeds. Ask over what period, and compared with what — a number with nothing to compare it to is not information. Ask which population counts: does \"customer\" include the ones who churned, the internal test accounts, the trial users? Ask what would count as a surprising answer, which is the fastest way to surface the assumption the requester has not said out loud.<\/p>\n<p>Then repeat the question back as one sentence and get agreement before building anything. \"Revenue from new customers, by month, for the last twelve months, excluding trials, compared with the same months last year.\" That sentence is the specification, and it is also the title of the chart.<\/p>\n<h2>Choosing the form<\/h2>\n<p>The choice is narrower than the chart menu suggests.<\/p>\n<p>Comparing a value across categories is a <strong>bar chart<\/strong>, sorted by value rather than alphabetically unless the categories have a natural order, with the axis starting at zero. Change over time is a <strong>line chart<\/strong>, with time on the horizontal axis. The relationship between two measures is a <strong>scatter plot<\/strong>. Part of a whole is a bar chart too — a pie is readable only at two or three slices, and a stacked bar with more than about four series stops being comparable because only the bottom segment shares a baseline.<\/p>\n<p>A single important number is just the number, large, with its comparison next to it. A table is the right answer more often than people admit: when the reader needs exact values, or will look up one row rather than scan a pattern, a table beats every chart.<\/p>\n<p>Sort order, axis range and colour are decisions, not defaults. Colour especially should mean something — a category, a threshold, a direction — and if it means nothing it should not vary.<\/p>\n<h2>The ways charts mislead<\/h2>\n<p>A <strong>truncated axis<\/strong> on a bar chart is the classic one. Bars encode value by length, so cutting the axis at 90 makes a 2% difference look like a doubling. Bars must start at zero. Line charts are different — they encode change by slope, and a zero baseline often flattens the very thing you are showing — so truncation is acceptable there if the axis is labelled honestly.<\/p>\n<p><strong>Dual axes<\/strong> let you place two unrelated scales on one chart and imply a relationship that the data does not contain; the apparent correlation is entirely a function of where you set the two ranges. Two charts stacked with a shared time axis say the same thing without the implication.<\/p>\n<p>Beyond that: do not use area or volume to encode a single value, because people read those badly. Do not use a rainbow of colours for an ordered quantity. And keep the non-data material — gridlines, borders, shadows, legends that repeat the labels — light enough that the data is the loudest thing on the page.<\/p>\n<h2>Dashboards are not reports<\/h2>\n<p>A <strong>dashboard<\/strong> is monitored: a few numbers somebody looks at regularly to decide whether anything needs attention. It should fit on one screen, lead with the summary, and make what is wrong visible without reading. If everything on it is fine, the reader should be able to tell in three seconds.<\/p>\n<p>A <strong>report<\/strong> is read once and answers a question, at whatever length that takes. Requests for a dashboard are frequently requests for a report, and building the wrong one is a week wasted. The question that separates them: how often will you look at this, and what will you do differently as a result?<\/p>\n<h2>Before you send it<\/h2>\n<p>Sanity-check it, every time. Does the total match a number the business already trusts — last month's close, the finance figure, the count in the source system? If it does not, find out why <em>before<\/em> you present, because someone else will. Spot-check a handful of individual rows against the source. Check the boundaries: the first period, the last period, the nulls, the categories with one row.<\/p>\n<p>And say what you are not sure about. \"Revenue is up 4%, but two large orders moved in from March, so the underlying trend is closer to flat\" is a better answer than a clean number that is technically correct and practically misleading. Nobody loses trust for flagging a caveat; they lose it for a number that quietly turns out to be wrong.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Building before the question has been agreed in one sentence.<\/li>\n<li>Bar charts with a truncated axis.<\/li>\n<li>Dual axes implying a correlation the data does not show.<\/li>\n<li>A pie chart with seven slices.<\/li>\n<li>Presenting a total without checking it against a number the business already believes.<\/li>\n<li>Building a dashboard when what was wanted was an answer.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Edward Tufte, <em>The Visual Display of Quantitative Information<\/em>, 2nd ed. — data-ink, graphical integrity and the axis rules. <a href=\"https://www.edwardtufte.com/book/the-visual-display-of-quantitative-information/\" target=\"_blank\" rel=\"noopener\">https://www.edwardtufte.com/book/the-visual-display-of-quantitative-information/<\/a><\/li>\n<li>Financial Times, <em>Visual Vocabulary<\/em> — which chart form suits which relationship. <a href=\"https://github.com/Financial-Times/chart-doctor/tree/main/visual-vocabulary\" target=\"_blank\" rel=\"noopener\">https://github.com/Financial-Times/chart-doctor/tree/main/visual-vocabulary<\/a><\/li>\n<li>Microsoft Learn, \"Visualization types in Power BI\" and the report design guidance. <a href=\"https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/power-bi/visuals/power-bi-visualization-types-for-reports-and-q-and-a<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"egypt-payroll","num":9,"domain":"hcm","track":"functional","title":"Egypt: Social Insurance & Salary Tax","sub":"The mechanics Oracle does not ship — and the consultant's biggest differentiator","hue":4,"minutes":11,"labs":["insurance","tax"],"terms":["insurable-wage","social-insurance-contribution-rates","nosi","form-1-and-form-6","personal-exemption","progressive-tax-brackets","bracket-elimination-for-high-earners","martyrs-victims-fund-contribution","universal-health-insurance","minimum-wage-and-mandatory-annual-increment"],"html":"<p>Oracle does not deliver a pre-built, maintained Egyptian payroll localization the way it does for some markets. The implementation partner builds the statutory rules — in elements, balances and Fast Formulas (Chapter 12). A consultant who knows the Egyptian mechanics is therefore useful on day one in a way that one who only knows the product is not.<\/p>\n<blockquote>\n<p><strong>Every figure in this chapter moves.<\/strong> Insurable-wage limits rise each January under a fixed schedule; tax law changes by decree. The figures below were checked against PwC Worldwide Tax Summaries and statutory alerts in 2026. Re-verify against NOSI or the Egyptian Tax Authority before quoting them to a client.<\/p>\n<\/blockquote>\n<h2>Social insurance: the insurable wage<\/h2>\n<p>Egyptian social insurance is administered by <strong>NOSI<\/strong>, the National Organization for Social Insurance, under Law 148 of 2019. Contributions are not calculated on gross salary. They apply to the <strong>insurable wage<\/strong>: the portion of pay bounded by a statutory floor and ceiling. From 1 January 2026 the minimum is EGP 2,700 per month and the maximum EGP 16,700, up from EGP 2,300 and 14,500 in 2025. The limits rise 15% each January under a schedule that began in 2021, after which they are indexed to inflation.<\/p>\n<p>The <strong>contribution rates<\/strong> are fixed by law: employee 11%, employer 18.75%, total 29.75% of the insurable wage. At the 2026 ceiling the employee share caps at EGP 1,837.00 per month and the employer share at EGP 3,131.25 — whether the person earns EGP 20,000 or 200,000. Being able to compute a capped contribution in a workshop builds credibility fast, and \"contributions apply to full gross\" is the most common calculation error in Egyptian payroll.<\/p>\n<div class=\"lab-embed\" data-lab=\"insurance\"><\/div>\n\n<p>Registration is form-driven. <strong>Form 1<\/strong> is filed with social insurance on hiring and <strong>Form 6<\/strong> on termination; the Personnel team handles them, and a standard Oracle implementation does not generate them unless someone builds the output. Two smaller statutory items belong in every Egyptian element inventory: the <strong>Martyrs and Victims Fund<\/strong> deduction of 0.05% of gross pay, and <strong>universal health insurance<\/strong> (employer 3.25%, employee 1%), which applies only in governorates where the scheme has been rolled out — confirm the client's governorate rather than assuming.<\/p>\n<h2>The minimum wage and the mandatory increment<\/h2>\n<p>The private-sector <strong>minimum wage<\/strong> is EGP 7,000 per month, and it is defined to include the employer's social-insurance share rather than sit beneath it. Law 14/2025 also requires an <strong>annual increment<\/strong> of at least 3% of the social-insurance wage. Because the base is the insurable wage, not total salary, the increment is effectively capped at 3% of the ceiling for higher earners. Calculating it on full gross is the classic error.<\/p>\n<h2>Salary tax: annual, progressive, exemption-adjusted<\/h2>\n<p>Salary tax is calculated annually and then divided across the year — the monthly figure is a derived slice, not an independent calculation. The formula: gross, less the <strong>personal exemption<\/strong>, less the employee's social-insurance contribution, equals net taxable income. Law No. 7 of 2024 raised the personal exemption from EGP 15,000 to <strong>EGP 20,000<\/strong> a year, for residents and non-residents alike, widened the zero-rated band to EGP 40,000, and introduced a top rate of 27.5%.<\/p>\n<p>The <strong>progressive brackets<\/strong> on annual net taxable income are: 0% to EGP 40,000; 10% to 55,000; 15% to 70,000; 20% to 200,000; 22.5% to 400,000; 25% to 1,200,000; and 27.5% above that.<\/p>\n<h2>Bracket elimination for high earners<\/h2>\n<p>Egypt adds a rule most payroll calculators ignore. As net taxable income rises past defined thresholds, access to the lower bands is progressively removed, so that the income which would have been taxed at 0% or 10% is taxed at the next surviving rate instead. Above EGP 600,000 the zero band disappears; above 700,000 the 10% band also goes; the pattern continues through 800,000 and 900,000 until, above EGP 1,200,000, only the 25% and 27.5% bands remain. Deloitte's summary of Law 7/2024 presents exactly this as a table of bracket applications by total-income level.<\/p>\n<p>A naive progressive calculation that applies every band to every employee is wrong for senior staff — precisely the people who notice. If a consultant builds or validates an Egyptian tax formula, this rule is a correctness requirement.<\/p>\n<div class=\"lab-embed\" data-lab=\"tax\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Applying contributions to gross instead of the capped insurable wage.<\/li>\n<li>Quoting last year's limits. They change every January.<\/li>\n<li>Calculating the 3% increment on total salary.<\/li>\n<li>Treating tax as a flat monthly percentage.<\/li>\n<li>Omitting the Martyrs Fund and health-insurance lines, then finding the gap in parallel run.<\/li>\n<li>Ignoring bracket elimination.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>PwC Worldwide Tax Summaries, Egypt — \"Taxes on personal income\" and \"Other taxes\". <a href=\"https://taxsummaries.pwc.com/egypt/individual/taxes-on-personal-income\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/taxes-on-personal-income<\/a> · <a href=\"https://taxsummaries.pwc.com/egypt/individual/other-taxes\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/other-taxes<\/a><\/li>\n<li>Mercans statutory alert, \"Egypt: Minimum and Maximum Insurable Wage Limits Increase for Social Insurance from 2026\". <a href=\"https://mercans.com/resources/statutory-alerts/egypt-minimum-and-maximum-insurable-wage-limits-increase-for-social-insurance-from-2026/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/resources/statutory-alerts/egypt-minimum-and-maximum-insurable-wage-limits-increase-for-social-insurance-from-2026/<\/a><\/li>\n<li>Deloitte Middle East, \"Amendment to tax brackets and annual personal exemption\" (Law 7/2024). <a href=\"https://www.deloitte.com/middle-east/en/services/tax/perspectives/amendment-to-tax-brackets-and-annual-personal-exemption.html\" target=\"_blank\" rel=\"noopener\">https://www.deloitte.com/middle-east/en/services/tax/perspectives/amendment-to-tax-brackets-and-annual-personal-exemption.html<\/a><\/li>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\" (annual increment). <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"egypt-leave","num":10,"domain":"hcm","track":"functional","title":"Egypt: Leave Under Labour Law 14/2025","sub":"The statutory entitlements that become absence plans","hue":16,"minutes":6,"labs":["leave"],"terms":["egyptian-annual-leave-entitlement","casual-leave","sick-leave","maternity-leave"],"html":"<p>Labour Law No. 14 of 2025 replaced the 2003 law and took effect on 1 September 2025. Its leave provisions are the direct input to absence-plan design (Chapter 6). This chapter states the entitlements and the design implications; the exit and probation rules live in Chapter 8.<\/p>\n<h2>Annual leave: a ladder by service and age<\/h2>\n<p>The statutory ladder is 15 days during the first year of service (pro-rated where service exceeds six months but is under a year); 21 days from the second year; 30 days for workers with ten years of service or aged over 50; 45 days for persons with disabilities; plus 7 additional days for hazardous, arduous or remote-area work. Annual leave excludes official and weekly holidays.<\/p>\n<p>Two further rules shape the plan. The worker must take at least 15 days a year, including six consecutive days, and the employer must settle the leave balance or pay its cash equivalent at least every three years. These translate into carryover and expiry configuration and into leave-encashment logic on exit. The best practice exercise for accrual bands is to build this ladder and then test the two boundary cases: the person crossing ten years mid-year and the person turning fifty mid-year.<\/p>\n<h2>Casual leave<\/h2>\n<p><strong>Casual leave<\/strong> covers unforeseen circumstances: a maximum of 7 days per year (up from 6 under the old law), no more than 2 consecutive days at a time, and — the detail that gets missed in design and surfaces in UAT — counted within the annual-leave entitlement rather than on top of it.<\/p>\n<figure class=\"fig-embed\" data-fig=\"egypt-leave-ladder\"><\/figure>\n\n<h2>Sick leave<\/h2>\n<p><strong>Sick leave<\/strong> is paid at rates that vary by duration and is governed by the social-insurance law: for generally insured workers, 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in the same calendar year, subject to medical certification. Industrial establishments have a stronger schedule under labour law, and employers offset amounts already paid by NOSI. In Oracle this is a textbook qualification plan with payment bands.<\/p>\n<h2>Maternity and paternity<\/h2>\n<p><strong>Maternity leave<\/strong> is four months paid, capped at three occurrences during the employee's service, with no minimum-service condition. The \"three times in service\" cap must be enforced in configuration, not merely documented. Fathers receive one paid day on the date of birth, up to three times, and it is not deducted from annual leave. The law also provides unpaid childcare leave of up to two years, up to three times, in establishments of fifty or more employees.<\/p>\n<div class=\"lab-embed\" data-lab=\"leave\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Building annual leave as a flat 21 days.<\/li>\n<li>Putting casual leave on top of annual leave.<\/li>\n<li>Treating sick leave as an accrual plan.<\/li>\n<li>Documenting the maternity cap without enforcing it.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\". <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<li>Andersen Egypt, \"Egypt's New Labour Law No. 14 of 2025\". <a href=\"https://eg.andersen.com/egypts-labour-law-14-2025/\" target=\"_blank\" rel=\"noopener\">https://eg.andersen.com/egypts-labour-law-14-2025/<\/a><\/li>\n<li>Amereller, \"Egypt: New Labor Law No. 14 of 2025\". <a href=\"https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/\" target=\"_blank\" rel=\"noopener\">https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/<\/a><\/li>\n<li>PwC Worldwide Tax Summaries, Egypt — \"Other taxes\" (sick-leave compensation under the social-insurance law). <a href=\"https://taxsummaries.pwc.com/egypt/individual/other-taxes\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/other-taxes<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"hdl","num":11,"domain":"hcm","track":"technical","title":"Loading Data: HCM Data Loader","sub":"The highest-value technical skill a functional consultant can arrive with","hue":198,"minutes":9,"labs":["hdl"],"terms":["hdl-hcm-data-loader","hsdl-hcm-spreadsheet-data-loader","source-system-key-vs-person-number"],"html":"<p>In Oracle HCM, \"functional\" consultants are expected to be mildly technical. On real projects, bulk data loads land on strong functional people, and many avoid them. <strong>HCM Data Loader (HDL)<\/strong> is Oracle's bulk loading tool: nobody hand-enters ten thousand employees, so data migration and mass updates run through it. Comfort with HDL makes a consultant useful immediately.<\/p>\n<h2>The shape of a load<\/h2>\n<p>A load is one or more <code>.dat<\/code> files, zipped flat (no folders) and uploaded. Each file holds data for a single business object and is named for it: <code>Worker.dat<\/code>, <code>Job.dat<\/code>, <code>Grade.dat<\/code>, <code>ElementEntry.dat<\/code>. HDL decompresses the zip, imports the data lines into staging tables, groups them into business objects, and then loads them.<\/p>\n<p>Inside a file there are two kinds of instruction line, both pipe-delimited. A <strong>METADATA<\/strong> line declares the columns for a component: the keyword, then the discriminator (which component the line describes), then the attribute names. <strong>MERGE<\/strong> lines carry the data in the same order; MERGE creates the record if it does not exist and updates it if it does. <strong>DELETE<\/strong> removes a record.<\/p>\n<pre><code>METADATA|JobFamily|JobFamilyCode|JobFamilyName|EffectiveStartDate|EffectiveEndDate\nMERGE|JobFamily|SALES|Sales|2000/01/01|4712/12/31\n<\/code><\/pre>\n<p>That creates a job family coded SALES, effective from 1 January 2000. The end date <code>4712/12/31<\/code> is Oracle's conventional \"end of time\"; it appears everywhere. Dates use <code>YYYY/MM/DD<\/code>. A <code>Worker.dat<\/code> continues with further METADATA and MERGE pairs for PersonName, PersonNationalIdentifier, PersonEmail, WorkRelationship and Assignment — all components of the same worker hierarchy, in one file.<\/p>\n<h2>The rules that get files rejected<\/h2>\n<p>The METADATA line must appear before the MERGE or DELETE lines it relates to. A file may contain several METADATA lines, but each must be for a different component — two Job METADATA lines in one file is invalid. Each MERGE line must contain the same attributes as its METADATA line, in the same order, so a pipe-count mismatch fails the line. Attribute names are case-sensitive. Files should be UTF-8 without a byte-order mark.<\/p>\n<h2>Keys: what makes a migration reconcilable<\/h2>\n<p>HDL identifies records three ways. <strong>Source keys<\/strong> use <code>SourceSystemOwner<\/code> plus <code>SourceSystemId<\/code> to identify a record by its origin in the legacy system; if used, both must appear in the METADATA line. <strong>User keys<\/strong> identify by natural business keys such as <code>JobFamilyCode<\/code>. Oracle also generates its own surrogate IDs internally. A person's Oracle identifier is the <strong>person number<\/strong>; the source system key is what links that record back to the legacy one.<\/p>\n<p>The choice matters after the load, not during it. Source keys are what let a team trace every Oracle record to its legacy origin and explain every variance in reconciliation. Getting them right makes reconciliation possible; getting them wrong makes it nearly impossible, and data conversion is routinely the thing that delays a go-live.<\/p>\n<h2>Referencing other objects and ordering the load<\/h2>\n<p>To point at a foreign object, the attribute is named with the key type in brackets — <code>JobFamilyId(SourceSystemId)<\/code>, <code>PersonId(SourceSystemId)<\/code>. That is how child components attach to their parents. Several <code>.dat<\/code> files can go in one zip; HDL imports them in parallel but loads them sequentially, so referenced data must exist before it is referenced: job families before jobs, grades and jobs before assignments, people before work relationships.<\/p>\n<div class=\"lab-embed\" data-lab=\"hdl\"><\/div>\n\n<h2>HSDL: the spreadsheet cousin<\/h2>\n<p><strong>HCM Spreadsheet Data Loader (HSDL)<\/strong> is a spreadsheet interface over the same loading framework, aimed at business users. HDL is for bulk migration by the project team; HSDL is for ongoing, business-user-facing mass updates after go-live.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Two METADATA lines for the same component in one file.<\/li>\n<li>MERGE attributes out of order relative to METADATA.<\/li>\n<li>Wrong date format (<code>MM/DD/YYYY<\/code> corrupts silently).<\/li>\n<li>Loading children before parents.<\/li>\n<li>Choosing user keys for a migration that will need reconciling.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>HCM Data Loading Business Objects<\/em> — \"Data File Instructions and Delivery\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21b/faihm/data-file-instructions-and-delivery.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21b/faihm/data-file-instructions-and-delivery.html<\/a><\/li>\n<li>Oracle tutorial, \"Create and Maintain Data with HCM Data Loader\". <a href=\"https://docs.oracle.com/en/cloud/saas/tutorial-hdl-load-files/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/tutorial-hdl-load-files/<\/a><\/li>\n<li>HCM Tables, \"HCM Data Loader (HDL) Complete Guide — .dat File Format, Templates &amp; Troubleshooting\". <a href=\"https://hcm-tables.com/blog/hdl-data-loader-guide\" target=\"_blank\" rel=\"noopener\">https://hcm-tables.com/blog/hdl-data-loader-guide<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"ff","num":12,"domain":"hcm","track":"technical","title":"Fast Formula","sub":"Oracle's rule language — learn it by reading, not by studying grammar","hue":330,"minutes":7,"labs":["ff"],"terms":["fast-formula"],"html":"<p>Statutory rules vary too much across countries to hard-code, so Oracle exposes a rule layer. <strong>Fast Formula<\/strong> is a simple expression language for calculations, validations and rules, written in near-English rather than a full programming language. In payroll it computes rates and amounts; in absence it drives accrual rules; elsewhere it handles eligibility and defaulting. Because Oracle ships no maintained Egyptian localization, Egyptian social-insurance and tax calculations are built here — and it may be the functional consultant who writes them.<\/p>\n<h2>The four sections<\/h2>\n<p>Most formulas follow one shape: declare inputs, set defaults, run the logic, return a value. Oracle does not strictly enforce the order, but following it avoids errors.<\/p>\n<pre><code>INPUTS ARE BASIC_SALARY\nDEFAULT FOR BASIC_SALARY IS 0\nIF BASIC_SALARY &gt; 35000 THEN\n  SPECIAL_ALLOWANCE = 2500\nELSE\n  SPECIAL_ALLOWANCE = 0\nRETURN SPECIAL_ALLOWANCE\n<\/code><\/pre>\n<p>If a consultant can read this, they can read most delivered formulas.<\/p>\n<h2>Where values come from<\/h2>\n<p>Values reach a formula three ways: as inputs passed at runtime, as database items read from the database, or as global values. Inputs are declared with <code>INPUTS ARE<\/code>, and the name must match the element input value exactly, with words joined by underscores. Database items are referenced by name, and the system supplies most of the ones needed. Oracle's own guidance is to prefer <code>INPUTS<\/code> over database items where possible, because inputs do not require a database read and therefore speed up the payroll run — a detail worth saying in an interview.<\/p>\n<h2>Formula types and contexts<\/h2>\n<p>Every formula has a type that determines which inputs and contexts are available to it, and a formula written for one context will not work in another. This is why the language cannot be learned in the abstract: the same syntax behaves differently depending on where it runs. The practical approach is to read delivered formulas of the type being built and adapt them.<\/p>\n<p>Statements worth recognizing on sight: <code>DEFAULT FOR<\/code> sets a fallback where a value could be null; <code>ALIAS<\/code> shortens an unwieldy database-item name; and formulas call other formulas with <code>SET_INPUT<\/code>, <code>EXECUTE<\/code> and <code>GET_OUTPUT<\/code>, which is how common calculations are factored out instead of writing one enormous formula. Comments sit inside <code>/* */<\/code>.<\/p>\n<h2>A real rule, written out<\/h2>\n<p>The Egyptian employee social-insurance contribution (Chapter 9) makes a good first formula: take the wage as an input, cap it at the ceiling, floor it at the minimum, and return 11% of the result. The order matters — cap and floor first, then the rate.<\/p>\n<div class=\"lab-embed\" data-lab=\"ff\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating Fast Formula as a programming language to master up front. Approach it through examples.<\/li>\n<li>Reading database items when an input would do.<\/li>\n<li>Copying a formula across types and expecting it to run.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Fast Formula Guide<\/em> (Cloud). <a href=\"https://docs.oracle.com/cloud/131/user_services/OAPFF/F823032AN112EA.htm\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/cloud/131/user_services/OAPFF/F823032AN112EA.htm<\/a><\/li>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Formulas for Absence Management\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/20b/oapff/formulas-for-absence-management.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/20b/oapff/formulas-for-absence-management.html<\/a><\/li>\n<li>Salma Rawashdeh, \"Understanding Fast Formulas in Oracle HCM: A Guide with Examples\". <a href=\"https://medium.com/@islamrwashdeh/understanding-fast-formulas-in-oracle-hcm-a-guide-with-examples-e54e452501cc\" target=\"_blank\" rel=\"noopener\">https://medium.com/@islamrwashdeh/understanding-fast-formulas-in-oracle-hcm-a-guide-with-examples-e54e452501cc<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"reporting","num":13,"domain":"hcm","track":"technical","title":"Reporting & Integration","sub":"OTBI, BI Publisher, HCM Extract, REST — four ways out, and when each is right","hue":186,"minutes":9,"labs":["reporting"],"terms":["otbi","subject-area","bi-publisher-bip","bursting","hcm-extract","rest-api"],"html":"<p>There is no SQL Developer connection to a SaaS pod. When someone asks how to get data out of Oracle HCM, the complete answer names four paths and a reason for each: OTBI for ad-hoc analysis, BI Publisher for formatted output and complex SQL, HCM Extract for scheduled or large-volume outbound files, and REST for real-time integration.<\/p>\n<h2>OTBI: self-service against live data<\/h2>\n<p><strong>Oracle Transactional Business Intelligence (OTBI)<\/strong> is ad-hoc reporting and analysis directly against live HCM data, built by dragging fields rather than writing SQL. It works through <strong>subject areas<\/strong>: pre-built, governed logical data models — think of them as pre-joined tables exposed as folders and columns — each covering a business domain at a fixed grain. Names follow a pattern of functional area, then grain, then \"Real Time\": <em>Workforce Management — Worker Assignment Real Time<\/em>, <em>Workforce Management — Person Real Time<\/em>, <em>Payroll — Payroll Run Results Real Time<\/em>. Reading the name tells you the grain before you open it, and \"Real Time\" areas give a current snapshot while \"Trend\" areas give data across periods.<\/p>\n<p>Choosing the right subject area is most of the work, and choosing wrong is the number-one cause of reports that return wrong numbers rather than errors. Date-effective tables multiply rows; multiple assignments double-count people unless filtered to the primary, latest record.<\/p>\n<p>Three constraints catch people. Two subject areas cannot be joined in a single analysis. There is a default row limit — commonly cited around 65,000 — past which OTBI can truncate silently. And subject areas are predefined; their grain cannot be changed. When one subject area is not enough there are three workarounds: a Combined Analysis joining two analyses on a shared key such as person number; moving to BI Publisher and writing the SQL; or an HCM Extract for genuinely large volumes.<\/p>\n<h2>BI Publisher: pixel-controlled documents<\/h2>\n<p><strong>BI Publisher (BIP)<\/strong> has two pieces: a data model, which is genuinely SQL against the reporting schema, and a template, which controls layout. Together they produce documents with exact formatting — payslips, salary certificates, statutory forms, letters — and they can be scheduled and delivered. <strong>Bursting<\/strong> splits one report run into many individual outputs, each delivered separately; it is the mechanism by which thousands of payslips from one payroll run are emailed to the right people, and it is the standard follow-up question after any BIP question.<\/p>\n<p>BIP is more flexible than OTBI and slower to build: it demands stronger SQL, an understanding of entity relationships, manual data-security setup and template development. Reach for it when OTBI genuinely cannot do the job, not by default.<\/p>\n<p>The decision rule, memorized: ad-hoc analysis, dashboards and quick operational lists go to OTBI; formatted, printable, per-employee and statutory documents go to BI Publisher. Using OTBI for a payslip or BIP for a quick headcount list are both wrong answers in an interview.<\/p>\n<h2>Extract and REST: the integration boundary<\/h2>\n<p><strong>HCM Extract<\/strong> pulls HCM data on a schedule and delivers it to an external system — banks, benefits providers, government portals. It supports changes-only extracts, sending only what has changed since the last run, and it is the right tool when a data volume is too large for OTBI. The <strong>REST API<\/strong> is Oracle's web-service interface for programmatic read and write access, used where a scheduled file would be too slow: recruitment platforms, identity systems, custom applications.<\/p>\n<p>The honest boundary for a functional consultant: HDL, simple formulas, OTBI and basic BIP are routinely expected. Oracle Integration Cloud (OIC) integrations and complex BIP development are where the genuine hand-off to a technical team happens.<\/p>\n<div class=\"lab-embed\" data-lab=\"reporting\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Using OTBI for a payslip, or BIP for a quick list.<\/li>\n<li>Trusting a large OTBI result without checking the row limit.<\/li>\n<li>Picking a subject area by name without checking its grain.<\/li>\n<li>Assuming direct database access exists.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Creating and Administering Analytics and Reports for HCM<\/em> — \"HCM Subject Areas for Transactional Business Intelligence\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/fahca/hcm-subject-areas-for-transactional-business-intelligence.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/fahca/hcm-subject-areas-for-transactional-business-intelligence.html<\/a><\/li>\n<li>HCM Tables, \"Oracle Fusion HCM OTBI Subject Areas — Complete Guide with Decision Tree\". <a href=\"https://www.hcm-tables.com/blog/otbi-subject-area-guide\" target=\"_blank\" rel=\"noopener\">https://www.hcm-tables.com/blog/otbi-subject-area-guide<\/a><\/li>\n<li>Hexstream, \"Oracle Fusion OTBI vs BI Publisher\". <a href=\"https://www.hexstream.com/tech-corner/oracle-fusion-otbi-vs-bi-publisher\" target=\"_blank\" rel=\"noopener\">https://www.hexstream.com/tech-corner/oracle-fusion-otbi-vs-bi-publisher<\/a><\/li>\n<li>SplashBI, \"How To Join Two Subject Areas in OTBI\". <a href=\"https://splashbi.com/blog/cross-subject-area-otbi-reporting/\" target=\"_blank\" rel=\"noopener\">https://splashbi.com/blog/cross-subject-area-otbi-reporting/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"extend","num":14,"domain":"hcm","track":"technical","title":"Extending Without Customizing","sub":"Flexfields, lookups, value sets, sandboxes — the answer to \"can you add a field?\"","hue":262,"minutes":6,"labs":[],"terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code","value-set","sandbox","journey","redwood","quarterly-update-26a-26d"],"html":"<p>Every client needs a field Oracle did not ship, an option Oracle did not put in a dropdown, and a screen that behaves slightly differently for one group of users. In a SaaS product none of that can be done by changing code. Oracle's answer is a set of configuration tools that survive upgrades, and the correct response to most \"can you add…\" requests is one of them.<\/p>\n<h2>Descriptive flexfields<\/h2>\n<p>A <strong>descriptive flexfield (DFF)<\/strong> is a configurable extra field added to a standard object without customization: an equipment number, a badge colour, a union membership number. Because it is configuration rather than code, it survives every quarterly update. A <strong>value set<\/strong> constrains what a flexfield segment can accept — free-text fields become dirty data, so value sets enforce validity and are used together with DFFs to control input.<\/p>\n<h2>Lookups<\/h2>\n<p><strong>Lookup types<\/strong> and <strong>lookup codes<\/strong> are configurable lists of values powering dropdowns across the application: contract types, reasons for leaving, nationality lists. They are usually the right answer to \"can we add an option to this dropdown?\"<\/p>\n<h2>The three-thought habit<\/h2>\n<p>When a client says \"we need an extra field for X\", the first three thoughts should be: DFF (where does the data live), lookup (should it be a controlled list), and approvals (what should the workflow do about it). Saying that sequence aloud in a workshop or interview is a strong signal. For example: recording which company car each manager has is a DFF on the assignment with a value set; a new resignation reason called \"Further Study\" is a lookup code; hiding the grade field on the transfer form for non-managers is a page-level change made in a sandbox.<\/p>\n<figure class=\"fig-embed\" data-fig=\"extension-ladder\"><\/figure>\n\n<h2>Sandboxes and publishing<\/h2>\n<p>A <strong>sandbox<\/strong> is an isolated workspace for making and testing configuration changes — page layouts, flexfields — before publishing them to the live environment. Publishing a sandbox is the moment a change becomes real for every user: a controlled, deliberate step, not an autosave.<\/p>\n<h2>Journeys, Redwood and the quarterly cycle<\/h2>\n<p>A <strong>journey<\/strong> is a configurable checklist of tasks assigned to a person around an event — onboarding, transfer, offboarding — covering the many small tasks across several people that otherwise get missed: equipment, badge, policy acknowledgements, document uploads. It is a visible, client-pleasing feature and a good thing to demonstrate.<\/p>\n<p><strong>Redwood<\/strong> is Oracle's current user-experience design system, progressively replacing older pages; a large and growing share of new capability, including Oracle's AI features, is built on it. Recognition-level awareness is enough, but describing the product only in terms of the classic interface sounds a release behind.<\/p>\n<p>Fusion applications update on a fixed <strong>quarterly cycle<\/strong>, named by year and letter — 26A, 26B, 26C, 26D. Updates are mandatory and scheduled; each brings features that are enabled by default or require opt-in, and regression testing around updates is a standing client obligation. Handling a quarterly update well after go-live is where consultants build reputations.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Promising a \"customization\". In SaaS, it is a DFF, a lookup, or a page change.<\/li>\n<li>Adding a free-text field without a value set.<\/li>\n<li>Forgetting that nothing in a sandbox is real until it is published.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Configuring and Extending Applications<\/em> — flexfields, lookups, value sets, sandboxes. <a href=\"https://docs.oracle.com/en/cloud/saas/applications-common/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/applications-common/<\/a><\/li>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — journeys. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigh/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigh/<\/a><\/li>\n<li>Oracle Cloud Applications readiness site — quarterly update naming and opt-in features. <a href=\"https://www.oracle.com/readiness/\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/readiness/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"security","num":15,"domain":"hcm","track":"technical","title":"The Security Model","sub":"What you can do versus whose data you can see","hue":300,"minutes":6,"labs":["security"],"terms":["job-role","abstract-role","duty-role","data-role-and-security-profile","area-of-responsibility-aor"],"html":"<p>Security determines who can see and do what. A consultant needs conceptual fluency rather than deep architecture skill, but the vocabulary appears in almost every requirements workshop, and one distinction carries most of it: function versus data scope.<\/p>\n<h2>Role types<\/h2>\n<p>Oracle's documentation defines five role types. A <strong>job role<\/strong> represents the specific job a worker does in the enterprise — Human Resource Analyst, Payroll Manager — and is the most-discussed role type in requirements sessions. An <strong>abstract role<\/strong> represents a worker's role independently of any job: the predefined Employee, Contingent Worker and Line Manager roles, which grant baseline self-service access to everyone in the system. A <strong>duty role<\/strong> is a logical grouping of function privileges — the granular building block from which job and abstract roles are composed; duty roles are never assigned directly to users. Aggregate privileges combine a task's function privilege with its data-security policy and are predefined and non-editable.<\/p>\n<h2>Data scope: security profiles and data roles<\/h2>\n<p>Where a job role says what a user can do, a <strong>security profile<\/strong> says which records they can do it to. Profiles scope data by person, organization, position, legislative data group, payroll and other criteria. A <strong>data role<\/strong> combines a job role with the security profiles that define its scope — Oracle's example is \"Country Human Resource Specialist\": the HR specialist job plus a country's data. An HR specialist in Egypt and one in Saudi Arabia hold the same job role and see the same screens; their security profiles differ, so neither sees the other country's records. Same function, different scope.<\/p>\n<h2>Areas of responsibility<\/h2>\n<p>An <strong>area of responsibility (AOR)<\/strong> assigns responsibility for a defined population — \"this HR representative is responsible for the Alexandria plant\" — and is used to drive both access and routing without building a custom role for every combination. It is increasingly the preferred mechanism for scoping HR representative access.<\/p>\n<div class=\"lab-embed\" data-lab=\"security\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Answering a data-visibility question with a job role.<\/li>\n<li>Assigning duty roles to users. They are components, not assignments.<\/li>\n<li>Building one custom role per department when an AOR would do.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Securing HCM<\/em> — \"Which are the role types in HCM Cloud?\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faqas/which-are-the-role-types-in-hcm-cloud.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faqas/which-are-the-role-types-in-hcm-cloud.html<\/a><\/li>\n<li>Oracle, <em>Securing HCM<\/em> — \"HCM Data Roles and Security Profiles\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21c/ochus/hcm-data-roles-and-security-profiles.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21c/ochus/hcm-data-roles-and-security-profiles.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"method","num":16,"domain":"hcm","track":"functional","title":"Implementation Methodology","sub":"How projects actually run — and where the real finish line is","hue":62,"minutes":8,"labs":["method"],"terms":["fit-gap-analysis","crp-conference-room-pilot","sit-system-integration-testing","uat-user-acceptance-testing","cutover","freeze-period","hypercare","reconciliation","configuration-workbook","test-script","raid-log","change-request","oracle-true-cloud-method"],"html":"<p>This is the vocabulary of how projects are delivered. Trainers and interviewers use it constantly, and using it correctly makes a consultant sound like someone who has been on a project rather than someone who has read about one. Oracle's current methodology for Fusion Cloud projects is the <strong>Oracle True Cloud Method<\/strong>, successor to older methodologies such as AIM — whose document codes still appear in conversation: BR100 for setup documents, MD050 for functional designs, TE040 for test scripts.<\/p>\n<h2>From requirements to design<\/h2>\n<p>A <strong>fit-gap analysis<\/strong> compares client requirements against delivered functionality and documents where the product fits, where it does not, and what will be done about each gap: configure, work around, extend, or descope. It is the foundation of scope and the reference point for every later argument about what was agreed. The <strong>configuration workbook<\/strong> — usually a large structured spreadsheet — records every configuration decision and its agreed values; it is the record of what was built and why, and the basis for rebuilding it in the next environment.<\/p>\n<p>Clients cannot validate a design from a document. A <strong>conference room pilot (CRP)<\/strong> is a structured demonstration of the configured system to the client, using their own data and scenarios, usually run in iterations — CRP1, CRP2 — with feedback incorporated between them.<\/p>\n<h2>Testing<\/h2>\n<p><strong>System integration testing (SIT)<\/strong> checks that the configured system works end to end, including integrations with other systems; individual pieces working does not mean the chain works. It is executed by the project team before handing over to the client for <strong>user acceptance testing (UAT)<\/strong>, in which the client executes agreed <strong>test scripts<\/strong> — step-by-step documents defining what to do, what data to use and what result to expect. Each requirement should be traceable to at least one script; testing without scripts is clicking, not testing. On functional projects the consultant writes the scripts and often helps execute them, and UAT failures land on the configuration.<\/p>\n<h2>Cutover and go-live<\/h2>\n<p><strong>Cutover<\/strong> is the sequenced set of activities moving the client from the legacy system to the new one: final data loads, reconciliation, a <strong>freeze period<\/strong> during which no changes are permitted in the legacy system so that migration runs against a stable base, and go/no-go decisions. Go-live is not a moment but an ordered plan with dependencies and rollback points. <strong>Reconciliation<\/strong> — comparing outputs between two systems or two runs and explaining every difference — is central to both data migration and the parallel payroll run; an unexplained difference is a defect until proven otherwise.<\/p>\n<p><strong>Hypercare<\/strong> is the intensive support period immediately after go-live, with heightened staffing and response times, typically covering the first one or two live payroll runs. The first live cycles surface problems no amount of testing catches. Hypercare and the first live payroll — not the go-live date — are the actual finish line.<\/p>\n<div class=\"lab-embed\" data-lab=\"method\"><\/div>\n\n<h2>Governance<\/h2>\n<p>Running alongside all of it: the <strong>RAID log<\/strong>, a single visible home for risks, assumptions, issues and dependencies, reviewed in regular governance meetings; and the <strong>change request<\/strong>, the formal mechanism by which \"can you just add…\" becomes a managed decision with its impact on time and cost assessed. Learning to recognize a change request when it is spoken in a workshop — before agreeing to it — protects both the project and the consultant.<\/p>\n<p>One principle underlies the whole method: consultants do not design the best system; they get decisions made and documented. The client owns the design.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating testing as the QA team's job.<\/li>\n<li>Skipping the freeze and migrating a moving target.<\/li>\n<li>Calling go-live the finish.<\/li>\n<li>Agreeing to scope changes in a workshop without a change request.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Oracle True Cloud Method<\/em> overview (Oracle Consulting). <a href=\"https://www.oracle.com/consulting/\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/consulting/<\/a><\/li>\n<li>Intellicept, \"Oracle ERP Cloud Implementation Phases | Detailed Explanation\". <a href=\"https://intellicept.com/oracle-erp-cloud-implementation-phases-explained\" target=\"_blank\" rel=\"noopener\">https://intellicept.com/oracle-erp-cloud-implementation-phases-explained<\/a><\/li>\n<li>Jade Global, \"Oracle Cloud Implementation Methodology\". <a href=\"https://www.jadeglobal.com/oracle/methodology/jadecloud-implementation-methodology\" target=\"_blank\" rel=\"noopener\">https://www.jadeglobal.com/oracle/methodology/jadecloud-implementation-methodology<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"gulf","num":17,"domain":"hcm","track":"functional","title":"Saudi Arabia & the Gulf","sub":"The systems named in every Saudi job posting","hue":130,"minutes":8,"labs":[],"terms":["gosi","qiwa","mudad","nitaqat-saudization","wps-and-sif-file","iqama-and-visa-linked-employment-data","end-of-service-benefit-eosb-gratuity"],"html":"<p>Saudi job postings name specific government platforms, and knowing them separates a candidate from those who only know Oracle's generic Gulf localization. This chapter covers the systems, the numbers that matter, and the ways a Saudi implementation differs structurally from an Egyptian one.<\/p>\n<blockquote>\n<p><strong>Figures move here too.<\/strong> Saudi social-insurance rates are being phased up under the 2024 reform, and platform rules change by ministerial decision. Verify against GOSI and the Ministry of Human Resources and Social Development before configuring.<\/p>\n<\/blockquote>\n<h2>GOSI: social insurance with two populations<\/h2>\n<p>The <strong>General Organization for Social Insurance (GOSI)<\/strong> is the Saudi counterpart to Egypt's NOSI. The structural difference from Egypt is that contribution treatment depends on nationality. For Saudi nationals registered before the new Social Insurance Law took effect on 3 July 2024, the combined rate is 21.5% of the contributable wage — employee 9.75% (9% pension plus 0.75% SANED unemployment insurance), employer 11.75% (9% pension, 2% occupational hazards, 0.75% SANED). Nationals registered on or after that date fall under a phased schedule that rises from 22.5% to 23.5% combined from 1 July 2026, with
