<title>Moon Learning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF4; --ink:#0B1F3A; --ink-2:#2E4160; --muted:#5F6F88; --line:#D5DCE8; --line-2:#B9C4D6;
  --navy:#0B1F3A; --navy-2:#14325C; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#24406A;
  --primary:#14325C; --primary-ink:#FFFFFF; --primary-soft:#DCE6F5;
  --gold:#B8871B; --gold-soft:#F6EBD1; --sky:#2E6FB7; --sky-soft:#DCE8F7;
  --good:#237A57; --good-soft:#DCEFE5; --bad:#B03A3A; --bad-soft:#F6DFDF;
  --pl:38%; --ps:48%; --pl-soft:93%; --ps-soft:55%;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 10px 30px -14px rgba(11,31,58,.22);
  --scrim:rgba(11,31,58,.42); --pop:0 24px 70px -18px rgba(11,31,58,.45); --edge:rgba(11,31,58,.16);
  --glass:rgba(247,249,252,.78); --glass-2:rgba(255,255,255,.66); --glass-edge:rgba(11,31,58,.10); --glass-hi:rgba(255,255,255,.85);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1628; --surface:#112036; --surface-2:#182A45; --ink:#E8EEF7; --ink-2:#C3CFE0; --muted:#8A9BB5; --line:#23364F; --line-2:#35496A;
    --navy:#070F1E; --navy-2:#0F1F38; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#1E3252;
    --primary:#6FA8E8; --primary-ink:#0A1628; --primary-soft:#1B3355;
    --gold:#E2B45C; --gold-soft:#3A2E14; --sky:#7FB3F0; --sky-soft:#1B3355;
    --good:#5FC58A; --good-soft:#153327; --bad:#F08787; --bad-soft:#3E1D1D;
    --pl:66%; --ps:48%; --pl-soft:19%; --ps-soft:32%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
    --scrim:rgba(2,7,16,.66); --pop:0 24px 70px -18px rgba(0,0,0,.75); --edge:rgba(0,0,0,.5);
  --glass:rgba(10,20,36,.74); --glass-2:rgba(28,46,72,.55); --glass-edge:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#112036; --surface-2:#182A45; --ink:#E8EEF7; --ink-2:#C3CFE0; --muted:#8A9BB5; --line:#23364F; --line-2:#35496A;
  --navy:#070F1E; --navy-2:#0F1F38; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#1E3252;
  --primary:#6FA8E8; --primary-ink:#0A1628; --primary-soft:#1B3355;
  --gold:#E2B45C; --gold-soft:#3A2E14; --sky:#7FB3F0; --sky-soft:#1B3355;
  --good:#5FC58A; --good-soft:#153327; --bad:#F08787; --bad-soft:#3E1D1D;
  --pl:66%; --ps:48%; --pl-soft:19%; --ps-soft:32%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  --scrim:rgba(2,7,16,.66); --pop:0 24px 70px -18px rgba(0,0,0,.75); --edge:rgba(0,0,0,.5);
  --glass:rgba(10,20,36,.74); --glass-2:rgba(28,46,72,.55); --glass-edge:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.07);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.2vw,44px);font-weight:800}
h2{font-size:clamp(22px,3vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--sky)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
code,pre{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
[data-h]{--p:hsl(var(--h) var(--ps) var(--pl));--p-soft:hsl(var(--h) var(--ps-soft) var(--pl-soft));--p-deep:hsl(var(--h) 44% 27%)}

/* ---- shell: a glass bar across the top, content centred beneath it.
   The glass is deliberately restrained — it lives on the four surfaces that
   float above the page (top bar, palette, speech bar, collection cards) and
   nowhere else, so it reads as depth rather than decoration. */
.app{min-height:100vh;display:flex;flex-direction:column}

.topbar{position:sticky;top:0;z-index:40;background:var(--glass);border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
.tbar{max-width:1240px;margin-inline:auto;width:100%;padding:11px clamp(14px,4vw,34px);display:flex;align-items:center;gap:clamp(10px,2vw,22px)}

.brand{display:flex;align-items:center;gap:10px;flex:none;border-radius:10px;padding:3px 6px 3px 3px;margin-left:-3px}
.brand:hover{background:var(--surface-2)}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;flex:none}
.brand-mark svg{width:19px;height:19px;fill:currentColor;stroke:none}
.brand-txt{display:flex;flex-direction:column;text-align:left;line-height:1}
.brand-name{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.015em;color:var(--ink)}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:4px;font-weight:700}

.domains{display:flex;gap:4px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.domains::-webkit-scrollbar{display:none}
.dtab{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-family:var(--ui);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.dtab svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--p);background:var(--glass-2);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 1px 2px rgba(0,0,0,.05)}

.bar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.search-btn{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-family:var(--ui);font-weight:600;font-size:13.5px}
.search-btn:hover{color:var(--ink);border-color:var(--p)}
.search-btn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search-btn .kbd{font-size:10px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}

.sections{max-width:1240px;margin-inline:auto;width:100%;padding:0 clamp(14px,4vw,34px);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.sections::-webkit-scrollbar{display:none}
.sections:empty{display:none}
.sec-btn{display:flex;align-items:center;gap:7px;padding:9px 13px 11px;font-family:var(--ui);font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.sec-btn svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sec-btn:hover{color:var(--ink)}
.sec-btn.on{color:var(--p);border-bottom-color:var(--p)}

.main{flex:1;padding:34px clamp(16px,4vw,52px) 110px;max-width:1160px;width:100%;min-width:0;margin-inline:auto}
/* Grid and flex items default to min-width:auto, so they refuse to shrink below
   their widest child. Without this, one wide diagram makes the whole page scroll
   sideways instead of scrolling inside its own .stage. */
.main,.reader>article,.fc-wrap>div,.lab,.lab-body,.prose,.sysmap,.stage{min-width:0}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.view-head p{max-width:64ch;color:var(--ink-2);font-family:var(--body);font-size:17px}

.sync{position:fixed;left:14px;bottom:14px;z-index:20;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 11px;backdrop-filter:blur(12px)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.sync.on i{background:var(--good)}

/* ---- common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.chip.p{background:var(--p-soft);color:var(--p)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p);display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:var(--ui)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
input[type=text],input[type=number],input[type=search],textarea,select{font:inherit;font-family:var(--ui);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--primary)}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
.ring{--v:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--p,var(--gold)) calc(var(--v)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--display)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--p,var(--gold));border-radius:3px;transition:width .3s}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.callout{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px;font-family:var(--body)}
.callout b{color:var(--gold);font-family:var(--ui)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r)}
pre.code{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0;line-height:1.65;white-space:pre;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-2);color:var(--navy-ink);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.mine{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--gold-soft);color:var(--gold);font-weight:800}

/* ---- HOME */
.hero{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr;gap:24px;justify-items:start;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(184,135,27,.28),transparent 65%);pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:#fff;margin:8px 0 12px}
.hero p{color:var(--navy-muted);font-family:var(--body);font-size:17px;max-width:56ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .btn{border-color:var(--navy-line);background:var(--navy-2);color:var(--navy-ink)}
.hero .btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.hero-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;position:relative;width:100%;max-width:760px;min-width:0}
.hero-side .hstat{min-width:0}
.hero-main{position:relative}
.hstat{background:var(--navy-2);border:1px solid var(--navy-line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;color:var(--navy-ink)}
.hstat:hover{border-color:var(--gold)}
.hstat .ring{--p:var(--gold)}
.hstat .ring b{background:var(--navy-2);color:var(--navy-ink)}
.hstat .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.hstat .lbl{font-size:12.5px;color:var(--navy-muted);margin-top:3px}
.sysmap{padding:24px}
.sysmap-scroll{overflow-x:auto;min-width:0}
.sysmap-inner{min-width:820px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 22px}
.layer-lbl{grid-column:1/-1;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px;margin-top:6px}
.layer-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.mnode{border:1px solid var(--line);border-left:4px solid var(--p);border-radius:8px;padding:11px 12px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;position:relative;display:grid;gap:3px}
.mnode:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--p)}
.mnode .t{font-family:var(--display);font-weight:700;font-size:14.5px;padding-right:40px}
.mnode .s{font-size:12.5px;color:var(--muted)}
.mnode .k{position:absolute;top:9px;right:11px;font-size:11px;color:var(--p);font-weight:800;font-family:var(--display)}
.mnode.two{grid-column:span 2}.mnode.full{grid-column:span 3}
.mnode.wide{grid-column:span 3;border-style:dashed}
.mnode .done{position:absolute;bottom:9px;right:11px;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.paths3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.path3{padding:16px 18px;display:grid;gap:6px;text-align:left;cursor:pointer}
.path3:hover{border-color:var(--primary)}
.path3 .n{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.path3 h3{font-size:16px}
.path3 p{font-size:14px;color:var(--ink-2)}

/* ---- PROGRESS CHART */
.pchart{padding:20px 22px 16px;margin-bottom:22px}
.pchart-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.pchart-head p{max-width:60ch;margin-top:4px;font-family:var(--body)}
.pchart-key{display:flex;gap:14px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.pchart-grid{display:grid;grid-template-columns:repeat(var(--cols,17),minmax(0,1fr));gap:6px;align-items:end}
.pcol{display:grid;justify-items:center;gap:5px;padding:4px 0;border-radius:8px;cursor:pointer}
.pcol:hover{background:var(--surface-2)}
.pcol-v{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pcol-trk{width:100%;max-width:26px;height:78px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.pcol-trk i{display:block;width:100%;background:var(--p);border-radius:5px;min-height:3px;transition:height .3s}
.pcol-n{font-family:var(--display);font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pcol-ok{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;background:var(--good);color:var(--surface)}
.pcol-ok.off{background:none;border:1.5px dashed var(--line-2)}

/* stacked mastery bar */
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%;transition:width .3s}
.sbar .s2{background:var(--good)}
.sbar .s1{background:var(--gold)}
.sbar .s0{background:var(--line-2)}

/* ---- ICONS + CHAPTER COVER BAND */
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.ch-cover{position:relative;height:132px;border-radius:12px;overflow:hidden;margin-bottom:22px;background:linear-gradient(115deg,var(--p-deep),var(--navy))}
.ch-cover .cover-art,.ch-cover .cover-img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch-cover .cover-img{object-fit:cover;opacity:.5}
.ch-cover .ca{fill:none;stroke:#fff;stroke-width:2;opacity:.2}
.ch-cover .ca .fill{fill:#fff;stroke:none}
.ch-cover-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,28px)}
.ch-cover-ico{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
.ch-cover-ico .ico{width:26px;height:26px;stroke-width:1.6}
.ch-cover-n{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:800;color:#fff;opacity:.3;line-height:1}

.chrow .n{display:grid;gap:6px;justify-items:center;align-content:center}
.chrow .n .ico{width:20px;height:20px;color:var(--p)}
.mnode .t{display:flex;align-items:flex-start;gap:8px}
.mnode .t .ico{width:17px;height:17px;color:var(--p);margin-top:1px}

/* ---- FIGURES: inline SVG diagrams embedded in the prose.
   Everything is token-driven, so a figure repaints with the theme and takes
   its accent from the chapter's hue. Text on a solid --p fill uses --surface,
   which is light when --p is dark and dark when --p is light. */
.fig-embed{margin:24px 0 28px;padding:0;min-width:0}
.fig-scroll{overflow-x:auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.fig-embed svg{display:block;width:100%;min-width:600px;height:auto}
.fig-embed figcaption{font-family:var(--ui);font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:11px}
.fig-embed figcaption b{display:block;font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:3px}

.fig-embed .f-box rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.fig-embed .f-box.accent rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.6}
.fig-embed .f-box.ghost rect{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-dasharray:5 4}
.fig-embed .f-box.ghost .f-t{fill:var(--muted)}
.fig-embed .f-t{fill:var(--ink);font-family:var(--ui);font-size:13px;font-weight:700}
.fig-embed .f-s{fill:var(--muted);font-family:var(--ui);font-size:11.5px;font-weight:500}
.fig-embed .f-s.strong{fill:var(--ink);font-weight:700}
.fig-embed .f-s.mid{text-anchor:middle}
.fig-embed .f-h{fill:var(--muted);font-family:var(--ui);font-size:10.5px;font-weight:800;letter-spacing:.09em}
.fig-embed .f-big{fill:var(--p);font-family:var(--display);font-size:26px;font-weight:800}

.fig-embed .f-line{fill:none;stroke:var(--line-2);stroke-width:1.5}
.fig-embed .f-arrow{fill:var(--line-2)}
.fig-embed .f-divide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}

.fig-embed .f-vault{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.fig-embed .f-blocked{stroke:var(--line-2);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig-embed .f-no circle{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.fig-embed .f-no path{stroke:var(--bad);stroke-width:2.2;stroke-linecap:round;fill:none}
.fig-embed .f-cap{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}

.fig-embed .f-seg rect{fill:var(--surface-2)}
.fig-embed .f-bar-l{text-anchor:middle;font-family:var(--ui);font-size:11.5px;font-weight:700;fill:var(--ink-2)}
.fig-embed .f-seg.a rect{fill:var(--p)}
.fig-embed .f-seg.a .f-bar-l{fill:var(--surface)}
.fig-embed .f-seg.b rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.2}
.fig-embed .f-seg.b .f-bar-l{fill:var(--p)}
.fig-embed .f-seg.ghost rect{fill:var(--surface-2)}
.fig-embed .f-seg.ghost .f-bar-l{fill:var(--muted)}
.fig-embed .f-seg.w1 rect{fill:var(--surface-2)}
.fig-embed .f-seg.w2 rect{fill:var(--gold-soft)}
.fig-embed .f-seg.w2 .f-bar-l{fill:var(--gold)}
.fig-embed .f-seg.w3 rect{fill:var(--bad-soft)}
.fig-embed .f-seg.w3 .f-bar-l{fill:var(--bad)}

.fig-embed .f-steps rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.4}
.fig-embed .f-step-n{text-anchor:middle;fill:var(--p);font-family:var(--display);font-size:24px;font-weight:800}
.fig-embed .f-step-l{text-anchor:middle;fill:var(--muted);font-family:var(--ui);font-size:11.5px;font-weight:600}

/* Scroll shadows. A wide diagram scrolls inside its own box, but on a phone
   nothing said so — the right-hand half of a figure was simply invisible. The
   shadow appears only while there is more to scroll to, and fades out at the
   end, because the cover gradients scroll with the content (local) while the
   shadows do not (scroll). */
.fig-scroll{--scroll-bg:var(--surface)}
.stage{--scroll-bg:var(--surface-2)}
.fig-scroll,.stage{
  background-image:
    linear-gradient(to right,var(--scroll-bg),transparent),
    linear-gradient(to left,var(--scroll-bg),transparent),
    linear-gradient(to right,var(--edge),transparent),
    linear-gradient(to left,var(--edge),transparent);
  background-position:left center,right center,left center,right center;
  background-repeat:no-repeat;
  background-size:26px 100%,26px 100%,13px 100%,13px 100%;
  background-attachment:local,local,scroll,scroll;
}

/* ---- Functional / Technical sections */
.sec-k{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.sec-k.technical{background:var(--sky-soft);color:var(--sky)}
.sec-lbl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.sec-lbl p{margin:0;flex:1 1 380px;font-size:14px;color:var(--muted);font-family:var(--body);max-width:78ch}
.sysmap-scroll + .sec-lbl{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}

.chgroup{margin-bottom:34px}
.chgroup-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chgroup-head p{margin:0;font-size:14.5px;color:var(--muted);font-family:var(--body);flex:1 1 340px;min-width:0}
.chgroup-head .n{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}

/* ---- CHAPTERS list */
.chlist{display:grid;gap:10px}
.chrow{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:14px 18px;text-align:left;width:100%;cursor:pointer}
.chrow:hover{border-color:var(--p)}
.chrow .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--p);line-height:1}
.chrow .n small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chrow h3{margin-bottom:2px}
.chrow .s{font-size:14px;color:var(--muted)}
.chrow .m{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chrow .m .ok{color:var(--good);font-weight:700}

/* ---- READER */
.reader{display:grid;grid-template-columns:1fr 230px;gap:40px;align-items:start}
.reader-toc{position:sticky;top:24px;display:grid;gap:4px;font-size:13.5px}
.reader-toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line);display:block}
.reader-toc a:hover,.reader-toc a.on{color:var(--ink);border-color:var(--p)}
.reader-toc .tt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 10px 6px}
.ch-head{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ch-head .eyebrow{color:var(--p)}
.ch-head h1{margin:6px 0 10px}
.ch-head .sub{font-family:var(--body);font-size:19px;color:var(--ink-2);max-width:60ch;font-style:italic}
.ch-head .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.prose{font-family:var(--body);font-size:17.5px;line-height:1.65;color:var(--ink);max-width:none}
/* The reading measure belongs to the text, not to the column: diagrams and
   labs get the whole article width, which is wider than 68ch on a desktop. */
.prose > *{max-width:68ch}
.prose > .fig-embed,.prose > .lab-embed{max-width:none}
.prose p{margin:0 0 18px}
.prose h2{font-family:var(--display);font-size:22px;margin:38px 0 12px;scroll-margin-top:24px;letter-spacing:-.01em}
.prose h2::before{content:"";display:block;width:36px;height:3px;background:var(--p);margin-bottom:10px;border-radius:2px}
.prose strong{font-weight:600;color:var(--ink)}
.prose ul{padding-left:22px;margin:0 0 18px}
.prose li{margin-bottom:6px}
.prose blockquote{margin:0 0 20px;border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:16px}
.prose blockquote p{margin:0}
.prose blockquote strong{color:var(--gold);font-family:var(--ui)}
.prose pre{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 20px;line-height:1.65;font-size:13px}
.prose code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.85em;overflow-wrap:anywhere}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose .mistakes{border:1px solid var(--line);border-radius:10px;padding:16px 18px 6px;margin:0 0 22px;background:var(--surface)}
.prose .mistakes h2{margin:0 0 10px;font-size:16px}
.prose .mistakes h2::before{display:none}
.prose .mistakes ul{padding-left:0;list-style:none;margin:0}
.prose .mistakes li{position:relative;padding:8px 0 8px 23px;border-top:1px solid var(--line);font-size:15.5px;margin:0}
.prose .mistakes li::before{content:"✕";position:absolute;left:0;top:8px;color:var(--bad);font-weight:800;font-family:var(--ui)}
.prose .sources{font-family:var(--ui);font-size:13.5px;color:var(--muted);margin-top:8px}
.prose .sources h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:30px 0 8px}
.prose .sources h2::before{display:none}
.prose .sources ul{padding-left:0;list-style:none}
.prose .sources li{margin-bottom:6px;padding-left:14px;text-indent:-14px}
.prose .sources a{word-break:break-all}
.lab-embed{margin:8px 0 26px;font-family:var(--ui);font-size:15px;line-height:1.5}
.lab-embed .lab{padding:20px}
.lab-embed .lab-head h2{margin:0;font-size:18px}
.lab-embed .lab-head h2::before{display:none}
.keyterms{margin:34px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.keyterms h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.kt{display:grid;gap:8px}
.kt .row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kt .row b{font-family:var(--display);font-size:14.5px;display:block}
.kt .row span{font-size:14px;color:var(--ink-2)}
.known{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;margin-top:2px}
.known svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.known.on{background:var(--good);border-color:var(--good);color:#fff}
.ch-foot{margin-top:30px;display:grid;gap:14px}
.ch-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ch-nav .btn{max-width:48%}
.notes{display:grid;gap:6px}
.ask-box{display:grid;gap:8px;background:var(--surface-2);border-radius:10px;padding:14px}
.ask-box .ans{font-size:15px;white-space:pre-wrap;color:var(--ink-2);font-family:var(--body)}

/* ---- GLOSSARY */
.gl-top{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.gl-top input{max-width:420px}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk label{font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-weight:700}
.chk label.on{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.gl-letter{font-family:var(--display);font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.09em;margin:22px 0 8px}
.gl{display:grid;gap:8px}
.gterm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px}
.gterm b{font-family:var(--display);font-size:15.5px}
.gterm .d{font-size:14.5px;color:var(--ink-2);font-family:var(--body);margin-top:2px}
.gterm .w{font-size:13.5px;color:var(--ink-2);margin-top:6px;padding-left:10px;border-left:2px solid var(--gold)}
.gterm .w b{font-family:var(--ui);font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.gterm .go{font-size:12px;color:var(--p);font-weight:700;white-space:nowrap;text-decoration:none;font-family:var(--ui)}
.add-form{display:grid;gap:8px;padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);margin-top:14px}
.add-form label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ---- LABS (shared with embeds) */
.labs-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.labs-nav button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.labs-nav button.active{background:var(--p);color:#fff;border-color:var(--p)}
.lab{padding:24px;display:grid;gap:18px;font-family:var(--ui)}
.lab-head{display:flex;flex-direction:column;gap:4px}
.lab-head .eyebrow{color:var(--p)}
.lab-head p{color:var(--ink-2);max-width:70ch;margin-top:4px;font-size:15px}
.stage{background:var(--surface-2);border-radius:var(--r);padding:18px;overflow-x:auto}
.explain{padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-height:64px;font-size:15px}
.explain b{font-family:var(--display)}
.explain .muted{font-size:13.5px}
.node{border:1.5px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink)}
.node:hover,.node.active{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
.node.ghost{border-style:dashed;color:var(--muted);font-weight:500}
.node small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.node.active small{color:var(--p)}
.tree{display:grid;gap:26px;min-width:720px}
.tier{display:flex;justify-content:center;gap:14px;position:relative}
.tier+.tier::before{content:"";position:absolute;top:-26px;left:50%;height:26px;width:1.5px;background:var(--line-2)}
.tier .node{min-width:150px;position:relative}
.tier.split{justify-content:space-around}
.tier.split::before{width:60%;left:20%;height:1.5px;top:-14px}
.tier.split::after{content:"";position:absolute;top:-26px;left:50%;height:12px;width:1.5px;background:var(--line-2)}
.tier.split .node::before{content:"";position:absolute;top:-14px;left:50%;width:1.5px;height:14px;background:var(--line-2)}
.ldg-box{border:2px dashed var(--p);border-radius:12px;padding:14px;display:grid;gap:10px;position:relative;flex:1;max-width:340px}
.ldg-box .lg{position:absolute;top:-10px;left:12px;background:var(--surface-2);padding:0 6px;font-size:11px;font-weight:800;color:var(--p);letter-spacing:.06em;text-transform:uppercase}
.pipe{display:flex;align-items:stretch;min-width:760px}
.pipe .node{flex:1;border-radius:0;position:relative;padding:10px 8px 10px 16px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);border:0;background:var(--surface)}
.pipe .node:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:6px 0 0 6px}
.pipe .node:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 6px 6px 0}
.pipe .node.active{background:var(--p);color:#fff}
.pipe .node.active small{color:#fff;opacity:.85}
.pipe .node:hover{box-shadow:none}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{padding:6px 12px;border-radius:6px;border:1px solid var(--line-2);font-size:13px;font-weight:700;background:var(--surface)}
.stepper button.active{background:var(--p);color:#fff;border-color:var(--p)}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.obj{padding:10px 12px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font-size:13.5px;transition:all .25s}
.obj .t{font-weight:800;font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.obj .v{margin-top:2px}
.obj.live{border-color:var(--good);background:var(--good-soft)}
.obj.new{border-color:var(--p);background:var(--p-soft);animation:pop .3s}
.obj.dead{opacity:.55;text-decoration:line-through;border-style:dashed}
.obj.off{opacity:.3;border-style:dashed}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.counter{display:flex;gap:14px;flex-wrap:wrap}
.counter div{padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-width:120px}
.counter .big{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;color:var(--p)}
.counter .lbl{font-size:12px;color:var(--muted)}
.tl{position:relative;padding:22px 0 8px;min-width:600px}
.tl-line{height:3px;background:var(--line-2);border-radius:2px;position:relative}
.tl-seg{position:absolute;top:0;height:3px;border-radius:2px;background:var(--p)}
.tl-seg.old{background:var(--muted)}
.tl-seg.gone{background:repeating-linear-gradient(90deg,var(--bad) 0 6px,transparent 6px 10px)}
.tl-mark{position:absolute;top:-8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.tl-mark i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--p);display:block}
.tl-mark.warn i{border-color:var(--gold)}
.tl-lbl{position:absolute;top:14px;transform:translateX(-50%);font-size:12.5px;font-weight:600;white-space:nowrap}
.tl-row{position:relative;height:56px}
.calc{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;align-items:start}
.calc .in{display:grid;gap:10px}
.calc .in label{font-size:13px;font-weight:700;color:var(--ink-2)}
.calc .out{display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
.kv.total{font-size:17px}
.kv.total b{color:var(--p)}
.hbar{display:grid;gap:6px;margin-top:8px}
.hbar .row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:10px;font-size:13.5px}
.hbar .trk{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.hbar .fill{height:100%;background:var(--p);border-radius:4px;transition:width .3s}
.hbar .fill.cap{background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.5}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.brackets{display:grid;gap:4px;margin-top:6px}
.brk{display:grid;grid-template-columns:120px 1fr 70px 110px;gap:10px;align-items:center;font-size:13.5px;padding:5px 8px;border-radius:6px;transition:opacity .2s}
.brk .trk{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.brk .fill{height:100%;background:var(--p);transition:width .3s}
.brk.dead{opacity:.35}
.brk.dead .rate{text-decoration:line-through;color:var(--bad)}
.brk .rate{font-weight:800;font-family:var(--display)}
.brk .amt{text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.ladder{display:flex;align-items:flex-end;gap:14px;min-height:190px;padding-top:10px}
.rung{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rung .col{width:100%;background:var(--p);border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;opacity:.85}
.rung:hover .col,.rung.active .col{opacity:1;filter:brightness(1.1)}
.rung .lbl{font-size:12.5px;text-align:center;color:var(--ink-2);line-height:1.25}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.plan{padding:12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.plan:hover,.plan.active{border-color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
.plan b{font-family:var(--display);display:block}
.plan small{color:var(--muted);font-size:12.5px}
.bands{display:flex;gap:4px;height:34px;margin-top:6px}
.bands div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border-radius:4px;background:var(--p)}
.bands div:nth-child(2){filter:brightness(1.2)}
.scen{display:grid;gap:8px}
.scen button{text-align:left;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:14.5px}
.scen button:hover,.scen button.active{border-color:var(--p)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.path{padding:12px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);transition:all .25s;font-size:13.5px}
.path b{font-family:var(--display);display:block;font-size:15px}
.path.win{border-color:var(--good);background:var(--good-soft)}
.path.lose{opacity:.4}
.hdl{display:grid;gap:2px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.hdl .ln{display:flex}
.hdl .tok{padding:0 4px;border-radius:4px;cursor:default;border:1px solid transparent}
.hdl .tok:hover,.hdl .tok.hl{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.hdl .kw{font-weight:700;color:var(--p)}
.hdl .pipe-c{color:var(--muted)}
.hdl .eot{color:var(--gold);font-weight:600}
.orderer{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orderer .node{min-width:110px}
.orderer .node.picked{opacity:.35;pointer-events:none}
.order-out{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px;padding:8px;border:1.5px dashed var(--line-2);border-radius:8px}
.order-out .node{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.order-out .arrow{color:var(--muted)}
.verdict{font-weight:700;font-size:14px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.ff{font-family:var(--mono);font-size:13.5px;line-height:1.75;display:grid;gap:8px;overflow-x:auto}
.ff .blk{padding:6px 12px;border-left:3px solid var(--p);border-radius:0 6px 6px 0;background:var(--surface);white-space:pre}
.ff .blk .lb{font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p);margin-bottom:2px}
.ff .blk.i{--p:hsl(214 var(--ps) var(--pl))}.ff .blk.d{--p:hsl(46 var(--ps) var(--pl))}.ff .blk.l{--p:hsl(152 var(--ps) var(--pl))}.ff .blk.r{--p:hsl(4 var(--ps) var(--pl))}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:520px}
.secgrid .cell{padding:14px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface)}
.secgrid .cell h4{margin-bottom:6px}
.secgrid .cell ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.phases{display:flex;min-width:820px}
.phase{flex:1;position:relative;padding:12px 10px 12px 18px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-right:0;text-align:left}
.phase:first-child{border-radius:8px 0 0 8px}.phase:last-child{border-radius:0 8px 8px 0;border-right:1px solid var(--line)}
.phase b{font-family:var(--display);font-size:13.5px;display:block}
.phase small{font-size:11.5px;color:var(--muted)}
.phase.active,.phase:hover{background:var(--p-soft);color:var(--p)}
.phase.active small{color:var(--p)}
.people{display:flex;gap:6px;flex-wrap:wrap}
.person{width:34px;height:44px;border-radius:6px 6px 3px 3px;background:var(--p);position:relative;cursor:pointer;opacity:.9;transition:all .2s;overflow:hidden}
.person::after{content:"";position:absolute;inset:0;background:var(--surface-2);transform:translateY(100%);transition:transform .25s}
.person.half::after{transform:translateY(50%)}
.person:hover{opacity:1}

/* ---- DRILL */
.drill-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg button.active{background:var(--primary);color:var(--primary-ink)}
.fc-wrap{display:grid;grid-template-columns:1fr 280px;gap:22px;align-items:start}
.fc{perspective:1200px;min-height:320px;cursor:pointer}
.fc-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:320px}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;gap:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.face.front{background:var(--navy);color:var(--navy-ink);border-color:var(--navy-line)}
.face.front .chip{background:var(--navy-2);color:var(--gold)}
.face.front .hint,.face.front .meta{color:var(--navy-muted)}
.face.back{transform:rotateY(180deg);overflow:auto}
.face .q{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.25;margin:auto 0}
.face .a{font-size:15.5px;color:var(--ink);display:grid;gap:10px;overflow:auto;font-family:var(--body)}
.face .a .lb{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p);font-family:var(--ui)}
.face .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.face .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.grade .btn{flex:1;justify-content:center}
.grade .no{border-color:var(--bad);color:var(--bad)}.grade .yes{border-color:var(--good);color:var(--good)}
.drill-side{display:grid;gap:12px}
.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mastery div{padding:10px 6px;border-radius:8px;background:var(--surface-2)}
.mastery .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.mastery .lbl{font-size:11.5px;color:var(--muted)}
.mastery .m0 .big{color:var(--muted)}.mastery .m1 .big{color:var(--gold)}.mastery .m2 .big{color:var(--good)}
.selfans{display:grid;gap:8px}
.feedback{font-size:14.5px;white-space:pre-wrap;background:var(--surface-2);padding:10px 12px;border-radius:8px;color:var(--ink-2);font-family:var(--body)}

/* ---- ABOUT */
.about{max-width:68ch;font-family:var(--body);font-size:17px;line-height:1.65}
.about h2{font-family:var(--display);font-size:20px;margin:30px 0 10px}
.about p{margin:0 0 16px}
.about ul{padding-left:22px}
.about code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.85em}

/* ---- SEARCH: rail trigger + command palette */

.pal-lock{overflow:hidden}
.pal{position:fixed;inset:0;z-index:60;display:grid;place-items:start center;padding:10vh 16px 16px}
.pal-bg{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px)}
.pal-box{position:relative;width:min(720px,100%);max-height:76vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--pop);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.pal-in input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:600;padding:2px 0}
.pal-in input::placeholder{color:var(--muted);font-weight:500}
.pal-in input:focus-visible{outline:none}
.pal-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.pal-row{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:9px;border-left:3px solid transparent}
.pal-row.on{background:var(--surface-2);border-left-color:var(--p,var(--gold))}
.pal-kind{flex:none;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p,var(--muted));width:62px}
.pal-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.pal-t{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);line-height:1.3}
.pal-sub{font-size:12px;color:var(--muted);font-weight:600}
.pal-snip{font-family:var(--body);font-size:13.5px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pal mark{background:var(--gold-soft);color:var(--ink);font-weight:700;border-radius:3px;padding:0 1px}
.pal-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.pal-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600}
.pal-foot .kbd{margin-right:3px}

/* ---- data tables inside labs: small, dense, row-state aware */
.dt{border-collapse:collapse;font-family:var(--ui);font-size:13.5px}
.dt th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:5px 14px 6px 0;border-bottom:1.5px solid var(--line-2);white-space:nowrap}
.dt td{padding:7px 14px 7px 0;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
.dt td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:20px}
.dt tr.gone td{opacity:.3;text-decoration:line-through}
.dt td.nul{color:var(--muted);font-style:italic}
.dt tr.tie td{background:var(--p-soft)}
.qline{display:flex;flex-direction:column;gap:3px;margin-bottom:13px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.qline b{color:var(--p);font-weight:600;margin-right:6px}
.qcount{margin-top:11px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.explain code,.kv code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--ink);overflow-wrap:anywhere}
.kv span{min-width:0}
.explain em{font-style:italic}

/* ---- OVERVIEW: the landing page across collections */
.over-hero{max-width:62ch;margin-bottom:34px}
.over-hero h1{font-size:clamp(30px,5vw,46px);margin:10px 0 14px}
.over-lede{font-family:var(--body);font-size:18px;line-height:1.66;color:var(--ink-2)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.dcard{text-align:left;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:16px;cursor:pointer;
  border:1px solid var(--glass-edge);background:var(--glass-2);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -20px rgba(0,0,0,.5);transition:transform .18s,box-shadow .18s}
.dcard:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px -22px rgba(0,0,0,.45)}
.dcard-top{display:flex;gap:13px;align-items:flex-start}
.dcard-ico{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;background:var(--p-soft);color:var(--p);border:1px solid var(--glass-edge)}
.dcard-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dcard-name{font-family:var(--display);font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.015em}
.dcard-tag{font-size:13.5px;color:var(--muted);margin-top:3px;font-weight:600}
.dcard-blurb{font-family:var(--body);font-size:16px;line-height:1.6;color:var(--ink-2);margin:0}
.dcard-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.dcard-stats b{color:var(--ink);font-family:var(--display);font-weight:800;font-size:15px}
.dcard-prog{display:flex;align-items:center;gap:11px;margin-top:auto;padding-top:4px}
.dcard-prog .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.dcard-prog .bar i{display:block;height:100%;background:var(--p);border-radius:3px}
.dcard-prog span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}

.over-cont{margin-top:40px}
.cont-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.cont{display:flex;align-items:center;gap:11px;padding:13px 15px;text-align:left;cursor:pointer;border-left:3px solid var(--p)}
.cont:hover{border-color:var(--p);background:var(--surface-2)}
.cont .ico{width:19px;height:19px;color:var(--p)}
.cont b{display:block;font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.25}
.cont span{font-size:11.5px;color:var(--muted);font-weight:600}
.over-foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--body);font-size:15px;color:var(--muted);max-width:70ch}

/* ---- SPEECH: listen control and the bar it raises */
.listen{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-family:var(--ui);font-weight:700;font-size:13px}
.listen svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.listen:hover{border-color:var(--p);color:var(--p)}
.listen.on{background:var(--p);border-color:var(--p);color:var(--surface)}
.listen-min{font-size:11px;opacity:.7;font-weight:600}
.prose .speaking{background:var(--p-soft);box-shadow:-10px 0 0 var(--p-soft),10px 0 0 var(--p-soft);border-radius:2px;transition:background .2s}

.reader-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:45;width:min(720px,calc(100vw - 24px));
  border:1px solid var(--glass-edge);border-radius:15px;background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--pop)}
.sb-in{display:flex;align-items:center;gap:12px;padding:10px 14px}
.sb-play{width:34px;height:34px;border-radius:50%;flex:none;background:var(--p);display:grid;place-items:center;position:relative}
.sb-play::before{content:"";width:11px;height:13px;background:var(--surface);clip-path:polygon(0 0,0 100%,100% 50%)}
.sb-play.paused::before{clip-path:none;width:10px;height:12px;background:linear-gradient(to right,var(--surface) 0 35%,transparent 35% 65%,var(--surface) 65% 100%)}
.sb-meta{display:flex;flex-direction:column;min-width:0;flex:none;max-width:190px}
.sb-title{font-family:var(--display);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-pos{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sb-track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);cursor:pointer;min-width:40px}
.sb-track i{display:block;height:100%;width:0;border-radius:3px;background:var(--p);transition:width .25s}
.reader-bar select{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:5px 6px;max-width:120px}
.sb-voice{min-width:0}
.sb-x{width:28px;height:28px;border-radius:7px;flex:none;color:var(--muted);font-size:19px;line-height:1;display:grid;place-items:center}
.sb-x:hover{color:var(--ink);background:var(--surface-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.pal-dom{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--p);background:var(--p-soft);padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}

@media (max-width:900px){
  .brand-sub{display:none}
  .brand-name{font-size:15.5px}
  .search-btn .lbl,.search-btn .kbd{display:none}
  .search-btn{padding:8px 9px}
  .dtab{padding:7px 11px;font-size:13px}
  .sec-btn{padding:9px 10px 11px;font-size:13px}
  .pal{padding:6vh 10px 10px}
  .pal-box{max-height:84vh}
  .pal-kind{width:auto;min-width:52px}
  .main{padding:20px 14px 120px}
  .sync{display:none}
  .sb-meta{display:none}
  .reader-bar{bottom:10px;width:calc(100vw - 16px)}
  .sb-voice{display:none}
  .hero{grid-template-columns:1fr}
  .reader{grid-template-columns:1fr}
  .reader-toc{display:none}
  .fc-wrap{grid-template-columns:1fr}
  .calc{grid-template-columns:1fr}
  .brk{grid-template-columns:90px 1fr 50px 90px;font-size:12px}
  /* touch targets: 24px circles and 28px pills are too small for a thumb */
  .known{width:30px;height:30px}
  .known svg{width:15px;height:15px}
  .chk label{min-height:34px;padding:6px 13px;font-size:13px}
  .gterm .go{padding:8px 0;display:inline-block}
  .labs-nav button{padding:9px 14px}
  .pchart-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
  .pcol-trk{height:52px}
  .pcol-v{display:none}
  .chrow{grid-template-columns:44px 1fr}
  .chrow .m{grid-column:2}
  .gterm{grid-template-columns:auto 1fr}
  .gterm .go{grid-column:2}
}
@media (max-width:520px){
  .dtab span{display:none}
  .dtab{padding:8px 11px}
  .over-hero h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- PRINT: a chapter should come out as a clean document.
   Tokens are forced back to the light set so a reader in dark mode does not
   print a black page. */
@media print{
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F4F8; --ink:#0B1F3A; --ink-2:#28374F;
    --muted:#4A5A72; --line:#C8D0DE; --line-2:#A9B4C8; --gold:#8A6412; --gold-soft:#F8F1DF;
    --shadow:none; --pop:none; color-scheme:light;
  }
  @page{margin:16mm 14mm}
  html,body{background:#fff}
  .app{display:block}
  .topbar,.sections,.reader-bar,.sync,.search-btn,.pal,.toast,.reader-toc,.ch-nav,.notes,.ask-box,.needs-sample,.ch-cover,.listen,
  .toggle,#addTermBtn,#addTermForm,.drill-top,.grade,.selfans,.labs-nav,.hero-side,.legend{display:none!important}
  .main{padding:0;max-width:none}
  .reader{display:block}
  .card{box-shadow:none;break-inside:avoid}
  .prose{max-width:none;font-size:11.5pt;line-height:1.5}
  h1{font-size:22pt} h2{font-size:15pt}
  h1,h2,h3{break-after:avoid}
  p,li,blockquote{orphans:3;widows:3}
  .lab,.mistakes,.callout,.keyterms .row,.gterm,.fig-embed{break-inside:avoid}
  /* wide diagrams scroll on screen; on paper they have to shrink instead */
  .stage,.sysmap,.sysmap-inner,.fig-scroll,.fig-embed svg{overflow:visible!important;min-width:0!important}
  .sysmap-inner{grid-template-columns:1fr 1fr}
  /* Sources already print their URL as the link text; everywhere else, reveal it */
  .prose a[href^="http"]:not(.sources a):after{content:" 9" attr(href) "A";font-size:8.5pt;color:#4A5A72;word-break:break-all}
  .ch-head{border-bottom:1px solid #C8D0DE;padding-bottom:8px}
}

<script id="hcm-data" type="application/json">{"domains":[{"id":"hcm","name":"Oracle HCM","short":"HCM","tagline":"Fusion HCM Cloud for functional consultants in Egypt and the Gulf","blurb":"The three modules junior consultants are hired for — Core HR, Absence and Payroll — plus the Egyptian and Saudi statutory knowledge Oracle does not ship in the product.","hue":214,"tracks":{"functional":{"name":"Functional","blurb":"What the business configures and runs: the structures people sit in, the record that describes them, and the money, time and law that follow."},"technical":{"name":"Technical","blurb":"What the consultant builds with: loading data in bulk, writing the calculation logic, getting information back out, extending without customizing, and controlling who sees what."}}},{"id":"analytics","name":"Data & Analytics","short":"Analytics","tagline":"SQL, Power BI and Excel — the analyst's toolkit, and when to reach for which","blurb":"The three tools every analytics job posting names, treated as one craft: get the rows out with SQL, model and publish them in Power BI, and know what Excel is still the fastest answer to.","hue":272,"tracks":{"functional":{"name":"Foundations","blurb":"How to think about data before you touch a tool: what a row means, what a spreadsheet is still best at, and how a question becomes a chart someone trusts."},"technical":{"name":"Tools","blurb":"The three the job postings name. SQL to get the rows out, Power BI to model and publish them, and the language underneath it that decides what a number means."}}}],"chapters":[{"id":"org","num":1,"domain":"hcm","track":"functional","title":"Enterprise & Organizational Structures","sub":"The compliance skeleton — legal view versus operational view","hue":214,"minutes":18,"labs":["org"],"terms":["enterprise","legal-entity","legal-employer","payroll-statutory-unit-psu","tax-reporting-unit-tru","legislative-data-group-ldg","business-unit-bu","department","division","location","legal-jurisdiction","reference-data-set","organization-tree","employment-model","enterprise-structures-configurator"],"html":"<p>Every Oracle HCM implementation starts here, because nothing else can be configured until these objects exist. No worker can be hired, no element defined, no payroll run, no report filtered, until the structures in this chapter are in place. That order is not a preference — the application enforces it, and a project that rushes this stage pays for it for years.<\/p>\n<p>The single hardest idea in this chapter is also the most important one: Oracle deliberately keeps two pictures of the same company. The <strong>legal<\/strong> picture answers the questions a government asks — who is registered, who employs, who pays, who reports. The <strong>operational<\/strong> picture answers the questions a manager asks — who runs what, who sits where, who may see whose data. In real companies the two rarely line up, and Oracle's structure exists precisely so they don't have to.<\/p>\n<p>A consultant who holds those two pictures apart can run a requirements workshop. One who does not will keep asking a client \"is that a company or a department?\" and getting an answer that means neither.<\/p>\n<figure class=\"fig-embed\" data-fig=\"legal-vs-operational\"><\/figure>\n\n<h2>One enterprise, many legal entities<\/h2>\n<p>The <strong>enterprise<\/strong> is the single top node of the whole structure. There is exactly one per implementation, and it is not a legal concept. It never appears on a government form, never signs a contract, never files a return. It is a container for settings that apply to everybody regardless of which company employs them.<\/p>\n<p>What actually lives on it is worth knowing, because these are decisions a consultant is asked about in the first week. The Manage Enterprise HCM Information task holds person-number generation — whether person numbers are typed by hand, generated automatically on save, or drawn from a sequence — along with worker-number settings, the default enterprise-wide <strong>employment model<\/strong>, position synchronization defaults, and global behaviours such as how a person's name is displayed.<\/p>\n<p>The employment-model setting deserves a paragraph of its own. It decides whether a worker in this enterprise can hold one assignment or several at the same time, and whether contracts are tracked as separate objects. The two-tier single-assignment model — one work relationship, one assignment — covers the overwhelming majority of implementations and is what to assume unless a client says otherwise. Two-tier multiple-assignment is for organizations where one person genuinely does two jobs concurrently under the same employer: a nurse who also teaches, a plant worker who covers a second line. The setting is made at the enterprise but can be overridden on an individual legal employer, which is how a group runs a simple model everywhere and a multiple-assignment model in the one subsidiary that needs it. Changing it later, after workers exist, is painful. Asking the question early is free.<\/p>\n<p>For a holding company with a factory and a trading arm, the enterprise is the group. The registered companies underneath are something else.<\/p>\n<p>Those registered companies are <strong>legal entities<\/strong>: organizations recognized by law that can own assets, sign contracts, incur liabilities, employ people and be sued. In Egypt each one has its own commercial register number and tax card. In Saudi Arabia each has its own commercial registration. Oracle creates them through the Legal Entity Configurator, a set of tasks shared with Financials rather than owned by HCM, which is why the task list sits under Define Common Applications Configuration rather than a purely HR menu.<\/p>\n<p>The first real job on any project is to work out how many legal entities there actually are. The commercial registers give the definitive answer. The org chart does not, the letterhead does not, and the client's own finance team frequently does not either — groups acquire companies and keep running them as one business long after the paperwork says otherwise. Ask for the register documents, count them, and build from that.<\/p>\n<h2>What makes a legal entity real<\/h2>\n<p>A legal entity in Oracle is not just a name. Three other objects have to exist first, and a consultant who does not know them will be blocked on day one of configuration.<\/p>\n<p>A <strong>legal address<\/strong> is the registered address of an organizational unit. Oracle requires legal addresses to exist before legal entities, because the entity is registered <em>somewhere<\/em> and the application will not let that be blank. These are maintained separately from the ordinary work <strong>location<\/strong> records used for employees, and the two are easy to confuse: one is where the company is registered, the other is where people physically work. They may be the same building. They are not the same object.<\/p>\n<p>A <strong>legal jurisdiction<\/strong> is the combination of a geographic area and a law that applies within it — Egypt income tax, Saudi social insurance, a specific municipal levy. Oracle ships predefined jurisdictions for the legislations it supports and lets you create more. Every legal entity is registered against an <em>identifying jurisdiction<\/em>, and the registration number entered there is the one that appears on statutory output. In Egypt that is the tax registration; in Saudi Arabia it is the commercial registration number.<\/p>\n<p>A <strong>legal authority<\/strong> is the government body that governs a jurisdiction — the Egyptian Tax Authority, NOSI, GOSI, the Ministry of Human Resources. Authorities are what registrations point at.<\/p>\n<p>The practical sequence is therefore: addresses, then jurisdictions and authorities, then the legal entity, then its registrations, then its HCM-specific information. Skipping ahead produces a validation error rather than a broken configuration, which is a mercy — but it also means a consultant who does not know the order spends an afternoon guessing.<\/p>\n<h2>Legal employer: the classification that lets you hire<\/h2>\n<p>A legal entity on its own employs nobody. To hire anyone into it, the entity must be classified as a <strong>legal employer<\/strong>. Oracle makes \"employer\" a classification you switch on rather than something every legal entity is assumed to be, because some entities exist only to hold property, own a licence or issue invoices. A property-holding company in a group has a commercial register and a tax card and has never had a payslip run against it.<\/p>\n<p>Every worker belongs to exactly one legal employer at a time, through their work relationship (Chapter 3). This is the most consequential link in the employment data model. Change the legal employer and you have changed who legally employs the person — the old employment ends and a new one begins, which in Egypt means a settlement, a new social-insurance registration and a fresh service date unless service is explicitly bridged. Change their department and nothing legal has happened at all. The system treats these as completely different events, and it is right to.<\/p>\n<blockquote>\n<p><strong>Interview classic.<\/strong> \"What is the difference between a legal entity and a legal employer?\" A legal employer is a classification applied to a legal entity that enables it to employ workers. Not every legal entity is a legal employer. Treating the two as synonyms is the most common miss in this whole area.<\/p>\n<\/blockquote>\n<p>There is a second, quieter consequence. Because the legal employer can override enterprise-level settings — the employment model, and a set of localization defaults — it is also the level at which a group with genuinely different operating companies expresses that difference. A consultant who reaches for a new business unit when the answer is a new legal employer has usually misread the requirement.<\/p>\n<h2>Who pays, and who reports<\/h2>\n<p>Two more classifications sit on the legal entity, and both are about payroll.<\/p>\n<p>A <strong>payroll statutory unit (PSU)<\/strong> is a legal entity responsible for paying workers and remitting payroll tax and social insurance to the authorities. It is the level at which a person's payroll records are grouped for statutory calculation and reporting — in Egypt, the entity that files with NOSI and the Egyptian Tax Authority; in Saudi Arabia, the entity that files with GOSI. Oracle's guidance is to create at least one legal entity designated as a PSU for every legislative data group, which is another way of saying: for each country you pay people in, somebody has to be the filer.<\/p>\n<p>Oracle's documentation puts the parent relationship plainly. When a legal entity is identified as a legal employer but <em>not<\/em> as a PSU, it must be given a parent PSU, and its legal reporting units are then created as tax reporting units under that parent rather than under itself. This is how a group centralises statutory filing: several employers, one filer.<\/p>\n<figure class=\"fig-embed\" data-fig=\"parent-psu\"><\/figure>\n\n<p>Beneath the PSU sits the <strong>tax reporting unit (TRU)<\/strong>, the reporting face of the PSU toward tax and social-insurance authorities. Oracle describes the TRU as the HCM form of a legal reporting unit, existing to group workers for tax and social-insurance reporting. When a legal entity is identified as a PSU, its legal reporting unit is carried across into HCM as a TRU automatically — which is why consultants often find a TRU they did not consciously create.<\/p>\n<p>A single PSU may need to report under more than one registration number, and the TRU is the level that hangs on. This is not a theoretical case in the region. An Egyptian company with branches registered at different social-insurance offices files separately for each; a Saudi group with several commercial registrations is assessed for Saudization against each registered establishment rather than against the group as a whole. Each of those registration numbers is a candidate TRU. The design question is answered by collecting registration certificates, not by drawing boxes.<\/p>\n<p>A worker is linked to a TRU through their statutory deductions calculation card (Chapter 5), not directly on the assignment. That indirection catches people out: a worker can be in the right legal employer, the right payroll and the right department, and still be missing from a statutory report because the card carries no TRU.<\/p>\n<p>The practical design question on a multi-company client is therefore: which legal entities are PSUs, and which are legal employers reporting under a parent PSU? A group with three registered companies in Egypt may well have three PSUs. Do not assume one per country.<\/p>\n<h2>The hard boundary: legislative data groups<\/h2>\n<p>A <strong>legislative data group (LDG)<\/strong> is a partition that isolates payroll and related legislative data. Each LDG belongs to exactly one legislation and carries one currency, and Oracle's instruction is to create one for each country the enterprise operates in, then associate each PSU with it.<\/p>\n<p>All payroll configuration lives inside exactly one LDG: elements, balances, balance dimensions, fast formulas, element eligibility, payroll definitions, rate definitions, calculation value definitions, organization payment methods. Egyptian payroll rules cannot leak into Saudi payroll rules, because as far as the application is concerned the Egyptian objects do not exist in the Saudi world. An element defined in the Egypt LDG is not hidden from the Saudi LDG. It is absent from it. It must be built again.<\/p>\n<p>This produces the most common support question in the first month of a multi-country project: \"why can't I see my element?\" The answer is almost always the LDG context selected at the top of the page.<\/p>\n<p>The partition is a feature, not a limitation. It is what makes it safe for one instance to run Egyptian and Saudi payroll side by side, with completely different statutory logic, without any possibility of one country's rule firing against the other's population. The cost is duplication: two countries means two element libraries, two sets of formulas, two balance structures. Estimating a multi-country payroll project as though configuration is reused once is the classic way to lose money on it.<\/p>\n<p>One more consequence, and it is the expensive one: an LDG cannot be meaningfully changed once payroll data exists inside it. The currency and legislation chosen at the start are effectively permanent. Getting the country list right before configuration starts is worth an extra workshop.<\/p>\n<figure class=\"fig-embed\" data-fig=\"ldg-wall\"><\/figure>\n\n<h2>The operational picture: business units<\/h2>\n<p>The <strong>business unit (BU)<\/strong> is an operational grouping used for processing transactions, sharing reference data such as jobs and grades, and controlling data access. It is not a legal registration and carries no statutory meaning whatever.<\/p>\n<p>A shared-services centre may serve three legal entities. A single legal entity may contain several business units. Neither arrangement is unusual and neither is wrong. Clients decide based on how they actually run the business, and they conflate \"how are we registered\" with \"how do we operate\" constantly. Keeping the two apart is the consultant's job, and the useful question in a workshop is not \"is this a business unit?\" but \"does this group of people need its own set of jobs, its own approvals, and its own view of the data?\"<\/p>\n<h2>Reference data sets, and why the BU matters more than it looks<\/h2>\n<p>The business unit's real power is reference data sharing, and this is the part of Chapter 1 most often skipped in training.<\/p>\n<p>Oracle lets you group set-enabled configuration data — jobs, grades, locations, departments — into <strong>reference data sets<\/strong>, then assign those sets to business units. At transaction time the application filters what can be selected based on the business unit involved. Assign a job to the Common Set and every business unit can use it. Assign it to a specific set attached to one business unit, and only that unit sees it.<\/p>\n<p>The consequence is that business unit design silently decides how much duplication the client will live with. A global group that wants one job catalogue everywhere puts jobs in the Common Set and is done. A group whose manufacturing arm and consulting arm share nothing puts them in separate sets and accepts that \"Manager\" now exists twice. Getting this wrong in either direction is painful: over-sharing produces a job list of four hundred entries where a hiring manager needs six, and under-sharing produces four hundred entries that are the same six repeated.<\/p>\n<p>Positions are the exception worth remembering. They attach to a business unit directly rather than through a set. If a client asks why their position list does not behave like their job list, that is why.<\/p>\n<figure class=\"fig-embed\" data-fig=\"reference-data-sets\"><\/figure>\n\n<h2>Departments, divisions and locations<\/h2>\n<p>Below the business unit, the <strong>department<\/strong> is the box on the org chart that a worker actually sits in. It is the natural unit for headcount reporting and manager hierarchies, and it exists independently of whoever currently manages it — which is why a manager change never requires a new department. Departments can carry a cost centre, which is the hook payroll costing later uses to send an employee's cost to the right place in the general ledger.<\/p>\n<p>A <strong>division<\/strong> is a broader management-reporting layer above departments, aligned to a product line or a geography, and used for analytics rather than transaction processing. Divisions are where a group answers \"how did the Middle East business perform\" when the Middle East is not a legal entity and never will be. Oracle's own worked example builds divisions for the US, Europe and the Middle East across five countries and several legal entities — a shape that maps neatly onto how regional groups in Cairo and Riyadh describe themselves.<\/p>\n<p>A <strong>location<\/strong> is a physical work site with an address. It matters more than it looks, because statutory jurisdiction, working-time rules, allowance eligibility and public-holiday calendars are frequently driven by where the person physically works rather than by who employs them. In the Gulf especially, location often decides allowance eligibility — a site allowance for a remote plant, a housing differential between cities. Locations are set-enabled like jobs and grades, so the same sharing rules apply.<\/p>\n<h2>Trees: how the structure becomes security and org charts<\/h2>\n<p>The objects above are a list until something arranges them into a shape. That something is an <strong>organization tree<\/strong>.<\/p>\n<p>Oracle supports department trees, organization trees and position trees. A tree takes the flat set of departments (or organizations, or positions) and expresses the parent–child relationships between them, in versions that carry their own effective dates. Two things consume them. The org chart the business sees is drawn from a tree. More importantly, security profiles scope data by tree node: \"this HR specialist can see everyone in the Manufacturing department and everything below it\" is a statement about a tree, not about a list of departments.<\/p>\n<p>This is the quiet link between Chapter 1 and Chapter 15. A structure that is correct but flat gives the security model nothing to grip. When a client asks for departmental HR access and the department tree has never been built, the request cannot be satisfied no matter how the roles are configured.<\/p>\n<p>Trees are versioned and must be published before use, which is a recurring source of \"I made the change and nothing happened\".<\/p>\n<h2>The order you build it in<\/h2>\n<p>Stated as a sequence, because the dependencies are real and the application enforces most of them:<\/p>\n<ul>\n<li>Legal addresses, jurisdictions and authorities.<\/li>\n<li>Legislative data groups, one per country.<\/li>\n<li>Legal entities, with their registrations.<\/li>\n<li>Legal entity HCM information: legal employer, PSU, parent PSU where the entity is an employer only.<\/li>\n<li>Tax reporting units, beyond those created automatically with the PSU.<\/li>\n<li>Business units, and the reference data sets assigned to them.<\/li>\n<li>Divisions, departments and locations.<\/li>\n<li>Trees, then published.<\/li>\n<\/ul>\n<p>Oracle also ships the <strong>Enterprise Structures Configurator<\/strong>, an interview-style wizard that asks about the enterprise, its countries and its operating shape, then creates legal entities, classifies them as legal employers and PSUs, and creates a legislative data group for each country in one pass. It produces a technical summary of what it intends to do before committing, and the structure can be reviewed and rolled back before it is loaded. It is genuinely useful for a greenfield build and genuinely dangerous as a substitute for understanding, because it makes defensible default choices that a consultant then has to explain — or unpick — six months later.<\/p>\n<h2>Three shapes you will actually meet<\/h2>\n<p><strong>The single-entity Egyptian company.<\/strong> One commercial register, one tax card, one legal entity that is both legal employer and PSU, one Egypt LDG, one TRU, one business unit, departments under it. Most of this chapter collapses to a single line each. The work is in the department tree and the locations.<\/p>\n<p><strong>The Egypt-plus-Saudi group.<\/strong> Two LDGs, and everything payroll-shaped doubles. Legal entities in each country, each a legal employer; whether each is also a PSU depends on who f
