further annual steps and a retirement age of 65. Expatriates carry only the employer-paid 2% occupational-hazards contribution — no pension, no SANED. The contributable wage is basic salary plus housing allowance, capped at SAR 45,000 per month; transport, commission and bonuses are excluded.<\/p>\n<figure class=\"fig-embed\" data-fig=\"gosi-populations\"><\/figure>\n\n<p>For an Oracle design this means nationality is a payroll-driving attribute, GOSI registration dates matter, and the element inventory needs separate treatment for the two populations.<\/p>\n<figure class=\"fig-embed\" data-fig=\"contributable-wage\"><\/figure>\n\n<h2>Qiwa, Mudad and the Wage Protection System<\/h2>\n<p><strong>Qiwa<\/strong> is the Ministry of Human Resources' digital labour platform: employment contracts are authenticated through it, and it handles work permits and establishment services. <strong>Mudad<\/strong> is the platform supporting wage protection and payroll compliance. The <strong>Wage Protection System (WPS)<\/strong> requires employers to pay salaries through official banking channels and to upload monthly payroll documentation — the <strong>SIF<\/strong> (Salary Information File) — containing each employee's ID or iqama number, basic salary, allowances, deductions and net pay. The system matches the file against actual bank transfers; when they match, the employee is legally considered paid.<\/p>\n<p>Compliance is enforced through consequences: late files escalate from a minor violation to a partial freeze of Qiwa services, and after three months to the employee's right to transfer sponsorship without consent. The three platforms must agree: the basic salary in the Qiwa contract must equal the basic salary in Mudad and in GOSI, so salary changes have to land on all three at once. In Oracle terms, the payment process (Chapter 5) produces the WPS file, and a Gulf go-live always includes a bank-file test with the actual bank.<\/p>\n<figure class=\"fig-embed\" data-fig=\"wps-agreement\"><\/figure>\n\n<h2>Nitaqat and nationality as compliance data<\/h2>\n<p><strong>Nitaqat<\/strong>, or Saudization, is the quota system requiring employers to maintain minimum percentages of Saudi national employees, with a colour-banded compliance rating that directly affects the ability to obtain visas and government services. WPS compliance feeds the rating. As a result, nationality reporting and workforce-composition analytics take on compliance significance in Saudi implementations that they do not have in Egypt: nationality is a compliance-reportable attribute, not merely demographic data.<\/p>\n<h2>Iqama, visas and document-driven employment<\/h2>\n<p>Employment legality in the Gulf is document-dependent in a way it is not in Egypt. <strong>Iqama<\/strong> (residency permit) numbers, visa details, expiry dates and renewal alerts become genuine HR requirements for every expatriate, and they combine with contract-expiry alerting (Chapter 8). Egyptian implementations mostly do not carry this; every Gulf one does.<\/p>\n<h2>End-of-service benefit<\/h2>\n<p>Gulf labour law provides an <strong>end-of-service benefit (EOSB)<\/strong> in place of a state pension for expatriates: a statutory lump sum on departure, calculated on length of service and final wage, with country-specific formulas and reductions for resignation before a service threshold. It is a central component of the final settlement in any Gulf payroll and has no Egyptian equivalent.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating GOSI as one rate. Nationals and expatriates differ, and the 2024 reform split nationals into two schedules.<\/li>\n<li>Ignoring the SAR 45,000 wage ceiling and the basic-plus-housing base.<\/li>\n<li>Forgetting that Qiwa, Mudad and GOSI must show the same basic salary.<\/li>\n<li>Treating nationality as demographic data rather than compliance data.<\/li>\n<li>Leaving the WPS file to the end of the project.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Mercans, \"GOSI Contributions in Saudi Arabia: 2026 Rates, Rules &amp; Compliance Guide\". <a href=\"https://mercans.com/glossary/gosi-contributions/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/glossary/gosi-contributions/<\/a><\/li>\n<li>Mercans statutory alert, \"Saudi Arabia: GOSI Contribution Rates &amp; Saned Unemployment Fund 2026\". <a href=\"https://mercans.com/resources/statutory-alerts/saudi-arabia-gosi-contribution-rates-saned-unemployment-fund-2026/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/resources/statutory-alerts/saudi-arabia-gosi-contribution-rates-saned-unemployment-fund-2026/<\/a><\/li>\n<li>Snad, \"Mudad and the Wage Protection System (WPS): 2026 Employer Guide\". <a href=\"https://www.snad.io/en/blog/mudad-wps-hamayat-ujur-saudi\" target=\"_blank\" rel=\"noopener\">https://www.snad.io/en/blog/mudad-wps-hamayat-ujur-saudi<\/a><\/li>\n<li>Qiwa (Ministry of Human Resources and Social Development). <a href=\"https://qiwa.sa\" target=\"_blank\" rel=\"noopener\">https://qiwa.sa<\/a><\/li>\n<\/ul><\/div>","cover":""}],"terms":[{"id":"absence-plan","name":"Absence plan","what":"The rules engine behind an absence type: who is eligible, how entitlement is earned or granted, and how it is paid.","trap":"","ch":"absence"},{"id":"absence-type","name":"Absence type","what":"What the worker actually selects when requesting leave — 'Annual Leave', 'Sick Leave', 'Maternity Leave'. Must be associated with at least one absence plan.","trap":"","ch":"absence"},{"id":"abstract-role","name":"Abstract role","what":"A role held by virtue of being a person in the system rather than because of a specific job — Employee, Line Manager, Contingent Worker.","trap":"","ch":"security"},{"id":"accrual-band","name":"Accrual band","what":"A rule within an accrual plan granting different accrual rates to different populations, usually by length of service.","trap":"","ch":"absence"},{"id":"accrual-plan","name":"Accrual plan","what":"A plan where workers accumulate leave over time, with rules for accrual rate, ceilings, and carryover.","trap":"","ch":"absence"},{"id":"area-of-responsibility-aor","name":"Area of Responsibility (AOR)","what":"An assignment of responsibility for a defined population, used to drive both access and routing.","trap":"","ch":"security"},{"id":"assignment","name":"Assignment","what":"The record carrying the actual job details: business unit, department, job, position, grade, location, manager, working hours, assignment status, and the standing data payroll reads.","trap":"Putting person-level data on the assignment or assignment-level data on the person. Knowing which lives where is the whole skill.","ch":"model"},{"id":"attrition-turnover","name":"Attrition / turnover","what":"The rate at which people leave the organization over a period, usually expressed annually as a percentage.","trap":"","ch":"hrfunction"},{"id":"balance","name":"Balance","what":"An accumulated total of element results over a defined period and dimension — for example gross pay year-to-date, or taxable earnings month-to-date.","trap":"Expecting balances to survive a global transfer. They do not.","ch":"payroll"},{"id":"bi-publisher-bip","name":"BI Publisher (BIP)","what":"Oracle's formatted reporting tool, combining a SQL-based data model with a layout template to produce pixel-controlled output.","trap":"Treating them as interchangeable. Using OTBI for a payslip or BIP for a quick headcount list are both wrong answers in an interview.","ch":"reporting"},{"id":"bracket-elimination-for-high-earners","name":"Bracket elimination for high earners","what":"A rule progressively removing access to the lower tax bands as net taxable income rises above defined thresholds.","trap":"Building a naive progressive calculation that applies every band to every employee. It will be wrong for senior staff, which is exactly who notices.","ch":"egypt-payroll"},{"id":"bursting","name":"Bursting","what":"Splitting one BI Publisher report run into many individual outputs, each delivered separately.","trap":"","ch":"reporting"},{"id":"business-unit-bu","name":"Business unit (BU)","what":"An operational grouping used for processing transactions, sharing reference data such as jobs and grades, and controlling data access. Not a legal registration.","trap":"'A business unit is just another word for department.' No. A BU is a processing and access construct; departments sit below it on the org chart.","ch":"org"},{"id":"carryover","name":"Carryover","what":"The rules governing how much unused leave transfers into the next plan term, and when it expires.","trap":"","ch":"absence"},{"id":"casual-leave","name":"Casual leave","what":"Short-notice leave for unforeseen circumstances.","trap":"","ch":"egypt-leave"},{"id":"centers-of-excellence-coe","name":"Centers of Excellence (CoE)","what":"Specialist HR teams owning policy in a specific domain — Compensation & Benefits, Talent Acquisition, Learning & Development, Organization Development.","trap":"","ch":"hrfunction"},{"id":"change-request","name":"Change request","what":"A formal request to alter agreed scope, with its impact on time and cost assessed.","trap":"","ch":"method"},{"id":"compensatory-plan","name":"Compensatory plan","what":"A plan tracking earned compensatory time off, given instead of paying overtime.","trap":"","ch":"absence"},{"id":"concurrent-employment","name":"Concurrent employment","what":"One person holding multiple simultaneous assignments under the same work relationship, or multiple work relationships across different legal employers.","trap":"","ch":"model"},{"id":"configuration-workbook","name":"Configuration workbook","what":"The structured document recording every configuration decision and its agreed values.","trap":"","ch":"method"},{"id":"costing","name":"Costing","what":"The allocation of payroll results to accounting segments so the cost lands in the right place in the general ledger.","trap":"","ch":"payroll"},{"id":"crp-conference-room-pilot","name":"CRP (Conference Room Pilot)","what":"A structured demonstration of the configured system to the client using their own data and scenarios.","trap":"","ch":"method"},{"id":"cutover","name":"Cutover","what":"The sequenced set of activities moving the client from the legacy system to the new one.","trap":"","ch":"method"},{"id":"data-role-and-security-profile","name":"Data role and security profile","what":"Where a job role says what a user can do, the data role and security profile say which records they can do it to.","trap":"","ch":"security"},{"id":"department","name":"Department","what":"An organization to which workers are assigned — the box on the org chart that a person actually sits in.","trap":"","ch":"org"},{"id":"dff-descriptive-flexfield","name":"DFF (Descriptive Flexfield)","what":"A configurable extra field added to a standard object without customization.","trap":"","ch":"extend"},{"id":"division","name":"Division","what":"A broader grouping above departments, usually aligned to a product line, business segment, or geography.","trap":"","ch":"org"},{"id":"duty-role","name":"Duty role","what":"A granular building block granting specific privileges, aggregated into job and abstract roles.","trap":"","ch":"security"},{"id":"effective-date","name":"Effective date","what":"The date on which a change becomes true in the real world — not the date it was typed into the system.","trap":"'Effective date is the date I entered it.' No — the system tracks the entry date separately.","ch":"dating"},{"id":"egyptian-annual-leave-entitlement","name":"Egyptian annual leave entitlement","what":"The statutory leave ladder under Labour Law No. 14 of 2025.","trap":"","ch":"egypt-leave"},{"id":"element","name":"Element","what":"The definition of a single thing that can appear on a payslip: a salary, an allowance, a deduction, or an informational item.","trap":"Creating an element and expecting it to appear for employees. Nothing happens until eligibility is defined and an entry exists.","ch":"payroll"},{"id":"element-classification","name":"Element classification","what":"The category assigned to an element — earnings, deduction, information — which controls processing order and how it feeds balances.","trap":"","ch":"payroll"},{"id":"element-eligibility-element-link","name":"Element eligibility (element link)","what":"The rule defining which population of workers an element applies to, based on criteria such as payroll, legal employer, grade, job, or department.","trap":"Defining eligibility too narrowly at build time and then needing to change it after entries already exist, which is considerably messier.","ch":"payroll"},{"id":"element-entry","name":"Element entry","what":"The actual assignment of an element to a specific person, with its values and dates.","trap":"","ch":"payroll"},{"id":"eligibility-profile","name":"Eligibility profile","what":"A reusable set of criteria determining whether a person qualifies for an absence plan — based on grade, job, department, location, length of service, and similar.","trap":"","ch":"absence"},{"id":"end-of-contract","name":"End of contract","what":"A fixed-term contract reaching its expiry date. Nobody terminates it; it simply lapses.","trap":"Treating all three exit routes as one 'termination' transaction. They have different downstream calculations.","ch":"lifecycle"},{"id":"end-of-service-benefit-eosb-gratuity","name":"End of Service Benefit (EOSB) / gratuity","what":"A statutory lump sum payable to departing employees in Gulf countries, calculated on length of service and final wage.","trap":"Importing EOSB logic into an Egyptian design, or assuming Egypt has gratuity. It does not work that way.","ch":"lifecycle"},{"id":"end-dating","name":"End-dating","what":"Closing a record as of a date rather than deleting it, so that history is preserved.","trap":"'I'll just delete the wrong record.' In a date-effective SaaS system you end-date, correct, or reverse. Deletion is rare, restricted, and usually the wrong instinct.","ch":"dating"},{"id":"enterprise","name":"Enterprise","what":"The single top node of the entire organizational structure. There is exactly one enterprise per Oracle HCM implementation, and everything else is defined beneath it.","trap":"Do not describe the enterprise as 'the company'. The company is the legal entity. The enterprise is the whole group.","ch":"org"},{"id":"fast-formula","name":"Fast Formula","what":"Oracle's rule language used to express calculations and conditions — payroll rates, accrual rules, eligibility logic.","trap":"'Fast Formula is a programming language to master upfront.' It is a per-context rule language — approach it through examples.","ch":"ff"},{"id":"final-settlement","name":"Final settlement","what":"The calculation of everything owed to a leaver: final salary, unused leave payout, any severance or end-of-service benefit, minus outstanding deductions such as loans.","trap":"","ch":"lifecycle"},{"id":"fit-gap-analysis","name":"Fit-gap analysis","what":"Comparing client requirements against delivered functionality and documenting where the product fits, where it does not, and what will be done about the gaps.","trap":"","ch":"method"},{"id":"form-1-and-form-6","name":"Form 1 and Form 6","what":"The statutory notifications filed with social insurance on hiring (Form 1) and on termination (Form 6).","trap":"","ch":"egypt-payroll"},{"id":"freeze-period","name":"Freeze period","what":"A window during which no changes are permitted in the legacy system, so that final data migration is against a stable base.","trap":"","ch":"method"},{"id":"fte-full-time-equivalent","name":"FTE (full-time equivalent)","what":"A measure of workload rather than of people. An employee working 50% time is 0.5 FTE but still 1 headcount.","trap":"Reporting FTE when the client asked for headcount, or the reverse. They are different numbers and both are 'correct'.","ch":"hrfunction"},{"id":"global-transfer","name":"Global transfer","what":"Moving a worker from one legal employer to another — typically across countries. The source work relationship is terminated and a new one is created under the destination legal employer.","trap":"Expecting balances to carry across. They do not — balances never span payroll relationships, so year-to-date figures start fresh in the new country.","ch":"model"},{"id":"gosi","name":"GOSI","what":"The General Organization for Social Insurance — Saudi Arabia's social insurance authority.","trap":"","ch":"gulf"},{"id":"grade","name":"Grade","what":"A level in the organization's hierarchy, used to control compensation ranges and eligibility for benefits or allowances.","trap":"'Grade equals salary.' Grade is a level. Money attaches to it through rate ranges and the salary basis — the two are linked but distinct objects.","ch":"workforce"},{"id":"grade-step","name":"Grade step","what":"An increment within a single grade, used where progression happens in defined steps rather than across a continuous range. Steps are grouped into grade ladders.","trap":"","ch":"workforce"},{"id":"hcm-extract","name":"HCM Extract","what":"A framework for extracting HCM data on a schedule for delivery to external systems.","trap":"","ch":"reporting"},{"id":"hdl-hcm-data-loader","name":"HDL (HCM Data Loader)","what":"Oracle's bulk data loading tool, using structured .dat files uploaded as a zip.","trap":"'Functional means no technical work.' In HCM the market pays a premium for functional consultants who handle HDL, formulas, and reporting themselves.","ch":"hdl"},{"id":"headcount","name":"Headcount","what":"A raw count of people, regardless of how much each one works. One person equals one headcount.","trap":"","ch":"hrfunction"},{"id":"hrbp-hr-business-partner","name":"HRBP (HR Business Partner)","what":"An HR professional embedded with a specific business division as its strategic HR contact.","trap":"","ch":"hrfunction"},{"id":"hsdl-hcm-spreadsheet-data-loader","name":"HSDL (HCM Spreadsheet Data Loader)","what":"A spreadsheet-based interface over the same loading framework, aimed at business users.","trap":"","ch":"hdl"},{"id":"hypercare","name":"Hypercare","what":"An intensive support period immediately after go-live with heightened staffing and response times.","trap":"","ch":"method"},{"id":"input-value","name":"Input value","what":"A field on an element that holds the data the calculation needs — typically amount, rate, percentage, or number of units.","trap":"","ch":"payroll"},{"id":"insurable-wage","name":"Insurable wage","what":"The portion of pay on which social insurance contributions are calculated, bounded by a statutory floor and ceiling.","trap":"'Contributions apply to full gross salary.' They do not — they apply to the capped insurable wage. This is the most common calculation error in Egyptian payroll.","ch":"egypt-payroll"},{"id":"iqama-and-visa-linked-employment-data","name":"Iqama and visa-linked employment data","what":"Residency permit and visa information that must be tracked, with expiry alerting, for expatriate employees.","trap":"","ch":"gulf"},{"id":"job","name":"Job","what":"A generic definition of a role, independent of the organization chart. Carries attributes such as grade range, qualifications, and job family.","trap":"Never define a job as a specific seat. That is a position.","ch":"workforce"},{"id":"job-family","name":"Job family","what":"A grouping of related jobs sharing similar characteristics — for example all finance jobs, or all engineering jobs.","trap":"","ch":"workforce"},{"id":"job-role","name":"Job role","what":"A role reflecting a job someone does in the organization — HR Specialist, Line Manager, Payroll Manager.","trap":"","ch":"security"},{"id":"journey","name":"Journey","what":"A configurable checklist of tasks assigned to a person around an event — onboarding, transfer, offboarding.","trap":"","ch":"extend"},{"id":"leave-encashment","name":"Leave encashment","what":"Paying out unused leave in cash instead of taking the time off.","trap":"","ch":"absence"},{"id":"legal-employer","name":"Legal employer","what":"A legal entity that has been explicitly classified as an employer. This is the entity that legally hires workers and appears on employment contracts.","trap":"Treating the two as synonyms. They are related but not interchangeable, and the difference is exactly what the question is testing.","ch":"org"},{"id":"legal-entity","name":"Legal entity","what":"An organization recognized by law that can own assets, sign contracts, incur liabilities, and be sued. Created in Oracle through the Legal Entity Configurator.","trap":"A legal entity on its own does not employ anybody. It has to be classified as a legal employer before a single person can be hired into it. This distinction is the most commonly missed point in the whole area.","ch":"org"},{"id":"legislative-data-group-ldg","name":"Legislative Data Group (LDG)","what":"A partition that isolates payroll and related legislative data by country. All payroll configuration — elements, balances, formulas — lives inside exactly one LDG.","trap":"Thinking you can reuse one element library globally. You cannot. Each LDG is its own world.","ch":"org"},{"id":"location","name":"Location","what":"A physical work site, with an address, attached to positions and assignments.","trap":"","ch":"org"},{"id":"lookup-type-and-lookup-code","name":"Lookup type and lookup code","what":"Configurable lists of values used in dropdowns across the application.","trap":"","ch":"extend"},{"id":"martyrs-victims-fund-contribution","name":"Martyrs & Victims Fund contribution","what":"A small statutory employee deduction of 0.05% of gross pay.","trap":"","ch":"egypt-payroll"},{"id":"maternity-leave","name":"Maternity leave","what":"Paid leave around childbirth.","trap":"","ch":"egypt-leave"},{"id":"minimum-wage-and-mandatory-annual-increment","name":"Minimum wage and mandatory annual increment","what":"The statutory wage floor and the legally required yearly increase.","trap":"Calculating the mandatory increment on full gross. It is on the social insurance wage.","ch":"egypt-payroll"},{"id":"mudad","name":"Mudad","what":"The Saudi platform supporting wage protection and payroll compliance.","trap":"","ch":"gulf"},{"id":"nitaqat-saudization","name":"Nitaqat / Saudization","what":"The Saudi quota system requiring employers to maintain minimum percentages of Saudi national employees, with a colour-banded compliance rating.","trap":"","ch":"gulf"},{"id":"no-entitlement-plan","name":"No entitlement plan","what":"A plan that tracks absences without maintaining a balance or providing entitlement — typically for unpaid leave.","trap":"","ch":"absence"},{"id":"nosi","name":"NOSI","what":"The National Organization for Social Insurance — the Egyptian authority administering social insurance under Law 148 of 2019.","trap":"","ch":"egypt-payroll"},{"id":"notice-period","name":"Notice period","what":"The advance written warning either party must give before terminating an indefinite-term contract.","trap":"Configuring notice rules from a secondary English-language source without verification. Statutory detail is the one area where being confidently wrong is expensive.","ch":"lifecycle"},{"id":"oracle-true-cloud-method","name":"Oracle True Cloud Method","what":"Oracle's current implementation methodology for Fusion Cloud projects.","trap":"'Consultants design the best system.' Consultants get decisions made and documented; the client owns the design.","ch":"method"},{"id":"org-chart","name":"Org chart","what":"The visual representation of reporting hierarchy — who reports to whom.","trap":"","ch":"hrfunction"},{"id":"otbi","name":"OTBI","what":"Oracle Transactional Business Intelligence — ad-hoc reporting and analysis directly against live HCM data, using pre-built subject areas.","trap":"Using OTBI for a payslip. Wrong tool — that is BI Publisher.","ch":"reporting"},{"id":"parallel-run","name":"Parallel run","what":"Running the new system's payroll alongside the legacy payroll for the same period and reconciling the two, line by line.","trap":"'Go-live means done.' Hypercare and the first live payroll after parallel are the actual finish line.","ch":"payroll"},{"id":"payment-process-bank-file","name":"Payment process / bank file","what":"The process that generates the actual payment instruction file sent to the bank.","trap":"","ch":"payroll"},{"id":"payroll-definition","name":"Payroll definition","what":"The configuration of a payroll's calendar: its frequency, period start and end dates, cut-off dates, and payment date.","trap":"","ch":"payroll"},{"id":"payroll-relationship","name":"Payroll relationship","what":"A parallel object linking the person to a payroll statutory unit (PSU). It is the highest level of the payroll employment model and groups a person's assignments for statutory calculation and reporting.","trap":"Thinking payroll runs against the assignment. It runs against the payroll relationship, aggregating across the assignments grouped within it.","ch":"model"},{"id":"payroll-run","name":"Payroll run","what":"The process that calculates gross-to-net for a population of workers for a given period.","trap":"","ch":"payroll"},{"id":"payroll-statutory-unit-psu","name":"Payroll Statutory Unit (PSU)","what":"A legal entity classified as responsible for paying workers, including remitting payroll tax and social insurance to the authorities.","trap":"Assuming one PSU per country automatically. A group with three registered companies in Egypt may well have three PSUs.","ch":"org"},{"id":"person","name":"Person","what":"The record of a human being, held once globally. Carries what is true of the human regardless of any employer: name, date of birth, national ID, personal contact details, nationality.","trap":"'There is an employee table.' There is not. There is a person, a work relationship, and an assignment.","ch":"model"},{"id":"personal-exemption","name":"Personal exemption","what":"An annual amount deducted from income before applying the tax brackets.","trap":"","ch":"egypt-payroll"},{"id":"position","name":"Position","what":"A specific, individual seat: a job tied to a particular department and location, which exists whether or not anyone currently fills it.","trap":"'Job and position are synonyms.' They are not, and this is the fastest way to look unprepared in front of a trainer. Job = what the work is. Position = a specific seat doing it.","ch":"workforce"},{"id":"prepayments","name":"Prepayments","what":"The process that takes payroll run results and distributes them across the person's payment methods, ready for payment.","trap":"","ch":"payroll"},{"id":"probation","name":"Probation","what":"An initial period during which either party may end the employment with lighter obligations than after confirmation.","trap":"Assuming probation can be extended by agreement. Under the 2025 law it cannot.","ch":"lifecycle"},{"id":"progressive-tax-brackets","name":"Progressive tax brackets","what":"Egypt's seven-band salary tax scale applied to annual net taxable income.","trap":"'Tax is a flat monthly percentage.' It is annual, progressive, exemption-adjusted, and reconciled.","ch":"egypt-payroll"},{"id":"qiwa","name":"Qiwa","what":"The Saudi Ministry of Human Resources digital labour platform, handling contracts, work permits, and establishment services.","trap":"","ch":"gulf"},{"id":"qualification-plan","name":"Qualification plan","what":"A plan where workers qualify for entitlement on an event, with payment percentages that can vary by band, rather than accruing a balance.","trap":"","ch":"absence"},{"id":"quarterly-update-26a-26d","name":"Quarterly update (26A–26D)","what":"Oracle's fixed quarterly release cycle for Fusion Cloud applications.","trap":"","ch":"extend"},{"id":"quickpay","name":"QuickPay","what":"A process that runs payroll for a single person outside the main run.","trap":"","ch":"payroll"},{"id":"raid-log","name":"RAID log","what":"A tracking log of Risks, Assumptions, Issues, and Dependencies.","trap":"","ch":"method"},{"id":"reconciliation","name":"Reconciliation","what":"Comparing outputs between two systems or two runs and explaining every difference.","trap":"","ch":"method"},{"id":"redwood","name":"Redwood","what":"Oracle's current user experience and design system, progressively replacing older pages.","trap":"","ch":"extend"},{"id":"resignation","name":"Resignation","what":"Employee-initiated termination of the employment relationship.","trap":"","ch":"lifecycle"},{"id":"rest-api","name":"REST API","what":"Oracle's web service interface for programmatic read and write access to HCM data.","trap":"'I can query the database directly.' There is no SQL Developer connection to a SaaS pod. Your query paths are OTBI, BIP data models, extracts, and REST.","ch":"reporting"},{"id":"retroactive-change-retro","name":"Retroactive change (retro)","what":"A change entered with an effective date in the past, after payroll has already been processed for that period.","trap":"Assuming retro only adds money. It can also create a recovery when a change reduces pay.","ch":"dating"},{"id":"salary-basis","name":"Salary basis","what":"The configuration that determines how salary is stored, quoted, and paid — annual, monthly, or hourly — and which element it feeds.","trap":"","ch":"payroll"},{"id":"sandbox","name":"Sandbox","what":"An isolated workspace for making and testing configuration changes before publishing them to the live environment.","trap":"","ch":"extend"},{"id":"shared-services-hr-operations","name":"Shared services / HR Operations","what":"A centralized team handling transactional HR work — payroll processing, data entry, tier-one queries — for the whole organization.","trap":"Treating them as low-level administrators. They hold the operational knowledge no document captures.","ch":"hrfunction"},{"id":"sick-leave","name":"Sick leave","what":"Paid leave for illness, with payment rates varying by duration.","trap":"","ch":"egypt-leave"},{"id":"sit-system-integration-testing","name":"SIT (System Integration Testing)","what":"Testing that the configured system works end to end, including integrations with other systems.","trap":"","ch":"method"},{"id":"social-insurance-contribution-rates","name":"Social insurance contribution rates","what":"The statutory percentages contributed by employee and employer on the insurable wage.","trap":"","ch":"egypt-payroll"},{"id":"solid-line-vs-dotted-line-reporting","name":"Solid-line vs dotted-line reporting","what":"Solid line is the formal line manager who owns performance and compensation decisions. Dotted line is a secondary, functional reporting relationship without that authority.","trap":"","ch":"hrfunction"},{"id":"source-system-key-vs-person-number","name":"Source system key vs person number","what":"The source system key identifies a record in the legacy system for load and reconciliation purposes; the person number is Oracle's own identifier.","trap":"'Data conversion is a side task.' It is routinely the thing that delays go-live.","ch":"hdl"},{"id":"subject-area","name":"Subject area","what":"A pre-built, governed data model in OTBI exposing a business domain such as workforce management or absence.","trap":"","ch":"reporting"},{"id":"tax-reporting-unit-tru","name":"Tax Reporting Unit (TRU)","what":"The reporting face of a PSU toward tax and statutory authorities. TRUs are created under a PSU and are what statutory reports and deduction cards actually reference.","trap":"","ch":"org"},{"id":"termination","name":"Termination","what":"Employer-initiated ending of employment, with or without cause.","trap":"","ch":"lifecycle"},{"id":"test-script","name":"Test script","what":"A step-by-step document defining what to do, what data to use, and what result to expect.","trap":"","ch":"method"},{"id":"uat-user-acceptance-testing","name":"UAT (User Acceptance Testing)","what":"Client-executed testing against agreed scripts to confirm the system meets requirements.","trap":"'Testing is the QA team's job.' Not on a functional implementation.","ch":"method"},{"id":"ulrich-model","name":"Ulrich model","what":"The dominant model for structuring an HR function into three parts: HRBPs, Centers of Excellence, and Shared Services.","trap":"","ch":"hrfunction"},{"id":"universal-health-insurance","name":"Universal health insurance","what":"A separate contributory health insurance scheme being progressively rolled out across governorates.","trap":"","ch":"egypt-payroll"},{"id":"update-vs-correction","name":"Update vs correction","what":"An update creates a new dated record and preserves history. A correction overwrites the existing record as if the previous value was never true.","trap":"Using correction to fix a real-world change, thereby destroying legitimate history.","ch":"dating"},{"id":"value-set","name":"Value set","what":"A definition constraining what values a flexfield segment can accept.","trap":"","ch":"extend"},{"id":"work-relationship","name":"Work relationship","what":"The link between a person and one legal employer, carrying a worker type and the start date of that employment. Terminating employment end-dates the work relationship.","trap":"Confusing termination of a work relationship with deletion of the person. The person record survives; the work relationship is end-dated.","ch":"model"},{"id":"work-terms","name":"Work terms","what":"An optional intermediate layer between the work relationship and the assignment, used to group employment terms such as payroll and compensation across multiple assignments.","trap":"Assuming every implementation has work terms. Many do not — the two-tier model omits this layer entirely.","ch":"model"},{"id":"worker-types","name":"Worker types","what":"The category recorded on a work relationship: employee, contingent worker, pending worker, or non-worker.","trap":"","ch":"model"},{"id":"wps-and-sif-file","name":"WPS and SIF file","what":"The Wage Protection System and the Salary Information File format used to prove salaries were paid correctly and on time.","trap":"","ch":"gulf"},{"id":"grain","name":"Grain","what":"What a single row of a table represents, said in one sentence — one order, one order line, one product per store per day.","trap":"A join can change the grain without warning. If you cannot state the grain after a join, do not sum anything.","ch":"tables"},{"id":"primary-key","name":"Primary key","what":"The column or set of columns that uniquely identifies a row, and therefore proves what the grain is.","trap":"A column called ID is not automatically unique. Count rows versus count distinct before you trust it.","ch":"tables"},{"id":"foreign-key","name":"Foreign key","what":"A column that points at another table's primary key, which is what makes a join possible.","trap":"Many analytics databases do not enforce them, so an orphaned key that matches nothing is perfectly possible.","ch":"tables"},{"id":"surrogate-key","name":"Surrogate key","what":"A meaningless generated number used as the key, as opposed to a natural key like an email address that carries business meaning.","trap":"Natural keys change — people change email addresses — and a key that changes breaks every row referencing it. Join on surrogates, report on naturals.","ch":"tables"},{"id":"cardinality","name":"Cardinality","what":"How many rows on one side of a relationship correspond to a row on the other: one-to-one, one-to-many, or many-to-many.","trap":"Getting it wrong is the usual cause of an inflated total.","ch":"tables"},{"id":"tidy-data","name":"Tidy data","what":"One variable per column, one observation per row, one value per cell.","trap":"A column header that is itself a data value — Jan, Feb, Mar — is the most common violation.","ch":"tables"},{"id":"long-and-wide","name":"Long and wide form","what":"Wide encodes a variable in the column headers; long stores it as values in a column, with one row per observation.","trap":"Pivot tables, Power BI and most charting tools expect long. Unpivot before you analyse, not after.","ch":"tables"},{"id":"null-in-data","name":"NULL","what":"A marker for a value that was never recorded — distinct from zero, which is a measurement, and from an empty string.","trap":"Filling NULLs with zero is a modelling decision you have to be able to defend, not a cleanup step.","ch":"tables"},{"id":"logical-processing-order","name":"Logical processing order","what":"The order the engine resolves a query in — FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT — which is not the order you write it in.","trap":"It explains almost every beginner error, starting with why a SELECT alias cannot be used in WHERE.","ch":"sql-shape"},{"id":"where-vs-having","name":"WHERE versus HAVING","what":"WHERE discards rows before grouping; HAVING discards groups after it.","trap":"A condition on an aggregate can only go in HAVING, because the aggregate does not exist until GROUP BY has run.","ch":"sql-shape"},{"id":"group-by","name":"GROUP BY","what":"Collapses rows into one row per distinct combination of the grouping columns.","trap":"Every selected column must be grouped by or aggregated — otherwise the engine has no way to pick which value to show.","ch":"sql-shape"},{"id":"aggregate-function","name":"Aggregate function","what":"SUM, COUNT, AVG, MIN or MAX — a function that turns many rows into one value.","trap":"They skip NULLs, so an average divides by the number of non-null rows, not the row count.","ch":"sql-shape"},{"id":"distinct","name":"DISTINCT","what":"Removes duplicate rows from the output, after SELECT has built them.","trap":"Reaching for it to hide duplication caused by a join treats the symptom; the grain is what is wrong.","ch":"sql-shape"},{"id":"alias-scope","name":"Alias scope","what":"Where a name defined in SELECT can be used — generally in ORDER BY, generally not in WHERE, GROUP BY or HAVING.","trap":"This one genuinely varies by dialect, so check rather than assume.","ch":"sql-shape"},{"id":"three-valued-logic","name":"Three-valued logic","what":"SQL conditions evaluate to true, false or unknown, and any comparison involving NULL is unknown.","trap":"NOT IN against a list containing NULL is never true, so the query returns nothing at all and nothing errors. Use NOT EXISTS.","ch":"sql-shape"},{"id":"count-star-vs-column","name":"COUNT(*) versus COUNT(column)","what":"COUNT(*) counts rows; COUNT(column) counts rows where that column is not NULL; COUNT(DISTINCT column) counts distinct non-null values.","trap":"Three different questions. Interviewers ask because it tests whether you have thought about NULLs.","ch":"sql-shape"},{"id":"inner-join","name":"Inner join","what":"Keeps only rows that found a match on both sides.","trap":"Silently drops rows that failed to match, which is how records disappear from a report unnoticed.","ch":"sql-joins"},{"id":"left-join","name":"Left join","what":"Keeps every row from the left table, filling the right-hand columns with NULL where nothing matched.","trap":"A condition on the right table in WHERE turns it back into an inner join. Put that condition in ON instead.","ch":"sql-joins"},{"id":"full-outer-join","name":"Full outer join","what":"Keeps unmatched rows from both sides, filling the gaps with NULL.","trap":"Useful for reconciling two sources; check both directions for unmatched rows, not just one.","ch":"sql-joins"},{"id":"cross-join","name":"Cross join","what":"Pairs every row on the left with every row on the right, producing the product of the two row counts.","trap":"Almost always an accident — usually a missing join condition — but deliberately useful for building a date scaffold.","ch":"sql-joins"},{"id":"fan-out","name":"Fan-out","what":"When a one-to-many join repeats each left row once per match, multiplying the rows.","trap":"Correct join behaviour, and how totals silently double. Aggregate the many side to your grain before joining.","ch":"sql-joins"},{"id":"anti-join","name":"Anti-join","what":"The idiom for rows with no match: a left join followed by a WHERE that keeps only the NULL right-hand rows.","trap":"This is the one case where filtering the right table in WHERE is deliberate rather than a bug.","ch":"sql-joins"},{"id":"join-key-mismatch","name":"Join key mismatch","what":"Keys that look equal but are not — trailing spaces, a text column joined to an integer, different case, stripped leading zeros.","trap":"When a join returns too few rows, suspect the data before the SQL.","ch":"sql-joins"},{"id":"window-function","name":"Window function","what":"A calculation across a set of rows that returns a value on every row instead of collapsing them, marked by the OVER clause.","trap":"You cannot filter on one in WHERE or HAVING — both run before it is computed. Wrap it in a CTE.","ch":"sql-windows"},{"id":"partition-by","name":"PARTITION BY","what":"Splits the rows into independent groups so the window calculation restarts for each — the window equivalent of GROUP BY, except the rows survive.","trap":"Omitting it makes the whole result set one partition, which is occasionally what you want and often not.","ch":"sql-windows"},{"id":"row-number-rank-dense-rank","name":"ROW_NUMBER, RANK, DENSE_RANK","what":"Three ways to number rows: never tie (1,2,3), tie and skip (1,2,2,4), tie and do not skip (1,2,2,3).","trap":"ROW_NUMBER with no tiebreaker in the ORDER BY returns a different row between runs.","ch":"sql-windows"},{"id":"lag-and-lead","name":"LAG and LEAD","what":"Return a value from an earlier or later row in the partition, which is how period-on-period change is written.","trap":"They replace the self-join most people reach for first, in one line.","ch":"sql-windows"},{"id":"frame-clause","name":"Frame clause","what":"How much of the partition the function sees for the current row — ROWS or RANGE BETWEEN some start AND some end.","trap":"With an ORDER BY and no frame, the default is RANGE, which treats tied ordering values as one unit. On data with ties, a running total silently differs from ROWS.","ch":"sql-windows"},{"id":"cte","name":"Common table expression (CTE)","what":"A named query, written WITH name AS (...), that later parts of the statement can refer to.","trap":"Not necessarily computed once — some engines inline it, so a CTE referenced three times may run three times.","ch":"sql-windows"},{"id":"recursive-cte","name":"Recursive CTE","what":"A CTE that refers to itself, used to walk a hierarchy such as an org chart or a category tree in a single query.","trap":"Always give it a termination condition or a depth limit; an unbounded one will run until something stops it.","ch":"sql-windows"},{"id":"qualify","name":"QUALIFY","what":"A clause in some warehouses that filters on a window function directly, without wrapping the query.","trap":"Not standard SQL. Check your engine has it before writing it into anything shared.","ch":"sql-windows"},{"id":"xlookup","name":"XLOOKUP","what":"Excel's lookup function that takes a lookup array and a return array, defaults to exact match, and can look in either direction.","trap":"Its predecessor VLOOKUP defaults to approximate match when the fourth argument is omitted, which returns confidently wrong answers on unsorted data.","ch":"excel"},{"id":"index-match","name":"INDEX and MATCH","what":"The older pairing that does what XLOOKUP does — MATCH finds the position, INDEX returns the value at it.","trap":"Worth reading fluently even if you never write it, because inherited spreadsheets are full of it.","ch":"excel"},{"id":"excel-table","name":"Excel Table","what":"A range formatted as a named object with typed columns, giving structured references like Sales[Revenue] that extend automatically.","trap":"It removes the commonest serious spreadsheet bug: a formula whose hard-coded range stopped short of new rows.","ch":"excel"},{"id":"pivot-table","name":"Pivot table","what":"A drag-and-drop grouped aggregation, and the fastest way to explore an unfamiliar dataset.","trap":"If it counts when you expected it to sum, there is a non-numeric value in the column.","ch":"excel"},{"id":"power-query","name":"Power Query","what":"The transformation engine shared by Excel and Power BI: import, clean, reshape and join, with every step recorded and repeatable.","trap":"The highest-return thing an Excel user can learn, and it transfers directly to Power BI.","ch":"excel"},{"id":"volatile-function","name":"Volatile function","what":"A function such as NOW, TODAY, RAND, OFFSET or INDIRECT that recalculates on every change anywhere in the workbook.","trap":"A common and invisible reason a workbook becomes slow.","ch":"excel"},{"id":"excel-limits","name":"Excel's limits","what":"1,048,576 rows by 16,384 columns per sheet — though performance, and the absence of any audit trail, bite well before that.","trap":"The moment a number matters to more than one person or must be reproduced next month, the answer stops being a spreadsheet.","ch":"excel"},{"id":"spill-and-dynamic-arrays","name":"Dynamic arrays and spilling","what":"One formula returning many results into neighbouring cells, which is what FILTER, SORT, UNIQUE and SEQUENCE rely on.","trap":"A spill range needs empty cells to spill into, or it returns #SPILL!.","ch":"excel"},{"id":"fact-table","name":"Fact table","what":"The table of events you measure — one row per sale, click or ticket — holding the numbers to aggregate and the keys pointing outward.","trap":"Descriptive attributes belong in dimensions, not here.","ch":"powerbi-model"},{"id":"dimension-table","name":"Dimension table","what":"The table of things you slice by — products, customers, stores, dates — short, slow-changing and descriptive.","trap":"Given a flat export, splitting the dimensions out of it is the first modelling job.","ch":"powerbi-model"},{"id":"star-schema","name":"Star schema","what":"One fact table surrounded by dimension tables, each joined by a single key — the shape Power BI is built for.","trap":"Both the engine's compression and its filter propagation assume it. A flat wide table is slower and harder to reason about.","ch":"powerbi-model"},{"id":"relationship-cardinality","name":"Relationship cardinality","what":"Whether a relationship is one-to-many, one-to-one or many-to-many, and which side is which.","trap":"A many-to-many usually means a bridge table is missing.","ch":"powerbi-model"},{"id":"cross-filter-direction","name":"Cross-filter direction","what":"Which way a filter travels along a relationship — single, from the one side to the many, or both.","trap":"Bidirectional is the tempting fix for a slicer that does nothing and usually the wrong one: it creates ambiguous paths and slows queries.","ch":"powerbi-model"},{"id":"date-table","name":"Date table","what":"A dedicated dimension with one row per date and no gaps, marked as the model's date table.","trap":"Without it, time-intelligence functions fail quietly at period boundaries rather than loudly.","ch":"powerbi-model"},{"id":"import-vs-directquery","name":"Import versus DirectQuery","what":"Import loads a compressed copy into the model; DirectQuery leaves the data in the source and queries it per visual.","trap":"Import is the default answer. DirectQuery costs latency, restricts DAX, and puts load on the source system.","ch":"powerbi-model"},{"id":"roches-maxim","name":"Roche's Maxim","what":"Data should be transformed as far upstream as possible, and as far downstream as necessary.","trap":"A calculation that gives the same answer whatever the user selects is a transformation, and belongs in Power Query rather than DAX.","ch":"powerbi-model"},{"id":"measure-vs-calculated-column","name":"Measure versus calculated column","what":"A calculated column is computed row by row at refresh and stored; a measure is computed at query time in the filter context of each cell.","trap":"Writing a calculated column where a measure belongs bloats the model and produces a report that does not react to slicers.","ch":"dax"},{"id":"filter-context","name":"Filter context","what":"The set of filters in force when a measure is evaluated — the cell's row and column, the slicers, the page and report filters.","trap":"A total row is a different filter context, not the sum of the rows above it. That is why totals appear wrong when they are not.","ch":"dax"},{"id":"row-context","name":"Row context","what":"Having a current row to read columns from, which calculated columns and iterators have and measures do not.","trap":"Row context does not filter anything by itself, which is why a bare column reference in a measure is an error.","ch":"dax"},{"id":"calculate","name":"CALCULATE","what":"The function that evaluates an expression in a filter context it has modified — the centre of the language.","trap":"Its filter arguments replace existing filters on the same column rather than adding to them. Wrap in KEEPFILTERS to intersect instead.","ch":"dax"},{"id":"context-transition","name":"Context transition","what":"CALCULATE converting an existing row context into the equivalent filter context.","trap":"This is the mechanism behind most DAX behaviour that looks like magic, including why a measure called inside an iterator sees only one row.","ch":"dax"},{"id":"iterator-functions","name":"Iterator functions","what":"The X functions — SUMX, AVERAGEX, MAXX, RANKX — which evaluate an expression once per row of a table and then aggregate.","trap":"SUM adds a column that already exists; SUMX computes something per row first. Multiplying two columns needs the latter.","ch":"dax"},{"id":"time-intelligence","name":"Time intelligence","what":"DAX functions such as SAMEPERIODLASTYEAR, DATEADD and TOTALYTD that shift or accumulate over a date dimension.","trap":"They require a marked, gapless date table, and without one they fail silently at period boundaries.","ch":"dax"},{"id":"divide-function","name":"DIVIDE","what":"DAX's division function, which returns blank rather than an error when the denominator is zero.","trap":"Use it instead of the / operator, or ship a visual full of errors the first time a category has no rows.","ch":"dax"},{"id":"business-question","name":"The business question","what":"The vague request turned into one sentence with a period, a comparison, a population and a decision attached.","trap":"Agree that sentence before building. It is the specification, and usually the title of the chart.","ch":"question-to-chart"},{"id":"chart-choice","name":"Chart choice","what":"Bars for comparison across categories, lines for change over time, scatter for the relationship between two measures, a table when exact values matter.","trap":"A pie is readable at two or three slices. Beyond that it is a bar chart pretending.","ch":"question-to-chart"},{"id":"truncated-axis","name":"Truncated axis","what":"Starting a value axis somewhere other than zero, which exaggerates differences.","trap":"Never on bars, which encode value by length. Acceptable on lines, which encode change by slope — if the axis is labelled honestly.","ch":"question-to-chart"},{"id":"dual-axis","name":"Dual axis","what":"Two different scales on one chart, one on each side.","trap":"The apparent correlation is a function of where you set the two ranges. Two stacked charts on a shared time axis say it without the implication.","ch":"question-to-chart"},{"id":"data-ink","name":"Data-ink","what":"Tufte's principle that most of the ink on a chart should represent data, and the rest should be as quiet as possible.","trap":"Gridlines, borders, shadows and legends that merely repeat the labels are the usual offenders.","ch":"question-to-chart"},{"id":"dashboard-vs-report","name":"Dashboard versus report","what":"A dashboard is monitored regularly and should fit one screen; a report is read once and answers a question at whatever length that takes.","trap":"Requests for a dashboard are frequently requests for a report. Ask how often they will look at it, and what they will do differently.","ch":"question-to-chart"},{"id":"sanity-check","name":"Sanity check","what":"Reconciling your total against a figure the business already trusts before you present it.","trap":"If it does not match, find out why before the meeting — because someone in the room will.","ch":"question-to-chart"},{"id":"action-and-action-reason","name":"Action and action reason","what":"Every change to an assignment is stamped with an action — Hire, Promotion, Transfer, Termination — and a client-defined reason underneath it. The action drives the flow; the reason makes later analysis possible.","trap":"Reasons feel like optional paperwork during implementation and turn out to be the only way to answer 'why did attrition rise'. Configure them or lose the question for ever.","ch":"model"},{"id":"assignment-status","name":"Assignment status","what":"The status on an assignment controlling whether it is active, suspended or inactive, and separately whether it is eligible for payroll processing.","trap":"'Active in HR but not paid' is a real and valid combination. It is also the usual explanation when somebody who should have been paid was not.","ch":"model"},{"id":"employment-model","name":"Employment model","what":"The enterprise-level setting that decides whether a worker can hold one assignment or several at once, and whether contracts are tracked separately. Two-tier single assignment covers most implementations.","trap":"It can be overridden per legal employer, but changing it after workers exist is painful. Ask in the first workshop, not the third.","ch":"org"},{"id":"enterprise-structures-configurator","name":"Enterprise Structures Configurator (ESC)","what":"An interview-style wizard that creates legal entities, classifies them as legal employers and payroll statutory units, and creates a legislative data group per country in one pass, with a technical summary to review before loading.","trap":"Useful for a greenfield build, dangerous as a substitute for understanding — it makes defensible default choices the consultant then has to defend or unpick.","ch":"org"},{"id":"last-standard-process-date","name":"Last standard process date","what":"The date on a terminated payroll relationship after which ordinary payroll runs no longer pick the person up. A separate final close date stops everything, including corrections.","trap":"Set the final close date too early and a legitimate late payment — a final bonus, a corrected settlement — cannot be made without reopening the record.","ch":"model"},{"id":"legal-jurisdiction","name":"Legal jurisdiction","what":"A geographic area combined with the law that applies in it — Egypt income tax, Saudi social insurance. Every legal entity is registered against an identifying jurisdiction, and that registration number is what appears on statutory output.","trap":"Jurisdictions and legal authorities must exist before the legal entity does. Discovering that mid-configuration costs an afternoon.","ch":"org"},{"id":"organization-tree","name":"Organization tree","what":"A versioned parent-child arrangement of departments, organizations or positions. It draws the org chart and, more importantly, gives security profiles something to scope against.","trap":"Trees must be published before they take effect, which is the usual explanation for 'I made the change and nothing happened'.","ch":"org"},{"id":"primary-assignment","name":"Primary assignment","what":"The flag marking which of a person's concurrent assignments is the main one. Reports, the org chart and most downstream integrations read it.","trap":"Set on the minor of two jobs, it quietly reports the person under the wrong department indefinitely, and nothing in the application complains.","ch":"model"},{"id":"reference-data-set","name":"Reference data set","what":"A grouping of set-enabled configuration data — jobs, grades, locations, departments — assigned to one or more business units, which controls what can be selected on a transaction in that unit.","trap":"Positions are the exception: they attach to a business unit directly, not through a set. Expecting positions to follow the job rules is a standard surprise.","ch":"org"},{"id":"seniority-date","name":"Seniority date","what":"A configurable date that records continuous service, separate from the hire date, so that service can bridge a break in employment or carry across legal employers within a group.","trap":"End-of-service gratuity and leave bands are calculated on service. Solving a rehire by back-dating the work relationship instead of setting a seniority date corrupts every headcount and accrual figure for that period.","ch":"model"}],"questions":[{"ch":"model","q":"After a global transfer from Egypt to Saudi Arabia, how many person records exist? How many work relationships? How many payroll relationships?","a":"One person record — the person is held once, globally. Two work relationships: the Egyptian one is terminated (end-dated) and a new one is created under the Saudi legal employer. Two payroll relationships: the Saudi one is created under the Saudi PSU in a different LDG, and because balances never span payroll relationships, year-to-date figures start fresh.","terms":["person","work-relationship","payroll-relationship","global-transfer"]},{"ch":"org","q":"What is the difference between a legal entity and a legal employer?","a":"A legal entity is an organization recognized by law that can own assets, sign contracts and be sued. A legal employer is a classification applied to a legal entity that enables it to employ workers. Not every legal entity is a legal employer — one may exist only to hold property — and nobody can be hired into an entity until the classification is switched on.","terms":["legal-entity","legal-employer"]},{"ch":"org","q":"A client asks why an Egyptian element does not appear in the Saudi environment. What is checked first?","a":"The legislative data group. All payroll configuration — elements, balances, formulas — lives inside exactly one LDG, and an element defined in the Egypt LDG does not exist in the Saudi LDG. It has to be built again there.","terms":["legislative-data-group-ldg","element"]},{"ch":"workforce","q":"Explain job versus position to someone who has never used an HR system.","a":"A job is what the work is — 'Accountant' — defined once and reused everywhere. A position is one specific seat doing that work: 'Accountant #3, Finance, Alexandria plant', with its own budget and reporting line, which exists whether or not anyone currently sits in it. When the person leaves, the position stays and becomes a vacancy.","terms":["job","position"]},{"ch":"dating","q":"When is a correction used instead of an update, and what does each do to history?","a":"An update records a real-world change: it creates a new dated record and keeps the old one, so a promotion on 1 July leaves both grades in history. A correction fixes a data-entry mistake: it overwrites the record as if the old value was never true. Using a correction for a real event destroys legitimate history and can trigger wrong retroactive payroll.","terms":["update-vs-correction","effective-date"]},{"ch":"payroll","q":"Walk through the payroll object chain from element to payment.","a":"Element (the definition) → element eligibility (who could receive it) → element entry (who does, and how much) → payroll run (gross-to-net, held against the payroll relationship) → balances (running totals) → prepayments (distribute results to payment methods) → payment process (the bank file) → costing (to the ledger). Each link depends on the one before it.","terms":["element","element-eligibility-element-link","element-entry","payroll-run","balance","prepayments","payment-process-bank-file","costing"]},{"ch":"egypt-payroll","q":"An employee earns EGP 25,000 per month. What is their monthly social-insurance contribution, and why is it not 11% of 25,000?","a":"EGP 1,837.00. Contributions apply to the insurable wage, which is capped at EGP 16,700 in 2026 (floor EGP 2,700). 11% of 16,700 is 1,837; the employer pays 18.75% of the same capped figure, EGP 3,131.25. The cap moves every January.","terms":["insurable-wage","social-insurance-contribution-rates"]},{"ch":"model","q":"Why can balances not span payroll relationships, and when does that become visible to a client?","a":"Because payroll processing and aggregation happen at the payroll relationship level, which is tied to one payroll statutory unit and one legislation. A different PSU means different statutory rules and a different LDG, so totals cannot carry across. It becomes visible on a global transfer, when year-to-date balances start from zero in the new country.","terms":["payroll-relationship","balance"]},{"ch":"absence","q":"Which of the six absence plan types fits maternity leave, and why not an accrual plan?","a":"A qualification plan. Maternity is not earned day by day — it is triggered by an event and paid at a defined rate over the absence, and it can carry occurrence caps. An accrual plan accumulates a balance over time, which is the wrong shape. The six types are accrual, qualification, no entitlement, compensatory, agreement and donation.","terms":["absence-plan","qualification-plan","accrual-plan"]},{"ch":"hrfunction","q":"A department has ten people, four of them half-time. What is the headcount and what is the FTE?","a":"Headcount 10 — every person counts as one. FTE 8 — six full-timers at 1.0 plus four half-timers at 0.5. Both numbers are correct; they answer different questions, so always ask which one the client means.","terms":["headcount","fte-full-time-equivalent"]},{"ch":"reporting","q":"OTBI or BI Publisher for a payslip? For a headcount dashboard? Justify both.","a":"Payslip: BI Publisher — a formatted, per-employee, printable document, produced from a SQL data model and a layout template and delivered by bursting. Headcount dashboard: OTBI — ad-hoc analysis against live data using the Worker Assignment subject area, no layout requirement. Swapping them is wrong in both directions.","terms":["otbi","bi-publisher-bip","bursting"]},{"ch":"payroll","q":"What does element eligibility do that an element entry does not?","a":"Eligibility defines the population an element can apply to — by payroll, legal employer, grade, job, department. It answers 'who could receive this'. An entry is the actual attachment of the element to one person with values and dates — 'who does, and how much'. Without eligibility, no entry can be created.","terms":["element-eligibility-element-link","element-entry"]},{"ch":"extend","q":"A client says 'we need an extra field for equipment number'. What are the first three thoughts?","a":"DFF — a descriptive flexfield on the relevant object holds the data without customization. Lookup or value set — should the field be a controlled list rather than free text. Approvals — what the workflow should do when the field changes. That sequence covers most 'can you add a field' requests.","terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code","value-set"]},{"ch":"security","q":"What is the difference between what a job role controls and what a security profile controls?","a":"A job role controls function — what a user can do: the screens, tasks and privileges of, say, an HR Specialist. A security profile controls data scope — whose records they can do it to: by legal employer, business unit, department, position or country. A data role combines the two. Same job role, different profiles, different visible populations.","terms":["job-role","data-role-and-security-profile"]},{"ch":"egypt-payroll","q":"Why does Oracle not deliver a maintained Egyptian payroll localization, and why does that matter for a consultant's value on a project?","a":"Oracle maintains localizations for a limited set of markets; Egypt's statutory rules are built by the implementation partner in elements, balances and Fast Formulas. That means someone on the project has to know the Egyptian mechanics — insurable-wage caps, the tax brackets and bracket elimination, the small statutory deductions — and a consultant who knows them is useful from the first workshop.","terms":["fast-formula","insurable-wage","progressive-tax-brackets"]},{"ch":"dating","q":"A raise is approved in July with an effective date of 1 May. What happens in the July payroll run?","a":"Retroactive events are raised for May and June, which were already paid at the old rate. Recalculate Payroll for Retroactive Changes runs before the main calculation, works out the arrears for both months and creates retro entries; the July run then pays them and re-states the affected balances, including social insurance and tax for the prior periods.","terms":["retroactive-change-retro"]},{"ch":"payroll","q":"What is a parallel run, and why is it not optional?","a":"Running the new system's payroll alongside the legacy payroll for the same period — typically two or three consecutive months — and reconciling the two line by line, explaining every difference. It is the only reliable proof that the new payroll is correct before the old one is switched off.","terms":["parallel-run","reconciliation"]},{"ch":"hrfunction","q":"Name the three parts of the Ulrich model and say which one a consultant works with most day to day.","a":"HR business partners embedded in the business, centers of excellence owning policy in a domain, and shared services doing the transactional work. Day to day, the consultant works most with shared services — in Egypt the Personnel and Payroll team — because their work is what the configuration automates; the CoEs sign off design in their domain.","terms":["ulrich-model","hrbp-hr-business-partner","centers-of-excellence-coe","shared-services-hr-operations"]},{"ch":"egypt-payroll","q":"What is the mandatory annual increment in Egypt calculated on, and why does that matter for high earners?","a":"At least 3% of the social-insurance wage — the insurable wage — not total salary. Because the insurable wage is capped (EGP 16,700 in 2026), the increment is effectively capped at 3% of the ceiling for anyone earning above it.","terms":["minimum-wage-and-mandatory-annual-increment","insurable-wage"]},{"ch":"egypt-payroll","q":"Under the current Egyptian brackets, why might a naive progressive tax calculation understate tax for a senior employee?","a":"Because of bracket elimination. Above defined net-income thresholds the lower bands are removed — above EGP 600,000 the 0% band goes, above 700,000 the 10% band too, and so on until above 1.2 million only the 25% and 27.5% bands apply. A calculator that applies every band to everyone gives senior staff lower-band relief they are not entitled to.","terms":["bracket-elimination-for-high-earners","progressive-tax-brackets"]},{"ch":"reporting","q":"What is a subject area, and why does choosing the wrong one produce wrong numbers rather than an error?","a":"A pre-built, governed data model in OTBI — pre-joined tables exposed as folders and columns — covering one domain at a fixed grain. Choosing wrong does not fail; it silently reports at the wrong grain: date-effective history multiplies rows and multiple assignments double-count people, so the numbers are plausible and wrong.","terms":["subject-area","otbi"]},{"ch":"reporting","q":"Name the three OTBI constraints that catch people, and the three workarounds.","a":"Constraints: no joins across subject areas in one analysis; a default row limit (around 65,000) past which results truncate silently; and predefined grain that cannot be changed. Workarounds: a Combined Analysis on a shared key such as person number; BI Publisher with hand-written SQL; or an HCM Extract for large volumes.","terms":["otbi","hcm-extract","bi-publisher-bip"]},{"ch":"reporting","q":"OTBI or BI Publisher for a payslip? For a headcount dashboard? For a 200,000-row extract? Justify all three.","a":"Payslip: BI Publisher, formatted per-employee output with bursting. Headcount dashboard: OTBI, ad-hoc and live. 200,000 rows: past OTBI's row limit — an HCM Extract, or BI Publisher with its own SQL.","terms":["otbi","bi-publisher-bip","hcm-extract"]},{"ch":"reporting","q":"What are the two halves of a BI Publisher report, and which one is closest to ordinary SQL work?","a":"A data model and a layout template. The data model is genuinely SQL against the reporting schema — that half is ordinary query work. The template controls layout and is the new part.","terms":["bi-publisher-bip"]},{"ch":"reporting","q":"Explain bursting to someone who has never heard of it.","a":"One report run produces thousands of individual outputs, each delivered separately to the right person — one payroll run becomes one payslip email per employee. Bursting is the splitting and routing step.","terms":["bursting"]},{"ch":"hdl","q":"Write a valid METADATA line for a simple object from memory, then a matching MERGE line.","a":"METADATA|JobFamily|JobFamilyCode|JobFamilyName|EffectiveStartDate|EffectiveEndDate — then — MERGE|JobFamily|SALES|Sales|2000/01/01|4712/12/31. Same discriminator, same attributes in the same order, pipe-delimited, dates as YYYY/MM/DD.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Give two reasons an HDL file would be rejected before any data loads.","a":"A METADATA line appearing after the MERGE lines it describes; two METADATA lines for the same component in one file; a MERGE line whose attributes do not match the METADATA order (pipe-count mismatch); a wrongly cased attribute name; a file saved with a UTF-8 byte-order mark.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Can a single .dat file contain two METADATA lines? Under what condition?","a":"Yes — a Worker.dat routinely has METADATA lines for Worker, PersonName, WorkRelationship, Assignment and more. The condition is that each METADATA line is for a different component; two for the same component is invalid.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"What is 4712/12/31 and why does it appear everywhere?","a":"Oracle's conventional 'end of time' date. Every date-effective record has an end date, and an open-ended, current record ends on 4712/12/31 — so it is on almost every current row in a load and in the tables.","terms":["hdl-hcm-data-loader","effective-date"]},{"ch":"hdl","q":"Explain the difference between a source key and a user key, and say which one to insist on for a migration that must be reconciled.","a":"A source key is SourceSystemOwner plus SourceSystemId — the record's identity in the legacy system. A user key is a natural business key such as JobFamilyCode. For a migration that must be reconciled, insist on source keys: they are what trace every Oracle record back to its legacy origin and let every variance be explained.","terms":["source-system-key-vs-person-number","hdl-hcm-data-loader"]},{"ch":"hdl","q":"What does JobFamilyId(SourceSystemId) mean in a METADATA line?","a":"A foreign-object reference: the column points at a job family, identified by its source-system id rather than Oracle's internal id. The bracket names the key type used to resolve the reference. It is how child records attach to parents in a load.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Multiple .dat files are in one zip. Are they loaded in parallel or sequentially, and what does that mean for ordering?","a":"Imported in parallel, loaded sequentially. Referenced data must exist before it is referenced: job families before jobs, grades and jobs before assignments, people before work relationships.","terms":["hdl-hcm-data-loader"]},{"ch":"ff","q":"What are the four logical sections of a Fast Formula?","a":"Inputs (INPUTS ARE), defaults (DEFAULT FOR), logic (assignments and IF/THEN/ELSE), and return (RETURN). Oracle does not strictly enforce the order, but following it avoids errors.","terms":["fast-formula"]},{"ch":"ff","q":"Why does Oracle recommend INPUTS statements over database items where possible?","a":"Inputs are passed at runtime and need no database read; database items are fetched from the database. Preferring inputs makes the payroll run faster.","terms":["fast-formula"]},{"ch":"ff","q":"What is a formula type, and why does it mean Fast Formula cannot be learned purely from grammar?","a":"The type fixes which inputs, database items and contexts are available to a formula. The same syntax behaves differently depending on where it runs, and a formula written for one context will not run in another — so the language is learned by reading delivered formulas of the type being built.","terms":["fast-formula"]},{"ch":"ff","q":"In words, what is the logic for capping an Egyptian insurable wage before applying the 11% employee contribution?","a":"Take the wage as an input. If it is above the ceiling (EGP 16,700 in 2026), use the ceiling. If it is below the floor (EGP 2,700), use the floor. Multiply the result by 0.11 and return it. Cap and floor first, rate last.","terms":["fast-formula","insurable-wage"]},{"ch":"extend","q":"A client wants a new field for equipment number. What are the first three thoughts?","a":"DFF, lookup (or value set), approvals — where the data lives, whether it should be a controlled list, and what the workflow should do about it.","terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code"]},{"ch":"extend","q":"What actually happens when a sandbox is published?","a":"The configuration changes made and tested in isolation become real for every user. It is a controlled, deliberate step — not an autosave — and the moment at which page and flexfield changes go live.","terms":["sandbox"]},{"ch":"reporting","q":"There is no direct database connection to a SaaS pod. Name all four ways to get data out, and when each is right.","a":"OTBI for ad-hoc analysis and dashboards; BI Publisher data models for formatted output and complex SQL; HCM Extract for scheduled or large-volume outbound files; REST APIs for real-time integration.","terms":["otbi","bi-publisher-bip","hcm-extract","rest-api"]},{"ch":"reporting","q":"Where is the honest boundary between what a strong functional consultant does and what is handed to a technical team?","a":"Expected of a functional consultant: HDL loads, simple Fast Formulas, OTBI analyses and basic BI Publisher. Handed off: Oracle Integration Cloud integrations and complex BI Publisher development.","terms":["hdl-hcm-data-loader","fast-formula","rest-api"]},{"ch":"tables","q":"Someone hands you a table and asks for total revenue. What do you establish first?","a":"What one row represents — the grain. If one row is one order, summing the order total is right. If the table has been joined to order lines, each order now appears once per line and the same sum is inflated by the average lines per order. Nothing errors; the number just looks plausible and is wrong. I'd confirm the primary key, check row count against distinct key count, and only then sum.","terms":["grain","primary-key","fan-out"]},{"ch":"tables","q":"Why prefer a surrogate key over a natural one for joining?","a":"Because natural keys change. Email addresses, national IDs and company codes all get reassigned or corrected, and when a key changes every row that referenced it breaks. A surrogate key is a meaningless generated number that never changes, so relationships stay intact. The working rule is join on surrogates, report on naturals — the user still wants to see the email, not the integer.","terms":["surrogate-key","primary-key"]},{"ch":"tables","q":"What is wrong with a table whose columns are Jan, Feb, Mar?","a":"The month is encoded in the column header rather than stored as a value, so it's wide rather than long. It's readable for a human scanning across, but pivot tables, Power BI and most charting tools all compute on long data — one row per observation, with a month column and a value column. It has to be unpivoted before you can group or chart by month, and doing that with the tool's unpivot rather than by hand is what makes it repeatable.","terms":["long-and-wide","tidy-data"]},{"ch":"sql-shape","q":"Why can't you use a SELECT alias in the WHERE clause?","a":"Because of logical processing order. The engine resolves FROM, then WHERE, then GROUP BY, then HAVING, and only then SELECT — so at the point WHERE runs, the alias doesn't exist yet. You either repeat the expression in WHERE or wrap the query in a subquery or CTE. The same alias usually does work in ORDER BY, because ORDER BY runs last.","terms":["logical-processing-order","alias-scope"]},{"ch":"sql-shape","q":"When does a filter belong in HAVING rather than WHERE?","a":"When it's a condition on an aggregate. 'Orders over 100' is a row condition and goes in WHERE. 'Customers whose total is over 1,000' is a condition on a SUM that doesn't exist until GROUP BY has run, so it has to go in HAVING. Putting a plain row filter in HAVING usually works but is slower — you've grouped rows you were always going to throw away.","terms":["where-vs-having","group-by"]},{"ch":"sql-shape","q":"A colleague's NOT IN query returns no rows at all, and there's no error. What do you check?","a":"Whether the list or subquery can return NULL. SQL has three-valued logic, so any comparison with NULL is unknown, and x NOT IN (1, 2, NULL) is never true for any x — the result set comes back empty and nothing complains. NOT EXISTS doesn't have that behaviour, so I'd rewrite it that way, and it's the safer default habit regardless.","terms":["three-valued-logic","null-in-data"]},{"ch":"sql-shape","q":"What's the difference between COUNT(*), COUNT(column) and COUNT(DISTINCT column)?","a":"COUNT(*) counts rows. COUNT(column) counts rows where that column isn't NULL. COUNT(DISTINCT column) counts distinct non-null values. They're three different questions, and the gap between the first two is exactly the number of NULLs — which is often the more interesting number.","terms":["count-star-vs-column","aggregate-function"]},{"ch":"sql-joins","q":"Why does a LEFT JOIN sometimes behave like an INNER JOIN?","a":"Because of a condition on the right table in the WHERE clause. Unmatched rows get NULL in the right-hand columns, NULL = anything is unknown, and WHERE discards them — so you're left with exactly what an inner join would return. The fix is to move that condition into the ON clause, where it decides what counts as a match instead of filtering the result. The exception is an anti-join, where filtering IS NULL in WHERE is the whole point.","terms":["left-join","anti-join"]},{"ch":"sql-joins","q":"Revenue in your report is roughly double what finance says. Where do you look first?","a":"A join that changed the grain. If orders were joined to order lines, every order-level value now appears once per line, so SUM(order_total) is weighted by line count. I'd compare the row count before and after each join — if a join changed it and I didn't expect that, stop there. The fix is to aggregate the many side to the grain I want before joining, usually in a CTE, rather than reaching for DISTINCT afterwards.","terms":["fan-out","cardinality","grain"]},{"ch":"sql-joins","q":"A join returns far fewer rows than you expected. What do you suspect?","a":"The keys, before the logic. Trailing whitespace, one side stored as text and the other as an integer, case sensitivity differing by collation, leading zeros stripped by a spreadsheet upstream. I'd count distinct keys on both sides and eyeball a handful that failed to match. It's nearly always the data rather than the SQL.","terms":["join-key-mismatch"]},{"ch":"sql-windows","q":"What does a window function do that GROUP BY cannot?","a":"It computes across a set of rows and returns the answer on every row, instead of collapsing them. That's what makes running totals, rankings, each row's share of its group, and period-on-period change possible while keeping the detail. PARTITION BY is the window equivalent of GR
