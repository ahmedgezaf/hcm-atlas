"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"absence","num":6,"track":"functional","title":"Absence Management","sub":"Where labour law becomes configuration","hue":98,"minutes":8,"labs":["leave"],"terms":["absence-type","absence-plan","accrual-plan","qualification-plan","no-entitlement-plan","compensatory-plan","eligibility-profile","accrual-band","carryover","leave-encashment"],"html":"<p>Absence is the module where a country's labour law turns into configuration. Every leave entitlement in the statute becomes an absence plan with rules, and every rule becomes a test script. The Egyptian annual-leave ladder is the classic accrual exercise; Egyptian sick leave is the classic qualification plan.<\/p>\n<h2>Types are what people see; plans are the rules<\/h2>\n<p>An <strong>absence type<\/strong> is what the worker actually selects when requesting leave — \"Annual Leave\", \"Sick Leave\", \"Maternity Leave\". It controls display and entry behaviour: whether half days are allowed, whether an end date is required, what documentation is needed. Every type must be associated with at least one plan. Clients describe requirements in terms of types (\"we need a Hajj leave\"); the consultant translates that into a type plus the plan behind it.<\/p>\n<p>An <strong>absence plan<\/strong> is the rules engine behind the type: who is eligible, how entitlement is earned or granted, and how it is paid. Oracle defines six plan types, and naming all six is a small, cheap differentiator, because most beginners know only two:<\/p>\n<ul>\n<li><strong>Accrual<\/strong> — workers accumulate time over a period for paid leave, such as a vacation plan.<\/li>\n<li><strong>Qualification<\/strong> — workers qualify for an entitlement on an event and receive payments during the absence, with payment percentages that can vary by band.<\/li>\n<li><strong>No entitlement<\/strong> — tracks absences without maintaining a balance or providing entitlement, typically unpaid leave.<\/li>\n<li><strong>Compensatory<\/strong> — tracks earned compensatory time that can be taken as time off, instead of overtime pay.<\/li>\n<li><strong>Agreement<\/strong> — plans built under statutory or collective-agreement rules.<\/li>\n<li><strong>Donation<\/strong> — tracks donated time that a worker receives.<\/li>\n<\/ul>\n<h2>Accrual plans and bands<\/h2>\n<p>An <strong>accrual plan<\/strong> accumulates leave over time, with rules for accrual rate, ceilings and carryover. Oracle supports front-loaded accrual (the whole year's entitlement granted at the start of the plan term) and incremental accrual (earned period by period). <strong>Accrual bands<\/strong> grant different rates to different populations, usually by length of service, because almost every real leave policy is tiered. Egyptian annual leave — 15 days in the first year, 21 from the second, 30 after ten years of service or at age 50 — is implemented directly as accrual bands. The boundary cases are the test cases: the person who crosses ten years mid-year and the person who turns fifty mid-year.<\/p>\n<p><strong>Carryover<\/strong> rules govern how much unused leave transfers into the next plan term and when it expires. Employers cap carryover to control liability and to encourage people to take leave, and carryover and expiry rules are a frequent source of client disagreement — pin them down in writing early. Egyptian law also imposes its own constraints (Chapter 10).<\/p>\n<h2>Qualification plans<\/h2>\n<p>A <strong>qualification plan<\/strong> is used where entitlement is not earned day by day but triggered by an event and paid at rates that vary over the absence. Egyptian sick leave is the textbook case: 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in a calendar year, subject to medical certification. Those percentages are configured as qualification bands. Maternity leave is the other standard example, with its own cap on occurrences.<\/p>\n<p>A <strong>no-entitlement plan<\/strong> exists because unpaid absence still needs to be recorded — for attendance, payroll deduction and reporting — even though nothing is earned or granted. A <strong>compensatory plan<\/strong> comes up whenever a client asks about time off in lieu.<\/p>\n<h2>Eligibility profiles and encashment<\/h2>\n<p>An <strong>eligibility profile<\/strong> is a reusable set of criteria — grade, job, department, location, length of service — that decides whether a person qualifies for a plan: \"employees in the Egypt legal employer with more than ten years of service\" as the criterion for the 30-day band. Eligibility profiles appear in absence, benefits and compensation, so learning them once pays off three times.<\/p>\n<p><strong>Leave encashment<\/strong> pays out unused leave in cash instead of time off. It occurs at termination as part of the final settlement and periodically where policy or law allows. It is the link between absence and payroll: an absence balance becomes a payroll element on termination.<\/p>\n<div class=\"lab-embed\" data-lab=\"leave\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Knowing only accrual and qualification plans. There are six.<\/li>\n<li>Building a flat annual entitlement when the law is tiered by service.<\/li>\n<li>Leaving carryover and expiry rules undocumented.<\/li>\n<li>Forgetting that casual leave in Egypt is counted within annual leave, not on top of it.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Types of Absence Plans\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faiam/types-of-absence-plans.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faiam/types-of-absence-plans.html<\/a><\/li>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Accrual Absence Plans\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/20b/faiam/accrual-absence-plans.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/20b/faiam/accrual-absence-plans.html<\/a><\/li>\n<li>Oracle, <em>Absence Management<\/em> datasheet. <a href=\"https://www.oracle.com/a/ocom/docs/applications/human-capital-management/absence-management-ds.pdf\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/a/ocom/docs/applications/human-capital-management/absence-management-ds.pdf<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"hrfunction","num":7,"track":"functional","title":"Headcount, Metrics & the HR Function","sub":"The vocabulary HR directors use — speak it fluently","hue":46,"minutes":7,"labs":["fte"],"terms":["headcount","fte-full-time-equivalent","attrition-turnover","org-chart","solid-line-vs-dotted-line-reporting","hrbp-hr-business-partner","centers-of-excellence-coe","shared-services-hr-operations","ulrich-model"],"html":"<p>A consultant does not need HR theory, but does need to speak HR's language fluently enough that an HR director never has to slow down. This chapter covers the metrics that appear in every reporting conversation and the way large HR functions are organized, which explains who owns which decision.<\/p>\n<h2>Headcount is not FTE<\/h2>\n<p><strong>Headcount<\/strong> is a raw count of people, regardless of how much each one works. One person equals one headcount. <strong>FTE<\/strong> — full-time equivalent — is a measure of workload rather than of people: an employee working half time is 0.5 FTE but still one headcount. A department with ten people, four of them half-time, has a headcount of ten and an FTE of eight. FTE is stored on the assignment.<\/p>\n<p>Both numbers are \"correct\", and they answer different questions: legal thresholds, facilities and org design care about humans; budgeting and capacity planning care about work. Reporting FTE when the client asked for headcount, or the reverse, is a reliable source of reporting disputes. Ask which one they mean.<\/p>\n<div class=\"lab-embed\" data-lab=\"fte\"><\/div>\n\n<p><strong>Attrition<\/strong> or turnover is the rate at which people leave over a period, usually expressed annually as a percentage. Definitions vary — voluntary versus involuntary, whether to include probation leavers, what goes in the denominator — so the first question when a client asks for a turnover report is how they define the numerator and the denominator. That question alone marks a consultant as experienced.<\/p>\n<h2>The org chart is data, not a drawing<\/h2>\n<p>In Oracle the <strong>org chart<\/strong> is generated from manager relationships on assignments; it is not drawn separately. If the chart looks wrong, the underlying manager data is wrong — fix the data, not the picture. Matrix organizations have two kinds of manager. <strong>Solid-line<\/strong> reporting is the formal line manager who owns performance and compensation decisions; <strong>dotted-line<\/strong> reporting is a secondary, functional relationship without that authority. A regional finance analyst may report solid-line to the country manager and dotted-line to the regional finance head. Approval routing usually follows the solid line, and getting it wrong sends approvals to the wrong person — which surfaces immediately in user acceptance testing.<\/p>\n<h2>How HR is organized: the Ulrich model<\/h2>\n<p>Most large HR functions use the vocabulary of the <strong>Ulrich model<\/strong>, which splits HR into three parts. <strong>HR business partners (HRBPs)<\/strong> are embedded with a business division as its strategic HR contact; they bring requirements framed as business problems rather than system specifications, and translating those into configuration is the consultant's job. <strong>Centers of excellence (CoEs)<\/strong> are specialist teams owning policy in a domain — compensation and benefits, talent acquisition, learning, organization development. The CoE typically signs off design in its domain: if the consultant designs a grade structure, C&amp;B approves it. <strong>Shared services<\/strong>, or HR Operations, is the centralized team doing transactional work — payroll processing, data entry, first-line queries — for the whole organization.<\/p>\n<p>In Egypt, shared services usually means the classic Personnel and Payroll team (شؤون العاملين): the people who handle social-insurance forms, labour-office files and attendance. They know the statutory reality better than anyone else in the building. Their daily work is what the configuration automates, they are the consultant's main day-to-day counterparts, and treating them as low-level administrators is a serious mistake — they hold operational knowledge no document captures.<\/p>\n<p>Knowing the model lets a consultant work out who owns a decision and who merely has an opinion about it.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Conflating headcount and FTE.<\/li>\n<li>Building a turnover report before agreeing the definition.<\/li>\n<li>Redrawing the org chart instead of fixing manager data.<\/li>\n<li>Routing approvals along the dotted line.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Dave Ulrich, <em>Human Resource Champions<\/em> (1997) — the original three-part model.<\/li>\n<li>Oracle, <em>Using Global Human Resources<\/em> — manager hierarchies and organization charts. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"lifecycle","num":8,"track":"functional","title":"The Employment Lifecycle","sub":"Hire to exit — every event is a dated transaction with a payroll consequence","hue":26,"minutes":8,"labs":["lifecycle"],"terms":["probation","notice-period","resignation","termination","end-of-contract","final-settlement","end-of-service-benefit-eosb-gratuity"],"html":"<p>Every event in an employee's working life is, in Oracle, a dated transaction against the assignment, with an approver and a downstream payroll consequence. Thinking in those terms is the consultant's default mental mode. This chapter follows a worker from hire to exit and, because the rules are statutory, uses Egypt's Labour Law No. 14 of 2025 (in force since 1 September 2025) as the worked example; Chapter 10 has the fuller statutory detail and Chapter 17 the Gulf equivalents.<\/p>\n<h2>Probation<\/h2>\n<p><strong>Probation<\/strong> is an initial period during which either party may end the employment with lighter obligations than after confirmation. Under Law 14/2025 it is capped at three months, cannot be extended, and a worker may be placed on probation only once with the same employer; the clause must be written into the contract or it has no legal effect. In the system, probation end dates drive alerts and confirmation workflows. Where a client's contracts specify a longer probation, flag it — the clause may be invalid.<\/p>\n<h2>Notice<\/h2>\n<p>A <strong>notice period<\/strong> is the advance written warning either party must give before terminating an indefinite-term contract. The 2025 law makes written notice mandatory, counts the notice period as service, and requires full wage during it. Several law-firm summaries state a flat three months regardless of service; earlier commentary described two months under ten years and three above. This is exactly the kind of point to verify against the Arabic text of the statute or the client's legal counsel before configuring, and saying so is a strong professional answer, not a weak one.<\/p>\n<h2>Three exit routes that are not the same<\/h2>\n<p><strong>Resignation<\/strong> is employee-initiated. Under the 2025 law the resignation must be validated at the competent labour office, the employer must respond within a set period, and the employee may withdraw the resignation within a short window after acceptance. Resignation carries no severance, but unused annual leave is paid out. A process design that makes reversal impossible fails the withdrawal requirement.<\/p>\n<p><strong>Termination<\/strong> is employer-initiated, with or without cause. The distinction determines severance exposure. Egyptian law lists specific grounds permitting immediate dismissal, places the burden of proving misconduct on the employer, and imposes strict procedural requirements. Termination is a heavily approval-gated transaction in any implementation.<\/p>\n<p><strong>End of contract<\/strong> is a fixed-term contract reaching its expiry date — nobody terminates it; it lapses. Under Law 14/2025, if a fixed-term contract is renewed or the employee simply continues working after expiry, it converts automatically into an indefinite-term contract, which ends the old practice of rolling short renewals indefinitely. Contract-expiry alerts are a real client requirement, especially in the Gulf, where they combine with visa and permit expiry.<\/p>\n<p>Treating the three as one \"termination\" transaction is a design error: they have different downstream calculations.<\/p>\n<div class=\"lab-embed\" data-lab=\"lifecycle\"><\/div>\n\n<h2>The final settlement<\/h2>\n<p>The <strong>final settlement<\/strong> calculates everything owed to a leaver: final salary, unused leave payout, any severance or end-of-service benefit, minus outstanding deductions such as loans. It is the last payroll event for that person and the one most likely to be disputed. It is usually run as an off-cycle QuickPay and requires the absence balance, the loan balance and the termination date all to be right at the same time — a good practice exercise because it touches absence, payroll and lifecycle at once.<\/p>\n<p>The <strong>end-of-service benefit (EOSB)<\/strong>, or gratuity, is a statutory lump sum payable to departing employees in Gulf countries, calculated on length of service and final wage. Gulf labour law provides it in place of a state pension for expatriate workers, with country-specific formulas. Egypt does not have gratuity in the Gulf sense; its equivalent protection comes through the social-insurance system. Importing EOSB logic into an Egyptian design, or assuming Egypt has gratuity, is a classic cross-market error.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Extending probation \"by agreement\". Under the 2025 law it cannot be extended.<\/li>\n<li>Configuring notice rules from an English summary without verification.<\/li>\n<li>Designing a resignation process with no withdrawal path.<\/li>\n<li>Merging the three exit routes into one transaction.<\/li>\n<li>Building EOSB into an Egyptian payroll.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\". <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<li>Andersen Egypt, \"Egypt's New Labour Law No. 14 of 2025\". <a href=\"https://eg.andersen.com/egypts-labour-law-14-2025/\" target=\"_blank\" rel=\"noopener\">https://eg.andersen.com/egypts-labour-law-14-2025/<\/a><\/li>\n<li>Amereller, \"Egypt: New Labor Law No. 14 of 2025\". <a href=\"https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/\" target=\"_blank\" rel=\"noopener\">https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"egypt-payroll","num":9,"track":"functional","title":"Egypt: Social Insurance & Salary Tax","sub":"The mechanics Oracle does not ship — and the consultant's biggest differentiator","hue":4,"minutes":11,"labs":["insurance","tax"],"terms":["insurable-wage","social-insurance-contribution-rates","nosi","form-1-and-form-6","personal-exemption","progressive-tax-brackets","bracket-elimination-for-high-earners","martyrs-victims-fund-contribution","universal-health-insurance","minimum-wage-and-mandatory-annual-increment"],"html":"<p>Oracle does not deliver a pre-built, maintained Egyptian payroll localization the way it does for some markets. The implementation partner builds the statutory rules — in elements, balances and Fast Formulas (Chapter 12). A consultant who knows the Egyptian mechanics is therefore useful on day one in a way that one who only knows the product is not.<\/p>\n<blockquote>\n<p><strong>Every figure in this chapter moves.<\/strong> Insurable-wage limits rise each January under a fixed schedule; tax law changes by decree. The figures below were checked against PwC Worldwide Tax Summaries and statutory alerts in 2026. Re-verify against NOSI or the Egyptian Tax Authority before quoting them to a client.<\/p>\n<\/blockquote>\n<h2>Social insurance: the insurable wage<\/h2>\n<p>Egyptian social insurance is administered by <strong>NOSI<\/strong>, the National Organization for Social Insurance, under Law 148 of 2019. Contributions are not calculated on gross salary. They apply to the <strong>insurable wage<\/strong>: the portion of pay bounded by a statutory floor and ceiling. From 1 January 2026 the minimum is EGP 2,700 per month and the maximum EGP 16,700, up from EGP 2,300 and 14,500 in 2025. The limits rise 15% each January under a schedule that began in 2021, after which they are indexed to inflation.<\/p>\n<p>The <strong>contribution rates<\/strong> are fixed by law: employee 11%, employer 18.75%, total 29.75% of the insurable wage. At the 2026 ceiling the employee share caps at EGP 1,837.00 per month and the employer share at EGP 3,131.25 — whether the person earns EGP 20,000 or 200,000. Being able to compute a capped contribution in a workshop builds credibility fast, and \"contributions apply to full gross\" is the most common calculation error in Egyptian payroll.<\/p>\n<div class=\"lab-embed\" data-lab=\"insurance\"><\/div>\n\n<p>Registration is form-driven. <strong>Form 1<\/strong> is filed with social insurance on hiring and <strong>Form 6<\/strong> on termination; the Personnel team handles them, and a standard Oracle implementation does not generate them unless someone builds the output. Two smaller statutory items belong in every Egyptian element inventory: the <strong>Martyrs and Victims Fund<\/strong> deduction of 0.05% of gross pay, and <strong>universal health insurance<\/strong> (employer 3.25%, employee 1%), which applies only in governorates where the scheme has been rolled out — confirm the client's governorate rather than assuming.<\/p>\n<h2>The minimum wage and the mandatory increment<\/h2>\n<p>The private-sector <strong>minimum wage<\/strong> is EGP 7,000 per month, and it is defined to include the employer's social-insurance share rather than sit beneath it. Law 14/2025 also requires an <strong>annual increment<\/strong> of at least 3% of the social-insurance wage. Because the base is the insurable wage, not total salary, the increment is effectively capped at 3% of the ceiling for higher earners. Calculating it on full gross is the classic error.<\/p>\n<h2>Salary tax: annual, progressive, exemption-adjusted<\/h2>\n<p>Salary tax is calculated annually and then divided across the year — the monthly figure is a derived slice, not an independent calculation. The formula: gross, less the <strong>personal exemption<\/strong>, less the employee's social-insurance contribution, equals net taxable income. Law No. 7 of 2024 raised the personal exemption from EGP 15,000 to <strong>EGP 20,000<\/strong> a year, for residents and non-residents alike, widened the zero-rated band to EGP 40,000, and introduced a top rate of 27.5%.<\/p>\n<p>The <strong>progressive brackets<\/strong> on annual net taxable income are: 0% to EGP 40,000; 10% to 55,000; 15% to 70,000; 20% to 200,000; 22.5% to 400,000; 25% to 1,200,000; and 27.5% above that.<\/p>\n<h2>Bracket elimination for high earners<\/h2>\n<p>Egypt adds a rule most payroll calculators ignore. As net taxable income rises past defined thresholds, access to the lower bands is progressively removed, so that the income which would have been taxed at 0% or 10% is taxed at the next surviving rate instead. Above EGP 600,000 the zero band disappears; above 700,000 the 10% band also goes; the pattern continues through 800,000 and 900,000 until, above EGP 1,200,000, only the 25% and 27.5% bands remain. Deloitte's summary of Law 7/2024 presents exactly this as a table of bracket applications by total-income level.<\/p>\n<p>A naive progressive calculation that applies every band to every employee is wrong for senior staff — precisely the people who notice. If a consultant builds or validates an Egyptian tax formula, this rule is a correctness requirement.<\/p>\n<div class=\"lab-embed\" data-lab=\"tax\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Applying contributions to gross instead of the capped insurable wage.<\/li>\n<li>Quoting last year's limits. They change every January.<\/li>\n<li>Calculating the 3% increment on total salary.<\/li>\n<li>Treating tax as a flat monthly percentage.<\/li>\n<li>Omitting the Martyrs Fund and health-insurance lines, then finding the gap in parallel run.<\/li>\n<li>Ignoring bracket elimination.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>PwC Worldwide Tax Summaries, Egypt — \"Taxes on personal income\" and \"Other taxes\". <a href=\"https://taxsummaries.pwc.com/egypt/individual/taxes-on-personal-income\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/taxes-on-personal-income<\/a> · <a href=\"https://taxsummaries.pwc.com/egypt/individual/other-taxes\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/other-taxes<\/a><\/li>\n<li>Mercans statutory alert, \"Egypt: Minimum and Maximum Insurable Wage Limits Increase for Social Insurance from 2026\". <a href=\"https://mercans.com/resources/statutory-alerts/egypt-minimum-and-maximum-insurable-wage-limits-increase-for-social-insurance-from-2026/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/resources/statutory-alerts/egypt-minimum-and-maximum-insurable-wage-limits-increase-for-social-insurance-from-2026/<\/a><\/li>\n<li>Deloitte Middle East, \"Amendment to tax brackets and annual personal exemption\" (Law 7/2024). <a href=\"https://www.deloitte.com/middle-east/en/services/tax/perspectives/amendment-to-tax-brackets-and-annual-personal-exemption.html\" target=\"_blank\" rel=\"noopener\">https://www.deloitte.com/middle-east/en/services/tax/perspectives/amendment-to-tax-brackets-and-annual-personal-exemption.html<\/a><\/li>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\" (annual increment). <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"egypt-leave","num":10,"track":"functional","title":"Egypt: Leave Under Labour Law 14/2025","sub":"The statutory entitlements that become absence plans","hue":16,"minutes":6,"labs":["leave"],"terms":["egyptian-annual-leave-entitlement","casual-leave","sick-leave","maternity-leave"],"html":"<p>Labour Law No. 14 of 2025 replaced the 2003 law and took effect on 1 September 2025. Its leave provisions are the direct input to absence-plan design (Chapter 6). This chapter states the entitlements and the design implications; the exit and probation rules live in Chapter 8.<\/p>\n<h2>Annual leave: a ladder by service and age<\/h2>\n<p>The statutory ladder is 15 days during the first year of service (pro-rated where service exceeds six months but is under a year); 21 days from the second year; 30 days for workers with ten years of service or aged over 50; 45 days for persons with disabilities; plus 7 additional days for hazardous, arduous or remote-area work. Annual leave excludes official and weekly holidays.<\/p>\n<p>Two further rules shape the plan. The worker must take at least 15 days a year, including six consecutive days, and the employer must settle the leave balance or pay its cash equivalent at least every three years. These translate into carryover and expiry configuration and into leave-encashment logic on exit. The best practice exercise for accrual bands is to build this ladder and then test the two boundary cases: the person crossing ten years mid-year and the person turning fifty mid-year.<\/p>\n<h2>Casual leave<\/h2>\n<p><strong>Casual leave<\/strong> covers unforeseen circumstances: a maximum of 7 days per year (up from 6 under the old law), no more than 2 consecutive days at a time, and — the detail that gets missed in design and surfaces in UAT — counted within the annual-leave entitlement rather than on top of it.<\/p>\n<figure class=\"fig-embed\" data-fig=\"egypt-leave-ladder\"><\/figure>\n\n<h2>Sick leave<\/h2>\n<p><strong>Sick leave<\/strong> is paid at rates that vary by duration and is governed by the social-insurance law: for generally insured workers, 75% of the insurable wage for the first 90 days and 85% thereafter, up to 180 days in the same calendar year, subject to medical certification. Industrial establishments have a stronger schedule under labour law, and employers offset amounts already paid by NOSI. In Oracle this is a textbook qualification plan with payment bands.<\/p>\n<h2>Maternity and paternity<\/h2>\n<p><strong>Maternity leave<\/strong> is four months paid, capped at three occurrences during the employee's service, with no minimum-service condition. The \"three times in service\" cap must be enforced in configuration, not merely documented. Fathers receive one paid day on the date of birth, up to three times, and it is not deducted from annual leave. The law also provides unpaid childcare leave of up to two years, up to three times, in establishments of fifty or more employees.<\/p>\n<div class=\"lab-embed\" data-lab=\"leave\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Building annual leave as a flat 21 days.<\/li>\n<li>Putting casual leave on top of annual leave.<\/li>\n<li>Treating sick leave as an accrual plan.<\/li>\n<li>Documenting the maternity cap without enforcing it.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>EY, \"Egypt enacts new labor law affecting employers from 1 September 2025\". <a href=\"https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025\" target=\"_blank\" rel=\"noopener\">https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025<\/a><\/li>\n<li>Andersen Egypt, \"Egypt's New Labour Law No. 14 of 2025\". <a href=\"https://eg.andersen.com/egypts-labour-law-14-2025/\" target=\"_blank\" rel=\"noopener\">https://eg.andersen.com/egypts-labour-law-14-2025/<\/a><\/li>\n<li>Amereller, \"Egypt: New Labor Law No. 14 of 2025\". <a href=\"https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/\" target=\"_blank\" rel=\"noopener\">https://amereller.com/publication/egypt-new-labor-law-no-14-of-2025/<\/a><\/li>\n<li>PwC Worldwide Tax Summaries, Egypt — \"Other taxes\" (sick-leave compensation under the social-insurance law). <a href=\"https://taxsummaries.pwc.com/egypt/individual/other-taxes\" target=\"_blank\" rel=\"noopener\">https://taxsummaries.pwc.com/egypt/individual/other-taxes<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"hdl","num":11,"track":"technical","title":"Loading Data: HCM Data Loader","sub":"The highest-value technical skill a functional consultant can arrive with","hue":198,"minutes":9,"labs":["hdl"],"terms":["hdl-hcm-data-loader","hsdl-hcm-spreadsheet-data-loader","source-system-key-vs-person-number"],"html":"<p>In Oracle HCM, \"functional\" consultants are expected to be mildly technical. On real projects, bulk data loads land on strong functional people, and many avoid them. <strong>HCM Data Loader (HDL)<\/strong> is Oracle's bulk loading tool: nobody hand-enters ten thousand employees, so data migration and mass updates run through it. Comfort with HDL makes a consultant useful immediately.<\/p>\n<h2>The shape of a load<\/h2>\n<p>A load is one or more <code>.dat<\/code> files, zipped flat (no folders) and uploaded. Each file holds data for a single business object and is named for it: <code>Worker.dat<\/code>, <code>Job.dat<\/code>, <code>Grade.dat<\/code>, <code>ElementEntry.dat<\/code>. HDL decompresses the zip, imports the data lines into staging tables, groups them into business objects, and then loads them.<\/p>\n<p>Inside a file there are two kinds of instruction line, both pipe-delimited. A <strong>METADATA<\/strong> line declares the columns for a component: the keyword, then the discriminator (which component the line describes), then the attribute names. <strong>MERGE<\/strong> lines carry the data in the same order; MERGE creates the record if it does not exist and updates it if it does. <strong>DELETE<\/strong> removes a record.<\/p>\n<pre><code>METADATA|JobFamily|JobFamilyCode|JobFamilyName|EffectiveStartDate|EffectiveEndDate\nMERGE|JobFamily|SALES|Sales|2000/01/01|4712/12/31\n<\/code><\/pre>\n<p>That creates a job family coded SALES, effective from 1 January 2000. The end date <code>4712/12/31<\/code> is Oracle's conventional \"end of time\"; it appears everywhere. Dates use <code>YYYY/MM/DD<\/code>. A <code>Worker.dat<\/code> continues with further METADATA and MERGE pairs for PersonName, PersonNationalIdentifier, PersonEmail, WorkRelationship and Assignment — all components of the same worker hierarchy, in one file.<\/p>\n<h2>The rules that get files rejected<\/h2>\n<p>The METADATA line must appear before the MERGE or DELETE lines it relates to. A file may contain several METADATA lines, but each must be for a different component — two Job METADATA lines in one file is invalid. Each MERGE line must contain the same attributes as its METADATA line, in the same order, so a pipe-count mismatch fails the line. Attribute names are case-sensitive. Files should be UTF-8 without a byte-order mark.<\/p>\n<h2>Keys: what makes a migration reconcilable<\/h2>\n<p>HDL identifies records three ways. <strong>Source keys<\/strong> use <code>SourceSystemOwner<\/code> plus <code>SourceSystemId<\/code> to identify a record by its origin in the legacy system; if used, both must appear in the METADATA line. <strong>User keys<\/strong> identify by natural business keys such as <code>JobFamilyCode<\/code>. Oracle also generates its own surrogate IDs internally. A person's Oracle identifier is the <strong>person number<\/strong>; the source system key is what links that record back to the legacy one.<\/p>\n<p>The choice matters after the load, not during it. Source keys are what let a team trace every Oracle record to its legacy origin and explain every variance in reconciliation. Getting them right makes reconciliation possible; getting them wrong makes it nearly impossible, and data conversion is routinely the thing that delays a go-live.<\/p>\n<h2>Referencing other objects and ordering the load<\/h2>\n<p>To point at a foreign object, the attribute is named with the key type in brackets — <code>JobFamilyId(SourceSystemId)<\/code>, <code>PersonId(SourceSystemId)<\/code>. That is how child components attach to their parents. Several <code>.dat<\/code> files can go in one zip; HDL imports them in parallel but loads them sequentially, so referenced data must exist before it is referenced: job families before jobs, grades and jobs before assignments, people before work relationships.<\/p>\n<div class=\"lab-embed\" data-lab=\"hdl\"><\/div>\n\n<h2>HSDL: the spreadsheet cousin<\/h2>\n<p><strong>HCM Spreadsheet Data Loader (HSDL)<\/strong> is a spreadsheet interface over the same loading framework, aimed at business users. HDL is for bulk migration by the project team; HSDL is for ongoing, business-user-facing mass updates after go-live.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Two METADATA lines for the same component in one file.<\/li>\n<li>MERGE attributes out of order relative to METADATA.<\/li>\n<li>Wrong date format (<code>MM/DD/YYYY<\/code> corrupts silently).<\/li>\n<li>Loading children before parents.<\/li>\n<li>Choosing user keys for a migration that will need reconciling.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>HCM Data Loading Business Objects<\/em> — \"Data File Instructions and Delivery\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21b/faihm/data-file-instructions-and-delivery.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21b/faihm/data-file-instructions-and-delivery.html<\/a><\/li>\n<li>Oracle tutorial, \"Create and Maintain Data with HCM Data Loader\". <a href=\"https://docs.oracle.com/en/cloud/saas/tutorial-hdl-load-files/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/tutorial-hdl-load-files/<\/a><\/li>\n<li>HCM Tables, \"HCM Data Loader (HDL) Complete Guide — .dat File Format, Templates &amp; Troubleshooting\". <a href=\"https://hcm-tables.com/blog/hdl-data-loader-guide\" target=\"_blank\" rel=\"noopener\">https://hcm-tables.com/blog/hdl-data-loader-guide<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"ff","num":12,"track":"technical","title":"Fast Formula","sub":"Oracle's rule language — learn it by reading, not by studying grammar","hue":330,"minutes":7,"labs":["ff"],"terms":["fast-formula"],"html":"<p>Statutory rules vary too much across countries to hard-code, so Oracle exposes a rule layer. <strong>Fast Formula<\/strong> is a simple expression language for calculations, validations and rules, written in near-English rather than a full programming language. In payroll it computes rates and amounts; in absence it drives accrual rules; elsewhere it handles eligibility and defaulting. Because Oracle ships no maintained Egyptian localization, Egyptian social-insurance and tax calculations are built here — and it may be the functional consultant who writes them.<\/p>\n<h2>The four sections<\/h2>\n<p>Most formulas follow one shape: declare inputs, set defaults, run the logic, return a value. Oracle does not strictly enforce the order, but following it avoids errors.<\/p>\n<pre><code>INPUTS ARE BASIC_SALARY\nDEFAULT FOR BASIC_SALARY IS 0\nIF BASIC_SALARY &gt; 35000 THEN\n  SPECIAL_ALLOWANCE = 2500\nELSE\n  SPECIAL_ALLOWANCE = 0\nRETURN SPECIAL_ALLOWANCE\n<\/code><\/pre>\n<p>If a consultant can read this, they can read most delivered formulas.<\/p>\n<h2>Where values come from<\/h2>\n<p>Values reach a formula three ways: as inputs passed at runtime, as database items read from the database, or as global values. Inputs are declared with <code>INPUTS ARE<\/code>, and the name must match the element input value exactly, with words joined by underscores. Database items are referenced by name, and the system supplies most of the ones needed. Oracle's own guidance is to prefer <code>INPUTS<\/code> over database items where possible, because inputs do not require a database read and therefore speed up the payroll run — a detail worth saying in an interview.<\/p>\n<h2>Formula types and contexts<\/h2>\n<p>Every formula has a type that determines which inputs and contexts are available to it, and a formula written for one context will not work in another. This is why the language cannot be learned in the abstract: the same syntax behaves differently depending on where it runs. The practical approach is to read delivered formulas of the type being built and adapt them.<\/p>\n<p>Statements worth recognizing on sight: <code>DEFAULT FOR<\/code> sets a fallback where a value could be null; <code>ALIAS<\/code> shortens an unwieldy database-item name; and formulas call other formulas with <code>SET_INPUT<\/code>, <code>EXECUTE<\/code> and <code>GET_OUTPUT<\/code>, which is how common calculations are factored out instead of writing one enormous formula. Comments sit inside <code>/* */<\/code>.<\/p>\n<h2>A real rule, written out<\/h2>\n<p>The Egyptian employee social-insurance contribution (Chapter 9) makes a good first formula: take the wage as an input, cap it at the ceiling, floor it at the minimum, and return 11% of the result. The order matters — cap and floor first, then the rate.<\/p>\n<div class=\"lab-embed\" data-lab=\"ff\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating Fast Formula as a programming language to master up front. Approach it through examples.<\/li>\n<li>Reading database items when an input would do.<\/li>\n<li>Copying a formula across types and expecting it to run.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Fast Formula Guide<\/em> (Cloud). <a href=\"https://docs.oracle.com/cloud/131/user_services/OAPFF/F823032AN112EA.htm\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/cloud/131/user_services/OAPFF/F823032AN112EA.htm<\/a><\/li>\n<li>Oracle, <em>Implementing Absence Management<\/em> — \"Formulas for Absence Management\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/20b/oapff/formulas-for-absence-management.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/20b/oapff/formulas-for-absence-management.html<\/a><\/li>\n<li>Salma Rawashdeh, \"Understanding Fast Formulas in Oracle HCM: A Guide with Examples\". <a href=\"https://medium.com/@islamrwashdeh/understanding-fast-formulas-in-oracle-hcm-a-guide-with-examples-e54e452501cc\" target=\"_blank\" rel=\"noopener\">https://medium.com/@islamrwashdeh/understanding-fast-formulas-in-oracle-hcm-a-guide-with-examples-e54e452501cc<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"reporting","num":13,"track":"technical","title":"Reporting & Integration","sub":"OTBI, BI Publisher, HCM Extract, REST — four ways out, and when each is right","hue":186,"minutes":9,"labs":["reporting"],"terms":["otbi","subject-area","bi-publisher-bip","bursting","hcm-extract","rest-api"],"html":"<p>There is no SQL Developer connection to a SaaS pod. When someone asks how to get data out of Oracle HCM, the complete answer names four paths and a reason for each: OTBI for ad-hoc analysis, BI Publisher for formatted output and complex SQL, HCM Extract for scheduled or large-volume outbound files, and REST for real-time integration.<\/p>\n<h2>OTBI: self-service against live data<\/h2>\n<p><strong>Oracle Transactional Business Intelligence (OTBI)<\/strong> is ad-hoc reporting and analysis directly against live HCM data, built by dragging fields rather than writing SQL. It works through <strong>subject areas<\/strong>: pre-built, governed logical data models — think of them as pre-joined tables exposed as folders and columns — each covering a business domain at a fixed grain. Names follow a pattern of functional area, then grain, then \"Real Time\": <em>Workforce Management — Worker Assignment Real Time<\/em>, <em>Workforce Management — Person Real Time<\/em>, <em>Payroll — Payroll Run Results Real Time<\/em>. Reading the name tells you the grain before you open it, and \"Real Time\" areas give a current snapshot while \"Trend\" areas give data across periods.<\/p>\n<p>Choosing the right subject area is most of the work, and choosing wrong is the number-one cause of reports that return wrong numbers rather than errors. Date-effective tables multiply rows; multiple assignments double-count people unless filtered to the primary, latest record.<\/p>\n<p>Three constraints catch people. Two subject areas cannot be joined in a single analysis. There is a default row limit — commonly cited around 65,000 — past which OTBI can truncate silently. And subject areas are predefined; their grain cannot be changed. When one subject area is not enough there are three workarounds: a Combined Analysis joining two analyses on a shared key such as person number; moving to BI Publisher and writing the SQL; or an HCM Extract for genuinely large volumes.<\/p>\n<h2>BI Publisher: pixel-controlled documents<\/h2>\n<p><strong>BI Publisher (BIP)<\/strong> has two pieces: a data model, which is genuinely SQL against the reporting schema, and a template, which controls layout. Together they produce documents with exact formatting — payslips, salary certificates, statutory forms, letters — and they can be scheduled and delivered. <strong>Bursting<\/strong> splits one report run into many individual outputs, each delivered separately; it is the mechanism by which thousands of payslips from one payroll run are emailed to the right people, and it is the standard follow-up question after any BIP question.<\/p>\n<p>BIP is more flexible than OTBI and slower to build: it demands stronger SQL, an understanding of entity relationships, manual data-security setup and template development. Reach for it when OTBI genuinely cannot do the job, not by default.<\/p>\n<p>The decision rule, memorized: ad-hoc analysis, dashboards and quick operational lists go to OTBI; formatted, printable, per-employee and statutory documents go to BI Publisher. Using OTBI for a payslip or BIP for a quick headcount list are both wrong answers in an interview.<\/p>\n<h2>Extract and REST: the integration boundary<\/h2>\n<p><strong>HCM Extract<\/strong> pulls HCM data on a schedule and delivers it to an external system — banks, benefits providers, government portals. It supports changes-only extracts, sending only what has changed since the last run, and it is the right tool when a data volume is too large for OTBI. The <strong>REST API<\/strong> is Oracle's web-service interface for programmatic read and write access, used where a scheduled file would be too slow: recruitment platforms, identity systems, custom applications.<\/p>\n<p>The honest boundary for a functional consultant: HDL, simple formulas, OTBI and basic BIP are routinely expected. Oracle Integration Cloud (OIC) integrations and complex BIP development are where the genuine hand-off to a technical team happens.<\/p>\n<div class=\"lab-embed\" data-lab=\"reporting\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Using OTBI for a payslip, or BIP for a quick list.<\/li>\n<li>Trusting a large OTBI result without checking the row limit.<\/li>\n<li>Picking a subject area by name without checking its grain.<\/li>\n<li>Assuming direct database access exists.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Creating and Administering Analytics and Reports for HCM<\/em> — \"HCM Subject Areas for Transactional Business Intelligence\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/fahca/hcm-subject-areas-for-transactional-business-intelligence.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/fahca/hcm-subject-areas-for-transactional-business-intelligence.html<\/a><\/li>\n<li>HCM Tables, \"Oracle Fusion HCM OTBI Subject Areas — Complete Guide with Decision Tree\". <a href=\"https://www.hcm-tables.com/blog/otbi-subject-area-guide\" target=\"_blank\" rel=\"noopener\">https://www.hcm-tables.com/blog/otbi-subject-area-guide<\/a><\/li>\n<li>Hexstream, \"Oracle Fusion OTBI vs BI Publisher\". <a href=\"https://www.hexstream.com/tech-corner/oracle-fusion-otbi-vs-bi-publisher\" target=\"_blank\" rel=\"noopener\">https://www.hexstream.com/tech-corner/oracle-fusion-otbi-vs-bi-publisher<\/a><\/li>\n<li>SplashBI, \"How To Join Two Subject Areas in OTBI\". <a href=\"https://splashbi.com/blog/cross-subject-area-otbi-reporting/\" target=\"_blank\" rel=\"noopener\">https://splashbi.com/blog/cross-subject-area-otbi-reporting/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"extend","num":14,"track":"technical","title":"Extending Without Customizing","sub":"Flexfields, lookups, value sets, sandboxes — the answer to \"can you add a field?\"","hue":262,"minutes":6,"labs":[],"terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code","value-set","sandbox","journey","redwood","quarterly-update-26a-26d"],"html":"<p>Every client needs a field Oracle did not ship, an option Oracle did not put in a dropdown, and a screen that behaves slightly differently for one group of users. In a SaaS product none of that can be done by changing code. Oracle's answer is a set of configuration tools that survive upgrades, and the correct response to most \"can you add…\" requests is one of them.<\/p>\n<h2>Descriptive flexfields<\/h2>\n<p>A <strong>descriptive flexfield (DFF)<\/strong> is a configurable extra field added to a standard object without customization: an equipment number, a badge colour, a union membership number. Because it is configuration rather than code, it survives every quarterly update. A <strong>value set<\/strong> constrains what a flexfield segment can accept — free-text fields become dirty data, so value sets enforce validity and are used together with DFFs to control input.<\/p>\n<h2>Lookups<\/h2>\n<p><strong>Lookup types<\/strong> and <strong>lookup codes<\/strong> are configurable lists of values powering dropdowns across the application: contract types, reasons for leaving, nationality lists. They are usually the right answer to \"can we add an option to this dropdown?\"<\/p>\n<h2>The three-thought habit<\/h2>\n<p>When a client says \"we need an extra field for X\", the first three thoughts should be: DFF (where does the data live), lookup (should it be a controlled list), and approvals (what should the workflow do about it). Saying that sequence aloud in a workshop or interview is a strong signal. For example: recording which company car each manager has is a DFF on the assignment with a value set; a new resignation reason called \"Further Study\" is a lookup code; hiding the grade field on the transfer form for non-managers is a page-level change made in a sandbox.<\/p>\n<figure class=\"fig-embed\" data-fig=\"extension-ladder\"><\/figure>\n\n<h2>Sandboxes and publishing<\/h2>\n<p>A <strong>sandbox<\/strong> is an isolated workspace for making and testing configuration changes — page layouts, flexfields — before publishing them to the live environment. Publishing a sandbox is the moment a change becomes real for every user: a controlled, deliberate step, not an autosave.<\/p>\n<h2>Journeys, Redwood and the quarterly cycle<\/h2>\n<p>A <strong>journey<\/strong> is a configurable checklist of tasks assigned to a person around an event — onboarding, transfer, offboarding — covering the many small tasks across several people that otherwise get missed: equipment, badge, policy acknowledgements, document uploads. It is a visible, client-pleasing feature and a good thing to demonstrate.<\/p>\n<p><strong>Redwood<\/strong> is Oracle's current user-experience design system, progressively replacing older pages; a large and growing share of new capability, including Oracle's AI features, is built on it. Recognition-level awareness is enough, but describing the product only in terms of the classic interface sounds a release behind.<\/p>\n<p>Fusion applications update on a fixed <strong>quarterly cycle<\/strong>, named by year and letter — 26A, 26B, 26C, 26D. Updates are mandatory and scheduled; each brings features that are enabled by default or require opt-in, and regression testing around updates is a standing client obligation. Handling a quarterly update well after go-live is where consultants build reputations.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Promising a \"customization\". In SaaS, it is a DFF, a lookup, or a page change.<\/li>\n<li>Adding a free-text field without a value set.<\/li>\n<li>Forgetting that nothing in a sandbox is real until it is published.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Configuring and Extending Applications<\/em> — flexfields, lookups, value sets, sandboxes. <a href=\"https://docs.oracle.com/en/cloud/saas/applications-common/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/applications-common/<\/a><\/li>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — journeys. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigh/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigh/<\/a><\/li>\n<li>Oracle Cloud Applications readiness site — quarterly update naming and opt-in features. <a href=\"https://www.oracle.com/readiness/\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/readiness/<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"security","num":15,"track":"technical","title":"The Security Model","sub":"What you can do versus whose data you can see","hue":300,"minutes":6,"labs":["security"],"terms":["job-role","abstract-role","duty-role","data-role-and-security-profile","area-of-responsibility-aor"],"html":"<p>Security determines who can see and do what. A consultant needs conceptual fluency rather than deep architecture skill, but the vocabulary appears in almost every requirements workshop, and one distinction carries most of it: function versus data scope.<\/p>\n<h2>Role types<\/h2>\n<p>Oracle's documentation defines five role types. A <strong>job role<\/strong> represents the specific job a worker does in the enterprise — Human Resource Analyst, Payroll Manager — and is the most-discussed role type in requirements sessions. An <strong>abstract role<\/strong> represents a worker's role independently of any job: the predefined Employee, Contingent Worker and Line Manager roles, which grant baseline self-service access to everyone in the system. A <strong>duty role<\/strong> is a logical grouping of function privileges — the granular building block from which job and abstract roles are composed; duty roles are never assigned directly to users. Aggregate privileges combine a task's function privilege with its data-security policy and are predefined and non-editable.<\/p>\n<h2>Data scope: security profiles and data roles<\/h2>\n<p>Where a job role says what a user can do, a <strong>security profile<\/strong> says which records they can do it to. Profiles scope data by person, organization, position, legislative data group, payroll and other criteria. A <strong>data role<\/strong> combines a job role with the security profiles that define its scope — Oracle's example is \"Country Human Resource Specialist\": the HR specialist job plus a country's data. An HR specialist in Egypt and one in Saudi Arabia hold the same job role and see the same screens; their security profiles differ, so neither sees the other country's records. Same function, different scope.<\/p>\n<h2>Areas of responsibility<\/h2>\n<p>An <strong>area of responsibility (AOR)<\/strong> assigns responsibility for a defined population — \"this HR representative is responsible for the Alexandria plant\" — and is used to drive both access and routing without building a custom role for every combination. It is increasingly the preferred mechanism for scoping HR representative access.<\/p>\n<div class=\"lab-embed\" data-lab=\"security\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Answering a data-visibility question with a job role.<\/li>\n<li>Assigning duty roles to users. They are components, not assignments.<\/li>\n<li>Building one custom role per department when an AOR would do.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Securing HCM<\/em> — \"Which are the role types in HCM Cloud?\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faqas/which-are-the-role-types-in-hcm-cloud.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faqas/which-are-the-role-types-in-hcm-cloud.html<\/a><\/li>\n<li>Oracle, <em>Securing HCM<\/em> — \"HCM Data Roles and Security Profiles\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21c/ochus/hcm-data-roles-and-security-profiles.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21c/ochus/hcm-data-roles-and-security-profiles.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"method","num":16,"track":"functional","title":"Implementation Methodology","sub":"How projects actually run — and where the real finish line is","hue":62,"minutes":8,"labs":["method"],"terms":["fit-gap-analysis","crp-conference-room-pilot","sit-system-integration-testing","uat-user-acceptance-testing","cutover","freeze-period","hypercare","reconciliation","configuration-workbook","test-script","raid-log","change-request","oracle-true-cloud-method"],"html":"<p>This is the vocabulary of how projects are delivered. Trainers and interviewers use it constantly, and using it correctly makes a consultant sound like someone who has been on a project rather than someone who has read about one. Oracle's current methodology for Fusion Cloud projects is the <strong>Oracle True Cloud Method<\/strong>, successor to older methodologies such as AIM — whose document codes still appear in conversation: BR100 for setup documents, MD050 for functional designs, TE040 for test scripts.<\/p>\n<h2>From requirements to design<\/h2>\n<p>A <strong>fit-gap analysis<\/strong> compares client requirements against delivered functionality and documents where the product fits, where it does not, and what will be done about each gap: configure, work around, extend, or descope. It is the foundation of scope and the reference point for every later argument about what was agreed. The <strong>configuration workbook<\/strong> — usually a large structured spreadsheet — records every configuration decision and its agreed values; it is the record of what was built and why, and the basis for rebuilding it in the next environment.<\/p>\n<p>Clients cannot validate a design from a document. A <strong>conference room pilot (CRP)<\/strong> is a structured demonstration of the configured system to the client, using their own data and scenarios, usually run in iterations — CRP1, CRP2 — with feedback incorporated between them.<\/p>\n<h2>Testing<\/h2>\n<p><strong>System integration testing (SIT)<\/strong> checks that the configured system works end to end, including integrations with other systems; individual pieces working does not mean the chain works. It is executed by the project team before handing over to the client for <strong>user acceptance testing (UAT)<\/strong>, in which the client executes agreed <strong>test scripts<\/strong> — step-by-step documents defining what to do, what data to use and what result to expect. Each requirement should be traceable to at least one script; testing without scripts is clicking, not testing. On functional projects the consultant writes the scripts and often helps execute them, and UAT failures land on the configuration.<\/p>\n<h2>Cutover and go-live<\/h2>\n<p><strong>Cutover<\/strong> is the sequenced set of activities moving the client from the legacy system to the new one: final data loads, reconciliation, a <strong>freeze period<\/strong> during which no changes are permitted in the legacy system so that migration runs against a stable base, and go/no-go decisions. Go-live is not a moment but an ordered plan with dependencies and rollback points. <strong>Reconciliation<\/strong> — comparing outputs between two systems or two runs and explaining every difference — is central to both data migration and the parallel payroll run; an unexplained difference is a defect until proven otherwise.<\/p>\n<p><strong>Hypercare<\/strong> is the intensive support period immediately after go-live, with heightened staffing and response times, typically covering the first one or two live payroll runs. The first live cycles surface problems no amount of testing catches. Hypercare and the first live payroll — not the go-live date — are the actual finish line.<\/p>\n<div class=\"lab-embed\" data-lab=\"method\"><\/div>\n\n<h2>Governance<\/h2>\n<p>Running alongside all of it: the <strong>RAID log<\/strong>, a single visible home for risks, assumptions, issues and dependencies, reviewed in regular governance meetings; and the <strong>change request<\/strong>, the formal mechanism by which \"can you just add…\" becomes a managed decision with its impact on time and cost assessed. Learning to recognize a change request when it is spoken in a workshop — before agreeing to it — protects both the project and the consultant.<\/p>\n<p>One principle underlies the whole method: consultants do not design the best system; they get decisions made and documented. The client owns the design.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating testing as the QA team's job.<\/li>\n<li>Skipping the freeze and migrating a moving target.<\/li>\n<li>Calling go-live the finish.<\/li>\n<li>Agreeing to scope changes in a workshop without a change request.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Oracle True Cloud Method<\/em> overview (Oracle Consulting). <a href=\"https://www.oracle.com/consulting/\" target=\"_blank\" rel=\"noopener\">https://www.oracle.com/consulting/<\/a><\/li>\n<li>Intellicept, \"Oracle ERP Cloud Implementation Phases | Detailed Explanation\". <a href=\"https://intellicept.com/oracle-erp-cloud-implementation-phases-explained\" target=\"_blank\" rel=\"noopener\">https://intellicept.com/oracle-erp-cloud-implementation-phases-explained<\/a><\/li>\n<li>Jade Global, \"Oracle Cloud Implementation Methodology\". <a href=\"https://www.jadeglobal.com/oracle/methodology/jadecloud-implementation-methodology\" target=\"_blank\" rel=\"noopener\">https://www.jadeglobal.com/oracle/methodology/jadecloud-implementation-methodology<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"gulf","num":17,"track":"functional","title":"Saudi Arabia & the Gulf","sub":"The systems named in every Saudi job posting","hue":130,"minutes":8,"labs":[],"terms":["gosi","qiwa","mudad","nitaqat-saudization","wps-and-sif-file","iqama-and-visa-linked-employment-data","end-of-service-benefit-eosb-gratuity"],"html":"<p>Saudi job postings name specific government platforms, and knowing them separates a candidate from those who only know Oracle's generic Gulf localization. This chapter covers the systems, the numbers that matter, and the ways a Saudi implementation differs structurally from an Egyptian one.<\/p>\n<blockquote>\n<p><strong>Figures move here too.<\/strong> Saudi social-insurance rates are being phased up under the 2024 reform, and platform rules change by ministerial decision. Verify against GOSI and the Ministry of Human Resources and Social Development before configuring.<\/p>\n<\/blockquote>\n<h2>GOSI: social insurance with two populations<\/h2>\n<p>The <strong>General Organization for Social Insurance (GOSI)<\/strong> is the Saudi counterpart to Egypt's NOSI. The structural difference from Egypt is that contribution treatment depends on nationality. For Saudi nationals registered before the new Social Insurance Law took effect on 3 July 2024, the combined rate is 21.5% of the contributable wage — employee 9.75% (9% pension plus 0.75% SANED unemployment insurance), employer 11.75% (9% pension, 2% occupational hazards, 0.75% SANED). Nationals registered on or after that date fall under a phased schedule that rises from 22.5% to 23.5% combined from 1 July 2026, with further annual steps and a retirement age of 65. Expatriates carry only the employer-paid 2% occupational-hazards contribution — no pension, no SANED. The contributable wage is basic salary plus housing allowance, capped at SAR 45,000 per month; transport, commission and bonuses are excluded.<\/p>\n<figure class=\"fig-embed\" data-fig=\"gosi-populations\"><\/figure>\n\n<p>For an Oracle design this means nationality is a payroll-driving attribute, GOSI registration dates matter, and the element inventory needs separate treatment for the two populations.<\/p>\n<figure class=\"fig-embed\" data-fig=\"contributable-wage\"><\/figure>\n\n<h2>Qiwa, Mudad and the Wage Protection System<\/h2>\n<p><strong>Qiwa<\/strong> is the Ministry of Human Resources' digital labour platform: employment contracts are authenticated through it, and it handles work permits and establishment services. <strong>Mudad<\/strong> is the platform supporting wage protection and payroll compliance. The <strong>Wage Protection System (WPS)<\/strong> requires employers to pay salaries through official banking channels and to upload monthly payroll documentation — the <strong>SIF<\/strong> (Salary Information File) — containing each employee's ID or iqama number, basic salary, allowances, deductions and net pay. The system matches the file against actual bank transfers; when they match, the employee is legally considered paid.<\/p>\n<p>Compliance is enforced through consequences: late files escalate from a minor violation to a partial freeze of Qiwa services, and after three months to the employee's right to transfer sponsorship without consent. The three platforms must agree: the basic salary in the Qiwa contract must equal the basic salary in Mudad and in GOSI, so salary changes have to land on all three at once. In Oracle terms, the payment process (Chapter 5) produces the WPS file, and a Gulf go-live always includes a bank-file test with the actual bank.<\/p>\n<figure class=\"fig-embed\" data-fig=\"wps-agreement\"><\/figure>\n\n<h2>Nitaqat and nationality as compliance data<\/h2>\n<p><strong>Nitaqat<\/strong>, or Saudization, is the quota system requiring employers to maintain minimum percentages of Saudi national employees, with a colour-banded compliance rating that directly affects the ability to obtain visas and government services. WPS compliance feeds the rating. As a result, nationality reporting and workforce-composition analytics take on compliance significance in Saudi implementations that they do not have in Egypt: nationality is a compliance-reportable attribute, not merely demographic data.<\/p>\n<h2>Iqama, visas and document-driven employment<\/h2>\n<p>Employment legality in the Gulf is document-dependent in a way it is not in Egypt. <strong>Iqama<\/strong> (residency permit) numbers, visa details, expiry dates and renewal alerts become genuine HR requirements for every expatriate, and they combine with contract-expiry alerting (Chapter 8). Egyptian implementations mostly do not carry this; every Gulf one does.<\/p>\n<h2>End-of-service benefit<\/h2>\n<p>Gulf labour law provides an <strong>end-of-service benefit (EOSB)<\/strong> in place of a state pension for expatriates: a statutory lump sum on departure, calculated on length of service and final wage, with country-specific formulas and reductions for resignation before a service threshold. It is a central component of the final settlement in any Gulf payroll and has no Egyptian equivalent.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Treating GOSI as one rate. Nationals and expatriates differ, and the 2024 reform split nationals into two schedules.<\/li>\n<li>Ignoring the SAR 45,000 wage ceiling and the basic-plus-housing base.<\/li>\n<li>Forgetting that Qiwa, Mudad and GOSI must show the same basic salary.<\/li>\n<li>Treating nationality as demographic data rather than compliance data.<\/li>\n<li>Leaving the WPS file to the end of the project.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Mercans, \"GOSI Contributions in Saudi Arabia: 2026 Rates, Rules &amp; Compliance Guide\". <a href=\"https://mercans.com/glossary/gosi-contributions/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/glossary/gosi-contributions/<\/a><\/li>\n<li>Mercans statutory alert, \"Saudi Arabia: GOSI Contribution Rates &amp; Saned Unemployment Fund 2026\". <a href=\"https://mercans.com/resources/statutory-alerts/saudi-arabia-gosi-contribution-rates-saned-unemployment-fund-2026/\" target=\"_blank\" rel=\"noopener\">https://mercans.com/resources/statutory-alerts/saudi-arabia-gosi-contribution-rates-saned-unemployment-fund-2026/<\/a><\/li>\n<li>Snad, \"Mudad and the Wage Protection System (WPS): 2026 Employer Guide\". <a href=\"https://www.snad.io/en/blog/mudad-wps-hamayat-ujur-saudi\" target=\"_blank\" rel=\"noopener\">https://www.snad.io/en/blog/mudad-wps-hamayat-ujur-saudi<\/a><\/li>\n<li>Qiwa (Ministry of Human Resources and Social Development). <a href=\"https://qiwa.sa\" target=\"_blank\" rel=\"noopener\">https://qiwa.sa<\/a><\/li>\n<\/ul><\/div>","cover":""}],"terms":[{"id":"absence-plan","name":"Absence plan","what":"The rules engine behind an absence type: who is eligible, how entitlement is earned or granted, and how it is paid.","trap":"","ch":"absence"},{"id":"absence-type","name":"Absence type","what":"What the worker actually selects when requesting leave — 'Annual Leave', 'Sick Leave', 'Maternity Leave'. Must be associated with at least one absence plan.","trap":"","ch":"absence"},{"id":"abstract-role","name":"Abstract role","what":"A role held by virtue of being a person in the system rather than because of a specific job — Employee, Line Manager, Contingent Worker.","trap":"","ch":"security"},{"id":"accrual-band","name":"Accrual band","what":"A rule within an accrual plan granting different accrual rates to different populations, usually by length of service.","trap":"","ch":"absence"},{"id":"accrual-plan","name":"Accrual plan","what":"A plan where workers accumulate leave over time, with rules for accrual rate, ceilings, and carryover.","trap":"","ch":"absence"},{"id":"area-of-responsibility-aor","name":"Area of Responsibility (AOR)","what":"An assignment of responsibility for a defined population, used to drive both access and routing.","trap":"","ch":"security"},{"id":"assignment","name":"Assignment","what":"The record carrying the actual job details: business unit, department, job, position, grade, location, manager, working hours, assignment status, and the standing data payroll reads.","trap":"Putting person-level data on the assignment or assignment-level data on the person. Knowing which lives where is the whole skill.","ch":"model"},{"id":"attrition-turnover","name":"Attrition / turnover","what":"The rate at which people leave the organization over a period, usually expressed annually as a percentage.","trap":"","ch":"hrfunction"},{"id":"balance","name":"Balance","what":"An accumulated total of element results over a defined period and dimension — for example gross pay year-to-date, or taxable earnings month-to-date.","trap":"Expecting balances to survive a global transfer. They do not.","ch":"payroll"},{"id":"bi-publisher-bip","name":"BI Publisher (BIP)","what":"Oracle's formatted reporting tool, combining a SQL-based data model with a layout template to produce pixel-controlled output.","trap":"Treating them as interchangeable. Using OTBI for a payslip or BIP for a quick headcount list are both wrong answers in an interview.","ch":"reporting"},{"id":"bracket-elimination-for-high-earners","name":"Bracket elimination for high earners","what":"A rule progressively removing access to the lower tax bands as net taxable income rises above defined thresholds.","trap":"Building a naive progressive calculation that applies every band to every employee. It will be wrong for senior staff, which is exactly who notices.","ch":"egypt-payroll"},{"id":"bursting","name":"Bursting","what":"Splitting one BI Publisher report run into many individual outputs, each delivered separately.","trap":"","ch":"reporting"},{"id":"business-unit-bu","name":"Business unit (BU)","what":"An operational grouping used for processing transactions, sharing reference data such as jobs and grades, and controlling data access. Not a legal registration.","trap":"'A business unit is just another word for department.' No. A BU is a processing and access construct; departments sit below it on the org chart.","ch":"org"},{"id":"carryover","name":"Carryover","what":"The rules governing how much unused leave transfers into the next plan term, and when it expires.","trap":"","ch":"absence"},{"id":"casual-leave","name":"Casual leave","what":"Short-notice leave for unforeseen circumstances.","trap":"","ch":"egypt-leave"},{"id":"centers-of-excellence-coe","name":"Centers of Excellence (CoE)","what":"Specialist HR teams owning policy in a specific domain — Compensation & Benefits, Talent Acquisition, Learning & Development, Organization Development.","trap":"","ch":"hrfunction"},{"id":"change-request","name":"Change request","what":"A formal request to alter agreed scope, with its impact on time and cost assessed.","trap":"","ch":"method"},{"id":"compensatory-plan","name":"Compensatory plan","what":"A plan tracking earned compensatory time off, given instead of paying overtime.","trap":"","ch":"absence"},{"id":"concurrent-employment","name":"Concurrent employment","what":"One person holding multiple simultaneous assignments under the same work relationship, or multiple work relationships across different legal employers.","trap":"","ch":"model"},{"id":"configuration-workbook","name":"Configuration workbook","what":"The structured document recording every configuration decision and its agreed values.","trap":"","ch":"method"},{"id":"costing","name":"Costing","what":"The allocation of payroll results to accounting segments so the cost lands in the right place in the general ledger.","trap":"","ch":"payroll"},{"id":"crp-conference-room-pilot","name":"CRP (Conference Room Pilot)","what":"A structured demonstration of the configured system to the client using their own data and scenarios.","trap":"","ch":"method"},{"id":"cutover","name":"Cutover","what":"The sequenced set of activities moving the client from the legacy system to the new one.","trap":"","ch":"method"},{"id":"data-role-and-security-profile","name":"Data role and security profile","what":"Where a job role says what a user can do, the data role and security profile say which records they can do it to.","trap":"","ch":"security"},{"id":"department","name":"Department","what":"An organization to which workers are assigned — the box on the org chart that a person actually sits in.","trap":"","ch":"org"},{"id":"dff-descriptive-flexfield","name":"DFF (Descriptive Flexfield)","what":"A configurable extra field added to a standard object without customization.","trap":"","ch":"extend"},{"id":"division","name":"Division","what":"A broader grouping above departments, usually aligned to a product line, business segment, or geography.","trap":"","ch":"org"},{"id":"duty-role","name":"Duty role","what":"A granular building block granting specific privileges, aggregated into job and abstract roles.","trap":"","ch":"security"},{"id":"effective-date","name":"Effective date","what":"The date on which a change becomes true in the real world — not the date it was typed into the system.","trap":"'Effective date is the date I entered it.' No — the system tracks the entry date separately.","ch":"dating"},{"id":"egyptian-annual-leave-entitlement","name":"Egyptian annual leave entitlement","what":"The statutory leave ladder under Labour Law No. 14 of 2025.","trap":"","ch":"egypt-leave"},{"id":"element","name":"Element","what":"The definition of a single thing that can appear on a payslip: a salary, an allowance, a deduction, or an informational item.","trap":"Creating an element and expecting it to appear for employees. Nothing happens until eligibility is defined and an entry exists.","ch":"payroll"},{"id":"element-classification","name":"Element classification","what":"The category assigned to an element — earnings, deduction, information — which controls processing order and how it feeds balances.","trap":"","ch":"payroll"},{"id":"element-eligibility-element-link","name":"Element eligibility (element link)","what":"The rule defining which population of workers an element applies to, based on criteria such as payroll, legal employer, grade, job, or department.","trap":"Defining eligibility too narrowly at build time and then needing to change it after entries already exist, which is considerably messier.","ch":"payroll"},{"id":"element-entry","name":"Element entry","what":"The actual assignment of an element to a specific person, with its values and dates.","trap":"","ch":"payroll"},{"id":"eligibility-profile","name":"Eligibility profile","what":"A reusable set of criteria determining whether a person qualifies for an absence plan — based on grade, job, department, location, length of service, and similar.","trap":"","ch":"absence"},{"id":"end-of-contract","name":"End of contract","what":"A fixed-term contract reaching its expiry date. Nobody terminates it; it simply lapses.","trap":"Treating all three exit routes as one 'termination' transaction. They have different downstream calculations.","ch":"lifecycle"},{"id":"end-of-service-benefit-eosb-gratuity","name":"End of Service Benefit (EOSB) / gratuity","what":"A statutory lump sum payable to departing employees in Gulf countries, calculated on length of service and final wage.","trap":"Importing EOSB logic into an Egyptian design, or assuming Egypt has gratuity. It does not work that way.","ch":"lifecycle"},{"id":"end-dating","name":"End-dating","what":"Closing a record as of a date rather than deleting it, so that history is preserved.","trap":"'I'll just delete the wrong record.' In a date-effective SaaS system you end-date, correct, or reverse. Deletion is rare, restricted, and usually the wrong instinct.","ch":"dating"},{"id":"enterprise","name":"Enterprise","what":"The single top node of the entire organizational structure. There is exactly one enterprise per Oracle HCM implementation, and everything else is defined beneath it.","trap":"Do not describe the enterprise as 'the company'. The company is the legal entity. The enterprise is the whole group.","ch":"org"},{"id":"fast-formula","name":"Fast Formula","what":"Oracle's rule language used to express calculations and conditions — payroll rates, accrual rules, eligibility logic.","trap":"'Fast Formula is a programming language to master upfront.' It is a per-context rule language — approach it through examples.","ch":"ff"},{"id":"final-settlement","name":"Final settlement","what":"The calculation of everything owed to a leaver: final salary, unused leave payout, any severance or end-of-service benefit, minus outstanding deductions such as loans.","trap":"","ch":"lifecycle"},{"id":"fit-gap-analysis","name":"Fit-gap analysis","what":"Comparing client requirements against delivered functionality and documenting where the product fits, where it does not, and what will be done about the gaps.","trap":"","ch":"method"},{"id":"form-1-and-form-6","name":"Form 1 and Form 6","what":"The statutory notifications filed with social insurance on hiring (Form 1) and on termination (Form 6).","trap":"","ch":"egypt-payroll"},{"id":"freeze-period","name":"Freeze period","what":"A window during which no changes are permitted in the legacy system, so that final data migration is against a stable base.","trap":"","ch":"method"},{"id":"fte-full-time-equivalent","name":"FTE (full-time equivalent)","what":"A measure of workload rather than of people. An employee working 50% time is 0.5 FTE but still 1 headcount.","trap":"Reporting FTE when the client asked for headcount, or the reverse. They are different numbers and both are 'correct'.","ch":"hrfunction"},{"id":"global-transfer","name":"Global transfer","what":"Moving a worker from one legal employer to another — typically across countries. The source work relationship is terminated and a new one is created under the destination legal employer.","trap":"Expecting balances to carry across. They do not — balances never span payroll relationships, so year-to-date figures start fresh in the new country.","ch":"model"},{"id":"gosi","name":"GOSI","what":"The General Organization for Social Insurance — Saudi Arabia's social insurance authority.","trap":"","ch":"gulf"},{"id":"grade","name":"Grade","what":"A level in the organization's hierarchy, used to control compensation ranges and eligibility for benefits or allowances.","trap":"'Grade equals salary.' Grade is a level. Money attaches to it through rate ranges and the salary basis — the two are linked but distinct objects.","ch":"workforce"},{"id":"grade-step","name":"Grade step","what":"An increment within a single grade, used where progression happens in defined steps rather than across a continuous range. Steps are grouped into grade ladders.","trap":"","ch":"workforce"},{"id":"hcm-extract","name":"HCM Extract","what":"A framework for extracting HCM data on a schedule for delivery to external systems.","trap":"","ch":"reporting"},{"id":"hdl-hcm-data-loader","name":"HDL (HCM Data Loader)","what":"Oracle's bulk data loading tool, using structured .dat files uploaded as a zip.","trap":"'Functional means no technical work.' In HCM the market pays a premium for functional consultants who handle HDL, formulas, and reporting themselves.","ch":"hdl"},{"id":"headcount","name":"Headcount","what":"A raw count of people, regardless of how much each one works. One person equals one headcount.","trap":"","ch":"hrfunction"},{"id":"hrbp-hr-business-partner","name":"HRBP (HR Business Partner)","what":"An HR professional embedded with a specific business division as its strategic HR contact.","trap":"","ch":"hrfunction"},{"id":"hsdl-hcm-spreadsheet-data-loader","name":"HSDL (HCM Spreadsheet Data Loader)","what":"A spreadsheet-bas
