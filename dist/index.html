ed interface over the same loading framework, aimed at business users.","trap":"","ch":"hdl"},{"id":"hypercare","name":"Hypercare","what":"An intensive support period immediately after go-live with heightened staffing and response times.","trap":"","ch":"method"},{"id":"input-value","name":"Input value","what":"A field on an element that holds the data the calculation needs — typically amount, rate, percentage, or number of units.","trap":"","ch":"payroll"},{"id":"insurable-wage","name":"Insurable wage","what":"The portion of pay on which social insurance contributions are calculated, bounded by a statutory floor and ceiling.","trap":"'Contributions apply to full gross salary.' They do not — they apply to the capped insurable wage. This is the most common calculation error in Egyptian payroll.","ch":"egypt-payroll"},{"id":"iqama-and-visa-linked-employment-data","name":"Iqama and visa-linked employment data","what":"Residency permit and visa information that must be tracked, with expiry alerting, for expatriate employees.","trap":"","ch":"gulf"},{"id":"job","name":"Job","what":"A generic definition of a role, independent of the organization chart. Carries attributes such as grade range, qualifications, and job family.","trap":"Never define a job as a specific seat. That is a position.","ch":"workforce"},{"id":"job-family","name":"Job family","what":"A grouping of related jobs sharing similar characteristics — for example all finance jobs, or all engineering jobs.","trap":"","ch":"workforce"},{"id":"job-role","name":"Job role","what":"A role reflecting a job someone does in the organization — HR Specialist, Line Manager, Payroll Manager.","trap":"","ch":"security"},{"id":"journey","name":"Journey","what":"A configurable checklist of tasks assigned to a person around an event — onboarding, transfer, offboarding.","trap":"","ch":"extend"},{"id":"leave-encashment","name":"Leave encashment","what":"Paying out unused leave in cash instead of taking the time off.","trap":"","ch":"absence"},{"id":"legal-employer","name":"Legal employer","what":"A legal entity that has been explicitly classified as an employer. This is the entity that legally hires workers and appears on employment contracts.","trap":"Treating the two as synonyms. They are related but not interchangeable, and the difference is exactly what the question is testing.","ch":"org"},{"id":"legal-entity","name":"Legal entity","what":"An organization recognized by law that can own assets, sign contracts, incur liabilities, and be sued. Created in Oracle through the Legal Entity Configurator.","trap":"A legal entity on its own does not employ anybody. It has to be classified as a legal employer before a single person can be hired into it. This distinction is the most commonly missed point in the whole area.","ch":"org"},{"id":"legislative-data-group-ldg","name":"Legislative Data Group (LDG)","what":"A partition that isolates payroll and related legislative data by country. All payroll configuration — elements, balances, formulas — lives inside exactly one LDG.","trap":"Thinking you can reuse one element library globally. You cannot. Each LDG is its own world.","ch":"org"},{"id":"location","name":"Location","what":"A physical work site, with an address, attached to positions and assignments.","trap":"","ch":"org"},{"id":"lookup-type-and-lookup-code","name":"Lookup type and lookup code","what":"Configurable lists of values used in dropdowns across the application.","trap":"","ch":"extend"},{"id":"martyrs-victims-fund-contribution","name":"Martyrs & Victims Fund contribution","what":"A small statutory employee deduction of 0.05% of gross pay.","trap":"","ch":"egypt-payroll"},{"id":"maternity-leave","name":"Maternity leave","what":"Paid leave around childbirth.","trap":"","ch":"egypt-leave"},{"id":"minimum-wage-and-mandatory-annual-increment","name":"Minimum wage and mandatory annual increment","what":"The statutory wage floor and the legally required yearly increase.","trap":"Calculating the mandatory increment on full gross. It is on the social insurance wage.","ch":"egypt-payroll"},{"id":"mudad","name":"Mudad","what":"The Saudi platform supporting wage protection and payroll compliance.","trap":"","ch":"gulf"},{"id":"nitaqat-saudization","name":"Nitaqat / Saudization","what":"The Saudi quota system requiring employers to maintain minimum percentages of Saudi national employees, with a colour-banded compliance rating.","trap":"","ch":"gulf"},{"id":"no-entitlement-plan","name":"No entitlement plan","what":"A plan that tracks absences without maintaining a balance or providing entitlement — typically for unpaid leave.","trap":"","ch":"absence"},{"id":"nosi","name":"NOSI","what":"The National Organization for Social Insurance — the Egyptian authority administering social insurance under Law 148 of 2019.","trap":"","ch":"egypt-payroll"},{"id":"notice-period","name":"Notice period","what":"The advance written warning either party must give before terminating an indefinite-term contract.","trap":"Configuring notice rules from a secondary English-language source without verification. Statutory detail is the one area where being confidently wrong is expensive.","ch":"lifecycle"},{"id":"oracle-true-cloud-method","name":"Oracle True Cloud Method","what":"Oracle's current implementation methodology for Fusion Cloud projects.","trap":"'Consultants design the best system.' Consultants get decisions made and documented; the client owns the design.","ch":"method"},{"id":"org-chart","name":"Org chart","what":"The visual representation of reporting hierarchy — who reports to whom.","trap":"","ch":"hrfunction"},{"id":"otbi","name":"OTBI","what":"Oracle Transactional Business Intelligence — ad-hoc reporting and analysis directly against live HCM data, using pre-built subject areas.","trap":"Using OTBI for a payslip. Wrong tool — that is BI Publisher.","ch":"reporting"},{"id":"parallel-run","name":"Parallel run","what":"Running the new system's payroll alongside the legacy payroll for the same period and reconciling the two, line by line.","trap":"'Go-live means done.' Hypercare and the first live payroll after parallel are the actual finish line.","ch":"payroll"},{"id":"payment-process-bank-file","name":"Payment process / bank file","what":"The process that generates the actual payment instruction file sent to the bank.","trap":"","ch":"payroll"},{"id":"payroll-definition","name":"Payroll definition","what":"The configuration of a payroll's calendar: its frequency, period start and end dates, cut-off dates, and payment date.","trap":"","ch":"payroll"},{"id":"payroll-relationship","name":"Payroll relationship","what":"A parallel object linking the person to a payroll statutory unit (PSU). It is the highest level of the payroll employment model and groups a person's assignments for statutory calculation and reporting.","trap":"Thinking payroll runs against the assignment. It runs against the payroll relationship, aggregating across the assignments grouped within it.","ch":"model"},{"id":"payroll-run","name":"Payroll run","what":"The process that calculates gross-to-net for a population of workers for a given period.","trap":"","ch":"payroll"},{"id":"payroll-statutory-unit-psu","name":"Payroll Statutory Unit (PSU)","what":"A legal entity classified as responsible for paying workers, including remitting payroll tax and social insurance to the authorities.","trap":"Assuming one PSU per country automatically. A group with three registered companies in Egypt may well have three PSUs.","ch":"org"},{"id":"person","name":"Person","what":"The record of a human being, held once globally. Carries what is true of the human regardless of any employer: name, date of birth, national ID, personal contact details, nationality.","trap":"'There is an employee table.' There is not. There is a person, a work relationship, and an assignment.","ch":"model"},{"id":"personal-exemption","name":"Personal exemption","what":"An annual amount deducted from income before applying the tax brackets.","trap":"","ch":"egypt-payroll"},{"id":"position","name":"Position","what":"A specific, individual seat: a job tied to a particular department and location, which exists whether or not anyone currently fills it.","trap":"'Job and position are synonyms.' They are not, and this is the fastest way to look unprepared in front of a trainer. Job = what the work is. Position = a specific seat doing it.","ch":"workforce"},{"id":"prepayments","name":"Prepayments","what":"The process that takes payroll run results and distributes them across the person's payment methods, ready for payment.","trap":"","ch":"payroll"},{"id":"probation","name":"Probation","what":"An initial period during which either party may end the employment with lighter obligations than after confirmation.","trap":"Assuming probation can be extended by agreement. Under the 2025 law it cannot.","ch":"lifecycle"},{"id":"progressive-tax-brackets","name":"Progressive tax brackets","what":"Egypt's seven-band salary tax scale applied to annual net taxable income.","trap":"'Tax is a flat monthly percentage.' It is annual, progressive, exemption-adjusted, and reconciled.","ch":"egypt-payroll"},{"id":"qiwa","name":"Qiwa","what":"The Saudi Ministry of Human Resources digital labour platform, handling contracts, work permits, and establishment services.","trap":"","ch":"gulf"},{"id":"qualification-plan","name":"Qualification plan","what":"A plan where workers qualify for entitlement on an event, with payment percentages that can vary by band, rather than accruing a balance.","trap":"","ch":"absence"},{"id":"quarterly-update-26a-26d","name":"Quarterly update (26A–26D)","what":"Oracle's fixed quarterly release cycle for Fusion Cloud applications.","trap":"","ch":"extend"},{"id":"quickpay","name":"QuickPay","what":"A process that runs payroll for a single person outside the main run.","trap":"","ch":"payroll"},{"id":"raid-log","name":"RAID log","what":"A tracking log of Risks, Assumptions, Issues, and Dependencies.","trap":"","ch":"method"},{"id":"reconciliation","name":"Reconciliation","what":"Comparing outputs between two systems or two runs and explaining every difference.","trap":"","ch":"method"},{"id":"redwood","name":"Redwood","what":"Oracle's current user experience and design system, progressively replacing older pages.","trap":"","ch":"extend"},{"id":"resignation","name":"Resignation","what":"Employee-initiated termination of the employment relationship.","trap":"","ch":"lifecycle"},{"id":"rest-api","name":"REST API","what":"Oracle's web service interface for programmatic read and write access to HCM data.","trap":"'I can query the database directly.' There is no SQL Developer connection to a SaaS pod. Your query paths are OTBI, BIP data models, extracts, and REST.","ch":"reporting"},{"id":"retroactive-change-retro","name":"Retroactive change (retro)","what":"A change entered with an effective date in the past, after payroll has already been processed for that period.","trap":"Assuming retro only adds money. It can also create a recovery when a change reduces pay.","ch":"dating"},{"id":"salary-basis","name":"Salary basis","what":"The configuration that determines how salary is stored, quoted, and paid — annual, monthly, or hourly — and which element it feeds.","trap":"","ch":"payroll"},{"id":"sandbox","name":"Sandbox","what":"An isolated workspace for making and testing configuration changes before publishing them to the live environment.","trap":"","ch":"extend"},{"id":"shared-services-hr-operations","name":"Shared services / HR Operations","what":"A centralized team handling transactional HR work — payroll processing, data entry, tier-one queries — for the whole organization.","trap":"Treating them as low-level administrators. They hold the operational knowledge no document captures.","ch":"hrfunction"},{"id":"sick-leave","name":"Sick leave","what":"Paid leave for illness, with payment rates varying by duration.","trap":"","ch":"egypt-leave"},{"id":"sit-system-integration-testing","name":"SIT (System Integration Testing)","what":"Testing that the configured system works end to end, including integrations with other systems.","trap":"","ch":"method"},{"id":"social-insurance-contribution-rates","name":"Social insurance contribution rates","what":"The statutory percentages contributed by employee and employer on the insurable wage.","trap":"","ch":"egypt-payroll"},{"id":"solid-line-vs-dotted-line-reporting","name":"Solid-line vs dotted-line reporting","what":"Solid line is the formal line manager who owns performance and compensation decisions. Dotted line is a secondary, functional reporting relationship without that authority.","trap":"","ch":"hrfunction"},{"id":"source-system-key-vs-person-number","name":"Source system key vs person number","what":"The source system key identifies a record in the legacy system for load and reconciliation purposes; the person number is Oracle's own identifier.","trap":"'Data conversion is a side task.' It is routinely the thing that delays go-live.","ch":"hdl"},{"id":"subject-area","name":"Subject area","what":"A pre-built, governed data model in OTBI exposing a business domain such as workforce management or absence.","trap":"","ch":"reporting"},{"id":"tax-reporting-unit-tru","name":"Tax Reporting Unit (TRU)","what":"The reporting face of a PSU toward tax and statutory authorities. TRUs are created under a PSU and are what statutory reports and deduction cards actually reference.","trap":"","ch":"org"},{"id":"termination","name":"Termination","what":"Employer-initiated ending of employment, with or without cause.","trap":"","ch":"lifecycle"},{"id":"test-script","name":"Test script","what":"A step-by-step document defining what to do, what data to use, and what result to expect.","trap":"","ch":"method"},{"id":"uat-user-acceptance-testing","name":"UAT (User Acceptance Testing)","what":"Client-executed testing against agreed scripts to confirm the system meets requirements.","trap":"'Testing is the QA team's job.' Not on a functional implementation.","ch":"method"},{"id":"ulrich-model","name":"Ulrich model","what":"The dominant model for structuring an HR function into three parts: HRBPs, Centers of Excellence, and Shared Services.","trap":"","ch":"hrfunction"},{"id":"universal-health-insurance","name":"Universal health insurance","what":"A separate contributory health insurance scheme being progressively rolled out across governorates.","trap":"","ch":"egypt-payroll"},{"id":"update-vs-correction","name":"Update vs correction","what":"An update creates a new dated record and preserves history. A correction overwrites the existing record as if the previous value was never true.","trap":"Using correction to fix a real-world change, thereby destroying legitimate history.","ch":"dating"},{"id":"value-set","name":"Value set","what":"A definition constraining what values a flexfield segment can accept.","trap":"","ch":"extend"},{"id":"work-relationship","name":"Work relationship","what":"The link between a person and one legal employer, carrying a worker type and the start date of that employment. Terminating employment end-dates the work relationship.","trap":"Confusing termination of a work relationship with deletion of the person. The person record survives; the work relationship is end-dated.","ch":"model"},{"id":"work-terms","name":"Work terms","what":"An optional intermediate layer between the work relationship and the assignment, used to group employment terms such as payroll and compensation across multiple assignments.","trap":"Assuming every implementation has work terms. Many do not — the two-tier model omits this layer entirely.","ch":"model"},{"id":"worker-types","name":"Worker types","what":"The category recorded on a work relationship: employee, contingent worker, pending worker, or non-worker.","trap":"","ch":"model"},{"id":"wps-and-sif-file","name":"WPS and SIF file","what":"The Wage Protection System and the Salary Information File format used to prove salaries were paid correctly and on time.","trap":"","ch":"gulf"}],"questions":[{"ch":"model","q":"After a global transfer from Egypt to Saudi Arabia, how many person records exist? How many work relationships? How many payroll relationships?","a":"One person record — the person is held once, globally. Two work relationships: the Egyptian one is terminated (end-dated) and a new one is created under the Saudi legal employer. Two payroll relationships: the Saudi one is created under the Saudi PSU in a different LDG, and because balances never span payroll relationships, year-to-date figures start fresh.","terms":["person","work-relationship","payroll-relationship","global-transfer"]},{"ch":"org","q":"What is the difference between a legal entity and a legal employer?","a":"A legal entity is an organization recognized by law that can own assets, sign contracts and be sued. A legal employer is a classification applied to a legal entity that enables it to employ workers. Not every legal entity is a legal employer — one may exist only to hold property — and nobody can be hired into an entity until the classification is switched on.","terms":["legal-entity","legal-employer"]},{"ch":"org","q":"A client asks why an Egyptian element does not appear in the Saudi environment. What is checked first?","a":"The legislative data group. All payroll configuration — elements, balances, formulas — lives inside exactly one LDG, and an element defined in the Egypt LDG does not exist in the Saudi LDG. It has to be built again there.","terms":["legislative-data-group-ldg","element"]},{"ch":"workforce","q":"Explain job versus position to someone who has never used an HR system.","a":"A job is what the work is — 'Accountant' — defined once and reused everywhere. A position is one specific seat doing that work: 'Accountant #3, Finance, Alexandria plant', with its own budget and reporting line, which exists whether or not anyone currently sits in it. When the person leaves, the position stays and becomes a vacancy.","terms":["job","position"]},{"ch":"dating","q":"When is a correction used instead of an update, and what does each do to history?","a":"An update records a real-world change: it creates a new dated record and keeps the old one, so a promotion on 1 July leaves both grades in history. A correction fixes a data-entry mistake: it overwrites the record as if the old value was never true. Using a correction for a real event destroys legitimate history and can trigger wrong retroactive payroll.","terms":["update-vs-correction","effective-date"]},{"ch":"payroll","q":"Walk through the payroll object chain from element to payment.","a":"Element (the definition) → element eligibility (who could receive it) → element entry (who does, and how much) → payroll run (gross-to-net, held against the payroll relationship) → balances (running totals) → prepayments (distribute results to payment methods) → payment process (the bank file) → costing (to the ledger). Each link depends on the one before it.","terms":["element","element-eligibility-element-link","element-entry","payroll-run","balance","prepayments","payment-process-bank-file","costing"]},{"ch":"egypt-payroll","q":"An employee earns EGP 25,000 per month. What is their monthly social-insurance contribution, and why is it not 11% of 25,000?","a":"EGP 1,837.00. Contributions apply to the insurable wage, which is capped at EGP 16,700 in 2026 (floor EGP 2,700). 11% of 16,700 is 1,837; the employer pays 18.75% of the same capped figure, EGP 3,131.25. The cap moves every January.","terms":["insurable-wage","social-insurance-contribution-rates"]},{"ch":"model","q":"Why can balances not span payroll relationships, and when does that become visible to a client?","a":"Because payroll processing and aggregation happen at the payroll relationship level, which is tied to one payroll statutory unit and one legislation. A different PSU means different statutory rules and a different LDG, so totals cannot carry across. It becomes visible on a global transfer, when year-to-date balances start from zero in the new country.","terms":["payroll-relationship","balance"]},{"ch":"absence","q":"Which of the six absence plan types fits maternity leave, and why not an accrual plan?","a":"A qualification plan. Maternity is not earned day by day — it is triggered by an event and paid at a defined rate over the absence, and it can carry occurrence caps. An accrual plan accumulates a balance over time, which is the wrong shape. The six types are accrual, qualification, no entitlement, compensatory, agreement and donation.","terms":["absence-plan","qualification-plan","accrual-plan"]},{"ch":"hrfunction","q":"A department has ten people, four of them half-time. What is the headcount and what is the FTE?","a":"Headcount 10 — every person counts as one. FTE 8 — six full-timers at 1.0 plus four half-timers at 0.5. Both numbers are correct; they answer different questions, so always ask which one the client means.","terms":["headcount","fte-full-time-equivalent"]},{"ch":"reporting","q":"OTBI or BI Publisher for a payslip? For a headcount dashboard? Justify both.","a":"Payslip: BI Publisher — a formatted, per-employee, printable document, produced from a SQL data model and a layout template and delivered by bursting. Headcount dashboard: OTBI — ad-hoc analysis against live data using the Worker Assignment subject area, no layout requirement. Swapping them is wrong in both directions.","terms":["otbi","bi-publisher-bip","bursting"]},{"ch":"payroll","q":"What does element eligibility do that an element entry does not?","a":"Eligibility defines the population an element can apply to — by payroll, legal employer, grade, job, department. It answers 'who could receive this'. An entry is the actual attachment of the element to one person with values and dates — 'who does, and how much'. Without eligibility, no entry can be created.","terms":["element-eligibility-element-link","element-entry"]},{"ch":"extend","q":"A client says 'we need an extra field for equipment number'. What are the first three thoughts?","a":"DFF — a descriptive flexfield on the relevant object holds the data without customization. Lookup or value set — should the field be a controlled list rather than free text. Approvals — what the workflow should do when the field changes. That sequence covers most 'can you add a field' requests.","terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code","value-set"]},{"ch":"security","q":"What is the difference between what a job role controls and what a security profile controls?","a":"A job role controls function — what a user can do: the screens, tasks and privileges of, say, an HR Specialist. A security profile controls data scope — whose records they can do it to: by legal employer, business unit, department, position or country. A data role combines the two. Same job role, different profiles, different visible populations.","terms":["job-role","data-role-and-security-profile"]},{"ch":"egypt-payroll","q":"Why does Oracle not deliver a maintained Egyptian payroll localization, and why does that matter for a consultant's value on a project?","a":"Oracle maintains localizations for a limited set of markets; Egypt's statutory rules are built by the implementation partner in elements, balances and Fast Formulas. That means someone on the project has to know the Egyptian mechanics — insurable-wage caps, the tax brackets and bracket elimination, the small statutory deductions — and a consultant who knows them is useful from the first workshop.","terms":["fast-formula","insurable-wage","progressive-tax-brackets"]},{"ch":"dating","q":"A raise is approved in July with an effective date of 1 May. What happens in the July payroll run?","a":"Retroactive events are raised for May and June, which were already paid at the old rate. Recalculate Payroll for Retroactive Changes runs before the main calculation, works out the arrears for both months and creates retro entries; the July run then pays them and re-states the affected balances, including social insurance and tax for the prior periods.","terms":["retroactive-change-retro"]},{"ch":"payroll","q":"What is a parallel run, and why is it not optional?","a":"Running the new system's payroll alongside the legacy payroll for the same period — typically two or three consecutive months — and reconciling the two line by line, explaining every difference. It is the only reliable proof that the new payroll is correct before the old one is switched off.","terms":["parallel-run","reconciliation"]},{"ch":"hrfunction","q":"Name the three parts of the Ulrich model and say which one a consultant works with most day to day.","a":"HR business partners embedded in the business, centers of excellence owning policy in a domain, and shared services doing the transactional work. Day to day, the consultant works most with shared services — in Egypt the Personnel and Payroll team — because their work is what the configuration automates; the CoEs sign off design in their domain.","terms":["ulrich-model","hrbp-hr-business-partner","centers-of-excellence-coe","shared-services-hr-operations"]},{"ch":"egypt-payroll","q":"What is the mandatory annual increment in Egypt calculated on, and why does that matter for high earners?","a":"At least 3% of the social-insurance wage — the insurable wage — not total salary. Because the insurable wage is capped (EGP 16,700 in 2026), the increment is effectively capped at 3% of the ceiling for anyone earning above it.","terms":["minimum-wage-and-mandatory-annual-increment","insurable-wage"]},{"ch":"egypt-payroll","q":"Under the current Egyptian brackets, why might a naive progressive tax calculation understate tax for a senior employee?","a":"Because of bracket elimination. Above defined net-income thresholds the lower bands are removed — above EGP 600,000 the 0% band goes, above 700,000 the 10% band too, and so on until above 1.2 million only the 25% and 27.5% bands apply. A calculator that applies every band to everyone gives senior staff lower-band relief they are not entitled to.","terms":["bracket-elimination-for-high-earners","progressive-tax-brackets"]},{"ch":"reporting","q":"What is a subject area, and why does choosing the wrong one produce wrong numbers rather than an error?","a":"A pre-built, governed data model in OTBI — pre-joined tables exposed as folders and columns — covering one domain at a fixed grain. Choosing wrong does not fail; it silently reports at the wrong grain: date-effective history multiplies rows and multiple assignments double-count people, so the numbers are plausible and wrong.","terms":["subject-area","otbi"]},{"ch":"reporting","q":"Name the three OTBI constraints that catch people, and the three workarounds.","a":"Constraints: no joins across subject areas in one analysis; a default row limit (around 65,000) past which results truncate silently; and predefined grain that cannot be changed. Workarounds: a Combined Analysis on a shared key such as person number; BI Publisher with hand-written SQL; or an HCM Extract for large volumes.","terms":["otbi","hcm-extract","bi-publisher-bip"]},{"ch":"reporting","q":"OTBI or BI Publisher for a payslip? For a headcount dashboard? For a 200,000-row extract? Justify all three.","a":"Payslip: BI Publisher, formatted per-employee output with bursting. Headcount dashboard: OTBI, ad-hoc and live. 200,000 rows: past OTBI's row limit — an HCM Extract, or BI Publisher with its own SQL.","terms":["otbi","bi-publisher-bip","hcm-extract"]},{"ch":"reporting","q":"What are the two halves of a BI Publisher report, and which one is closest to ordinary SQL work?","a":"A data model and a layout template. The data model is genuinely SQL against the reporting schema — that half is ordinary query work. The template controls layout and is the new part.","terms":["bi-publisher-bip"]},{"ch":"reporting","q":"Explain bursting to someone who has never heard of it.","a":"One report run produces thousands of individual outputs, each delivered separately to the right person — one payroll run becomes one payslip email per employee. Bursting is the splitting and routing step.","terms":["bursting"]},{"ch":"hdl","q":"Write a valid METADATA line for a simple object from memory, then a matching MERGE line.","a":"METADATA|JobFamily|JobFamilyCode|JobFamilyName|EffectiveStartDate|EffectiveEndDate — then — MERGE|JobFamily|SALES|Sales|2000/01/01|4712/12/31. Same discriminator, same attributes in the same order, pipe-delimited, dates as YYYY/MM/DD.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Give two reasons an HDL file would be rejected before any data loads.","a":"A METADATA line appearing after the MERGE lines it describes; two METADATA lines for the same component in one file; a MERGE line whose attributes do not match the METADATA order (pipe-count mismatch); a wrongly cased attribute name; a file saved with a UTF-8 byte-order mark.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Can a single .dat file contain two METADATA lines? Under what condition?","a":"Yes — a Worker.dat routinely has METADATA lines for Worker, PersonName, WorkRelationship, Assignment and more. The condition is that each METADATA line is for a different component; two for the same component is invalid.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"What is 4712/12/31 and why does it appear everywhere?","a":"Oracle's conventional 'end of time' date. Every date-effective record has an end date, and an open-ended, current record ends on 4712/12/31 — so it is on almost every current row in a load and in the tables.","terms":["hdl-hcm-data-loader","effective-date"]},{"ch":"hdl","q":"Explain the difference between a source key and a user key, and say which one to insist on for a migration that must be reconciled.","a":"A source key is SourceSystemOwner plus SourceSystemId — the record's identity in the legacy system. A user key is a natural business key such as JobFamilyCode. For a migration that must be reconciled, insist on source keys: they are what trace every Oracle record back to its legacy origin and let every variance be explained.","terms":["source-system-key-vs-person-number","hdl-hcm-data-loader"]},{"ch":"hdl","q":"What does JobFamilyId(SourceSystemId) mean in a METADATA line?","a":"A foreign-object reference: the column points at a job family, identified by its source-system id rather than Oracle's internal id. The bracket names the key type used to resolve the reference. It is how child records attach to parents in a load.","terms":["hdl-hcm-data-loader"]},{"ch":"hdl","q":"Multiple .dat files are in one zip. Are they loaded in parallel or sequentially, and what does that mean for ordering?","a":"Imported in parallel, loaded sequentially. Referenced data must exist before it is referenced: job families before jobs, grades and jobs before assignments, people before work relationships.","terms":["hdl-hcm-data-loader"]},{"ch":"ff","q":"What are the four logical sections of a Fast Formula?","a":"Inputs (INPUTS ARE), defaults (DEFAULT FOR), logic (assignments and IF/THEN/ELSE), and return (RETURN). Oracle does not strictly enforce the order, but following it avoids errors.","terms":["fast-formula"]},{"ch":"ff","q":"Why does Oracle recommend INPUTS statements over database items where possible?","a":"Inputs are passed at runtime and need no database read; database items are fetched from the database. Preferring inputs makes the payroll run faster.","terms":["fast-formula"]},{"ch":"ff","q":"What is a formula type, and why does it mean Fast Formula cannot be learned purely from grammar?","a":"The type fixes which inputs, database items and contexts are available to a formula. The same syntax behaves differently depending on where it runs, and a formula written for one context will not run in another — so the language is learned by reading delivered formulas of the type being built.","terms":["fast-formula"]},{"ch":"ff","q":"In words, what is the logic for capping an Egyptian insurable wage before applying the 11% employee contribution?","a":"Take the wage as an input. If it is above the ceiling (EGP 16,700 in 2026), use the ceiling. If it is below the floor (EGP 2,700), use the floor. Multiply the result by 0.11 and return it. Cap and floor first, rate last.","terms":["fast-formula","insurable-wage"]},{"ch":"extend","q":"A client wants a new field for equipment number. What are the first three thoughts?","a":"DFF, lookup (or value set), approvals — where the data lives, whether it should be a controlled list, and what the workflow should do about it.","terms":["dff-descriptive-flexfield","lookup-type-and-lookup-code"]},{"ch":"extend","q":"What actually happens when a sandbox is published?","a":"The configuration changes made and tested in isolation become real for every user. It is a controlled, deliberate step — not an autosave — and the moment at which page and flexfield changes go live.","terms":["sandbox"]},{"ch":"reporting","q":"There is no direct database connection to a SaaS pod. Name all four ways to get data out, and when each is right.","a":"OTBI for ad-hoc analysis and dashboards; BI Publisher data models for formatted output and complex SQL; HCM Extract for scheduled or large-volume outbound files; REST APIs for real-time integration.","terms":["otbi","bi-publisher-bip","hcm-extract","rest-api"]},{"ch":"reporting","q":"Where is the honest boundary between what a strong functional consultant does and what is handed to a technical team?","a":"Expected of a functional consultant: HDL loads, simple Fast Formulas, OTBI analyses and basic BI Publisher. Handed off: Oracle Integration Cloud integrations and complex BI Publisher development.","terms":["hdl-hcm-data-loader","fast-formula","rest-api"]}]}</script>
<script>
/* =====================================================================
   HCM ATLAS — an open study site for Oracle HCM Cloud consultants
   working in Egypt and the Gulf.
   ---------------------------------------------------------------------
   HOW TO EXTEND
   • Chapters live in DATA.chapters: {id, num, title, sub, hue, labs[],
     terms[], minutes, html}. The HTML is built from Markdown source
     (chapters-*.md) by build.py; [[lab:id]] in the source embeds a lab.
   • Glossary terms live in DATA.terms: {id, name, what, trap, ch}.
   • Drill questions live in DATA.questions: {ch, q, a, terms[]}.
   • Labs are functions in LABS: {id, ch, title, lead, render(el)}.
   • Readers can add their own terms and questions in-page; those, plus
     progress and notes, live in state S (browser storage, synced to the
     page's database when available).
   ===================================================================== */
const DATA = JSON.parse(document.getElementById('hcm-data').textContent);
const CH = DATA.chapters; const chById = id => CH.find(c=>c.id===id);
const TERMS = {}; DATA.terms.forEach(t=>TERMS[t.id]=t);
const allTerms = () => [...DATA.terms, ...S.custom];

/* ---------- state ---------- */
const S = {known:{},read:{},notes:{},drill:{},custom:[],customQ:[],updatedAt:0};
const LS='hcm-atlas-v2';
try{ const raw=localStorage.getItem(LS); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){}
let db=null, saveTimer=null;
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(db) db.doc('progress/main').set(JSON.parse(JSON.stringify(S))).catch(()=>{}); },600); }
(async()=>{ try{ if(!window.claude||!window.claude.use) return; db=await claude.use('db'); if(!db) return;
  const snap=await db.doc('progress/main').get(); if(snap.exists){ const d=snap.data(); if((d.updatedAt||0)>(S.updatedAt||0)){ Object.assign(S,d); render(); } else save(); } else save();
  const el=document.getElementById('sync'); el.classList.add('on'); el.querySelector('span').textContent='Progress synced across devices'; }catch(e){ db=null; } })();
let sample=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ sample=await claude.use('sample'); if(sample) document.querySelectorAll('.needs-sample').forEach(x=>x.hidden=false); } }catch(e){} })();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-EG');
const fmt2 = n => n.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function pct(a,b){ return b?Math.round(100*a/b):0; }
function termExplain(id){ const t=TERMS[id]; if(!t) return ''; return `<b>${esc(t.name)}</b><br>${esc(t.what)}${t.trap?`<div class="muted" style="margin-top:6px"><b style="color:var(--gold)">Watch out:</b> ${esc(t.trap)}</div>`:''}`; }
/* Stable heading ids: derived from the text, so a deep link keeps working when
   a section moves or a lab is added. Deduped against ids already handed out. */
function slugId(text, taken){ const base='h-'+String(text).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60); let id=base,n=2; while(taken.has(id)) id=base+'-'+(n++); taken.add(id); return id; }
function explainBox(id, init){ return `<div class="explain" id="${id}">${init}</div>`; }
function knownBtn(id){ return `<span class="known ${S.known[id]?'on':''}" data-known="${esc(id)}" title="Mark as known" role="button" tabindex="0"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></span>`; }
function wireKnown(root){ root.querySelectorAll('[data-known]').forEach(k=>{ const h=e=>{ e.preventDefault(); e.stopPropagation(); const id=k.dataset.known; S.known[id]=!S.known[id]; if(!S.known[id]) delete S.known[id]; save(); k.classList.toggle('on',!!S.known[id]); }; k.onclick=h; k.onkeydown=e=>{ if(e.key==='Enter'||e.key===' ') h(e); }; }); }

/* ---------- router ---------- */
let route={view:'home'}, lastHash='';
function go(view, extra={}){ route={view,...extra}; lastHash=[view,extra.ch||extra.lab||'',extra.sec||''].filter(Boolean).join('/'); location.hash=lastHash; render(); if(!extra.sec) window.scrollTo({top:0}); }
function parseHash(){ const h=location.hash.slice(1); const [v,x,y]=h.split('/'); const r={view:v||'home'}; if(v==='chapters'&&x){ r.ch=x; if(y) r.sec=y; } if(v==='labs'&&x) r.lab=x; return r; }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h===lastHash) return; lastHash=h; route=parseHash(); render(); window.scrollTo({top:0}); });
function render(){ document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.go===route.view)); ({home:renderHome,chapters:renderChapters,labs:renderLabs,glossary:renderGlossary,drill:renderDrill,about:renderAbout}[route.view]||renderHome)($('#view')); }
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
$('#themeBtn').addEventListener('click',()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme'); const next=cur==='dark'?'light':cur==='light'?'':'dark'; if(next) r.setAttribute('data-theme',next); else r.removeAttribute('data-theme'); try{localStorage.setItem('hcm-theme',next);}catch(e){} });
try{ const th=localStorage.getItem('hcm-theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

/* ---------- progress ---------- */
function cardIds(){ return [...allTerms().map(t=>'t:'+t.id), ...DATA.questions.map((_,i)=>'q:'+i), ...S.customQ.map(q=>'c:'+q.id)]; }
function progress(){ const total=allTerms().length, known=allTerms().filter(t=>S.known[t.id]).length; const read=CH.filter(c=>S.read[c.id]).length; const cards=cardIds(); const solid=cards.filter(c=>S.drill[c]===2).length, shaky=cards.filter(c=>S.drill[c]===1).length; return {total,known,read,chapters:CH.length,cards:cards.length,solid,shaky}; }

/* ================= HOME ================= */
/* Per-chapter progress: one column per chapter, filled by the share of its
   terms marked known, ticked when the chapter is read. Clicking opens it. */
function chapterProgress(){
  const rows=CH.map(c=>{ const t=c.terms.length, k=c.terms.filter(id=>S.known[id]).length;
    return {c,t,k,pct:t?Math.round(100*k/t):0,read:!!S.read[c.id]}; });
  const done=rows.filter(r=>r.read).length, allKnown=rows.filter(r=>r.t&&r.k===r.t).length;
  return `<div class="pchart card">
    <div class="pchart-head"><div><div class="eyebrow">Where you are, chapter by chapter</div><p class="small muted">Column height is the share of that chapter's terms you have marked known. A tick means you marked the chapter read.</p></div>
      <div class="pchart-key"><span>${done} read</span><span>${allKnown} fully known</span></div></div>
    <div class="pchart-grid">${rows.map(r=>`<button class="pcol ${r.read?'read':''}" data-h style="--h:${r.c.hue}" data-ch="${r.c.id}" aria-label="Chapter ${r.c.num}, ${esc(r.c.title)} — ${r.k} of ${r.t} terms known${r.read?', read':''}"><span class="pcol-v">${r.pct}%</span><span class="pcol-trk"><i style="height:${r.pct}%"></i></span><span class="pcol-n">${r.c.num}</span>${r.read?'<span class="pcol-ok">✓</span>':'<span class="pcol-ok off"></span>'}</button>`).join('')}</div>
  </div>`;
}

function renderHome(v){
  const pr=progress();
  const node=(id,cls='')=>{const c=chById(id);return `<button class="mnode ${cls}" data-h style="--h:${c.hue}" data-ch="${id}"><span class="k">${c.num}</span><div class="t">${icon(c.id)}<span>${esc(c.title)}</span></div><div class="s">${esc(c.sub)}</div>${S.read[id]?'<span class="done">✓</span>':''}</button>`;};
  const stat=(to,val,p2,lbl)=>`<button class="hstat" data-go2="${to}"><div class="ring" style="--v:${p2}"><b>${p2}%</b></div><div><div class="big num">${val}</div><div class="lbl">${lbl}</div></div></button>`;
  const sec=(track,name,blurb)=>`<div class="sec-lbl"><span class="sec-k ${track}">${name}</span><p>${blurb}</p></div>`;
  v.innerHTML=`<section class="hero">
    <div class="hero-side">${stat('chapters',`${pr.read} / ${pr.chapters}`,pct(pr.read,pr.chapters),'chapters read')}${stat('glossary',`${pr.known} / ${pr.total}`,pct(pr.known,pr.total),'terms marked known')}${stat('drill',`${pr.solid} / ${pr.cards}`,pct(pr.solid,pr.cards),'drill cards solid')}</div>
    <div class="hero-main"><div class="eyebrow">Oracle Fusion HCM Cloud · Core HR · Absence · Payroll</div><h1>Oracle HCM, explained for consultants in Egypt and the Gulf</h1><p>Seventeen chapters that read like a book, fifteen interactive labs that behave like the system, a glossary of ${DATA.terms.length} terms, and a drill deck to make it stick. Built for a new functional consultant who has to be useful on a project, not just pass an exam.</p><div class="cta"><button class="btn gold" data-go2="chapters" data-ch2="org">Start with Chapter 1</button><button class="btn" data-go2="labs">Open the labs</button></div></div>
  </section>
  ${chapterProgress()}
  <div class="eyebrow" style="margin:22px 0 10px">The system on one screen — each block is a chapter</div>
  <div class="sysmap card">
    ${sec('functional','Functional','What the business configures and runs: the structures people sit in, the record that describes them, and the money, time and law that follow.')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">Structure — what exists before anyone is hired</div>${node('org')}${node('workforce','two')}
      <div class="layer-lbl">People — the data model everything reads from</div>${node('model','two')}${node('hrfunction')}
      ${node('dating','wide')}
      <div class="layer-lbl">Money &amp; time — what the model feeds</div>${node('payroll')}${node('absence')}${node('lifecycle')}
      <div class="layer-lbl">Law — the rules configured per country</div>${node('egypt-payroll')}${node('egypt-leave')}${node('gulf')}
      <div class="layer-lbl">Delivery — how the project is run</div>${node('method','full')}
    </div></div>
    ${sec('technical','Technical','What the consultant builds with: loading data in bulk, writing the calculation logic, getting information back out, extending without customizing, and controlling who sees what.')}
    <div class="sysmap-scroll"><div class="sysmap-inner">
      <div class="layer-lbl">The consultant’s toolkit</div>${node('hdl')}${node('ff')}${node('reporting')}${node('extend','two')}${node('security')}
    </div></div>
    <div class="legend"><span>Colour is consistent everywhere on this site: the chapter’s colour marks its labs, its glossary terms and its drill cards.</span><span>Dashed = a foundation that runs under every record above it.</span></div>
  </div>
  <div class="paths3">
    <button class="path3 card" data-go2="chapters" data-ch2="model"><span class="n">If you read one chapter</span><h3>The Employment Data Model</h3><p>Person, work relationship, assignment, payroll relationship. Everything else reads from it.</p></button>
    <button class="path3 card" data-go2="chapters" data-ch2="egypt-payroll"><span class="n">If you work in Egypt</span><h3>Social Insurance &amp; Salary Tax</h3><p>Oracle does not ship these rules. Knowing them is the differentiator.</p></button>
    <button class="path3 card" data-go2="chapters" data-ch2="hdl"><span class="n">If you want to be useful on day one</span><h3>Loading Data: HDL</h3><p>Bulk loads land on functional consultants. Most avoid them.</p></button>
  </div>
  <div class="callout" style="margin-top:22px"><b>Numbers move.</b> Egyptian insurable-wage limits rise every January; Saudi GOSI rates are phasing up through 2028; labour-law summaries still disagree on details. Statutory figures on this site were verified in 2026 and each chapter lists its sources. Re-check with the authority before quoting a figure to a client.</div>`;
  v.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>go('chapters',{ch:b.dataset.ch})));
  v.querySelectorAll('[data-go2]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go2, b.dataset.ch2?{ch:b.dataset.ch2}:{})));
}

/* ================= CHAPTERS ================= */
function renderChapters(v){
  if(route.ch) return renderReader(v, chById(route.ch)||CH[0]);
  const row=c=>`<button class="chrow card" data-h style="--h:${c.hue}" data-ch="${c.id}"><div class="n">${icon(c.id)}<span>${c.num}</span></div><div><h3>${esc(c.title)}</h3><div class="s">${esc(c.sub)}</div></div><div class="m">${S.read[c.id]?'<span class="ok">✓ Read</span>':''}<span>${c.minutes} min</span><span>${c.terms.length} terms</span>${c.labs.length?`<span>${c.labs.length} lab${c.labs.length>1?'s':''}</span>`:''}</div></button>`;
  const group=(track,name,blurb)=>{ const list=CH.filter(c=>c.track===track); if(!list.length) return '';
    const read=list.filter(c=>S.read[c.id]).length;
    return `<section class="chgroup"><div class="chgroup-head"><span class="sec-k ${track}">${name}</span><p>${blurb}</p><span class="n num">${read} of ${list.length} read · ${list.reduce((a,c)=>a+c.minutes,0)} min</span></div><div class="chlist">${list.map(row).join('')}</div></section>`; };
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">${CH.length} chapters · about ${CH.reduce((a,c)=>a+c.minutes,0)} minutes of reading</div><h1>Chapters</h1><p>Read in order the first time — each chapter assumes the ones before it. After that, jump to whatever the project needs.</p></div></div>
  ${group('functional','Functional','What the business configures and runs: the structures people sit in, the record that describes them, and the money, time and law that follow.')}
  ${group('technical','Technical','What the consultant builds with: loading data in bulk, writing the calculation logic, getting information back out, extending without customizing, and controlling who sees what.')}`;
  v.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>go('chapters',{ch:b.dataset.ch})));
}
function renderReader(v,c){
  const i=CH.indexOf(c); const prev=CH[i-1], next=CH[i+1];
  const terms=[...c.terms.map(id=>TERMS[id]).filter(Boolean), ...S.custom.filter(t=>t.ch===c.id)];
  v.innerHTML=`<div class="reader" data-h style="--h:${c.hue}"><article>
    <div class="ch-cover">${c.cover?`<img class="cover-img" src="${c.cover}" alt="">`:coverArt(c.num)}<div class="ch-cover-in"><span class="ch-cover-ico">${icon(c.id)}</span><span class="ch-cover-n num">${String(c.num).padStart(2,'0')}</span></div></div>
    <div class="ch-head"><div class="eyebrow">Chapter ${c.num} of ${CH.length}</div><h1>${esc(c.title)}</h1><p class="sub">${esc(c.sub)}</p><div class="meta"><span>${c.minutes} min read</span><span>·</span><span>${terms.length} key terms</span>${c.labs.length?`<span>·</span><span>${c.labs.length} interactive lab${c.labs.length>1?'s':''}</span>`:''}<label class="toggle" style="margin-left:auto"><input type="checkbox" id="readChk" ${S.read[c.id]?'checked':''}> Mark as read</label></div></div>
    <div class="prose" id="prose">${c.html}</div>
    <section class="keyterms"><h2>Key terms in this chapter</h2><div class="kt">${terms.map(t=>`<div class="row">${knownBtn(t.id)}<div><b>${esc(t.name)}${t.mine?' <span class="mine">yours</span>':''}</b><span>${esc(t.what)}</span></div></div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn sm" id="addTermBtn">+ Add a term to this chapter</button><div id="addTermForm"></div></div></section>
    <div class="ch-foot">
      <div class="notes"><span class="eyebrow">My notes on this chapter</span><textarea id="chNote" placeholder="Examples from the client, things the trainer said, questions to chase…">${esc(S.notes[c.id]||'')}</textarea></div>
      <div class="ask-box needs-sample" ${sample?'':'hidden'}><span class="eyebrow">Ask about this chapter</span><input type="text" id="askQ" placeholder="e.g. give me a Saudi example of this, or explain the PSU/TRU split like I'm the client"><div class="ans muted" id="askA">Answers are grounded in this chapter's text.</div></div>
      <div class="ch-nav">${prev?`<button class="btn" data-ch="${prev.id}">← ${esc(prev.title)}</button>`:'<span></span>'}${next?`<button class="btn primary" data-ch="${next.id}">${esc(next.title)} →</button>`:`<button class="btn primary" data-go2="drill">Go to Drill →</button>`}</div>
    </div></article>
    <aside class="reader-toc" id="toc"></aside></div>`;
  // embed labs
  v.querySelectorAll('.lab-embed').forEach(el=>{ const lab=LABS.find(l=>l.id===el.dataset.lab); if(!lab){ el.remove(); return; } el.innerHTML=`<div class="lab card"><div class="lab-head"><span class="eyebrow">Try it</span><h2>${esc(lab.title)}</h2><p>${esc(lab.lead)}</p></div><div class="lab-body"></div></div>`; lab.render(el.querySelector('.lab-body')); });
  // embed figures
  v.querySelectorAll('.fig-embed').forEach(el=>{ const f=FIGS.find(x=>x.id===el.dataset.fig); if(!f){ el.remove(); return; } el.id='fig-'+f.id; el.innerHTML=`<div class="fig-scroll">${f.svg()}</div><figcaption><b>${esc(f.title)}</b>${esc(f.caption)}</figcaption>`; });
  // toc
  const taken=new Set(); const hs=[...v.querySelectorAll('.prose h2')].filter(h=>!h.closest('.sources')&&!h.closest('.lab')); hs.forEach(h=>{ h.id=slugId(h.textContent,taken); });
  $('#toc').innerHTML=`<div class="tt">On this page</div>${hs.map(h=>`<a href="#${h.id}" data-a="${h.id}">${esc(h.textContent)}</a>`).join('')}`;
  $('#toc').querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(a.dataset.a).scrollIntoView({behavior:'smooth',block:'start'});}));
  const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ $('#toc').querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.a===en.target.id)); } }); },{rootMargin:'-10% 0px -80% 0px'}); hs.forEach(h=>io.observe(h));
  // A deep link like #chapters/hdl/h-load-order lands on that section. Consumed
  // once, so a later re-render (adding a term, say) does not yank the page back.
  if(route.sec){ const target=document.getElementById(route.sec); delete route.sec; if(target) requestAnimationFrame(()=>target.scrollIntoView({block:'start'})); }
  // wiring
  $('#readChk').addEventListener('change',e=>{ if(e.target.checked) S.read[c.id]=1; else delete S.read[c.id]; save(); toast(e.target.checked?'Chapter marked as read':'Unmarked'); });
  let nt; $('#chNote').addEventListener('input',e=>{ S.notes[c.id]=e.target.value; clearTimeout(nt); nt=setTimeout(save,400); });
  v.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>go('chapters',{ch:b.dataset.ch})));
  v.querySelectorAll('[data-go2]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go2)));
  wireKnown(v);

let glQ='', glCh=null;
function renderGlossary(v){
  const list=allTerms().filter(t=>(!glCh||t.ch===glCh)&&(!glQ||(t.name+' '+t.what+' '+(t.trap||'')).toLowerCase().includes(glQ.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  let letter=''; const rows=list.map(t=>{ const c=chById(t.ch); const L=t.name[0].toUpperCase(); const head=L!==letter?`<div class="gl-letter">${L}</div>`:''; letter=L; return head+`<div class="gterm card" data-h style="--h:${c?c.hue:210}">${knownBtn(t.id)}<div><b>${esc(t.name)}${t.mine?' <span class="mine">yours</span>':''}</b><div class="d">${esc(t.what)}</div>${t.trap?`<div class="w"><b>Watch out</b> · ${esc(t.trap)}</div>`:''}</div>${c?`<a class="go" href="#chapters/${c.id}" data-ch="${c.id}">Ch. ${c.num} →</a>`:''}${t.mine?`<button class="btn sm ghost" data-del="${t.id}">Delete</button>`:''}</div>`; }).join('');
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">${allTerms().length} terms · A to Z</div><h1>Glossary</h1><p>One definition per term, the trap that usually comes with it, and the chapter that explains it properly. Tick a term when you can say it out loud without looking.</p></div></div>
  <div class="gl-top"><input type="search" id="glSearch" placeholder="Search terms…" value="${esc(glQ)}"><div class="chk">${CH.map(c=>`<label class="${glCh===c.id?'on':''}" data-h style="--h:${c.hue}"><input type="checkbox" hidden data-gc="${c.id}">${c.num}</label>`).join('')}<span class="small muted" style="align-self:center">${glCh?chById(glCh).title:'all chapters'}</span></div></div>
  <div class="gl">${rows||'<div class="empty">No term matches.</div>'}</div>`;
  const si=$('#glSearch'); si.addEventListener('input',()=>{ glQ=si.value; const pos=si.selectionStart; renderGlossary(v); const e=$('#glSearch'); e.focus(); e.setSelectionRange(pos,pos); });
  v.querySelectorAll('[data-gc]').forEach(b=>b.addEventListener('change',()=>{ glCh=glCh===b.dataset.gc?null:b.dataset.gc; renderGlossary(v); }));
  v.querySelectorAll('[data-ch]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); go('chapters',{ch:a.dataset.ch}); }));
  v.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ S.custom=S.custom.filter(t=>t.id!==b.dataset.del); save(); renderGlossary(v); toast('Term removed'); }));
  wireKnown(v);
}

LABS.push({id:'tax',ch:'egypt-payroll',title:'Egypt salary tax & bracket elimination',lead:'Tax is annual, progressive, exemption-adjusted — the monthly figure is a slice. Turn on bracket elimination to see why a naive calculator understates tax for senior staff. Figures per the handbook (Law 7/2024); verify before quoting.',render(b){
  const BR=[[40000,0],[55000,.10],[70000,.15],[200000,.20],[400000,.225],[1200000,.25],[Infinity,.275]];
  const ELIM=[[600000,1],[700000,2],[800000,3],[900000,4],[1200000,5]]; // net income above X → first N brackets eliminated
  b.innerHTML=`<div class="calc"><div class="in card" style="padding:16px"><label>Monthly gross salary (EGP)</label><input type="number" id="txN" value="30000" step="1000" min="0"><input type="range" id="txR" min="5000" max="150000" step="1000" value="30000"><label class="toggle"><input type="checkbox" id="txE" checked> Apply bracket elimination for high earners</label><div class="small muted">Personal exemption EGP 20,000/yr · employee social insurance deducted before tax</div></div><div class="out card" style="padding:16px" id="txOut"></div></div><div class="callout"><b>Interpolated thresholds.</b> The handbook states the 600k and 700k steps explicitly and says the pattern continues to 1.2M; the 800k/900k steps here follow that pattern. Treat the exact ladder as something to confirm against the Egyptian Tax Authority.</div>`;
  const n=$('#txN'), r=$('#txR'), e=$('#txE');
  const calc=()=>{const gm=Math.max(0,+n.value||0); const iw=Math.min(16700,Math.max(2700,gm)); const si=iw*.11*12; const gross=gm*12; const net=Math.max(0,gross-20000-si);
    let elim=0; if(e.checked) ELIM.forEach(([th,k])=>{ if(net>th) elim=k; });
    let prev=0, total=0; const rows=BR.map(([up,rate],i)=>{ const dead=i<elim; const span=Math.max(0,Math.min(net,up)-prev); const inBand=span; let amt; if(dead){ amt=inBand*BR[elim][1]; } else amt=inBand*rate; total+=amt; const w=up===Infinity?(net>prev?100:0):Math.min(100,100*Math.max(0,Math.min(net,up)-prev)/(up-prev)); const row=`<div class="brk ${dead?'dead':''}"><span class="num">${fmt(prev)}–${up===Infinity?'∞':fmt(up)}</span><div class="trk"><div class="fill" style="width:${w}%"></div></div><span class="rate">${(rate*100).toFixed(rate*100%1?1:0)}%</span><span class="amt">${inBand>0?'EGP '+fmt(amt):'—'}</span></div>`; prev=up; return row;}).join('');
    $('#txOut').innerHTML=`<div class="kv"><span>Annual gross</span><b>EGP ${fmt(gross)}</b></div><div class="kv"><span>− personal exemption</span><b>EGP 20,000</b></div><div class="kv"><span>− employee social insurance (12 × 11% of insurable)</span><b>EGP ${fmt(si)}</b></div><div class="kv"><span>= Net taxable income</span><b>EGP ${fmt(net)}</b></div>
    <div class="brackets">${rows}</div>${elim?`<div class="small" style="color:var(--bad);margin-top:6px">Net income above EGP ${fmt(ELIM[elim-1][0])}: the first ${elim} bracket${elim>1?'s':''} ${elim>1?'are':'is'} eliminated — that income is taxed at the ${(BR[elim][1]*100).toFixed(1)}% band instead.</div>`:''}
    <div class="kv total" style="margin-top:8px"><span>Annual tax</span><b>EGP ${fmt(total)}</b></div><div class="kv"><span>Monthly slice (÷12)</span><b>EGP ${fmt(total/12)}</b></div>`;};

}});

  <div class="eyebrow" style="margin:16px 0 6px">Maternity · qualification plan</div><div class="bands"><div style="flex:4">4 months paid</div><div style="flex:1;background:var(--muted)">max ×3 in service</div></div><div class="small muted" style="margin-top:8px">The “three times in service” cap must be enforced in configuration, not just documented. Fathers: one paid day at birth, up to three times.</div></div></div>

/* Lab 10: HDL */
LABS.push({id:'hdl',ch:'hdl',title:'HDL file anatomy & load order',lead:'One .dat per business object, zipped flat. METADATA declares the columns, MERGE carries the data, pipes separate everything. Hover any token; then put the files in a valid load order.',render(b){
  const tip={METADATA:'Instruction keyword: this line declares the column list for the discriminator that follows. Must come before its MERGE lines.',MERGE:'Instruction keyword: create the record if it does not exist, update it if it does. (DELETE is the other one.)',JobFamily:'The discriminator — which business object / component this line is about. Two METADATA lines for the same component in one file = rejected.',JobFamilyCode:'A user key: a natural business key. Attribute names are case-sensitive.',JobFamilyName:'Attribute — must appear in the MERGE line in the same position.',EffectiveStartDate:'Date-effective start. Format yyyy/mm/dd.',EffectiveEndDate:'Date-effective end.',SALES:'Value for JobFamilyCode — this is the user key identifying the record.',Sales:'Value for JobFamilyName.','2000/01/01':'Effective from 1 January 2000.','4712/12/31':'Oracle’s “end of time”. You will see it constantly.',Worker:'Discriminator for the top of the worker hierarchy. PersonName, WorkRelationship, Assignment follow as further METADATA/MERGE pairs in the same file.',SourceSystemOwner:'Source key, part 1: which legacy system the record came from. If you use source keys, both attributes must be in METADATA.',SourceSystemId:'Source key, part 2: the record’s id in that legacy system. This is what makes reconciliation possible.',PersonNumber:'Oracle’s own identifier.',ActionCode:'HIRE, and the like — the action this row performs.',StartDate:'Start of the work relationship.',DateOfBirth:'Person-level attribute — lives on the person, not the assignment.',XXTEST:'Value of SourceSystemOwner.',XXTEST_PER1:'Value of SourceSystemId — the legacy key reconciliation runs against.',XXTEST1:'Value of PersonNumber.',HIRE:'The action.','2018/01/01':'Date value.','1975/01/01':'Date of birth.','JobFamilyId(SourceSystemId)':'Foreign reference: point at another object by naming the attribute with the key type in brackets. This is how children attach to parents.'};
  const line=(kw,parts)=>`<div class="ln"><span class="tok kw" data-tip="${kw}">${kw}</span>${parts.map(p=>`<span class="pipe-c">|</span><span class="tok ${p==='4712/12/31'?'eot':''}" data-tip="${esc(p)}">${esc(p)}</span>`).join('')}</div>`;
  const files=['Grade','Job','JobFamily','Worker']; const valid=o=>{const i=x=>o.indexOf(x); return i('JobFamily')<i('Job') && i('Grade')<i('Worker') && i('Job')<i('Worker');};
  let picked=[];
  const draw=()=>{b.innerHTML=`<div class="stage"><div class="eyebrow" style="margin-bottom:8px">JobFamily.dat — user keys</div><div class="hdl">${line('METADATA',['JobFamily','JobFamilyCode','JobFamilyName','EffectiveStartDate','EffectiveEndDate'])}${line('MERGE',['JobFamily','SALES','Sales','2000/01/01','4712/12/31'])}</div>
    <div class="eyebrow" style="margin:16px 0 8px">Worker.dat — source keys</div><div class="hdl">${line('METADATA',['Worker','SourceSystemOwner','SourceSystemId','EffectiveStartDate','EffectiveEndDate','PersonNumber','ActionCode','StartDate','DateOfBirth'])}${line('MERGE',['Worker','XXTEST','XXTEST_PER1','2018/01/01','4712/12/31','XXTEST1','HIRE','2018/01/01','1975/01/01'])}</div>
    <div class="eyebrow" style="margin:16px 0 8px">Job.dat — referencing a parent</div><div class="hdl">${line('METADATA',['Job','JobCode','JobName','JobFamilyId(SourceSystemId)','EffectiveStartDate','EffectiveEndDate'])}</div></div>
    ${explainBox('hdlEx','<span class="muted">Hover a token. Rejection reasons to memorise: METADATA after its MERGE lines; two METADATA lines for the same component; MERGE attributes not matching METADATA order; wrong case in an attribute name.</span>')}
    <div class="stage"><div class="eyebrow" style="margin-bottom:8px">Load order — files import in parallel but load sequentially; referenced data must exist first</div><div class="orderer">${files.map(f=>`<button class="node ${picked.includes(f)?'picked':''}" data-f="${f}">${f}.dat</button>`).join('')}<button class="btn sm ghost" id="hdlReset">Reset</button></div><div class="order-out" style="margin-top:10px">${picked.length?picked.map((f,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${f}.dat</span>`).join(''):'<span class="muted small">Click the files in the order they should be loaded.</span>'}</div>${picked.length===files.length?`<div class="verdict ${valid(picked)?'ok':'no'}" style="margin-top:8px">${valid(picked)?'Valid. JobFamily before Job (Job references it); Grade and Job before Worker (assignments reference both).':'Something is referenced before it exists. Job needs JobFamily first; Worker needs Grade and Job first.'}</div>`:''}</div>`;
    b.querySelectorAll('[data-tip]').forEach(t=>t.addEventListener('mouseenter',()=>{$('#hdlEx').innerHTML=`<b><code>${esc(t.dataset.tip)}</code></b><br>${esc(tip[t.dataset.tip]||'A value in this column.')}`;}));
    b.querySelectorAll('[data-f]').forEach(x=>x.addEventListener('click',()=>{picked.push(x.dataset.f);draw();})); $('#hdlReset').addEventListener('click',()=>{picked=[];draw();});};
  draw();
}});

LABS.push({id:'ff',ch:'ff',title:'Fast Formula anatomy',lead:'Inputs, defaults, logic, return — that is the whole shape. Below: the delivered-style example, then the Egyptian social insurance formula from the Day 5 drill, colour-coded by section.',render(b){
  const blk=(c,l,code)=>`<div class="blk ${c}"><div class="lb">${l}</div>${esc(code)}</div>`;
  b.innerHTML=`<div class="grid g2"><div class="stage"><div class="eyebrow" style="margin-bottom:8px">Minimal example</div><div class="ff">${blk('i','1 · Inputs','INPUTS ARE BASIC_SALARY')}${blk('d','2 · Defaults','DEFAULT FOR BASIC_SALARY IS 0')}${blk('l','3 · Logic','IF BASIC_SALARY > 35000 THEN\n  SPECIAL_ALLOWANCE = 2500\nELSE\n  SPECIAL_ALLOWANCE = 0')}${blk('r','4 · Return','RETURN SPECIAL_ALLOWANCE')}</div></div>
  <div class="stage"><div class="eyebrow" style="margin-bottom:8px">Egypt social insurance — employee share (Day 5 drill)</div><div class="ff">${blk('i','1 · Inputs','INPUTS ARE INSURABLE_WAGE')}${blk('d','2 · Defaults','DEFAULT FOR INSURABLE_WAGE IS 0\nFLOOR_AMT   = 2700\nCEILING_AMT = 16700\nEMP_RATE    = 0.11')}${blk('l','3 · Logic  (cap, then floor, THEN the rate)','CAPPED_WAGE = INSURABLE_WAGE\nIF CAPPED_WAGE > CEILING_AMT THEN\n  CAPPED_WAGE = CEILING_AMT\nIF CAPPED_WAGE < FLOOR_AMT THEN\n  CAPPED_WAGE = FLOOR_AMT\nEMP_CONTRIBUTION = CAPPED_WAGE * EMP_RATE')}${blk('r','4 · Return','RETURN EMP_CONTRIBUTION')}</div></div></div>
  <div class="grid g3"><div class="card" style="padding:12px 14px;font-size:14px"><b>Inputs vs database items.</b> Values arrive as runtime inputs, database items, or globals. Oracle prefers INPUTS where possible — no database read, faster payroll run. Worth saying in an interview.</div><div class="card" style="padding:12px 14px;font-size:14px"><b>Formula types.</b> The type fixes which inputs and contexts exist. A formula for one context will not run in another — which is why the language is learned by reading delivered formulas, not grammar.</div><div class="card" style="padding:12px 14px;font-size:14px"><b>Recognise on sight.</b> DEFAULT FOR (null fallback), ALIAS (shorten a database item), and formula-calling-formula via SET_INPUT / EXECUTE / GET_OUTPUT.</div></div>`;
}});

/* ================= DRILL ================= */
const D={mode:'questions',ch:null,queue:[],idx:0,flipped:false,rebuild:true};
function buildCards(){
  let cards=[];
  if(D.mode==='terms') cards=allTerms().filter(t=>!D.ch||t.ch===D.ch).map(t=>({id:'t:'+t.id,q:t.name,ch:t.ch,back:[{lb:'Definition',tx:t.what},t.trap?{lb:'Watch out',tx:t.trap,warn:true}:null].filter(Boolean)}));
  else if(D.mode==='questions') cards=DATA.questions.filter(q=>!D.ch||q.ch===D.ch).map((q,i)=>({id:'q:'+DATA.questions.indexOf(q),q:q.q,ch:q.ch,back:[{lb:'Model answer',tx:q.a},...q.terms.map(id=>TERMS[id]).filter(Boolean).slice(0,2).map(t=>({lb:t.name,tx:t.what}))]}));
  else cards=S.customQ.map(q=>({id:'c:'+q.id,q:q.q,ch:q.ch,back:[{lb:'Your answer',tx:q.a}],mine:true}));
  const m=c=>S.drill[c.id]||0, rnd=()=>Math.random()-.5;
  return [...cards.filter(c=>m(c)===0).sort(rnd),...cards.filter(c=>m(c)===1).sort(rnd),...cards.filter(c=>m(c)===2).sort(rnd)];
}
function renderDrill(v){
  if(D.rebuild){ D.queue=buildCards(); D.idx=0; D.flipped=false; D.rebuild=false; }
  const pr=progress(); const c=D.queue[D.idx]; const ch=c?chById(c.ch):CH[0]; const counts={0:0,1:0,2:0}; D.queue.forEach(x=>counts[S.drill[x.id]||0]++);
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">Retrieval practice · out loud, not in your head</div><h1>Drill</h1><p>Read the front, answer aloud in a sentence or two, flip, then grade yourself honestly. Missed cards come back first. "Solid" means it was said fluently twice.</p></div></div>
  <div class="drill-top"><div class="seg">${[['questions','Questions'],['terms','Terms'],['mine','Mine']].map(([k,l])=>`<button class="${D.mode===k?'active':''}" data-mode="${k}">${l}</button>`).join('')}</div>
  <div class="chk">${CH.map(x=>`<label class="${D.ch===x.id?'on':''}" data-h style="--h:${x.hue}"><input type="checkbox" hidden data-pf="${x.id}">${x.num}</label>`).join('')}<span class="small muted" style="align-self:center">${D.ch?chById(D.ch).title:'all chapters'}</span></div>
  <button class="btn sm ghost" id="shuffle" style="margin-left:auto">Reshuffle</button></div>
  ${!c?`<div class="empty">${D.mode==='mine'?'No questions of your own yet. Add one below.':'No cards match this filter.'}</div>`:`
  <div class="fc-wrap"><div>
    <div class="fc ${D.flipped?'flipped':''}" id="fc" data-h style="--h:${ch.hue}"><div class="fc-inner">
      <div class="face front"><div class="meta"><span class="chip">Ch. ${ch.num} · ${esc(ch.title)}</span>${c.mine?'<span class="mine">yours</span>':''}<span style="margin-left:auto" class="num">${D.idx+1} / ${D.queue.length}</span></div><div class="q">${esc(c.q)}</div><div class="hint">Say it out loud · click to flip · <span class="kbd">space</span></div></div>
      <div class="face back"><div class="meta"><span class="chip p">Answer</span></div><div class="a">${c.back.map(x=>`<div><div class="lb" ${x.warn?'style="color:var(--gold)"':''}>${esc(x.lb)}</div><div>${esc(x.tx)}</div></div>`).join('')}</div></div>
    </div></div>
    <div class="grade" style="margin-top:12px"><button class="btn no" data-g="0">Not yet</button><button class="btn" id="flipBtn">${D.flipped?'Show front':'Flip'}</button><button class="btn yes" data-g="1">Got it</button></div>
    <div class="selfans card needs-sample" style="padding:14px;margin-top:14px" ${sample?'':'hidden'}><span class="eyebrow">Type an answer and have it checked</span><textarea id="selfA" placeholder="One or two sentences, the way it would be said in an interview…"></textarea><div style="display:flex;gap:8px;align-items:center"><button class="btn sm primary" id="checkA">Check my answer</button><span class="small muted">Graded against the model answer, not the internet.</span></div><div class="feedback" id="fb" hidden></div></div>
  </div>
  <aside class="drill-side"><div class="card" style="padding:14px"><div class="eyebrow" style="margin-bottom:8px">This deck</div><div class="mastery"><div class="m0"><div class="big num">${counts[0]}</div><div class="lbl">new</div></div><div class="m1"><div class="big num">${counts[1]}</div><div class="lbl">shaky</div></div><div class="m2"><div class="big num">${counts[2]}</div><div class="lbl">solid</div></div></div><div class="sbar" style="margin-top:10px"><i class="s2" style="width:${pct(counts[2],D.queue.length)}%"></i><i class="s1" style="width:${pct(counts[1],D.queue.length)}%"></i><i class="s0" style="width:${pct(counts[0],D.queue.length)}%"></i></div></div>
   <div class="card" style="padding:14px"><div class="eyebrow" style="margin-bottom:6px">All cards</div><div class="small">${pr.solid} solid · ${pr.shaky} shaky · ${pr.cards-pr.solid-pr.shaky} new</div></div>

/* ================= ABOUT ================= */
function renderAbout(v){
  v.innerHTML=`<div class="view-head"><div><div class="eyebrow">About this site</div><h1>What HCM Atlas is, and how to keep it honest</h1></div></div>
  <div class="about">
  <p>HCM Atlas is a study site for people starting out as Oracle Fusion HCM Cloud functional consultants in Egypt and the Gulf. It covers the three modules most junior consultants are hired for — Core HR, Absence Management and Payroll — and the statutory and market knowledge around them that Oracle does not ship in the product.</p>
  <h2>How it is organized</h2>
  <p><strong>Chapters</strong> are written to be read, in order the first time. Each one ends with the mistakes that beginners actually make and the sources it was checked against. <strong>Labs</strong> are the same ideas as things that move: an org tree to click through, a payroll chain that shows what breaks, calculators for the Egyptian statutory rules, an HDL file to hover over. Most labs are also embedded in their chapter. The <strong>Glossary</strong> is one definition per term with the trap attached. <strong>Drill</strong> is retrieval practice: answer out loud, flip, grade yourself, and missed cards come back first.</p>
  <h2>Where the content comes from</h2>
  <p>Product concepts follow Oracle's own documentation (Implementing Global Human Resources, Implementing Absence Management, Administering Global Payroll, Securing HCM, the HCM Data Loader guides) and reputable practitioner write-ups where Oracle's text is terse. Egyptian statutory figures were checked against PwC Worldwide Tax Summaries, Deloitte and Mercans statutory alerts, and the EY, Andersen and Amereller summaries of Labour Law No. 14 of 2025. Saudi figures follow GOSI's published rates via Mercans and the Mudad/WPS employer guides. Every chapter lists its sources.</p>
  <h2>What to distrust</h2>
  <p>Statutory numbers. Egyptian insurable-wage limits rise every January under a fixed schedule; Saudi GOSI rates are being phased up through 2028; the notice period under Law 14/2025 is still summarized differently by different firms. The figures here were verified in 2026. Before configuring or quoting a figure, verify it against the authority itself — NOSI, the Egyptian Tax Authority, GOSI, the Ministry of Human Resources — or the client's legal counsel. A consultant who says "I would confirm this against the statute" is giving a strong answer, not a weak one.</p>
  <h2>Extending the site</h2>
  <p>Anyone reading can add their own terms (from any chapter) and their own drill questions (from Drill); they are stored with your progress. The site itself is a single HTML file. Chapters are authored in Markdown and compiled in; a comment at the top of the page's script explains the data structures for adding chapters, terms, questions and labs. The intent is that new knowledge — a new module, a new country's rules, a new law — is added as a chapter with its own sources, not as loose notes.</p>
  <h2>Design</h2>
  <p>Navy and gold, a serif for reading and a grotesque for the interface, and one colour per chapter carried consistently through labs, glossary and drill so the colour becomes a memory cue. Both light and dark themes are supported; the toggle is in the sidebar. The layout follows common documentation-site practice: a fixed left navigation, a reading column of about 68 characters, a right-hand table of contents on wide screens, and every wide diagram scrolling inside its own container so the page never scrolls sideways.</p>
  </div>`;
}

/* ---------------------------------------------------------------------
   COVER ART — the band at the top of a chapter. Four abstract patterns,
   picked by chapter number so neighbours never repeat, drawn in the
   chapter's own hue. A chapter with a `cover:` image in its frontmatter
   uses that photograph instead; this is the default.
   --------------------------------------------------------------------- */
function coverArt(num) {
  const pattern = num % 4;
  const open = '<svg class="cover-art" viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="ca">';
  const close = '</g></svg>';
  let body = '';

  if (pattern === 0) {                       // concentric rings
    for (let i = 0; i < 10; i++) body += `<circle cx="${40 + i * 88}" cy="80" r="${16 + (i % 4) * 15}"/>`;
  } else if (pattern === 1) {                // diagonal hatch
    for (let i = -4; i < 26; i++) body += `<path d="M${i * 40} 170 L${i * 40 + 90} -10"/>`;
  } else if (pattern === 2) {                // dot grid
    for (let r = 0; r < 5; r++) for (let c = 0; c < 25; c++) body += `<circle cx="${18 + c * 33}" cy="${18 + r * 33}" r="3.5" class="fill"/>`;
  } else {                                   // nested chevrons
    for (let i = 0; i < 12; i++) body += `<path d="M${-40 + i * 76} 170 L${10 + i * 76} 80 L${-40 + i * 76} -10"/>`;
  }
  return open + body + close;
}


/* =====================================================================
   FIGURES — static diagrams embedded in the prose with [[fig:id]].
   ---------------------------------------------------------------------
   A lab is something to push on; a figure is something to take in at a
   glance. They are deliberately different: a figure never has state, is
   never interactive, and carries no numbers that are not also in the
   chapter's text.

   Every figure is inline SVG so it inherits the theme's tokens and the
   chapter's hue (var(--p)) with no image file and no request. Draw on a
   fixed viewBox; .fig-scroll handles narrow screens.

   FIGS.push({ id, ch, title, caption, svg() })
   ===================================================================== */

const FIGS = [];

/* Small builders so the diagrams stay readable and consistent. */
const F = {
  /* A titled box. `sub` is an optional caption line, or an array of lines —
     SVG text does not wrap, so anything long has to be split by hand. */
  box(x, y, w, h, t, sub, cls = '') {
    const lines = sub == null ? [] : (Array.isArray(sub) ? sub : [sub]);
    const ty = lines.length ? y + 21 : y + h / 2 + 4.5;
    return `<g class="f-box ${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>` +
      `<text class="f-t" x="${x + 12}" y="${ty}">${t}</text>` +
      lines.map((l, i) => `<text class="f-s" x="${x + 12}" y="${y + 38 + i * 15}">${l}</text>`).join('') +
      `</g>`;
  },
  /* Column or section heading inside the drawing. */
  head(x, y, t, cls = '') {
    return `<text class="f-h ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  note(x, y, t, cls = '') {
    return `<text class="f-s ${cls}" x="${x}" y="${y}">${t}</text>`;
  },
  /* Elbow connector: down from (x1,y1), across, down into (x2,y2). */
  elbow(x1, y1, x2, y2, cls = '') {
    const mid = y1 + (y2 - y1) / 2;
    return `<path class="f-line ${cls}" d="M${x1} ${y1} V${mid} H${x2} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  down(x, y1, y2, cls = '') {
    return `<path class="f-line ${cls}" d="M${x} ${y1} V${y2}" marker-end="url(#fig-ar)"/>`;
  },
  across(x1, x2, y, cls = '') {
    return `<path class="f-line ${cls}" d="M${x1} ${y} H${x2}" marker-end="url(#fig-ar)"/>`;
  },
  /* Horizontal proportion bar: segments = [{w, label, cls}] summing to width. */
  bar(x, y, width, height, segments) {
    let at = x, out = '';
    segments.forEach(s => {
      const w = width * s.w;
      out += `<g class="f-seg ${s.cls || ''}"><rect x="${at}" y="${y}" width="${w}" height="${height}" rx="3"/>` +
        (w > 34 ? `<text class="f-bar-l" x="${at + w / 2}" y="${y + height / 2 + 4}">${s.label}</text>` : '') + `</g>`;
      at += w;
    });
    return out;
  },
};

/* Shared arrow marker; one per rendered figure. */
const FIG_DEFS = `<defs><marker id="fig-ar" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L7 4 L0 7 z" class="f-arrow"/></marker></defs>`;
