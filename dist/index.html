<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCM Atlas</title>
<meta name="description" content="Oracle Fusion HCM Cloud explained for functional consultants in Egypt and the Gulf: 17 chapters, interactive labs, a glossary and a drill deck.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="HCM Atlas">
<meta property="og:description" content="Oracle Fusion HCM Cloud explained for functional consultants in Egypt and the Gulf: 17 chapters, interactive labs, a glossary and a drill deck.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B1F3A'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='800' fill='%23B8871B' text-anchor='middle'>H</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF4; --ink:#0B1F3A; --ink-2:#2E4160; --muted:#5F6F88; --line:#D5DCE8; --line-2:#B9C4D6;
  --navy:#0B1F3A; --navy-2:#14325C; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#24406A;
  --primary:#14325C; --primary-ink:#FFFFFF; --primary-soft:#DCE6F5;
  --gold:#B8871B; --gold-soft:#F6EBD1; --sky:#2E6FB7; --sky-soft:#DCE8F7;
  --good:#237A57; --good-soft:#DCEFE5; --bad:#B03A3A; --bad-soft:#F6DFDF;
  --pl:38%; --ps:48%; --pl-soft:93%; --ps-soft:55%;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 10px 30px -14px rgba(11,31,58,.22);
  --scrim:rgba(11,31,58,.42); --pop:0 24px 70px -18px rgba(11,31,58,.45);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1628; --surface:#112036; --surface-2:#182A45; --ink:#E8EEF7; --ink-2:#C3CFE0; --muted:#8A9BB5; --line:#23364F; --line-2:#35496A;
    --navy:#070F1E; --navy-2:#0F1F38; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#1E3252;
    --primary:#6FA8E8; --primary-ink:#0A1628; --primary-soft:#1B3355;
    --gold:#E2B45C; --gold-soft:#3A2E14; --sky:#7FB3F0; --sky-soft:#1B3355;
    --good:#5FC58A; --good-soft:#153327; --bad:#F08787; --bad-soft:#3E1D1D;
    --pl:66%; --ps:48%; --pl-soft:19%; --ps-soft:32%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
    --scrim:rgba(2,7,16,.66); --pop:0 24px 70px -18px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#112036; --surface-2:#182A45; --ink:#E8EEF7; --ink-2:#C3CFE0; --muted:#8A9BB5; --line:#23364F; --line-2:#35496A;
  --navy:#070F1E; --navy-2:#0F1F38; --navy-ink:#EAF0F9; --navy-muted:#8FA3C4; --navy-line:#1E3252;
  --primary:#6FA8E8; --primary-ink:#0A1628; --primary-soft:#1B3355;
  --gold:#E2B45C; --gold-soft:#3A2E14; --sky:#7FB3F0; --sky-soft:#1B3355;
  --good:#5FC58A; --good-soft:#153327; --bad:#F08787; --bad-soft:#3E1D1D;
  --pl:66%; --ps:48%; --pl-soft:19%; --ps-soft:32%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  --scrim:rgba(2,7,16,.66); --pop:0 24px 70px -18px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.2vw,44px);font-weight:800}
h2{font-size:clamp(22px,3vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
h4{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--sky)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
code,pre{font-family:var(--mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
[data-h]{--p:hsl(var(--h) var(--ps) var(--pl));--p-soft:hsl(var(--h) var(--ps-soft) var(--pl-soft));--p-deep:hsl(var(--h) 44% 27%)}

/* ---- shell: navy rail */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;padding:22px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1a1200;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.brand-name{font-family:var(--display);font-weight:800;font-size:19px;line-height:1;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--navy-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--navy-muted);font-weight:600;font-size:14.5px;width:100%;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--navy-2);color:var(--navy-ink)}
.nav-btn.active{background:var(--navy-2);color:var(--navy-ink);box-shadow:inset 3px 0 0 var(--gold)}
.rail-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-muted);padding:16px 11px 6px;font-weight:700}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px 11px 0;border-top:1px solid var(--navy-line)}
.sync{font-size:12px;color:var(--navy-muted);display:flex;align-items:center;gap:6px;padding-top:10px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--navy-line);display:inline-block}
.sync.on i{background:var(--good)}
.theme-btn{font-size:13px;color:var(--navy-muted);display:flex;align-items:center;gap:6px;padding:4px 0}
.theme-btn:hover{color:var(--navy-ink)}
.main{padding:36px clamp(16px,4vw,52px) 100px;max-width:1160px;width:100%;min-width:0;margin-inline:auto}
/* Grid and flex items default to min-width:auto, so they refuse to shrink below
   their widest child. Without this, one wide diagram makes the whole page scroll
   sideways instead of scrolling inside its own .stage. */
.main,.reader>article,.fc-wrap>div,.lab,.lab-body,.prose,.sysmap,.stage{min-width:0}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.view-head p{max-width:64ch;color:var(--ink-2);font-family:var(--body);font-size:17px}

/* ---- common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.chip.p{background:var(--p-soft);color:var(--p)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p);display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:var(--ui)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
input[type=text],input[type=number],input[type=search],textarea,select{font:inherit;font-family:var(--ui);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--primary)}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
.ring{--v:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--p,var(--gold)) calc(var(--v)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--display)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--p,var(--gold));border-radius:3px;transition:width .3s}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.callout{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px;font-family:var(--body)}
.callout b{color:var(--gold);font-family:var(--ui)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r)}
pre.code{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0;line-height:1.65;white-space:pre;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-2);color:var(--navy-ink);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.mine{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--gold-soft);color:var(--gold);font-weight:800}

/* ---- HOME */
.hero{background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr;gap:24px;justify-items:start;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(184,135,27,.28),transparent 65%);pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:#fff;margin:8px 0 12px}
.hero p{color:var(--navy-muted);font-family:var(--body);font-size:17px;max-width:56ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .btn{border-color:var(--navy-line);background:var(--navy-2);color:var(--navy-ink)}
.hero .btn.gold{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.hero-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;position:relative;width:100%;max-width:760px;min-width:0}
.hero-side .hstat{min-width:0}
.hero-main{position:relative}
.hstat{background:var(--navy-2);border:1px solid var(--navy-line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;color:var(--navy-ink)}
.hstat:hover{border-color:var(--gold)}
.hstat .ring{--p:var(--gold)}
.hstat .ring b{background:var(--navy-2);color:var(--navy-ink)}
.hstat .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.hstat .lbl{font-size:12.5px;color:var(--navy-muted);margin-top:3px}
.sysmap{padding:24px}
.sysmap-scroll{overflow-x:auto;min-width:0}
.sysmap-inner{min-width:820px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 22px}
.layer-lbl{grid-column:1/-1;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:10px;margin-top:6px}
.layer-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.mnode{border:1px solid var(--line);border-left:4px solid var(--p);border-radius:8px;padding:11px 12px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;position:relative;display:grid;gap:3px}
.mnode:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--p)}
.mnode .t{font-family:var(--display);font-weight:700;font-size:14.5px;padding-right:40px}
.mnode .s{font-size:12.5px;color:var(--muted)}
.mnode .k{position:absolute;top:9px;right:11px;font-size:11px;color:var(--p);font-weight:800;font-family:var(--display)}
.mnode.two{grid-column:span 2}.mnode.full{grid-column:span 3}
.mnode.wide{grid-column:span 3;border-style:dashed}
.mnode .done{position:absolute;bottom:9px;right:11px;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.paths3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.path3{padding:16px 18px;display:grid;gap:6px;text-align:left;cursor:pointer}
.path3:hover{border-color:var(--primary)}
.path3 .n{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.path3 h3{font-size:16px}
.path3 p{font-size:14px;color:var(--ink-2)}

/* ---- PROGRESS CHART */
.pchart{padding:20px 22px 16px;margin-bottom:22px}
.pchart-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.pchart-head p{max-width:60ch;margin-top:4px;font-family:var(--body)}
.pchart-key{display:flex;gap:14px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.pchart-grid{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:6px;align-items:end}
.pcol{display:grid;justify-items:center;gap:5px;padding:4px 0;border-radius:8px;cursor:pointer}
.pcol:hover{background:var(--surface-2)}
.pcol-v{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pcol-trk{width:100%;max-width:26px;height:78px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.pcol-trk i{display:block;width:100%;background:var(--p);border-radius:5px;min-height:3px;transition:height .3s}
.pcol-n{font-family:var(--display);font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pcol-ok{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;background:var(--good);color:var(--surface)}
.pcol-ok.off{background:none;border:1.5px dashed var(--line-2)}

/* stacked mastery bar */
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%;transition:width .3s}
.sbar .s2{background:var(--good)}
.sbar .s1{background:var(--gold)}
.sbar .s0{background:var(--line-2)}

/* ---- ICONS + CHAPTER COVER BAND */
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.ch-cover{position:relative;height:132px;border-radius:12px;overflow:hidden;margin-bottom:22px;background:linear-gradient(115deg,var(--p-deep),var(--navy))}
.ch-cover .cover-art,.ch-cover .cover-img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch-cover .cover-img{object-fit:cover;opacity:.5}
.ch-cover .ca{fill:none;stroke:#fff;stroke-width:2;opacity:.2}
.ch-cover .ca .fill{fill:#fff;stroke:none}
.ch-cover-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,28px)}
.ch-cover-ico{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
.ch-cover-ico .ico{width:26px;height:26px;stroke-width:1.6}
.ch-cover-n{font-family:var(--display);font-size:clamp(40px,7vw,64px);font-weight:800;color:#fff;opacity:.3;line-height:1}

.chrow .n{display:grid;gap:6px;justify-items:center;align-content:center}
.chrow .n .ico{width:20px;height:20px;color:var(--p)}
.mnode .t{display:flex;align-items:flex-start;gap:8px}
.mnode .t .ico{width:17px;height:17px;color:var(--p);margin-top:1px}

/* ---- FIGURES: inline SVG diagrams embedded in the prose.
   Everything is token-driven, so a figure repaints with the theme and takes
   its accent from the chapter's hue. Text on a solid --p fill uses --surface,
   which is light when --p is dark and dark when --p is light. */
.fig-embed{margin:24px 0 28px;padding:0;min-width:0}
.fig-scroll{overflow-x:auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.fig-embed svg{display:block;width:100%;min-width:600px;height:auto}
.fig-embed figcaption{font-family:var(--ui);font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:11px}
.fig-embed figcaption b{display:block;font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:3px}

.fig-embed .f-box rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.fig-embed .f-box.accent rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.6}
.fig-embed .f-box.ghost rect{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-dasharray:5 4}
.fig-embed .f-box.ghost .f-t{fill:var(--muted)}
.fig-embed .f-t{fill:var(--ink);font-family:var(--ui);font-size:13px;font-weight:700}
.fig-embed .f-s{fill:var(--muted);font-family:var(--ui);font-size:11.5px;font-weight:500}
.fig-embed .f-s.strong{fill:var(--ink);font-weight:700}
.fig-embed .f-s.mid{text-anchor:middle}
.fig-embed .f-h{fill:var(--muted);font-family:var(--ui);font-size:10.5px;font-weight:800;letter-spacing:.09em}
.fig-embed .f-big{fill:var(--p);font-family:var(--display);font-size:26px;font-weight:800}

.fig-embed .f-line{fill:none;stroke:var(--line-2);stroke-width:1.5}
.fig-embed .f-arrow{fill:var(--line-2)}
.fig-embed .f-divide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}

.fig-embed .f-vault{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.fig-embed .f-blocked{stroke:var(--line-2);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig-embed .f-no circle{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.fig-embed .f-no path{stroke:var(--bad);stroke-width:2.2;stroke-linecap:round;fill:none}
.fig-embed .f-cap{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}

.fig-embed .f-seg rect{fill:var(--surface-2)}
.fig-embed .f-bar-l{text-anchor:middle;font-family:var(--ui);font-size:11.5px;font-weight:700;fill:var(--ink-2)}
.fig-embed .f-seg.a rect{fill:var(--p)}
.fig-embed .f-seg.a .f-bar-l{fill:var(--surface)}
.fig-embed .f-seg.b rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.2}
.fig-embed .f-seg.b .f-bar-l{fill:var(--p)}
.fig-embed .f-seg.ghost rect{fill:var(--surface-2)}
.fig-embed .f-seg.ghost .f-bar-l{fill:var(--muted)}
.fig-embed .f-seg.w1 rect{fill:var(--surface-2)}
.fig-embed .f-seg.w2 rect{fill:var(--gold-soft)}
.fig-embed .f-seg.w2 .f-bar-l{fill:var(--gold)}
.fig-embed .f-seg.w3 rect{fill:var(--bad-soft)}
.fig-embed .f-seg.w3 .f-bar-l{fill:var(--bad)}

.fig-embed .f-steps rect{fill:var(--p-soft);stroke:var(--p);stroke-width:1.4}
.fig-embed .f-step-n{text-anchor:middle;fill:var(--p);font-family:var(--display);font-size:24px;font-weight:800}
.fig-embed .f-step-l{text-anchor:middle;fill:var(--muted);font-family:var(--ui);font-size:11.5px;font-weight:600}

/* ---- Functional / Technical sections */
.sec-k{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.sec-k.technical{background:var(--sky-soft);color:var(--sky)}
.sec-lbl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.sec-lbl p{margin:0;flex:1 1 380px;font-size:14px;color:var(--muted);font-family:var(--body);max-width:78ch}
.sysmap-scroll + .sec-lbl{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}

.chgroup{margin-bottom:34px}
.chgroup-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chgroup-head p{margin:0;font-size:14.5px;color:var(--muted);font-family:var(--body);flex:1 1 340px;min-width:0}
.chgroup-head .n{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}

/* ---- CHAPTERS list */
.chlist{display:grid;gap:10px}
.chrow{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:14px 18px;text-align:left;width:100%;cursor:pointer}
.chrow:hover{border-color:var(--p)}
.chrow .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--p);line-height:1}
.chrow .n small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chrow h3{margin-bottom:2px}
.chrow .s{font-size:14px;color:var(--muted)}
.chrow .m{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chrow .m .ok{color:var(--good);font-weight:700}

/* ---- READER */
.reader{display:grid;grid-template-columns:1fr 230px;gap:40px;align-items:start}
.reader-toc{position:sticky;top:24px;display:grid;gap:4px;font-size:13.5px}
.reader-toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line);display:block}
.reader-toc a:hover,.reader-toc a.on{color:var(--ink);border-color:var(--p)}
.reader-toc .tt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 10px 6px}
.ch-head{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ch-head .eyebrow{color:var(--p)}
.ch-head h1{margin:6px 0 10px}
.ch-head .sub{font-family:var(--body);font-size:19px;color:var(--ink-2);max-width:60ch;font-style:italic}
.ch-head .meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.prose{font-family:var(--body);font-size:17.5px;line-height:1.65;color:var(--ink);max-width:none}
/* The reading measure belongs to the text, not to the column: diagrams and
   labs get the whole article width, which is wider than 68ch on a desktop. */
.prose > *{max-width:68ch}
.prose > .fig-embed,.prose > .lab-embed{max-width:none}
.prose p{margin:0 0 18px}
.prose h2{font-family:var(--display);font-size:22px;margin:38px 0 12px;scroll-margin-top:24px;letter-spacing:-.01em}
.prose h2::before{content:"";display:block;width:36px;height:3px;background:var(--p);margin-bottom:10px;border-radius:2px}
.prose strong{font-weight:600;color:var(--ink)}
.prose ul{padding-left:22px;margin:0 0 18px}
.prose li{margin-bottom:6px}
.prose blockquote{margin:0 0 20px;border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:16px}
.prose blockquote p{margin:0}
.prose blockquote strong{color:var(--gold);font-family:var(--ui)}
.prose pre{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 20px;line-height:1.65;font-size:13px}
.prose code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.85em}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose .mistakes{border:1px solid var(--line);border-radius:10px;padding:16px 18px 6px;margin:0 0 22px;background:var(--surface)}
.prose .mistakes h2{margin:0 0 10px;font-size:16px}
.prose .mistakes h2::before{display:none}
.prose .mistakes ul{padding-left:0;list-style:none;margin:0}
.prose .mistakes li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15.5px;margin:0}
.prose .mistakes li::before{content:"✕";color:var(--bad);font-weight:800;font-family:var(--ui);flex:none}
.prose .sources{font-family:var(--ui);font-size:13.5px;color:var(--muted);margin-top:8px}
.prose .sources h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:30px 0 8px}
.prose .sources h2::before{display:none}
.prose .sources ul{padding-left:0;list-style:none}
.prose .sources li{margin-bottom:6px;padding-left:14px;text-indent:-14px}
.prose .sources a{word-break:break-all}
.lab-embed{margin:8px 0 26px;font-family:var(--ui);font-size:15px;line-height:1.5}
.lab-embed .lab{padding:20px}
.lab-embed .lab-head h2{margin:0;font-size:18px}
.lab-embed .lab-head h2::before{display:none}
.keyterms{margin:34px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.keyterms h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.kt{display:grid;gap:8px}
.kt .row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kt .row b{font-family:var(--display);font-size:14.5px;display:block}
.kt .row span{font-size:14px;color:var(--ink-2)}
.known{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;margin-top:2px}
.known svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.known.on{background:var(--good);border-color:var(--good);color:#fff}
.ch-foot{margin-top:30px;display:grid;gap:14px}
.ch-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ch-nav .btn{max-width:48%}
.notes{display:grid;gap:6px}
.ask-box{display:grid;gap:8px;background:var(--surface-2);border-radius:10px;padding:14px}
.ask-box .ans{font-size:15px;white-space:pre-wrap;color:var(--ink-2);font-family:var(--body)}

/* ---- GLOSSARY */
.gl-top{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}
.gl-top input{max-width:420px}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk label{font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-weight:700}
.chk label.on{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.gl-letter{font-family:var(--display);font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.09em;margin:22px 0 8px}
.gl{display:grid;gap:8px}
.gterm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px}
.gterm b{font-family:var(--display);font-size:15.5px}
.gterm .d{font-size:14.5px;color:var(--ink-2);font-family:var(--body);margin-top:2px}
.gterm .w{font-size:13.5px;color:var(--ink-2);margin-top:6px;padding-left:10px;border-left:2px solid var(--gold)}
.gterm .w b{font-family:var(--ui);font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.gterm .go{font-size:12px;color:var(--p);font-weight:700;white-space:nowrap;text-decoration:none;font-family:var(--ui)}
.add-form{display:grid;gap:8px;padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);margin-top:14px}
.add-form label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ---- LABS (shared with embeds) */
.labs-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.labs-nav button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.labs-nav button.active{background:var(--p);color:#fff;border-color:var(--p)}
.lab{padding:24px;display:grid;gap:18px;font-family:var(--ui)}
.lab-head{display:flex;flex-direction:column;gap:4px}
.lab-head .eyebrow{color:var(--p)}
.lab-head p{color:var(--ink-2);max-width:70ch;margin-top:4px;font-size:15px}
.stage{background:var(--surface-2);border-radius:var(--r);padding:18px;overflow-x:auto}
.explain{padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-height:64px;font-size:15px}
.explain b{font-family:var(--display)}
.explain .muted{font-size:13.5px}
.node{border:1.5px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink)}
.node:hover,.node.active{border-color:var(--p);color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
.node.ghost{border-style:dashed;color:var(--muted);font-weight:500}
.node small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.node.active small{color:var(--p)}
.tree{display:grid;gap:26px;min-width:720px}
.tier{display:flex;justify-content:center;gap:14px;position:relative}
.tier+.tier::before{content:"";position:absolute;top:-26px;left:50%;height:26px;width:1.5px;background:var(--line-2)}
.tier .node{min-width:150px;position:relative}
.tier.split{justify-content:space-around}
.tier.split::before{width:60%;left:20%;height:1.5px;top:-14px}
.tier.split::after{content:"";position:absolute;top:-26px;left:50%;height:12px;width:1.5px;background:var(--line-2)}
.tier.split .node::before{content:"";position:absolute;top:-14px;left:50%;width:1.5px;height:14px;background:var(--line-2)}
.ldg-box{border:2px dashed var(--p);border-radius:12px;padding:14px;display:grid;gap:10px;position:relative;flex:1;max-width:340px}
.ldg-box .lg{position:absolute;top:-10px;left:12px;background:var(--surface-2);padding:0 6px;font-size:11px;font-weight:800;color:var(--p);letter-spacing:.06em;text-transform:uppercase}
.pipe{display:flex;align-items:stretch;min-width:760px}
.pipe .node{flex:1;border-radius:0;position:relative;padding:10px 8px 10px 16px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);border:0;background:var(--surface)}
.pipe .node:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:6px 0 0 6px}
.pipe .node:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%);border-radius:0 6px 6px 0}
.pipe .node.active{background:var(--p);color:#fff}
.pipe .node.active small{color:#fff;opacity:.85}
.pipe .node:hover{box-shadow:none}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{padding:6px 12px;border-radius:6px;border:1px solid var(--line-2);font-size:13px;font-weight:700;background:var(--surface)}
.stepper button.active{background:var(--p);color:#fff;border-color:var(--p)}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.obj{padding:10px 12px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font-size:13.5px;transition:all .25s}
.obj .t{font-weight:800;font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.obj .v{margin-top:2px}
.obj.live{border-color:var(--good);background:var(--good-soft)}
.obj.new{border-color:var(--p);background:var(--p-soft);animation:pop .3s}
.obj.dead{opacity:.55;text-decoration:line-through;border-style:dashed}
.obj.off{opacity:.3;border-style:dashed}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.counter{display:flex;gap:14px;flex-wrap:wrap}
.counter div{padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-width:120px}
.counter .big{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;color:var(--p)}
.counter .lbl{font-size:12px;color:var(--muted)}
.tl{position:relative;padding:22px 0 8px;min-width:600px}
.tl-line{height:3px;background:var(--line-2);border-radius:2px;position:relative}
.tl-seg{position:absolute;top:0;height:3px;border-radius:2px;background:var(--p)}
.tl-seg.old{background:var(--muted)}
.tl-seg.gone{background:repeating-linear-gradient(90deg,var(--bad) 0 6px,transparent 6px 10px)}
.tl-mark{position:absolute;top:-8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.tl-mark i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--p);display:block}
.tl-mark.warn i{border-color:var(--gold)}
.tl-lbl{position:absolute;top:14px;transform:translateX(-50%);font-size:12.5px;font-weight:600;white-space:nowrap}
.tl-row{position:relative;height:56px}
.calc{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;align-items:start}
.calc .in{display:grid;gap:10px}
.calc .in label{font-size:13px;font-weight:700;color:var(--ink-2)}
.calc .out{display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
.kv.total{font-size:17px}
.kv.total b{color:var(--p)}
.hbar{display:grid;gap:6px;margin-top:8px}
.hbar .row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:10px;font-size:13.5px}
.hbar .trk{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.hbar .fill{height:100%;background:var(--p);border-radius:4px;transition:width .3s}
.hbar .fill.cap{background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.5}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.brackets{display:grid;gap:4px;margin-top:6px}
.brk{display:grid;grid-template-columns:120px 1fr 70px 110px;gap:10px;align-items:center;font-size:13.5px;padding:5px 8px;border-radius:6px;transition:opacity .2s}
.brk .trk{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.brk .fill{height:100%;background:var(--p);transition:width .3s}
.brk.dead{opacity:.35}
.brk.dead .rate{text-decoration:line-through;color:var(--bad)}
.brk .rate{font-weight:800;font-family:var(--display)}
.brk .amt{text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.ladder{display:flex;align-items:flex-end;gap:14px;min-height:190px;padding-top:10px}
.rung{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rung .col{width:100%;background:var(--p);border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;opacity:.85}
.rung:hover .col,.rung.active .col{opacity:1;filter:brightness(1.1)}
.rung .lbl{font-size:12.5px;text-align:center;color:var(--ink-2);line-height:1.25}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.plan{padding:12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.plan:hover,.plan.active{border-color:var(--p);box-shadow:0 0 0 3px var(--p-soft)}
.plan b{font-family:var(--display);display:block}
.plan small{color:var(--muted);font-size:12.5px}
.bands{display:flex;gap:4px;height:34px;margin-top:6px}
.bands div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border-radius:4px;background:var(--p)}
.bands div:nth-child(2){filter:brightness(1.2)}
.scen{display:grid;gap:8px}
.scen button{text-align:left;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:14.5px}
.scen button:hover,.scen button.active{border-color:var(--p)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.path{padding:12px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);transition:all .25s;font-size:13.5px}
.path b{font-family:var(--display);display:block;font-size:15px}
.path.win{border-color:var(--good);background:var(--good-soft)}
.path.lose{opacity:.4}
.hdl{display:grid;gap:2px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.hdl .ln{display:flex}
.hdl .tok{padding:0 4px;border-radius:4px;cursor:default;border:1px solid transparent}
.hdl .tok:hover,.hdl .tok.hl{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.hdl .kw{font-weight:700;color:var(--p)}
.hdl .pipe-c{color:var(--muted)}
.hdl .eot{color:var(--gold);font-weight:600}
.orderer{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orderer .node{min-width:110px}
.orderer .node.picked{opacity:.35;pointer-events:none}
.order-out{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px;padding:8px;border:1.5px dashed var(--line-2);border-radius:8px}
.order-out .node{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.order-out .arrow{color:var(--muted)}
.verdict{font-weight:700;font-size:14px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.ff{font-family:var(--mono);font-size:13.5px;line-height:1.75;display:grid;gap:8px;overflow-x:auto}
.ff .blk{padding:6px 12px;border-left:3px solid var(--p);border-radius:0 6px 6px 0;background:var(--surface);white-space:pre}
.ff .blk .lb{font-family:var(--ui);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p);margin-bottom:2px}
.ff .blk.i{--p:hsl(214 var(--ps) var(--pl))}.ff .blk.d{--p:hsl(46 var(--ps) var(--pl))}.ff .blk.l{--p:hsl(152 var(--ps) var(--pl))}.ff .blk.r{--p:hsl(4 var(--ps) var(--pl))}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:520px}
.secgrid .cell{padding:14px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface)}
.secgrid .cell h4{margin-bottom:6px}
.secgrid .cell ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.phases{display:flex;min-width:820px}
.phase{flex:1;position:relative;padding:12px 10px 12px 18px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-right:0;text-align:left}
.phase:first-child{border-radius:8px 0 0 8px}.phase:last-child{border-radius:0 8px 8px 0;border-right:1px solid var(--line)}
.phase b{font-family:var(--display);font-size:13.5px;display:block}
.phase small{font-size:11.5px;color:var(--muted)}
.phase.active,.phase:hover{background:var(--p-soft);color:var(--p)}
.phase.active small{color:var(--p)}
.people{display:flex;gap:6px;flex-wrap:wrap}
.person{width:34px;height:44px;border-radius:6px 6px 3px 3px;background:var(--p);position:relative;cursor:pointer;opacity:.9;transition:all .2s;overflow:hidden}
.person::after{content:"";position:absolute;inset:0;background:var(--surface-2);transform:translateY(100%);transition:transform .25s}
.person.half::after{transform:translateY(50%)}
.person:hover{opacity:1}

/* ---- DRILL */
.drill-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg button.active{background:var(--primary);color:var(--primary-ink)}
.fc-wrap{display:grid;grid-template-columns:1fr 280px;gap:22px;align-items:start}
.fc{perspective:1200px;min-height:320px;cursor:pointer}
.fc-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:320px}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;gap:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.face.front{background:var(--navy);color:var(--navy-ink);border-color:var(--navy-line)}
.face.front .chip{background:var(--navy-2);color:var(--gold)}
.face.front .hint,.face.front .meta{color:var(--navy-muted)}
.face.back{transform:rotateY(180deg);overflow:auto}
.face .q{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.25;margin:auto 0}
.face .a{font-size:15.5px;color:var(--ink);display:grid;gap:10px;overflow:auto;font-family:var(--body)}
.face .a .lb{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p);font-family:var(--ui)}
.face .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.face .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.grade{display:flex;gap:8px;flex-wrap:wrap}
.grade .btn{flex:1;justify-content:center}
.grade .no{border-color:var(--bad);color:var(--bad)}.grade .yes{border-color:var(--good);color:var(--good)}
.drill-side{display:grid;gap:12px}
.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mastery div{padding:10px 6px;border-radius:8px;background:var(--surface-2)}
.mastery .big{font-family:var(--display);font-size:22px;font-weight:800;line-height:1}
.mastery .lbl{font-size:11.5px;color:var(--muted)}
.mastery .m0 .big{color:var(--muted)}.mastery .m1 .big{color:var(--gold)}.mastery .m2 .big{color:var(--good)}
.selfans{display:grid;gap:8px}
.feedback{font-size:14.5px;white-space:pre-wrap;background:var(--surface-2);padding:10px 12px;border-radius:8px;color:var(--ink-2);font-family:var(--body)}

/* ---- ABOUT */
.about{max-width:68ch;font-family:var(--body);font-size:17px;line-height:1.65}
.about h2{font-family:var(--display);font-size:20px;margin:30px 0 10px}
.about p{margin:0 0 16px}
.about ul{padding-left:22px}
.about code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.85em}

/* ---- SEARCH: rail trigger + command palette */
.search-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;margin-bottom:10px;border-radius:8px;border:1px solid var(--navy-line);background:var(--navy-2);color:var(--navy-muted);font-family:var(--ui);font-weight:600;font-size:14px}
.search-btn:hover{color:var(--navy-ink);border-color:var(--gold)}
.search-btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search-btn .kbd{margin-left:auto;color:var(--navy-muted);border-color:var(--navy-line);font-size:10px}

.pal-lock{overflow:hidden}
.pal{position:fixed;inset:0;z-index:60;display:grid;place-items:start center;padding:10vh 16px 16px}
.pal-bg{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px)}
.pal-box{position:relative;width:min(720px,100%);max-height:76vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--pop);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.pal-in input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:600;padding:2px 0}
.pal-in input::placeholder{color:var(--muted);font-weight:500}
.pal-in input:focus-visible{outline:none}
.pal-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.pal-row{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:9px;border-left:3px solid transparent}
.pal-row.on{background:var(--surface-2);border-left-color:var(--p,var(--gold))}
.pal-kind{flex:none;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--p,var(--muted));width:62px}
.pal-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.pal-t{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);line-height:1.3}
.pal-sub{font-size:12px;color:var(--muted);font-weight:600}
.pal-snip{font-family:var(--body);font-size:13.5px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pal mark{background:var(--gold-soft);color:var(--ink);font-weight:700;border-radius:3px;padding:0 1px}
.pal-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.pal-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600}
.pal-foot .kbd{margin-right:3px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px;z-index:40;justify-content:space-around;border-top:1px solid var(--navy-line)}
  .brand,.rail-foot,.rail-sec{display:none}
  .search-btn{flex-direction:column;gap:3px;width:auto;margin:0;padding:6px 4px;border:0;background:none;font-size:10.5px}
  .search-btn .kbd{display:none}
  .search-btn svg{width:20px;height:20px}
  .pal{padding:6vh 10px 10px}
  .pal-box{max-height:84vh}
  .pal-kind{width:auto;min-width:52px}
  .nav-btn{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;width:auto}
  .nav-btn.active{box-shadow:none}
  .main{padding:20px 14px 110px}
  .hero{grid-template-columns:1fr}
  .reader{grid-template-columns:1fr}
  .reader-toc{display:none}
  .fc-wrap{grid-template-columns:1fr}
  .calc{grid-template-columns:1fr}
  .brk{grid-template-columns:90px 1fr 50px 90px;font-size:12px}
  .pchart-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
  .pcol-trk{height:52px}
  .pcol-v{display:none}
  .chrow{grid-template-columns:44px 1fr}
  .chrow .m{grid-column:2}
  .gterm{grid-template-columns:auto 1fr}
  .gterm .go{grid-column:2}
}

<script id="hcm-data" type="application/json">{"chapters":[{"id":"org","num":1,"track":"functional","title":"Enterprise & Organizational Structures","sub":"The compliance skeleton — legal view versus operational view","hue":214,"minutes":9,"labs":["org"],"terms":["enterprise","legal-entity","legal-employer","payroll-statutory-unit-psu","tax-reporting-unit-tru","legislative-data-group-ldg","business-unit-bu","department","division","location"],"html":"<p>Every Oracle HCM implementation starts here, because nothing else can be configured until these objects exist. The single hardest idea in this chapter is also the most important one: Oracle deliberately keeps two pictures of the same company. The <strong>legal<\/strong> picture answers the questions a government asks — who is registered, who employs, who pays, who reports. The <strong>operational<\/strong> picture answers the questions a manager asks — who runs what, who sits where, who may see whose data. In real companies the two rarely line up, and Oracle's structure exists precisely so they don't have to.<\/p>\n<figure class=\"fig-embed\" data-fig=\"legal-vs-operational\"><\/figure>\n\n<h2>One enterprise, many legal entities<\/h2>\n<p>The <strong>enterprise<\/strong> is the single top node of the whole structure. There is exactly one per implementation. It is a container for enterprise-wide settings — person-number generation, worker-number sequencing, global defaults — and it is not a legal concept. It never appears on a government form. For a holding company with a factory and a trading arm, the enterprise is the group; the registered companies underneath are something else.<\/p>\n<p>Those registered companies are <strong>legal entities<\/strong>: organizations recognized by law that can own assets, sign contracts, incur liabilities and be sued. In Egypt each one has its own commercial register number and tax card. Oracle creates them through the Legal Entity Configurator, and the first job on any project is to work out how many there really are. The commercial registers give the definitive answer; the org chart does not.<\/p>\n<p>A legal entity on its own employs nobody. To hire anyone into it, the entity must be classified as a <strong>legal employer<\/strong>. Oracle makes \"employer\" a classification you switch on rather than something every legal entity is assumed to be, because some entities exist only to hold property or issue invoices. Every worker belongs to exactly one legal employer at a time, through their work relationship (Chapter 3). Change the legal employer and you have changed who legally employs the person — a materially different event from changing their department.<\/p>\n<blockquote>\n<p><strong>Interview classic.<\/strong> \"What is the difference between a legal entity and a legal employer?\" A legal employer is a classification applied to a legal entity that enables it to employ workers. Not every legal entity is a legal employer. Treating the two as synonyms is the most common miss in this whole area.<\/p>\n<\/blockquote>\n<h2>Who pays, and who reports<\/h2>\n<p>Two more classifications sit on the legal entity, both about payroll. A <strong>payroll statutory unit (PSU)<\/strong> is a legal entity responsible for paying workers and remitting payroll tax and social insurance to the authorities. It is the level at which a person's payroll records are grouped for statutory calculation and reporting — in Egypt, the entity that files with NOSI and the Egyptian Tax Authority. Oracle's documentation puts the relationship plainly: when a legal entity is identified as a legal employer but not as a PSU, it must be given a parent PSU, and its reporting units are created as children of that parent.<\/p>\n<p>Beneath the PSU sits the <strong>tax reporting unit (TRU)<\/strong>: the reporting face of the PSU toward tax and social-insurance authorities. Oracle describes the TRU as the HCM version of a \"legal reporting unit\" and says it exists \"to group workers for the purpose of tax and social insurance reporting.\" A single PSU may need to report under more than one registration number, and the TRU gives it a level to hang that on. Statutory reports are typically run per TRU, and a person is linked to a TRU through their calculation cards.<\/p>\n<p>The practical design question on a multi-company client is therefore: which legal entities are PSUs, and which are legal employers reporting under a parent PSU? A group with three registered companies in Egypt may well have three PSUs. Do not assume one per country.<\/p>\n<h2>The hard boundary: legislative data groups<\/h2>\n<p>A <strong>legislative data group (LDG)<\/strong> is a partition that isolates payroll and related legislative data by country. All payroll configuration — elements, balances, formulas — lives inside exactly one LDG. Egyptian payroll rules must never leak into Saudi payroll rules, and the LDG is the boundary that guarantees it. An element defined in the Egypt LDG simply does not exist in the Saudi LDG; it must be built again. When someone asks \"why can't I see my element?\", the first thing to check is which LDG they are in.<\/p>\n<figure class=\"fig-embed\" data-fig=\"ldg-wall\"><\/figure>\n\n<h2>The operational picture<\/h2>\n<p>The <strong>business unit (BU)<\/strong> is an operational grouping used for processing transactions, sharing reference data such as jobs and grades, and controlling data access. It is not a legal registration. A shared-services centre may serve three legal entities; a single legal entity may contain several business units. Clients decide based on how they actually run the business, and they conflate \"how are we registered\" with \"how do we operate\" constantly. Keeping the two apart is the consultant's job.<\/p>\n<p>Below the BU, the <strong>department<\/strong> is the box on the org chart that a worker actually sits in — the natural unit for headcount reporting and manager hierarchies. It exists independently of whoever currently manages it, which is why manager changes never require a new department. A <strong>division<\/strong> is a broader management-reporting layer above departments, aligned to a product line or geography, and is used for analytics rather than transaction processing. A <strong>location<\/strong> is a physical work site with an address; it matters because statutory jurisdiction, working-time rules, allowances and public-holiday calendars are frequently driven by where the person physically works. In the Gulf especially, location often decides allowance eligibility.<\/p>\n<div class=\"lab-embed\" data-lab=\"org\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Describing the enterprise as \"the company\". The company is a legal entity; the enterprise is the whole group.<\/li>\n<li>Assuming a legal entity can hire. It cannot until it is classified as a legal employer.<\/li>\n<li>Assuming one PSU per country. Map legal entities to PSUs deliberately.<\/li>\n<li>Expecting to reuse one element library across countries. Each LDG is its own world.<\/li>\n<li>Calling a business unit \"just another word for department\". A BU is a processing and access construct; departments sit below it.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Payroll<\/em> — \"What's a tax reporting unit?\" and related legal-entity classification topics. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/fapcd/what-s-a-tax-reporting-unit.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/fapcd/what-s-a-tax-reporting-unit.html<\/a><\/li>\n<li>Maverick Solutions, \"Effectively using legislations and legislative data groups in Oracle Cloud HCM Payroll\". <a href=\"https://mavericksolutions.com/2021/06/15/legislations-and-legislative-data-groups-in-oracle-cloud-hcm-payroll/\" target=\"_blank\" rel=\"noopener\">https://mavericksolutions.com/2021/06/15/legislations-and-legislative-data-groups-in-oracle-cloud-hcm-payroll/<\/a><\/li>\n<li>Apps2Fusion, \"Legal Entity and Legal Employer in Fusion Application\". <a href=\"https://apps2fusion.com/old/oracle-fusion-online-training/1519-legal-entity-and-legal-employer-in-fusion-application\" target=\"_blank\" rel=\"noopener\">https://apps2fusion.com/old/oracle-fusion-online-training/1519-legal-entity-and-legal-employer-in-fusion-application<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"workforce","num":2,"track":"functional","title":"Workforce Structures","sub":"Jobs, positions, grades — what work exists and at what level","hue":200,"minutes":6,"labs":["jobpos"],"terms":["job","position","grade","grade-step","job-family"],"html":"<p>If Chapter 1 is the compliance skeleton, this is the work skeleton: how an organization defines what work exists, at what level, and in which seat. One distinction in this chapter — job versus position — is the most frequently tested concept in Oracle HCM interviews, and the fastest way to look unprepared in front of a trainer is to treat the two as synonyms.<\/p>\n<h2>Job: what the work is<\/h2>\n<p>A <strong>job<\/strong> is a generic definition of a role, independent of the organization chart. It carries attributes such as a grade range, required qualifications and a job family. Most roles repeat across an organization, so defining \"Accountant\" once and reusing it everywhere avoids duplicating the same definition dozens of times. The Finance department in Cairo, the plant in 10th of Ramadan City and the Alexandria branch can all use the same job. In a job-based (non-position) organization, the assignment carries job, department and location as separate fields; this is the common pattern in Egyptian private companies.<\/p>\n<h2>Position: a specific seat<\/h2>\n<p>A <strong>position<\/strong> is a specific, individual seat: a job tied to a particular department and location, which exists whether or not anyone currently fills it. \"Accountant #3, Finance Department, Alexandria Plant\" carries its own headcount budget, reporting line and FTE. When the incumbent leaves, the position remains and becomes vacant — and a vacancy is a real, reportable thing.<\/p>\n<p>Organizations that budget headcount need to track seats independently of people. Position management is therefore standard in government, oil and gas, banking and most Gulf entities. It brings vacancy reporting and stricter headcount control, at the cost of more setup and maintenance. A consultant aiming at the Gulf market should learn position management properly rather than treating it as an optional extra.<\/p>\n<div class=\"lab-embed\" data-lab=\"jobpos\"><\/div>\n\n<h2>Grades and steps<\/h2>\n<p>A <strong>grade<\/strong> is a level in the hierarchy, used to control compensation ranges and eligibility for benefits or allowances — \"G1\" through \"G12\", or \"Junior / Senior / Lead / Principal\". Grades carry rate ranges (minimum, midpoint, maximum). They drive eligibility constantly: \"only G7 and above get the car allowance\" is a sentence a consultant hears and then configures. Grade is not the same as salary. Grade is a level; money attaches to it through rate ranges and the salary basis (Chapter 5), and the two are linked but distinct objects.<\/p>\n<p>A <strong>grade step<\/strong> is an increment within a single grade, used where progression happens in defined steps rather than across a continuous range. Steps are grouped into grade ladders. Grade G5 might have steps 1 through 8, each with a defined rate; an annual increment moves a person from step 3 to step 4 without changing their grade. Government and unionized pay scales work this way, which makes steps highly relevant in the Gulf public sector and in Egyptian government-linked entities. If a client has a step-based scale and the design uses a plain grade rate range, the design is wrong.<\/p>\n<p>A <strong>job family<\/strong> groups related jobs — all finance jobs, all engineering jobs — for career-path design, reporting and shared eligibility rules. It is recognition-level for Core HR and becomes more important in Talent Management.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Defining a job as a specific seat. That is a position.<\/li>\n<li>Saying \"grade equals salary\". Grade is a level; rate ranges and the salary basis carry the money.<\/li>\n<li>Designing a continuous rate range for a client whose scale is actually step-based.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — Jobs and Positions; Grades, Grade Rates and Grade Ladders. <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigh/\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigh/<\/a><\/li>\n<li>Oracle, \"Employment Model\" (positions and assignments in the employment hierarchy). <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"model","num":3,"track":"functional","title":"The Employment Data Model","sub":"Person → work relationship → assignment. There is no employee table.","hue":246,"minutes":10,"labs":["model"],"terms":["person","work-relationship","work-terms","assignment","payroll-relationship","concurrent-employment","global-transfer","worker-types"],"html":"<p>This is the single most important structure in the product. Payroll, absence, security and reporting all read from it. If a new consultant learns only one chapter cold, it should be this one. The core insight: there is no employee table. A human being, that human's relationship to an employer, and the details of the job they do are three separate objects. Knowing which attribute lives on which object is the actual skill.<\/p>\n<h2>Person: the human, held once<\/h2>\n<p>The <strong>person<\/strong> record represents a human being and is held once, globally, across the entire enterprise. It carries what is true of the human regardless of any employer: name, date of birth, national identifier, personal contact details, nationality. A person may work for one company, leave, and return years later, or work for two group companies at once; their date of birth does not change with any of that. Storing it once avoids contradictions. One person record exists per human, no matter how many employments they have had.<\/p>\n<h2>Work relationship: the legal link<\/h2>\n<p>A <strong>work relationship<\/strong> is the link between a person and one legal employer. Oracle describes it as the legal connection between a person and a legal employer, carrying the worker type and the start date of that employment. Terminating employment end-dates the work relationship; it does not delete the person. A person can hold more than one work relationship — for example a contingent-worker relationship with one group company and an employee relationship with another.<\/p>\n<p>The <strong>worker type<\/strong> recorded on the work relationship is one of employee, contingent worker, pending worker or non-worker. A pending worker is someone hired but not yet started, so that onboarding can begin before day one. A non-worker might be a retiree or a board member. Worker type maps to a payroll relationship type, which decides whether the person is included in payroll runs at all; a contingent worker may be excluded from payroll entirely.<\/p>\n<h2>Assignment: the job details<\/h2>\n<p>The <strong>assignment<\/strong> carries the actual job details: business unit, department, job, position, grade, location, manager, working hours, assignment status, and the standing data payroll reads. Job details change often — promotions, transfers, hours changes — while the person and the employer stay the same, so isolating them in their own date-effective object keeps the history clean. Almost every lifecycle transaction is a dated change against the assignment, which is why a consultant spends most of their configuration life here.<\/p>\n<p>Oracle offers two shapes for the hierarchy. In the <strong>two-tier<\/strong> model, the default, a work relationship holds assignments directly. In the <strong>three-tier<\/strong> model an optional layer called <strong>employment terms<\/strong> (also called work terms) sits between them to group contractual attributes — working hours, grade, collective agreement, contract details — across several assignments. Two-tier is the more common choice in new implementations; the three-tier model exists for organizations that need one set of contractual terms covering multiple assignments. \"What is the difference between employment terms and an assignment?\" is a standard question: terms group contractual and compensation attributes; the assignment holds the actual job details.<\/p>\n<h2>Payroll relationship: where payroll actually runs<\/h2>\n<p>Parallel to this hierarchy sits the <strong>payroll relationship<\/strong>, which links the person to a payroll statutory unit. It is the highest level of the payroll employment model and groups a person's assignments for statutory calculation and reporting. Tax and social insurance must be calculated on a person's total earnings within a statutory unit, not per assignment — if someone holds two assignments, their social insurance cannot be calculated twice in isolation. Oracle creates the payroll relationship automatically on hire. Payroll processing always occurs at the payroll relationship level, balances aggregate there, and — critically — <strong>balances do not span payroll relationships<\/strong>.<\/p>\n<p><strong>Concurrent employment<\/strong> means one person holding several simultaneous assignments under one work relationship, or several work relationships across different legal employers: a lecturer who also runs a research lab, a doctor employed by a hospital who also works clinic hours. Assignments grouped in one payroll relationship must share the same PSU and person type.<\/p>\n<h2>The canonical worked example: a global transfer<\/h2>\n<p>A <strong>global transfer<\/strong> moves a worker from one legal employer to another, typically across countries. Legally that is a new employment, not an edit to an existing one — different country, different legislation, different statutory registration. The source work relationship is terminated and a new one is created under the destination legal employer; a new payroll relationship is created under the destination PSU, in a different LDG. The person record is unchanged throughout. Because balances never span payroll relationships, year-to-date figures start fresh in the new country.<\/p>\n<p>Be able to narrate this end to end and give the counts at the end: one person record, two work relationships (one ended), two payroll relationships (one ended).<\/p>\n<div class=\"lab-embed\" data-lab=\"model\"><\/div>\n\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Believing there is an employee table. There is a person, a work relationship and an assignment.<\/li>\n<li>Confusing termination of a work relationship with deletion of the person. The person survives.<\/li>\n<li>Assuming every implementation has employment terms. Two-tier omits that layer entirely.<\/li>\n<li>Thinking payroll runs against the assignment. It runs against the payroll relationship.<\/li>\n<li>Expecting balances to carry across a global transfer. They do not.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Human Resources<\/em> — \"Employment Model\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/24a/faigh/employment-model.html<\/a><\/li>\n<li>Oracle, <em>Administering Global Payroll<\/em> — \"Overview of Administering Payroll Relationships\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html<\/a><\/li>\n<li>Future Proof Technologies, \"HCM Employment Model in Oracle Fusion HCM Cloud\". <a href=\"https://medium.com/@futureprooftrainings/hcm-employment-model-in-oracle-fusion-hcm-cloud-0ec24a4e638a\" target=\"_blank\" rel=\"noopener\">https://medium.com/@futureprooftrainings/hcm-employment-model-in-oracle-fusion-hcm-cloud-0ec24a4e638a<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"dating","num":4,"track":"functional","title":"Effective Dating","sub":"Nothing is deleted. Everything has the date it became true.","hue":278,"minutes":6,"labs":["dating"],"terms":["effective-date","update-vs-correction","retroactive-change-retro","end-dating"],"html":"<p>Oracle HCM is a date-effective system. Almost nothing is ever deleted; changes are recorded with the date on which they become true in the real world. People coming from transactional systems trip over this more than anything else, and it has direct payroll consequences.<\/p>\n<h2>The effective date is not the entry date<\/h2>\n<p>The <strong>effective date<\/strong> is the date on which a change becomes true — not the date it was typed into the system. HR reality and data entry rarely happen on the same day: a promotion effective 1 January may be entered on 15 January, and the system must know the person was at the new grade from the first. Every date-effective record has a start date and an end date. Setting the effective date correctly is the difference between a correct payslip and a retroactive correction, and most \"the system calculated it wrong\" tickets turn out to be effective-date errors. The system tracks the entry date separately, for audit.<\/p>\n<h2>Update versus correction<\/h2>\n<p>An <strong>update<\/strong> creates a new dated record and preserves history. A <strong>correction<\/strong> overwrites the existing record as if the previous value was never true. Some changes are real events — a promotion — and some are data-entry mistakes — a typo in a grade. The system needs to tell real history from erroneous history.<\/p>\n<p>Promoting someone on 1 July is an update: both the old and the new grade belong in history because both were true. Fixing a misspelled surname is a correction: the old spelling was never true and should not be preserved. Using a correction to record a real-world change destroys legitimate history and can trigger incorrect retroactive payroll; it is the one habit that corrupts an audit trail silently.<\/p>\n<div class=\"lab-embed\" data-lab=\"dating\"><\/div>\n\n<h2>Retroactive changes<\/h2>\n<p>A <strong>retroactive change<\/strong> (\"retro\") is a change entered with an effective date in the past, after payroll has already been processed for that period. Backdated promotions and late salary approvals are normal. A raise effective 1 May and approved in July means the May and June payrolls already ran at the old rate; the July run must calculate the arrears for both months and pay them. Oracle handles this through retroactive events and the <em>Recalculate Payroll for Retroactive Changes<\/em> process, which runs before the main calculation and creates retro entries the payroll run then picks up.<\/p>\n<p>Two things matter for a consultant explaining retro to a client. First, retro affects balances, not just the current payslip: it re-states social insurance and tax for the prior periods too. Second, retro is not always money in — a change that reduces pay creates a recovery.<\/p>\n<h2>End-dating instead of deleting<\/h2>\n<p><strong>End-dating<\/strong> closes a record as of a date rather than deleting it, so that history is preserved. Terminating employment end-dates the work relationship; removing an allowance end-dates the element entry. When a client asks \"can you just delete this record?\", the correct consulting answer is almost always \"we end-date it, and here is why that is better for you.\" In a date-effective SaaS system the tools are end-date, correct, or reverse. Deletion is rare, restricted, and usually the wrong instinct.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>\"The effective date is when I entered it.\" The system tracks the two dates separately for a reason.<\/li>\n<li>Using correction for a real event, wiping the history.<\/li>\n<li>Assuming retro only adds money. It can recover money too.<\/li>\n<li>Reaching for delete. End-date instead.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"How Retroactive Pay Is Calculated\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/22a/faigp/how-retroactive-pay-is-calculated.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/22a/faigp/how-retroactive-pay-is-calculated.html<\/a><\/li>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"Events, Retroactive Pay and Proration\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21b/faigp/events-retroactive-pay-and-proration.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21b/faigp/events-retroactive-pay-and-proration.html<\/a><\/li>\n<\/ul><\/div>","cover":""},{"id":"payroll","num":5,"track":"functional","title":"The Payroll Object Chain","sub":"Element → eligibility → entry → run → balance → prepayment → payment → costing","hue":152,"minutes":11,"labs":["payroll"],"terms":["element","element-classification","element-eligibility-element-link","element-entry","input-value","balance","salary-basis","payroll-definition","payroll-run","quickpay","prepayments","payment-process-bank-file","costing","parallel-run"],"html":"<p>Payroll in Oracle is a chain of objects, each depending on the one before it. A consultant who can recite the chain and explain what breaks when a link is missing can debug most payroll problems without opening a log. The chain runs: element → element eligibility → element entry → payroll run → balance → prepayment → payment → costing.<\/p>\n<h2>Defining what can be paid<\/h2>\n<p>An <strong>element<\/strong> is the definition of a single thing that can appear on a payslip: a salary, an allowance, a deduction or an informational item. Payroll is built from named, individually configured components — \"Basic Salary\", \"Transport Allowance\", \"Social Insurance Employee Contribution\", \"Loan Deduction\" — rather than one monolithic calculation, so that each can carry its own rules, taxability and reporting treatment. Elements live inside one LDG and must be rebuilt per country. Every payslip line traces back to an element, and reading a client's element list is one of the first tasks on a project.<\/p>\n<p>Each element has a <strong>classification<\/strong> — earnings, deduction, information — which controls processing order and how the element feeds balances. Payroll must process earnings before it can calculate deductions based on them, so classification drives sequencing: standard earnings, supplemental earnings, pre-statutory deductions, statutory deductions, voluntary deductions. When a calculation runs in the wrong order, classification and processing priority are the first things to check.<\/p>\n<p>An element's <strong>input values<\/strong> are the fields that hold the data the calculation needs — amount, rate, percentage, units. A \"Loan Deduction\" element might carry input values for total loan amount, monthly instalment and remaining balance. Deciding an element's input values is a core design decision recorded in the configuration workbook.<\/p>\n<h2>Who can get it, and who does<\/h2>\n<p>Creating an element does nothing on its own. <strong>Element eligibility<\/strong> (historically \"element link\") defines which population the element applies to, by criteria such as payroll, legal employer, grade, job or department: \"Car Allowance is eligible for grade G7 and above in the Cairo business unit.\" Without eligibility, an element cannot be given to anyone. This is the most common cause of \"why can't I add this allowance to this employee?\" — the answer is almost always that eligibility does not cover them. Eligibility defined too narrowly at build time is considerably messier to widen once entries exist.<\/p>\n<p>An <strong>element entry<\/strong> is the actual attachment of an element to a specific person, with values and dates: a transport allowance of EGP 800 per month effective 1 March. Eligibility says who <em>could<\/em> receive something; the entry says who <em>does<\/em>, and how much. Entries can be created manually, loaded in bulk with HCM Data Loader (Chapter 11), or generated automatically.<\/p>\n<p>The <strong>salary basis<\/strong> decides how salary is stored, quoted and paid — annual, monthly or hourly — and which element it feeds. An annual basis stores EGP 240,000 and pays EGP 20,000 monthly. Getting the basis wrong multiplies or divides everyone's pay by twelve, so always confirm how the client quotes salary in offer letters before configuring it.<\/p>\n<h2>Running it<\/h2>\n<p>A <strong>payroll definition<\/strong> is the calendar: frequency, period start and end dates, cut-off dates and payment date — \"Egypt Monthly Payroll, calendar months, cut-off on the 25th, paid on the last working day.\" A person must be assigned to a payroll, on the assignment, before they can be processed.<\/p>\n<p>The <strong>payroll run<\/strong> (Calculate Payroll) is the engine that calculates gross-to-net for a population for a period: it evaluates elements, applies formulas, and produces run results and balances, held against the payroll relationship. Errors at this stage typically point to missing entries, missing eligibility or formula problems. <strong>QuickPay<\/strong> runs the same calculation for a single person outside the main run — the primary testing tool during configuration (change an element, QuickPay one employee, check the result) and the mechanism for off-cycle payments such as a final settlement.<\/p>\n<p>A <strong>balance<\/strong> is an accumulated total of element results over a period and dimension: gross pay year-to-date, taxable earnings month-to-date. Balances have dimensions (period-, month-, quarter-, year-to-date) and scope (assignment or relationship level). Statutory calculations, payslips and reports all depend on them, and when a report shows a wrong total the balance feed is usually where the problem lives. Balances do not span payroll relationships — which is why year-to-date figures reset on a global transfer.<\/p>\n<h2>After the run<\/h2>\n<p>Calculation and payment are separate steps. <strong>Prepayments<\/strong> takes the run results and distributes them across each person's payment methods — someone may split their salary across two bank accounts. It runs after the payroll run and before the payment process, and it is the step people forget exists until a payment fails. Oracle's standard flow then archives the results, generates payslips, and produces the payments: the <strong>payment process<\/strong> creates the bank file. In Saudi Arabia and the UAE, the file must follow the Wage Protection System SIF format (Chapter 17), and a Gulf go-live always includes a bank-file test with the actual bank. The bank file is a common cause of go-live delay; never treat it as an afterthought.<\/p>\n<p><strong>Costing<\/strong> allocates payroll results to accounting segments so the cost lands in the right place in the general ledger, broken down by department, project or cost centre. It is the bridge between HCM and Finance and is often owned jointly with a finance consultant.<\/p>\n<div class=\"lab-embed\" data-lab=\"payroll\"><\/div>\n\n<h2>Proving it works: the parallel run<\/h2>\n<p>A <strong>parallel run<\/strong> executes the new system's payroll alongside the legacy payroll for the same period and reconciles the two line by line. It is the only reliable proof that the new payroll is correct before the old one is switched off, and it typically runs for two or three consecutive months before go-live. Differences must be explained, not just noted. It is also the highest-stakes activity before go-live, and the point where a consultant with analytical instincts is visibly useful.<\/p>\n<div class=\"mistakes\"><h2>Common mistakes<\/h2>\n<ul>\n<li>Creating an element and expecting it to appear on payslips. Nothing happens until eligibility exists and an entry is made.<\/li>\n<li>Confusing eligibility (who could) with entry (who does).<\/li>\n<li>Forgetting prepayments sits between calculation and payment.<\/li>\n<li>Treating the bank file as a formality.<\/li>\n<li>Believing go-live means done. Hypercare and the first live payroll are the finish line.<\/li>\n<\/ul>\n<\/div><div class=\"sources\"><h2>Sources<\/h2>\n<ul>\n<li>Oracle, <em>Administering Payroll<\/em> — \"Payroll Processes\" (calculate, prepayments, archive, payments). <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/21a/faaus/payroll-processes.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/21a/faaus/payroll-processes.html<\/a><\/li>\n<li>Oracle, <em>Implementing Global Payroll<\/em> — \"Overview of Payroll Costing\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/faigp/overview-of-payroll-costing.html\" target=\"_blank\" rel=\"noopener\">https://docs.oracle.com/en/cloud/saas/human-resources/faigp/overview-of-payroll-costing.html<\/a><\/li>\n<li>Oracle, <em>Administering Global Payroll<\/em> — \"Overview of Administering Payroll Relationships\". <a href=\"https://docs.oracle.com/en/cloud/saas/human-resources/23d/faapq/overview-of-administering-payroll-relationships.html\" target=\
